"environment":"Perpetual moonlit dusk and silvered meadows","culture":"Moonhares are the Vale-warren harengon who dance to the lunar tides and carry omens between the moon-courts. Their moon-dances are read as auguries, and a Moonhare courier is trusted to carry a secret as faithfully as a message.","tradition":"The Moon-Dance, timed to lunar tides, where the young dance their First Run's tale before the warren.","appearance":"Silver-furred, moon-marked, charm-hung dance-wraps.","naming":"Given name plus a moon-phase (Lira Waxing-Foot).","occupations":["Couriers and omen-carriers","Dancers and performers","Vale scouts"],"allies":["Kitsune of the Vale","Moon elves"],"rivals":["Dream-thieves","Those who intercept couriers"],"landmark":"The Hall of Nine Lanterns","hooks":["A message you carried has started a Moon Court feud","Your moon-dance omen named you for something you don't understand","One of the Nine Lanterns went out on your watch"]},"ln-stormhare":{"region":"stormreach","homeland":"The ridge-runs of the Stormreach coast","environment":"The storm-belt's leading edge and lightning-lit ridges","culture":"Stormhares run the tempest coast, the fastest couriers alive, who deliver word through storms that ground everyone else. They race the lightning for sport and glory, and a Stormhare's Courier's Word is said to outrun the weather itself.","tradition":"The Storm-Run, delivering a message across the storm-front without stopping, to earn a courier's charm.","appearance":"Wind-slicked grey fur, static-marked ears, light storm-cloth.","naming":"Given name plus a storm-run (Dax Boltfoot).","occupations":["Storm-couriers","Gale Riders' scouts","Weather-runners"],"allies":["Stormborn dragonborn","Gale Riders"],"rivals":["Stormwardens (who find them reckless)","Rival courier-lines"],"landmark":"The Standing Bolt above Thundergate","hooks":["A storm-run message you carried could stop or start a war","You outran a storm that has since begun hunting you","The Storm spoke to you mid-run and you cannot forget it"]},"ln-wildhare":{"region":"emerald-wilds","homeland":"The open ranges at the Wilds' frontier","environment":"Meadow-frontier, hedgerow country, and forest edges","culture":"Wildhares are the free-roaming harengon of the open country, scouts and pathfinders who know every trail between the settled lands and the Wilds. They keep no fixed warren, only the road and the season, and their First Run circles farther than any other line's.","tradition":"The First Run, a solo journey between two distant warrens, longest among the Wildhares.","appearance":"Brown-and-tan fur, trail-worn leathers, foraged charms.","naming":"Given name plus a trail-name (Bram Longtrail).","occupations":["Scouts and pathfinders","Frontier guides","Foragers and trappers"],"allies":["Wildborn humans","Wanderfoot halflings","Wood elves"],"rivals":["Road-bandits","Deep-wood predators"],"landmark":"The frontier trails of the Wilds' edge","hooks":["A trail you scout leads somewhere that was not there before","Your First Run route now passes through the Hunt's range","You are the first Wildhare to try to settle down"]},"ln-duskhare":{"region":"shadowlands","homeland":"The shadow-border warrens near the Vale","environment":"Twilight border-country between Vale and Shadowlands","culture":"Duskhares keep the quiet, stranger faiths of the shadow-border, harengon who carry messages where the light thins and few couriers will go. They move unseen through the dusk and know the safe paths across the shadow-border better than anyone alive.","tradition":"The Dusk-Crossing, a rite of carrying a message across the shadow-border and back by moonlight alone.","appearance":"Dusk-grey fur, shadow-marked ears, muffling dark wraps.","naming":"Given name plus a dusk-omen (Vesh Greywhisper).","occupations":["Shadow-border couriers","Night-guides","Quiet scouts"],"allies":["Elarin elves","Night-court vampires (as clients)"],"rivals":["The Unlit","Shadowland raiders"],"landmark":"The Threshold of Long Shadows","hooks":["A Night Court message you carry has a deadline you can't meet","The shadow-border is advancing across your safe paths","The Unlit tried to hire you and now want you silenced"]},"ln-swiftfoot":{"region":"crownlands","homeland":"The courier-roads and cities of the Crownlands","environment":"City streets and the great trade-roads","culture":"Swiftfoot harengon are the city-couriers and road-runners of the Crownlands, the fastest legs in any market or guild-hall. They keep the Courier's Word as sacred law, and a Swiftfoot who breaks a delivery is shunned by every warren.","tradition":"The Courier's Word, an unbreakable vow to deliver a message, taught before a Swiftfoot can run for hire.","appearance":"Lean, bright-eyed, guild-liveried run-wraps, message-tokens.","naming":"Given name plus a route (Pip of the Nine Wards).","occupations":["City couriers and runners","Guild messengers","Race-runners"],"allies":["Cityborn humans","Goldhand League"],"rivals":["Rival courier-guilds","Message-thieves"],"landmark":"The great trade-crossroads of the Crownlands","hooks":["A Courier's Word binds you to deliver to someone now dead","A message you carried has toppled a guild","You witnessed something on a run that powerful people want buried"]},"ln-direwolf":{"region":"emerald-wilds","homeland":"The deep-wood ranges of the Emerald Wilds","environment":"Old-growth forest and deep hunting-trails","culture":"Direwolf packs are the great hunters of the deep Wilds, largest and oldest of the wolfkin, who keep the strictest pack-law. To hunt without need is their deepest taboo, and a Direwolf's pack-name is earned on a solo First Hunt in the deepest wood.","tradition":"The First Hunt, a solitary hunt in the deep wood to earn one's pack-name.","appearance":"Massive, grey-furred, scar-marked, bone and claw tokens.","naming":"Given name plus a hunt-deed (Fenra Deep-Runner).","occupations":["Hunters and trackers","Range-wardens","Pack-guardians"],"allies":["Wood elves","Owlkin night-hunters"],"rivals":["Rival packs","Loggers and poachers"],"landmark":"The Heartwood at the forest's center","hooks":["You were cast out and carry a lone-wolf name","Your pack's range-treaty has been broken and blood is owed","The Hunt now runs the same trails as your pack"]},"ln-frostwolf":{"region":"frostbound-north","homeland":"The ice-plain ranges of the Frostbound North","environment":"Arctic tundra, glacier-fields, and frozen forests","culture":"Frostwolf packs run the white north, enduring hunters whose pack-bonds are forged against the killing cold. They share the ice with the frost-clans and bearkin, and their Howl-Moots carry news across distances no runner could cross.","tradition":"The Howl-Moot, where packs gather to sing their news, their dead, and their new pack-names into the aurora.","appearance":"White-furred, ice-blue eyes, frost-rimed, fur-and-amber tokens.","naming":"Given name plus a cold-deed (Skoll Frost-Runner).","occupations":["Ice-hunters and trackers","North guides","Pack-warriors"],"allies":["Frost orcs","Polar bearkin","Northlanders"],"rivals":["Ice-reavers","The Winter Hunt"],"landmark":"The frozen fjord-ranges of the north","hooks":["The Winter Hunt has begun taking from your pack","A Howl-Moot carried word of a pack gone silent","The ice is thinning and your range with it"]},"ln-shadowwolf":{"region":"shadowlands","homeland":"The shadow-border ranges near the Vale","environment":"Twilight border-country and long-shadowed woods","culture":"Shadowwolf packs hold the shadow-border no one else will keep, wolfkin who hunt the things that come out of the dark. Wary neighbors to the night-courts, they move silent through the dusk and are feared by other packs for the company they must keep.","tradition":"The Silent Hunt, a rite of hunting through the shadow-border without a single howl.","appearance":"Shadow-black fur, dusk-grey eyes, muffled dark leathers.","naming":"Given name plus a shadow-deed (Umbra Nightpaw).","occupations":["Border-wardens and night-hunters","Shadow-scouts","Monster-hunters"],"allies":["Shadow-wardens","Duskhares"],"rivals":["The Unlit","The Hollow Men"],"landmark":"Gloamhold, the sunless fortress-city","hooks":["The border-light is failing and the dark is advancing on your range","A night-court noble seeks your pack for a hunt in daylight","Other packs have named yours for consorting with the dark"]},"ln-moonwolf":{"region":"moonlit-vale","homeland":"The moonlit ranges of the Vale's edge","environment":"Silvered dusk-forests and moon-meadows","culture":"Moonwolf packs run under the Vale's endless moon, mystics among the wolfkin who read omens in the moon-tides and the hunt. Their howls carry dream-omens, and moon-court nobles seek Moonwolf seers to read the meaning of a night's hunt.","tradition":"The Moon-Hunt, a hunt timed to the lunar tide whose course is read for omens.","appearance":"Silver-grey fur, moon-pale eyes, lunar-marked, dream-charms.","naming":"Given name plus a moon-omen (Sela Moonrunner).","occupations":["Seer-hunters and omen-readers","Vale wardens","Dream-guides"],"allies":["Moon elves","Owlkin dream-wardens"],"rivals":["Dream-thieves","Those who hunt without omen"],"landmark":"Silvermere, the fate-showing lake","hooks":["A moon-hunt omen showed a death you mean to prevent","Your pack's seer has vanished into the Turning Wood","The moon-tides are turning wrong and the omens with them"]},"ln-stormwolf":{"region":"stormreach","homeland":"The tempest-coast ranges of the Stormreach","environment":"Storm-lashed coasts and lightning-struck highlands","culture":"Stormwolf packs run the storm-country, wolfkin who hunt through tempests that would ground any other pack and take no penalty in the wind. They believe the Storm hunts alongside them, and their pack-law is as fierce as the weather that shaped it.","tradition":"The Storm-Hunt, hunting through a living tempest to prove the pack runs with the Storm.","appearance":"Storm-grey fur, static-lit ruffs, wind-worn leathers.","naming":"Given name plus a storm-deed (Rax Thunderpaw).","occupations":["Storm-hunters and scouts","Coast-wardens","Gale Riders' trackers"],"allies":["Stormborn dragonborn","Stormhares"],"rivals":["Rival packs","Those who fear the storm-hunt"],"landmark":"The Eye, the calm at the storm's center","hooks":["The Storm led your hunt to something it wanted found","A rival pack claims your storm-range","The tempest that shelters your pack has begun to fail"]},"ln-greatowl":{"region":"emerald-wilds","homeland":"The roost-towers of the deep Emerald Wilds","environment":"Ancient canopy and high forest-roosts","culture":"Great Owls are the loremaster-owlkin of the deep Wilds, keepers of the Witness-books that record what happens while the world sleeps. Patient and silent, they hold the closest thing to unbroken history, and a Great Owl's testimony can settle a war.","tradition":"The Long Watch, a solitary vigil marking adulthood, its every observation entered in the roost's Witness-book.","appearance":"Broad-winged, tawny, wide-eyed, scholar's feather-cloaks.","naming":"Given name plus a watch-name (Aelwyn Nightwatch).","occupations":["Loremasters and librarians","Seers and augurs","Night-sentinels"],"allies":["Wood elves","Moon elves"],"rivals":["Those who would burn a Witness-book","Secret-thieves"],"landmark":"The roost-library spires of the deep Wilds","hooks":["A page torn from your roost's Witness-book named the Nameless Emperor","Your Long Watch showed something you were not meant to see","Someone is hunting the keepers of the Witness-books"]},"ln-snowowl":{"region":"frostbound-north","homeland":"The glacier-roosts of the Frostbound North","environment":"Arctic peaks, snow-fields, and ice-roosts","culture":"Snow Owls keep the aurora-vigils of the north, owlkin seers who read the northern lights as ancestor-fire and guard the memory of the dead kings under ice. Silent and still, they watch over the Aurora Vault and warn the holds of what the ice gives up.","tradition":"The Aurora-Watch, a vigil beneath the northern lights to read the ancestors' will.","appearance":"Snow-white plumage, pale-gold eyes, frost-quiet robes.","naming":"Given name plus an aurora-omen (Vela Frostwatch).","occupations":["Aurora-readers and seers","Vault-wardens","North sentinels"],"allies":["Northlanders","Aurora-keepers","Frost goliaths"],"rivals":["Ice-reavers","Grave-thieves of the vault"],"landmark":"The Aurora Vault of Fjordheim","hooks":["The aurora has changed color over the Vault and only you read the warning","A dead king is thawing and your vigil foresaw it","The ancestor-fire showed a name that should be dead"]},"ln-nightowl":{"region":"moonlit-vale","homeland":"The dream-roosts of Silvermere","environment":"Perpetual dusk and dream-tides of the Vale","culture":"Night Owls are the dream-wardens of the Vale, owlkin who guard sleepers from the dream-eaters and hunt those who traffic in stolen dreams. They read omens in dreams as others read them in stars, and Silvermere itself answers their watch.","tradition":"The Dream-Watch, guarding a sleeper through the night to learn the reading of dreams.","appearance":"Dusk-grey plumage, dark-gold eyes, dream-silk robes.","naming":"Given name plus a dream-omen (Sable Duskwatch).","occupations":["Dream-wardens and readers","Omen-scribes","Vale watch-keepers"],"allies":["Moon elves","Vale kitsune"],"rivals":["Dream-thieves","Dream-eaters"],"landmark":"Silvermere, the fate-showing lake","hooks":["A dream-thief is stealing memories and your ward was the first target","Three sleepers dreamed the same fate and you must learn why","A dream-eater has crossed into the waking Vale"]},"ln-ghostowl":{"region":"shadowlands","homeland":"The shadow-border roosts near Gloamhold","environment":"Sunless twilight and long-shadowed woods","culture":"Ghost Owls are the silent watchers of the shadow-border, owlkin so quiet they are said to be half in the dark themselves. They keep vigil over what the shadow hides and carry warnings the living need but fear to hear.","tradition":"The Hollow-Watch, a vigil kept in total silence at the edge of the deepest shadow.","appearance":"Ash-grey and near-translucent plumage, luminous pale eyes, shadow-silk.","naming":"Given name plus a shadow-omen (Wraith Greywatch).","occupations":["Shadow-border sentinels","Warning-bearers","Silent scouts"],"allies":["Shadow-wardens","Shadowwolf packs"],"rivals":["The Unlit","The Hollow Men"],"landmark":"The Threshold of Long Shadows","hooks":["Your hollow-watch saw the border-light begin to fail","You carry a warning no one wants to believe","The Unlit are hunting the Ghost Owls who watch them"]},"ln-sunowl":{"region":"celestial-heights","homeland":"The high dawn-roosts of the Celestial Heights","environment":"Rarefied luminous heights and dawn-lit spires","culture":"Sun Owls are the rarest owlkin, dwelling among the seraphim in the Celestial Heights, star-readers who watch the constellations for the Radiant Choir. Where other owlkin watch the dark, Sun Owls watch the light, and they were the first to notice the stars going out.","tradition":"The Dawn-Watch, a vigil kept through the night to greet and read the first light.","appearance":"Gold-white plumage, sun-bright eyes, starlight-glass ornaments.","naming":"Given name plus a star-name (Aurel Dawnwatch).","occupations":["Star-readers and augurs","Choir-scholars","Threshold-watchers"],"allies":["Seraphim","Star elves"],"rivals":["The Unlit","Those who silence prophecy"],"landmark":"The Threshold at the edge of the world","hooks":["You were first to see the stars over the Threshold going out","The Choir wants your reading of a forbidden prophecy","A Fallen seraph trusts you with a warning the Choir buried"]},"ln-bengal":{"region":"emerald-wilds","homeland":"The jungle-territories of the deep Wilds","environment":"Dense tropical Wilds and river-jungles","culture":"Bengals are the jungle tigerkin, solitary sovereigns who each rule the ground they stand on and bow to no pack. Their honor-duels settle disputes without war, and a Bengal's guest, once welcomed, is under sacred sanctuary.","tradition":"The Claiming, marking a first territory to earn adulthood, defended by honor-challenge.","appearance":"Ember-orange and black striping, personal sigil-marks, duel-trophies.","naming":"A single proud name plus a territory (Rakh of the Green River).","occupations":["Champions and duelists","Solitary hunters","Honor-arbiters"],"allies":["Wood elves (as respected neighbors)","Ancient tiger lines"],"rivals":["Lionkin prides","Rival territory-holders"],"landmark":"The river-territories of the deep Wilds","hooks":["An honor-challenge has followed you across the world","You broke a guest-sanctuary and owe a life-debt","You lost your first territory and wander to reclaim your honor"]},"ln-whitetiger":{"region":"ironspine","homeland":"The cold heights of the high Ironspine","environment":"Snow-capped peaks and high alpine forest","culture":"White Tigers withdrew to the cold heights in the Age of Ash, tigerkin of the snow-line who keep the oldest honor-codes in near-isolation. Rarely seen, they descend only to answer a debt or a worthy challenge, and their word is considered unbreakable.","tradition":"The Snow-Vigil, a solitary trial in the high cold to prove one is worthy of the old codes.","appearance":"White and slate striping, ice-pale eyes, frost-marked sigils.","naming":"A single name plus a peak (Sarn of the Silver Peak).","occupations":["Reclusive wardens","Honor-champions","High-pass guardians"],"allies":["Goliath high-clans","Bearkin"],"rivals":["Those who violate the old codes","Vault-raiders"],"landmark":"The high snow-line territories","hooks":["A debt has called you down from the heights for the first time in years","Someone impersonates the White Tiger codes to justify a crime","A worthy challenger has climbed to your snow-line"]},"ln-shadowtiger":{"region":"shadowlands","homeland":"The border-territories of the Shadowlands","environment":"Twilight woods and long-shadowed hunting-grounds","culture":"Shadow Tigers took to the border in the Blood Wars, solitary hunters who move unseen through the dusk and take contracts the prides would refuse. Feared as assassins, they keep a strict personal honor even in the dark, and a Shadow Tiger's given word is never sold.","tradition":"The Unseen Claiming, marking a territory no one ever sees you patrol.","appearance":"Shadow-black and charcoal striping, dusk-gold eyes, muffled dark wraps.","naming":"A single name plus a shadow-mark (Vael of the Long Dusk).","occupations":["Assassins and bodyguards","Border-hunters","Silent wardens"],"allies":["Shadowwolf packs","Night-court (as clients)"],"rivals":["The Unlit","Those who break their given word"],"landmark":"Gloamhold, the sunless city","hooks":["A contract you took turns out to serve the Unlit","Your unseen territory has been trespassed by something worse than you","A given word binds you to protect an enemy"]},"ln-stormtiger":{"region":"stormreach","homeland":"The tempest-coast territories of the Stormreach","environment":"Storm-lashed coasts and lightning-struck ridges","culture":"Storm Tigers hold the storm-country, tigerkin who claim territory in the tempest itself and hunt through weather that grounds all others. They read the Storm as a rival worthy of respect, and their honor-duels are fought on ridgelines in the teeth of the wind.","tradition":"The Storm-Claiming, marking a territory a challenger must reach through a living tempest.","appearance":"Storm-grey and violet striping, static-lit eyes, storm-glass sigils.","naming":"A single name plus a storm (Krarr of the Standing Bolt).","occupations":["Storm-hunters and champions","Coast-wardens","Gale Riders' allies"],"allies":["Stormborn dragonborn","Stormwolves"],"rivals":["Rival territory-holders","Stormwardens"],"landmark":"The Standing Bolt above Thundergate","hooks":["A challenger died reaching your storm-territory and their pride blames you","The Storm has begun to hunt you as a rival","Your ridgeline territory is being taken by a rising storm-cult"]},"ln-ancienttiger":{"region":"emerald-wilds","homeland":"The lost first-territories of the oldest Wilds","environment":"Primeval old-growth and forgotten forest-shrines","culture":"Ancient Tigers claim descent from the First Age's great hunters, the oldest tigerkin bloodlines, keepers of territory-shrines older than any kingdom. Legend says their line returns in a time of breaking, and the eldest carry memory that predates the Sundering.","tradition":"The First Claiming, a pilgrimage to a lost ancestral territory-shrine of the First Age.","appearance":"Deep-hued ancient striping, gold-flecked eyes, first-age relic-sigils.","naming":"A single archaic name plus an elder-territory (Ashkar of the First Grove).","occupations":["Shrine-keepers and loremasters","Elder champions","Wilds guardians"],"allies":["Wyrmblood dragonborn","Great Owl loremasters"],"rivals":["Relic-thieves","Those who defile the old shrines"],"landmark":"The First Grove, said to exist for those who deserve to find it","hooks":["Your line is said to return only when the world is breaking, and it is stirring","An ancestral shrine you guard has been defiled","You found a First Age relic that remembers you"]},"ln-brownbear":{"region":"emerald-wilds","homeland":"The forest-holds of the Emerald Wilds","environment":"Old-growth forest and river-valleys","culture":"Brown Bears are the forest-guardian bearkin, hearth-keepers who protect the frontier-holds and Wilds villages. Slow to anger and impossible to move, they hibernate through the hardest season and wake as the fiercest defenders a community could ask for.","tradition":"The First Winter, a young bearkin's first solitary hibernation-vigil, marking adulthood.","appearance":"Broad, brown-furred, hearth-marked, heavy protective wraps.","naming":"Given name plus a hold-name (Bruin of Green Hollow).","occupations":["Guardians and protectors","Herbalists and healers","Hold-provisioners"],"allies":["Wildborn humans","Wood elves","Wolfkin"],"rivals":["Deep-wood predators","Reckless loggers"],"landmark":"The frontier holds of the Wilds' edge","hooks":["You woke early from the First Winter to find your hold gone","The Hunt is bearing down on the village you guard","Someone you are hearth-sworn to protect has vanished"]},"ln-polarbear":{"region":"frostbound-north","homeland":"The ice-holds of the Frostbound North","environment":"Arctic ice-plains and glacier-shores","culture":"Polar Bears are the ice-guardian bearkin of the far north, the mightiest of their kind, who hold the frozen holds against the Winter Hunt and the ice-reavers. They wake from the long sleep as living bulwarks, and a Polar Bear at a doorway is a wall no army passes.","tradition":"The Ice-Vigil, a hibernation held in a glacier-den, waking only when the hold has need.","appearance":"White-furred, massive, frost-scarred, ancestor-marked furs.","naming":"Given name plus an ice-hold (Isbjorn of Whitehall).","occupations":["Ice-hold guardians","North defenders","Glacier-wardens"],"allies":["Northlanders","Frost wolves","Frost goliaths"],"rivals":["Ice-reavers","The Winter Hunt"],"landmark":"Whitehall, the hall carved inside a living glacier","hooks":["The Winter Hunt is at the gates of the hold you guard","You woke from the Ice-Vigil to a hold under siege","Something in the glacier is waking alongside you"]},"ln-blackbear":{"region":"crownlands","homeland":"The hill-country and frontier towns of the Crownlands","environment":"Wooded hills, farm-frontiers, and cave-dens","culture":"Black Bears are the hill-and-frontier bearkin, quieter and more solitary than their cousins, who guard small communities and mind their own dens. They are the beloved protectors of many a Crownlands town, gruff but gentle until roused.","tradition":"The Den-Keeping, an oath a young Black Bear swears to protect one place or family for life.","appearance":"Black-furred, compact, den-marked, plain sturdy wraps.","naming":"Given name plus a den or town (Cuth of Ashford).","occupations":["Town-guardians","Foragers and healers","Frontier defenders"],"allies":["Cityborn humans","Hearthborn halflings"],"rivals":["Bandits","Land-grabbing lords"],"landmark":"The frontier towns of the Crownlands","hooks":["The family you den-swore to protect is in danger far away","Bandits have driven you from your den","A lord means to seize the town you guard"]},"ln-cavebear":{"region":"ironspine","homeland":"The deep cave-holds of the Ironspine","environment":"Mountain caves and the upper Blackdeep","culture":"Cave Bears withdrew into the Ironspine's caves during the Age of Ash, bearkin who guard the thresholds between surface and Deep. They keep the longest hibernations of all, and a woken Cave Bear is a rare and serious omen, for they wake only for grave need.","tradition":"The Deep-Sleep, a hibernation lasting years, kept at a threshold to the Deep.","appearance":"Huge, dark-furred, cave-pale eyes, stone-marked wraps.","naming":"Given name plus a deep-hold (Grommash of the Ninth Cave).","occupations":["Threshold-guardians","Deep-wardens","Cave-lore keepers"],"allies":["Deep dwarves","Mountain dwarves"],"rivals":["Whatever comes up from the Deep","Tunnel-stalkers"],"landmark":"The cave-thresholds of the Ironspine","hooks":["You woke from the Deep-Sleep because something is coming up","The threshold you guard has been breached","A Cave Bear waking is an omen and everyone wants to know what it means"]},"ln-greatbear":{"region":"frostbound-north","homeland":"The oldest ancestor-holds of the north","environment":"Ancient glacier-halls and ancestor-shrines","culture":"Great Bears are the eldest bearkin bloodline, said to descend from a Great Bear who slept a hundred years and woke to save a dying hold. Their line wakes, legend holds, only when the world itself is breaking, and the north watches their slumber for signs.","tradition":"The Century-Sleep, the longest hibernation, undertaken by an elder to be ready for a great need.","appearance":"Titanic, silver-furred, ancestor-marked, relic-adorned.","naming":"Given name plus an ancestor-hold (Ursaka of the First Hearth).","occupations":["Ancestor-guardians","Elder protectors","Living omens"],"allies":["Aurora-keepers","Titan-born goliaths"],"rivals":["The Winter Hunt","Those who would wake them for gain"],"landmark":"The ancestor-shrines of the deep north","hooks":["Your bloodline wakes only when the world breaks, and you have woken","An elder Great Bear is stirring and the north wants to know why","You carry the ancestor-relic of the First Hearth"]},"ln-sunlion":{"region":"sunscorch","homeland":"The Sun Court seat of Sunspire","environment":"The golden desert and sun-warmed courts","culture":"Sun Lions are the desert-court lionkin, the proudest prides of the Sunscorch, who hold the sun as the source of rightful rule. Their courts run on loyalty and oratory, and a Sun Lion measures worth by the pride they lift and the pride that lifts them.","tradition":"The Sun-Rite, a coming-of-age at the summer solstice, when a young lionkin swears the Pride-Oath.","appearance":"Golden-maned, sun-bronzed, sun-gold ornaments, rank-braided manes.","naming":"A proud name plus a court (Rasha of the Sun Court).","occupations":["Courtiers and rulers","Champions and pride-guards","Orators and diplomats"],"allies":["Sun elves","Desertborn humans","Seraphim"],"rivals":["Tigerkin","Rival prides","Tariff-lords"],"landmark":"Sunspire, the mile-high needle that casts no shadow at noon","hooks":["The Sun Court's heir is lost in the deep dunes and your pride is blamed","You are pride-less and seek a court to call your own","The Spire has begun to glow and the court is divided over the omen"]},"ln-desertlion":{"region":"sunscorch","homeland":"The deep-dune prides of the Sunscorch","environment":"The killing deep dunes far from any oasis","culture":"Desert Lions are the deep-dune prides who live where the Sun Court will not go, hardier and wilder than the courtly Sun Lions. They keep the oasis-roads open and the buried cities secret, and their loyalty is to the pride and the road, not to any throne.","tradition":"The Deep Crossing, a rite of surviving the deep dunes and returning with word of what the sand has uncovered.","appearance":"Sand-tawny, sun-scoured, practical desert-wraps, dune-charms.","naming":"A name plus a dune-road (Karim of the Long Dune).","occupations":["Caravan-guards and guides","Deep-dune scouts","Road-wardens"],"allies":["Desertborn humans","Sun elves","Sand-readers"],"rivals":["Grave-robbers","The Sun Court's tariffs"],"landmark":"The Buried City of Karan-That-Was","hooks":["A storm uncovered a city your pride is sworn to keep hidden","The Sun Court demands tribute your pride cannot pay","Your Deep Crossing found something that followed you back"]},"ln-mountainlion":{"region":"ironspine","homeland":"The high-pass prides of the Ironspine","environment":"Mountain crags, high passes, and cliff-country","culture":"Mountain Lions are the highland prides who took to the peaks, solitary-leaning lionkin who guard the high passes and keep smaller, tighter prides than their desert kin. Agile and proud, they are the wardens of routes the caravans depend on.","tradition":"The Crag-Claiming, a rite of holding a high pass alone to earn a place in the pride.","appearance":"Grey-tawny, lean, crag-marked, mountain-wraps and claw-tokens.","naming":"A name plus a pass (Vira of the Grey Pass).","occupations":["Pass-wardens and guides","High-country hunters","Caravan-guards"],"allies":["Goliath clans","Mountain dwarves"],"rivals":["Vault-raiders","Rival prides for the passes"],"landmark":"The high passes of the Ironspine","hooks":["The pass your pride guards has become a war-road","A vault-claim dispute threatens your crag-territory","Your pride's high pass is being taken by raiders"]},"ln-goldenlion":{"region":"sunscorch","homeland":"The old royal seats of the buried desert empires","environment":"The desert and the ruins of lost sun-kingdoms","culture":"Golden Lions are the royal bloodline, lionkin who claim descent from the buried desert empires and carry crown-claims to thrones that no longer exist. Regal and burdened by legacy, they seek to restore a glory the sand swallowed, or to finally lay it to rest.","tradition":"The Crown-Reckoning, where a Golden Lion learns the true, fallen history of their line's lost throne.","appearance":"Radiant golden manes, royal bearing, ancient regalia, sun-crown marks.","naming":"A royal name plus a fallen dynasty (Aurelion of the Drowned Sun).","occupations":["Would-be rulers and pretenders","Loremasters of lost empires","Champions of old claims"],"allies":["Sun elves","Sun Court (uneasily)"],"rivals":["Rival crown-claimants","Grave-robbers of the royal tombs"],"landmark":"The buried royal tombs of the Sunscorch","hooks":["A buried empire's crown has surfaced and your bloodline is named","Your crown-claim makes you a target for those who fear a restored throne","The truth of your line's fall is worse than the legend"]},"ln-dusklion":{"region":"shadowlands","homeland":"The shadow-border prides near the Vale","environment":"Twilight border-country and long-shadowed savannas","culture":"Dusk Lions are the shadow-border prides, lionkin who hold the failing light at the world's edge, prouder for standing where others flee. Marked by the endless dusk, they keep court in the gloom and defend the last lit lands against the advancing dark.","tradition":"The Dusk-Oath, a Pride-Oath sworn to hold the border where the light thins.","appearance":"Dusk-tawny with shadowed manes, dim-gold eyes, border-wraps.","naming":"A name plus a dusk-hold (Sekh of the Last Light).","occupations":["Border-wardens and champions","Refuge-keepers","Light-guardians"],"allies":["Dusk-hares","Shadow-wardens"],"rivals":["The Unlit","The Hollow Men"],"landmark":"The Threshold of Long Shadows","hooks":["The border-light is failing and your pride's oath with it","Refugees flee the dark into your pride's lands","The Unlit mean to snuff the last light your pride guards"]},"ln-falconborn":{"region":"skyward-isles","homeland":"The aerie-town Highperch","environment":"Drifting sky-isles and high updraft-currents","culture":"Falconborn are the stooping raptor-aerie of the Skyward Isles, the fastest divers alive, prized as sky-couriers and hunters. Their aeries measure status by dive-speed, and a Falconborn's First Flight is a plunge between two isles that few forget.","tradition":"The Stoop, a First Flight dive between drifting isles to earn adult wings.","appearance":"Sharp-featured, swift-feathered in browns and greys, dive-harnesses.","naming":"Given name plus a stoop-deed (Kael Swiftstoop).","occupations":["Sky-couriers and hunters","Aerie-scouts","Glider-racers"],"allies":["Harengon sky-runners","Sky Covenant"],"rivals":["Rival aeries","Roc-broods"],"landmark":"Highperch, clinging to a drifting isle","hooks":["A sinking isle holds your aerie and the lifeboats are few","A bridge was cut mid-stoop and you saw who did it","Your dive carried a message that started a sky-feud"]},"ln-ravenkin":{"region":"crownlands","homeland":"The market-quarter rookeries of the Crownlands cities","environment":"Crowded city rookeries and guild-quarters","culture":"Ravenkin are the clever, secretive city-guild birdkin, keepers of the raven-lines' famous cunning and their hoards of stolen secrets. In every market a Ravenkin knows more than they say, and the legend of the Raven Who Stole a King's True Name is theirs.","tradition":"The Secret-Keeping, where a young Ravenkin earns standing by holding a dangerous secret without spending it.","appearance":"Black-feathered, sharp-eyed, dark clever finery, trinket-hoards.","naming":"Given name plus a wry epithet (Mattias Ninewords).","occupations":["Fixers and secret-brokers","City-guilders","Spies and thieves"],"allies":["Kitsune brokers","Cityborn humans"],"rivals":["Rival guilds","Those they have out-schemed"],"landmark":"The market-quarter rookeries of Highreach","hooks":["You hold a secret that could topple a guild and everyone knows you have it","A raven-line hoard was robbed of one specific thing","You may hold a fragment of the Nameless Emperor's true name"]},"ln-swiftwing":{"region":"sapphire-sea","homeland":"The long sea-lanes of the Sapphire Sea","environment":"Open ocean and the endless trade-lanes","culture":"Swiftwings are the tireless long-distance birdkin, ocean-crossing navigators who crew the fleets and carry word between distant ports. No line flies farther without rest, and a Swiftwing's flock-songs map the whole Sapphire Sea from memory.","tradition":"The Long Crossing, a solo ocean flight out of sight of land to earn a navigator's mark.","appearance":"Streamlined, long-winged, sea-weathered, navigator's charms.","naming":"Given name plus a crossing (Nera of the Long Blue).","occupations":["Navigators and sea-couriers","Ship-scouts","Cartographers"],"allies":["Coastborn humans","Seaborn traders","Free Captains"],"rivals":["Storm-krakens","Toll-covenant enforcers"],"landmark":"Port Meridian, the free harbor","hooks":["A flock-song verse describes a route that no longer exists","You were first to spot the surfaced wreck on the Graveyard Reef","Your long crossing carried a message that must beat a storm home"]},"ln-stormcrow":{"region":"stormreach","homeland":"The storm-belt roosts of the Stormreach","environment":"The living storm-front and lightning-lashed coasts","culture":"Stormcrows ride the tempest, birdkin who take no penalty in the wind and are read as omens by the storm-cults. Where a Stormcrow gathers, the Stormwardens say, the Storm is watching, and their flock-cries are treated as weather-augury.","tradition":"The Storm-Cry, where a young Stormcrow flies into a tempest and returns to speak what the Storm showed.","appearance":"Slate-black feathers, static-lit eyes, storm-charms.","naming":"Given name plus a storm-omen (Grael Tempestcry).","occupations":["Storm-omens and weather-readers","Gale Riders' scouts","Coast-criers"],"allies":["Stormborn dragonborn","Gale Riders"],"rivals":["Stormwardens (who both use and fear them)","Rival roosts"],"landmark":"The Standing Bolt above Thundergate","hooks":["Your flock gathered over a hold and now it fears an omen","The Storm showed you something in a storm-cry you can't forget","The Standing Bolt is dying and the crows are fleeing it"]},"ln-sunfeather":{"region":"sunscorch","homeland":"The oasis market-quarters of the Sunscorch","environment":"Desert oasis-towns and sun-bright skies","culture":"Sunfeathers are the bright-plumed dawn-birds of the desert towns, birdkin whose dazzling display can blind a foe and whose songs open the oasis-markets each dawn. They are the criers, entertainers, and daybreak-heralds of the Sunscorch.","tradition":"The Dawn-Song, sung at first light to open the market and mark the singer as come-of-age.","appearance":"Brilliant gold-and-crimson plumage, sun-bright, festival finery.","naming":"Given name plus a dawn-name (Isha Dawnsong).","occupations":["Criers and heralds","Entertainers and musicians","Market-openers"],"allies":["Desertborn humans","Lionkin courts"],"rivals":["Rival criers","Those who work in the dark"],"landmark":"The Oasis of Karan","hooks":["Your dawn-song is the only thing keeping a market's fragile peace","A rival crier is spreading a false omen in your voice","Your dazzle blinded the wrong person and now you owe a debt"]},"ln-bird-raven":{"region":"shadowlands","homeland":"The sunless rookeries of Gloamhold","environment":"The twilight fortress-city and its long-shadowed towers","culture":"The true Raven-line keeps the oldest secret-hoards, dwelling among the night-courts as brokers of forbidden knowledge. Older and darker than their Crownlands Ravenkin cousins, they trade in the secrets the living would rather forget.","tradition":"The Naming-Theft, a rite of learning one secret so dangerous the whole roost must keep it.","appearance":"Glossy black, red-tinged eyes, shadow-silk finery.","naming":"Given name plus a taken secret (Corvain Blacktongue).","occupations":["Secret-brokers","Night-court agents","Loremasters of the forbidden"],"allies":["Night Court","Kitsune of the Vale"],"rivals":["The Unlit","Those whose secrets they hold"],"landmark":"Gloamhold, the sunless city","hooks":["You hold a secret the Night Court would kill to bury","The Unlit want a name only your roost remembers","A stolen secret in your hoard is worse than you knew"]},"ln-bird-crow":{"region":"crownlands","homeland":"The old battlefields and gallows-fields of the Crownlands","environment":"Fallow war-fields and imperial ruins","culture":"Crow-line birdkin keep the field-rites, gathering where the Old Empire's dead lie and remembering the fallen no one else will name. Wrongly called ill omens, they are in truth the mourners and memory-keepers of the war-country.","tradition":"The Field-Watch, a rite of standing vigil over unburied dead until they are named.","appearance":"Sooty black, watchful, mourning-grey wraps, field-tokens.","naming":"Given name plus a field (Wren of Ashenfield).","occupations":["Field-mourners and memory-keepers","Salvage-scouts","War-historians"],"allies":["Lantern Order","Ravenkin"],"rivals":["Grave-robbers","Sunder-wights"],"landmark":"The Ashfall Road paved with the bones of an army","hooks":["A war-field you watch has begun to give up its dead","You know where an imperial vault lies beneath the fallen","A sunder-wight has risen following your field-watch"]},"ln-bird-eagle":{"region":"ironspine","homeland":"The high crag-aeries of the Ironspine peaks","environment":"The highest mountain crags above the cloud line","culture":"Eagle-line birdkin hold the proudest highland aeries, sky-lords who claim the peaks and look down, often literally, on the ground-bound. Fierce and honor-bound, they guard the high passes alongside the goliath clans.","tradition":"The High-Claiming, a first flight to the highest crag one can reach, marking one's standing.","appearance":"Golden-brown plumage, keen-eyed, proud aerie-regalia.","naming":"Given name plus a peak (Aquila of the Ninth Crag).","occupations":["Peak-wardens and scouts","Sky-cavalry","High-pass guardians"],"allies":["Goliath high-clans","Mountain lions"],"rivals":["Roc-broods","Rival aeries"],"landmark":"The Nine Bridges above the cloud line","hooks":["A roc has taken the crag your aerie claims","A vault-war on the peaks threatens your high pass","Your pride will not let you fly with the ground-bound, and you must"]},"ln-bird-falcon":{"region":"sunscorch","homeland":"The falconry-courts of the Sunscorch oases","environment":"Desert skies and oasis hunting-grounds","culture":"Falcon-line birdkin are the desert hunt-partners and messengers, bonded to the caravan-courts as scouts and swift-flyers. Distinct from the sky-isle Falconborn, they keep the oasis-roads watched and the sun-courts informed.","tradition":"The Bonding, a rite where a young Falcon pledges partnership to a caravan or court for a season.","appearance":"Barred grey-and-tan, sharp, court-liveried jesses and charms.","naming":"Given name plus a court (Sef of the Sun Court).","occupations":["Court-scouts and messengers","Desert hunters","Caravan outriders"],"allies":["Sun elves","Desert lions","Desertborn humans"],"rivals":["Grave-robbers","Mirage-stalkers"],"landmark":"Sunspire, the shadowless needle","hooks":["The court you bonded to sends you into the deep dunes","You carry warning of a raid the court will not believe","Your bonded caravan uncovered a buried city"]},"ln-bird-hawk":{"region":"crownlands","homeland":"The frontier watch-towers of the Crownlands marches","environment":"Open country, farmland, and border watch-posts","culture":"Hawk-line birdkin are the borderland sentinels, sharp-eyed watchers who guard the frontier roads and farmsteads. Practical and vigilant, they are the eyes of many a Crownlands duchy and rarely miss what moves below.","tradition":"The First Watch, a solo vigil over a stretch of border to earn a sentinel's post.","appearance":"Russet-barred, keen-eyed, watch-liveried, spyglass-charms.","naming":"Given name plus a watch-post (Talia of Ashford Watch).","occupations":["Border-sentinels and scouts","Message-hawks","Road-wardens"],"allies":["Cityborn humans","Greycloak Company"],"rivals":["Bandits","Fen drakes"],"landmark":"The frontier watch-towers of the Crownlands","hooks":["You spotted an army the duchy insists is not there","Your border-post has gone silent one tower at a time","A message-hawk route has been compromised"]},"ln-bird-osprey":{"region":"sapphire-sea","homeland":"The coastal fishing-towns of the Sapphire Sea","environment":"Reef-shallows, river-mouths, and fishing-coasts","culture":"Osprey-line birdkin are the fisher-hunters of the coasts, diving birdkin who bring in the catch and pilot boats through the reef-shallows. They are the backbone of the fishing-fleets and read the water as well as any seaborn.","tradition":"The First Dive, plunging for one's first catch in the reef-shallows to join the fleet.","appearance":"White-and-brown, salt-crusted, fisher's wraps, hook-charms.","naming":"Given name plus a shoal (Marl of the Coral Shoal).","occupations":["Fisher-hunters and reef-pilots","Boat-scouts","Coast-provisioners"],"allies":["Coastborn humans","Turtlekin pilots","Seaborn"],"rivals":["Reef-serpents","Toll-covenant"],"landmark":"The Graveyard Reef where sunk fleets rest","hooks":["The reef-serpents are driving the fish, and the fleets, ashore","Your fishing-ground was seized by the covenant","You dived on a wreck and brought up more than fish"]},"ln-bird-swan":{"region":"moonlit-vale","homeland":"The lake-courts of Silvermere","environment":"Moonlit lakes and mist-gardens of the Vale","culture":"Swan-line birdkin are the graceful court-birds of the Vale, keepers of ceremony, beauty, and the old courtesies. Elegant and proud, they preside over the Moon Court's rites, and a Swan's disfavor can end a courtier's season.","tradition":"The Lake-Dance, a coming-of-age performance on the moonlit water before the court.","appearance":"White-plumed, elegant, moon-silk finery, grace-marks.","naming":"Given name plus a lake (Odila of Silvermere).","occupations":["Courtiers and ceremony-keepers","Dancers and artists","Rite-wardens"],"allies":["Moon elves","Vale kitsune"],"rivals":["Rival courtiers","Those who breach ceremony"],"landmark":"Silvermere, the fate-showing lake","hooks":["A Moon Court ceremony you preside over hides a deadly plot","Your grace-favor is being forged to ruin a rival","The lake showed you a fate mid-dance"]},"ln-bird-heron":{"region":"emerald-wilds","homeland":"The marsh-villages at the Wilds' waterways","environment":"Fen-country, marsh-reeds, and slow river-shallows","culture":"Heron-line birdkin are the patient marsh-folk, still-standing hunters and reed-lore keepers of the wetland Wilds. Contemplative and solitary-leaning, they are sought as healers and quiet counselors who wait out any trouble.","tradition":"The Still-Watch, standing motionless in the marsh until the reeds accept you, marking adulthood.","appearance":"Slate-blue plumage, long-limbed, reed-woven wraps.","naming":"Given name plus a fen (Sedge of the Grey Marsh).","occupations":["Marsh-healers and herbalists","Reed-lore keepers","Fen-guides"],"allies":["Wood elves","Meadowborn halflings"],"rivals":["Root-wraiths","Fen drakes"],"landmark":"The reed-country of the Emerald Wilds","hooks":["A blight is creeping through your marsh","Your reed-lore is the only cure for a spreading sickness","Something old has risen in the fen you watch"]},"ln-bird-parrot":{"region":"sapphire-sea","homeland":"The bright island-ports of the Sapphire Sea","environment":"Tropical isles and busy trade-harbors","culture":"Parrot-line birdkin are the polyglot traders and tale-tellers of the island-ports, birdkin who speak every tongue of the sea and carry news, gossip, and languages between a hundred harbors. No deal in Port Meridian closes without one nearby.","tradition":"The Hundred-Words, learning to greet in a hundred tongues before joining the harbor-guild.","appearance":"Brilliant multicolored plumage, port-fashion, trade-charms.","naming":"Given name plus a port (Rio of Port Meridian).","occupations":["Translators and traders","News-criers and tale-tellers","Harbor-fixers"],"allies":["Coastborn humans","Swiftwing navigators","Free Captains"],"rivals":["Rival traders","Toll-covenant"],"landmark":"Port Meridian, the free harbor","hooks":["You overheard a deal in a tongue no one knew you spoke","A rumor you carried has sparked a harbor-war","You alone can translate a covenant ultimatum"]},"ln-bird-songbird":{"region":"crownlands","homeland":"The market-quarters of the Crownlands cities","environment":"City squares, guild-halls, and festival streets","culture":"Songbird-line birdkin fill the cities with music and news, birdkin whose songs carry history, gossip, and the mood of the streets. A Songbird's tune can raise a festival or a riot, and criers, minstrels, and heralds spring from their line.","tradition":"The First Song, a public performance in the market square to earn a singer's name.","appearance":"Small, bright-throated, festival-colored, ribbon-charms.","naming":"Given name plus a song (Lark of the Lantern Ward).","occupations":["Minstrels and criers","News-singers","Festival-keepers"],"allies":["Cityborn humans","Halfling quarters"],"rivals":["Censoring guilds","Rival minstrels"],"landmark":"The festival squares of Highreach","hooks":["Your song stirred a riot the guilds want blamed on you","A forbidden verse of history is yours alone to sing","A rival is stealing your songs to spread a lie"]},"ln-bird-vulture":{"region":"ashen-wastes","homeland":"The ash-roads and ruin-fields of the Ashen Wastes","environment":"Volcanic wastes, ash-fields, and death-grounds","culture":"Vulture-line birdkin keep the death-rites others shun, birdkin who tend the fallen and cleanse the ash-fields of the dead. Feared and misunderstood, they are in truth sacred undertakers, and no ash-clan buries its dead without a Vulture's blessing.","tradition":"The Cleansing, a rite of tending the unburied dead so they do not rise as ash-wraiths.","appearance":"Bald-headed, dark-mantled, ash-marked death-vestments.","naming":"Given name plus a rite-name (Morrec Ashkeeper).","occupations":["Death-keepers and undertakers","Ash-field cleansers","Ruin-guides"],"allies":["Ashborn orcs","Lantern Order"],"rivals":["Ash-wraiths","Ember-pilgrim zealots"],"landmark":"The Glass Capital and its unburied dead","hooks":["Ash-wraiths are rising where a cleansing was skipped","You must give death-rites to an enemy to stop them rising","A vault in the Glass Capital holds unblessed dead"]},"ln-bird-magpie":{"region":"crownlands","homeland":"The thieves'-markets and undercity of the Crownlands","environment":"Back-alleys, undercity, and grey-markets","culture":"Magpie-line birdkin are the collectors and cat-burglars, birdkin who cannot resist a shining thing and turn it into a trade. Charming and light-fingered, they run the grey-markets and fence what falls off the back of a wagon.","tradition":"The First Find, a rite of acquiring, by wit or worse, one shining thing to start a hoard.","appearance":"Black-and-white, glittering with trinkets, pocketed finery.","naming":"Given name plus a prized find (Pica Brightpocket).","occupations":["Fences and cat-burglars","Grey-market traders","Appraisers"],"allies":["Ravenkin","Goblin fixers","Halfling burglars"],"rivals":["City watch","Those they have robbed"],"landmark":"The Grey Market of the undercity","hooks":["You stole a shining thing that turned out to be cursed","A powerful person wants back exactly what you fenced","Your hoard holds a key someone will kill for"]},"ln-bird-crane":{"region":"moonlit-vale","homeland":"The garden-shrines of the Moonlit Vale","environment":"Misted gardens, shrine-pools, and quiet groves","culture":"Crane-line birdkin are the long-lived shrine-keepers and peacemakers of the Vale, birdkin of ceremony, patience, and the sacred art of the folded oath. A Crane's mediation is trusted across the Vale, and their dances are said to bless a long life.","tradition":"The Folded Oath, a ceremony where promises are sealed in an intricate ritual dance.","appearance":"Tall, white-and-red crowned, ceremonial robes, oath-folds.","naming":"Given name plus a shrine (Tsuru of the Nine Lanterns).","occupations":["Peacemakers and shrine-keepers","Ceremony-wardens","Long-life healers"],"allies":["Moon elves","Vale kitsune","Turtlekin arbiters"],"rivals":["Oath-breakers","Those who defile shrines"],"landmark":"The Hall of Nine Lanterns","hooks":["A folded oath you sealed is being broken and blamed on you","One of the Nine Lanterns went dark during your ceremony","You must mediate a feud that wants no peace"]},"ln-bird-seagull":{"region":"sapphire-sea","homeland":"The rough dock-quarters of every sea-port","environment":"Harbors, docks, and rocky coasts","culture":"Seagull-line birdkin are the scrappy, adaptable dock-folk, birdkin who thrive in every harbor and turn any scrap into a living. Loud, clever, and impossible to be rid of, they are the sailors, scavengers, and rumor-mills of the waterfront.","tradition":"The Scavenging, a rite of surviving a season on the docks by wit alone to earn a berth.","appearance":"Grey-and-white, brash, salt-worn dock-wear, whistle-charms.","naming":"Given name plus a dock (Skip of Saltmarket).","occupations":["Sailors and dock-hands","Scavengers and fixers","Rumor-mongers"],"allies":["Riverfoot halflings","Free Captains","Goblin dockers"],"rivals":["Harbor-masters","Covenant enforcers"],"landmark":"The dock-quarters of Port Meridian","hooks":["A dock-rumor you spread turned out to be dangerously true","You scavenged something a captain will kill to reclaim","A blockade is starving the docks and you know a way out"]},"ln-bird-peacock":{"region":"sunscorch","homeland":"The sun-courts and pleasure-gardens of Sunspire","environment":"Opulent desert courts and garden-palaces","culture":"Peacock-line birdkin are the resplendent court-birds of the sun-courts, birdkin of display, fashion, and elaborate status-games. Vain by reputation and shrewd in truth, they turn beauty into influence and rule the Sunscorch's salons.","tradition":"The Unfurling, a debut display before the court where a young Peacock claims their status.","appearance":"Iridescent blue-green trains, jeweled finery, display-marks.","naming":"Given name plus a court-house (Mayur of House Sunfeather).","occupations":["Courtiers and fashion-lords","Patrons and salon-keepers","Status-brokers"],"allies":["Sun lions","Sun elves"],"rivals":["Rival courtiers","Those they have outshone"],"landmark":"The garden-courts of Sunspire","hooks":["Your court debut exposed a plot against the Sun Court","A rival is spreading a scandal in your name","The lost heir was last seen at your salon"]},"ln-bird-hummingbird":{"region":"emerald-wilds","homeland":"The flower-groves and Meadowborn villages of the Wilds' edge","environment":"Blossom-groves, meadows, and herb-gardens","culture":"Hummingbird-line birdkin are the tiny, tireless pollinators and swift messengers of the flower-country, birdkin whose speed and delicacy make them prized couriers and healers. Small but fierce, they defend their groves with startling boldness.","tradition":"The Nectar-Run, a swift First Flight visiting nine blossoming groves in a single day.","appearance":"Tiny, iridescent, blur-winged, blossom-charms.","naming":"Given name plus a bloom (Zip of the Ninth Blossom).","occupations":["Swift couriers and pollinators","Herb-healers","Grove-tenders"],"allies":["Meadowborn halflings","Wood elves"],"rivals":["Blight-bringers","Grove-poachers"],"landmark":"The wildflower meadows of the Wilds' edge","hooks":["A blight is killing the groves your nectar-run depends on","You carry a healing-nectar someone desperately needs","Your grove is threatened and you will not flee it"]},"ln-bird-woodpecker":{"region":"emerald-wilds","homeland":"The timber-holds and forest-towns of the Emerald Wilds","environment":"Old-growth timber and forest craft-towns","culture":"Woodpecker-line birdkin are the carpenters and forest-craftfolk, birdkin whose knock-signals carry through the trees and whose woodcraft shapes the Wilds' towns. Industrious and precise, they read a tree's health by its sound and keep the timber-truce with the Greenwardens.","tradition":"The Knock-Speech, learning the tapped signal-code that carries messages across the forest.","appearance":"Red-crowned, black-and-white, tool-belted craft-wear.","naming":"Given name plus a grove (Tock of Thornwatch).","occupations":["Carpenters and woodwrights","Signal-keepers","Timber-wardens"],"allies":["Wood elves","Wildborn humans","Greenwardens"],"rivals":["Reckless loggers","Root-wraiths"],"landmark":"Thornwatch, the forest craft-town","hooks":["The knock-code carried a distress signal you must answer","A sickness in the timber only your ear can find","Loggers are breaking the timber-truce your line keeps"]},"ln-bird-pelican":{"region":"sapphire-sea","homeland":"The provisioning-ports and island stores of the Sapphire Sea","environment":"Harbor-shallows, island stores, and supply-depots","culture":"Pelican-line birdkin are the carriers and provisioners of the sea-trade, big-billed birdkin who haul supplies, run relief to storm-struck isles, and keep the fleets fed. Generous and dependable, they are the quiet logistics that keep the Sapphire Sea alive.","tradition":"The Carrying, a rite of running relief-supplies to a distant isle without loss.","appearance":"Broad, grey-white, deep provision-satchels, harbor-wear.","naming":"Given name plus a depot (Bram of Coralhold Stores).","occupations":["Provisioners and carriers","Relief-runners","Depot-keepers"],"allies":["Coastborn humans","Turtlekin","Pelagic seaborn"],"rivals":["Toll-covenant","Supply-raiders"],"landmark":"The island stores of Coralhold","hooks":["A storm-struck isle will starve without your relief-run","Raiders have hit your supply-depot","Your relief cargo hid contraband you knew nothing about"]},"ln-bird-cardinal":{"region":"frostbound-north","homeland":"The winter-holds of the Frostbound North","environment":"Snow-forests and the bright-red-against-white north","culture":"Cardinal-line birdkin are the winter-heralds of the north, bright-red birdkin whose appearance marks the turning seasons and whose songs carry ancestor-omens across the snow. Steadfast in the cold, they are the north's messengers of hope and warning alike.","tradition":"The Winter-Herald, a song sung at the deep of winter to call the ancestors' guidance.","appearance":"Brilliant crimson against the snow, crest-marked, ancestor-charms.","naming":"Given name plus a winter (Ember of the Long White).","occupations":["Season-heralds and omen-singers","North messengers","Hope-keepers"],"allies":["Northlanders","Snow owls","Frost wolves"],"rivals":["Ice-reavers","The Winter Hunt"],"landmark":"The winter-holds around Fjordheim","hooks":["Your winter-herald song foretold a doom the hold denies","You must carry hope to a hold the Winter Hunt has cut off","An ancestor-omen named you for a hard task"]},"ln-bird-bluejay":{"region":"crownlands","homeland":"The town-squares and frontier villages of the Crownlands","environment":"Market-towns, village greens, and woodland edges","culture":"Blue Jay-line birdkin are the bold, brash alarm-callers and mimics, birdkin who raise the cry when trouble comes and can throw any voice they have heard. Clever tricksters and fierce defenders, they are the self-appointed sentinels of a hundred small towns.","tradition":"The Alarm-Cry, a rite of proving one can raise, and be trusted with, the town's warning-call.","appearance":"Bright blue-crested, black-collared, watch-tokens, whistle-charms.","naming":"Given name plus a town (Jai of Ashford).","occupations":["Alarm-callers and sentinels","Mimics and scouts","Town-defenders"],"allies":["Cityborn humans","Black bears","Hawk sentinels"],"rivals":["Bandits","Those they have mocked"],"landmark":"The village greens of the Crownlands","hooks":["You raised an alarm no one believed until too late","You can mimic a voice that could expose or frame a lord","A false alarm in your voice has ruined your name"]},"ln-bloodborn":{"region":"shadowlands","homeland":"The fledgling-halls of Gloamhold","environment":"The sunless fortress-city and its under-halls","culture":"Bloodborn are the newly-turned, vampires still learning the Dusk Accord and the hungers it governs. They serve a house through their first decades, and a Bloodborn's Turning-Vigil determines whether they master the thirst or are mastered by it.","tradition":"The Turning-Vigil, the first night of the returned, spent under a house's protection and judgment.","appearance":"Pale, sharp-toothed, still adjusting to the eyes and hungers, plain house-livery.","naming":"Given name plus a house (Cael of House Mourne).","occupations":["House-servants and initiates","Blood-accord clerks","Night-runners"],"allies":["Their sire's house","Duskborn"],"rivals":["Rival houses","The Unlit"],"landmark":"Gloamhold, the sunless city","hooks":["You do not yet know which house or sire made you","Your thirst is slipping the Accord's leash","A house means to use your newness against your own sire"]},"ln-nightborn":{"region":"shadowlands","homeland":"The house-courts of the Night Court","environment":"Sunless courts and mirror-less halls","culture":"Nightborn are house-scions born into vampire nobility, raised in the Dusk Accord and the centuries-long games of the Night Court. Patient and political, they treat a debt as a leash and an alliance as a slow-tightening knot.","tradition":"The Century-Court, when houses gather once a hundred years to settle debts and reweave alliances.","appearance":"Aristocratic, timeless finery, house-signet, composed pallor.","naming":"Given name and full house-lineage (Isadore of House Valmont, Third of the Line).","occupations":["House-scions and courtiers","Debt-brokers","Night-court diplomats"],"allies":["Their house bloc","Vale kitsune"],"rivals":["Rival houses","The Unlit"],"landmark":"The Night Court of Gloamhold","hooks":["A blood-accord your house swore is now yours to honor across ages","The Century-Court falls in your generation and the debts are dangerous","Your house needs a living envoy no one will miss"]},"ln-crimson":{"region":"shadowlands","homeland":"The warrior-halls of the crimson lines","environment":"Border-fortresses of the Shadowlands","culture":"Crimson are the warrior-vampire lines, house-guards and duelists who held the border through the Blood Wars. Where the Nightborn scheme, the Crimson enforce, and their disciplined night-guard are the sword behind the Accord.","tradition":"The Blood-Duel, a formal contest that settles house-disputes without open war.","appearance":"Crimson-sashed, battle-scarred, dueling-blades, warrior's pallor.","naming":"Given name and a battle-honor (Rurik Redguard).","occupations":["House-guards and duelists","Border-enforcers","War-captains"],"allies":["Their house","Bloodmoon orcs (as border-allies)"],"rivals":["The Unlit","Rival house-guards"],"landmark":"The border-fortresses of the Shadowlands","hooks":["A blood-duel you must fight is rigged against your house","The Unlit are massing at the border you guard","You are ordered to enforce an Accord-ruling you find unjust"]},"ln-moonblood":{"region":"moonlit-vale","homeland":"The Vale-courts where night meets moonlight","environment":"Moonlit dusk and the Vale's silvered halls","culture":"Moonblood are the mystic vampire lines of the Moonlit Vale, seers and dream-walkers who read the lunar tides and traffic in omens rather than blood-politics. They bridge the night-courts and the moon-courts, and their prophecies are sought and feared alike.","tradition":"The Moon-Communion, a rite of reading fate in the lunar tides and the blood at once.","appearance":"Luminous-pale, moon-marked, dream-silk, silvered eyes.","naming":"Given name and a lunar epithet (Selara Moonveil).","occupations":["Seers and dream-walkers","Omen-brokers","Court-mystics"],"allies":["Moon elves","Vale kitsune","Night owls"],"rivals":["Dream-thieves","The Unlit"],"landmark":"Silvermere, the fate-showing lake","hooks":["A moon-communion showed a fate you would die to prevent","Your prophecy has made you a piece in a Moon Court game","The lunar tides are turning wrong and your omens with them"]},"ln-ancient-v":{"region":"abyssal-trench","homeland":"The deep sunless vaults of the oldest houses","environment":"Ancient sealed crypts and lightless deep places","culture":"The Ancient are the eldest vampires, who remember the sky breaking and have seen too many ages to bother with cruelty for its own sake. They sleep for centuries in sealed vaults, and when one stirs, whole houses hold their breath, for an Ancient's waking reshapes the Accord.","tradition":"The Long Sleep, a slumber of centuries from which an Ancient wakes only for a turning of the age.","appearance":"Timeless, still, robed in dead centuries' fashion, eyes like old wells.","naming":"A single archaic name (Vhaeloth, called the Patient).","occupations":["Sleeping powers","Keepers of the oldest lore","Arbiters of the Accord"],"allies":["Their ancient house","Abyssal seaborn (as neighbors of the deep)"],"rivals":["The Unlit","Those who would wake them for gain"],"landmark":"The Drowned Spire rising from the trench","hooks":["An Ancient of your house is waking and no one knows what it wants","You serve an Ancient who remembers the sky breaking","Someone means to wake an Ancient to end the Accord"]},"ln-duskborn-v":{"region":"shadowlands","homeland":"The shadow-border refuges of the returned","environment":"The failing-light border-country","culture":"Duskborn are the border-dwelling vampires who chose the edge of the light over the deep courts, wardens who hold the shadow-border against the Unlit and shelter refugees the courts ignore. Less bound by house politics, they are the closest thing to heroes the returned produce.","tradition":"The Dusk-Watch, a self-imposed vigil holding the border where the living and the dark both press.","appearance":"Weathered, plain border-wear, dusk-marked, watchful pallor.","naming":"Given name and a border-post (Alden of the Grey Watch).","occupations":["Border-wardens and refuge-keepers","Monster-hunters","Living-and-dead go-betweens"],"allies":["Shadow-wardens","Duskhares","Dusk lions"],"rivals":["The Unlit","House-politics that would use them"],"landmark":"The Threshold of Long Shadows","hooks":["The border-light is failing and your watch is the last one holding","Refugees are fleeing the dark into your care","The Unlit have found something that can dim a sun"]},"ln-tideborn-s":{"region":"sapphire-sea","homeland":"The reef-shallows and tide-towns of the Sapphire Sea","environment":"Warm shallows, tide-flats, and coastal currents","culture":"Tideborn seaborn are the shallow-water folk who trade and live along the tide-line, the most surface-facing of the sea-peoples. They keep the Tide Covenant's law and sing the tide-tables, and their harbors are where the deep meets the dry.","tradition":"The First Descent, a young Tideborn's first dive into deeper water to earn adult standing.","appearance":"Teal-scaled, finned, pearl-adorned, tide-woven kelp-silk.","naming":"Given name plus a tide (Nael of the Turning Tide).","occupations":["Traders and tide-singers","Covenant wardens","Coast-pilots"],"allies":["Coastborn humans","Turtlekin","Tideborn dragonborn"],"rivals":["Free Captains (over tolls)","Reef-raiders"],"landmark":"Coralhold, the half-submerged reef-city","hooks":["A covenant toll-dispute has put you between the deep and the surface","The tides are singing wrong and the elders fear the abyss","Reef-serpents are fleeing the deep and driving ashore"]},"ln-reefborn":{"region":"sapphire-sea","homeland":"The living coral city Coralhold","environment":"Coral-reef cities and bright shallow gardens","culture":"Reefborn seaborn are the coral-city builders, artisans who grow their homes from living reef and tend the Coral Throne. Bright and communal, they are the gardeners and craftfolk of the sea, and a reef-war over territory is their gravest fear.","tradition":"The Coral-Tending, a lifelong care of a living reef-home passed down and grown across generations.","appearance":"Coral-hued scales, reef-jeweled, living-coral ornaments.","naming":"Given name plus a reef (Cora of the Bright Reef).","occupations":["Coral-shapers and artisans","Reef-wardens","Pearl-cultivators"],"allies":["Turtlekin reef-elders","Pearl Guild"],"rivals":["Reef-raiders","Abyss-choir"],"landmark":"The living Coral Throne of the covenant","hooks":["Your reef-home is sickening in a strange new shape","A reef-war looms over disputed coral-territory","The Coral Throne is growing wrong and no one knows why"]},"ln-deepborn":{"region":"abyssal-trench","homeland":"The cold deep-water halls below the reefs","environment":"The cold lightless mid-deep, below sun and above the abyss","culture":"Deepborn seaborn dwell in the cold dark below the reefs, bio-luminous folk who keep to themselves and distrust the bright surface. Patient and alien to the tide-towns, they are the bridge, and the buffer, between the reef-cities and the true abyss.","tradition":"The Deepening, a rite of descending into the cold dark alone and returning bearing its light.","appearance":"Dark-scaled, bio-luminous markings, blind-pale eyes, deep-glow ornaments.","naming":"Given name plus a depth (Vorel of the Cold Deep).","occupations":["Deep-wardens and glow-tenders","Salvagers of sunk things","Abyss-watchers"],"allies":["Abyssborn (warily)","Deep dwarves"],"rivals":["Abyss-choir cults","Surface salvagers"],"landmark":"The Silent Deep where even light dies","hooks":["Something the size of an island is moving up from the abyss","You carry a light the abyss-folk want back","The Deepening showed you the trench is not empty"]},"ln-stormtide":{"region":"stormreach","homeland":"The storm-coast currents of the Stormreach","environment":"The tempest-lashed sea where storm meets tide","culture":"Stormtide seaborn ride the storm-driven currents where the Stormreach meets the sea, the wildest and boldest of the tide-folk. Kin in spirit to the Gale Riders and Stormborn, they surf the tempest-swells and salvage what the storms drown.","tradition":"The Storm-Swim, riding a tempest-driven current to prove one belongs to the storm-tide.","appearance":"Storm-grey scales, static-marked fins, storm-glass and salvage-charms.","naming":"Given name plus a storm-current (Rael of the Tempest Race).","occupations":["Storm-salvagers and swimmers","Rescue-divers","Coast-raiders"],"allies":["Stormborn dragonborn","Gale Riders","Stormtide dragonborn"],"rivals":["Stormwardens","Storm-krakens"],"landmark":"The drowning coasts of the Stormfall","hooks":["A storm-swim carried you to a wreck no one else can reach","The tempest that shelters your current has begun to fail","You salvaged something the storm was hiding"]},"ln-abyssborn":{"region":"abyssal-trench","homeland":"The vent-lit courts of the Abyssal Trench","environment":"The crushing lightless deep around black-fire vents","culture":"Abyssborn seaborn keep the alien hymn-singing courts of the trench, folk of the black fire whose faiths the surface finds disturbing. Not evil, but utterly other, they guard what sleeps near the vents and sing in registers the surface cannot hear.","tradition":"The Deep-Song, a hymn learned in the crushing dark that binds the abyss-folk together.","appearance":"Black-scaled, anglerlight lures, abyss-glass ornaments, void-pale eyes.","naming":"A resonant deep-name plus a vent (Xoloth of the Black Fire).","occupations":["Abyss-keepers and vent-wardens","Deep-song singers","Guardians of drowned relics"],"allies":["Deepborn (uneasily)","Ancient vampires of the deep"],"rivals":["Surface seaborn who fear them","Vent-raiders"],"landmark":"The Black Fire vents of the trench","hooks":["Your Deep-Song is being heard in surface harbors","The Drowned Spire has lit up for the first time in an age","You carry a drowned relic the abyss wants returned to the dark"]},"ln-pearlborn":{"region":"sapphire-sea","homeland":"The pearl-current trade-routes of the Sapphire Sea","environment":"The rich pearl-beds and trade-currents","culture":"Pearlborn seaborn are the merchant-divers of the pearl-currents, the wealthiest and most cosmopolitan of the sea-folk, who run the Pearl Guild and seal treaties in gifted pearls. Diplomatic and shrewd, they are the sea's bankers and go-betweens.","tradition":"Pearl-gifting, sealing bonds and treaties with a pearl whose flaw and luster record the terms.","appearance":"Pearl-sheened scales, opulent shell-and-pearl finery, trade-marks.","naming":"Given name plus a current (Lys of the Pearl Run).","occupations":["Pearl-divers and merchants","Guild-diplomats","Treaty-brokers"],"allies":["Turtlekin arbiters","Pearl Guild","Coastborn humans"],"rivals":["Free Captains","Pearl-poachers"],"landmark":"Port Meridian, the free harbor","hooks":["A pearl-sealed treaty you carry could stop or start a reef-war","Poachers are raiding your family's pearl-beds","A gifted pearl's hidden flaw reveals a broken bargain"]},"ln-shellguard":{"region":"sapphire-sea","homeland":"The island fortress-holds of the Sapphire Sea","environment":"Storm-proof island holds and reef-guarded shores","culture":"Shellguards are the island-guardian turtlekin, the immovable defenders whose shield-lines never break and who hold the storm-proof island holds. Patient and lawful, they guard the elder-circles and the tide-law the sea-peoples live by.","tradition":"The Shell-Marking, a life-record carved slowly into one's own shell over decades of deeds.","appearance":"Broad-shelled, deliberate, shell-sigils, simple guard-wraps.","naming":"Given name plus an island-hold (Tobar of the Green Hold).","occupations":["Island-guardians and shield-bearers","Elder-circle wardens","Reef-defenders"],"allies":["Reefborn seaborn","Pearlborn merchants"],"rivals":["Reef-raiders","Abyss-choir"],"landmark":"The island holds of the Sapphire Sea","hooks":["Your island hold sits above something the Deep Conclave wants sealed","A reef-war is coming to the hold you guard","The elder-circle entrusted you with a tide-law treaty to deliver"]},"ln-seaturtle":{"region":"sapphire-sea","homeland":"The open-water migrations of the Sapphire Sea","environment":"The open ocean and its long migration-currents","culture":"Seaturtles are the ocean-wandering turtlekin, long-lived navigators who follow the great currents and know the whole sea as a single road. They are the pilots and living charts of the Sapphire Sea, and their memory spans generations of tides.","tradition":"The Great Migration, a life-defining circuit of the sea's currents, undertaken once to earn elder-standing.","appearance":"Streamlined shells, current-worn, navigator's shell-marks.","naming":"Given name plus a current (Kaimana of the Long Current).","occupations":["Navigators and pilots","Living cartographers","Migration-guides"],"allies":["Swiftwing navigators","Coastborn humans","Pearlborn"],"rivals":["Storm-krakens","Toll-covenant enforcers"],"landmark":"The great migration-currents of the sea","hooks":["A current you have followed for decades has shifted","Your living chart is the only map to a lost island","The migration crossed the path of something rising from the deep"]},"ln-riverback":{"region":"crownlands","homeland":"The inland waterways and river-moots of the Crownlands","environment":"Slow rivers, lakes, and inland waterways","culture":"Riverbacks are the inland-waterway turtlekin, ferry-keepers and river-moot arbiters who mediate the disputes of the barge-folk and border-towns. Trusted neutral parties, they keep the river-law and remember every treaty made on the water.","tradition":"The River-Moot, a slow gathering where disputes are heard across many days on the water.","appearance":"Mossy river-shells, weathered, ferry-poles, river-sigils.","naming":"Given name plus a river (Marn of the Slow River).","occupations":["Ferry-keepers and pilots","River-arbiters","Waterway-wardens"],"allies":["Riverfoot halflings","Bridgewater guilds"],"rivals":["Toll-trolls","River-guild rivals"],"landmark":"The Drowned Palace beneath Bridgewater","hooks":["A river-moot dispute is about to turn to blood","Your ferry-route crosses over the Drowned Palace and something stirs","A treaty you keep is being denied by both parties"]},"ln-terrapin":{"region":"emerald-wilds","homeland":"The marsh-villages at the Wilds' waterways","environment":"Wetland fens, marsh-villages, and reed-country","culture":"Terrapins are the marsh-village turtlekin, small and communal, herbalists and quiet keepers of the fen-lore. They live in stilt-villages among the reeds and are famed for patience, healing, and the ability to outwait any trouble.","tradition":"The Fen-Keeping, a rite of tending a stretch of marsh and its lore for the village.","appearance":"Small mottled shells, reed-woven wraps, herb-pouches.","naming":"Given name plus a marsh (Pell of the Quiet Fen).","occupations":["Marsh-healers and herbalists","Fen-lore keepers","Village-elders"],"allies":["Heron birdkin","Meadowborn halflings","Wood elves"],"rivals":["Fen drakes","Blight-bringers"],"landmark":"The reed-country of the Emerald Wilds","hooks":["A blight is spreading through your marsh","Your fen-lore holds a cure someone needs desperately","Something old has stirred in the reeds you tend"]},"ln-ancientshell":{"region":"sapphire-sea","homeland":"The oldest island-sanctuaries of the Sapphire Sea","environment":"Ancient island-shrines and time-worn sanctuaries","culture":"Ancient Shells are the eldest turtlekin bloodline, living records older than most kingdoms who remember the First Age and speak of it perhaps once a century. Their shell-markings are histories in themselves, and they are the final arbiters when all other law fails.","tradition":"The Century-Speaking, when an Ancient Shell shares one long-held memory of the First Age.","appearance":"Vast, moss-and-barnacle shells, marked with centuries of history, still eyes.","naming":"A single archaic name plus a sanctuary (Old Maru of the First Isle).","occupations":["Living histories and final arbiters","Sanctuary-keepers","Elder-of-elders"],"allies":["Turtlekin elder-circles","Ancient tigerkin","Great Owls"],"rivals":["Those who would rush or exploit them","Relic-thieves"],"landmark":"The First Isle sanctuary","hooks":["An Ancient Shell is about to speak a memory of the First Age and factions vie to hear it","The sanctuary you tend holds a First Age secret","You must protect an elder whose memory is the key to a crisis"]},"ln-redtail":{"region":"moonlit-vale","homeland":"The market-courts of Duskhollow","environment":"Perpetual dusk, silk-salons, and market-quarters","culture":"Redtails are the court-and-market kitsune, brokers of favors and secrets who run the salons of the Vale. Charming and dangerous, they track favor-debts with absolute precision, and a Redtail's freely-given favor is a bond stronger than any chain.","tradition":"The First Mask, a coming-of-age when a young Redtail takes or is given their court-face.","appearance":"Red-furred, expressive-masked, moon-silk finery, favor-tokens.","naming":"Given name plus a court-mask (Akari of the Crimson Mask).","occupations":["Favor-brokers and courtiers","Negotiators and fixers","Salon-keepers"],"allies":["Moon elves","Vale harengon","Ravenkin"],"rivals":["Rival brokers","Those who default on favors"],"landmark":"Duskhollow, the market-town in eternal dusk","hooks":["You owe a favor-debt you cannot repay and cannot escape","A favor you granted has made you a piece in a Moon Court game","You took a court-mask its former owner wants back"]},"ln-silvertail":{"region":"moonlit-vale","homeland":"The old noble houses of the Moon Court","environment":"Ancient silk-walled estates and mirror-halls","culture":"Silvertails are the old noble kitsune lines, houses older than the Sundering they quietly survived, keepers of the deepest secrets and the longest games. Elegant and patient, they rule the Moon Court by knowing more than anyone and saying less.","tradition":"The Tail-Reckoning, marking the addition of a new tail, a rite earned by an age of cunning survived.","appearance":"Silver-furred, many-tailed with age, exquisite masks, ancestral finery.","naming":"House-name and personal name (Yuki of House Silvermoon).","occupations":["Noble house-heads","Master intriguers","Secret-keepers of the age"],"allies":["Ancient vampires","High elves","Moon elves"],"rivals":["Rival houses","The Unlit"],"landmark":"The Moon Court of the Vale","hooks":["Your house holds a secret from before the Sundering","A tale is circulating that could topple your house","The Nine-Tailed One has called in a favor your house owes"]},"ln-shadowtail":{"region":"shadowlands","homeland":"The shadow-border enclaves near the Vale","environment":"The twilight border where Vale bleeds into Shadowlands","culture":"Shadowtails are the border kitsune who walk where the Vale meets the Shadowlands, spies and shadow-walkers who trade secrets between the living and the returned. The most dangerous of the kitsune, they keep faiths and favors in the dark that even other kitsune fear.","tradition":"The Shadow-Mask, a court-face worn only in the dark, whose secrets are never spoken by daylight.","appearance":"Shadow-dark fur, void-touched masks, shadow-silk, dusk-gold eyes.","naming":"Given name plus a shadow-mask (Kage of
