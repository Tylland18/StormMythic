      +'<select onchange="SM.codex.set(\'el\',this.value)">'+opt(els,f.el)+'</select>'
      +'<select onchange="SM.codex.set(\'tier\',this.value)">'+opt(tiers,f.tier)+'</select>'
      +'</div></div>'
      +'<div class="section-head" style="margin-top:12px"><h3 id="codexCount">'+C.countHtml()+'</h3></div>'
      +'<div id="codexList" class="list">'+C.listHtml()+'</div>'
      +'<div id="codexPager" class="row" style="justify-content:center;gap:8px;margin-top:12px">'+C.pagerHtml()+'</div>';
  };
})();
SM.data.LORE={"meta":{"world":"Aethyr, the Storm-Wracked World","premise":"Long ago the sky broke and the Storm came down. It never fully left. Aethyr is a continent of proud survivor-cultures raised in the ruin of a vanished golden age, where weather is a living force, old empires lie buried under ash and ice, and every people tells a different story about who broke the sky.","worldRule":"Kin is broad heritage; Lineage is a specific ancestry, region, environment, magical influence, or cultural branch. No Kin or Lineage locks a character into any Class or Discipline."},"regions":[{"id":"crownlands","name":"The Crownlands","climate":"Temperate river valleys, long autumns, mild wet winters","description":"The green heart of Aethyr, a patchwork of river-duchies, walled market-cities and old battlefields turned farmland. The Crownlands were the seat of the Old Empire that fell in the Great Sundering, and every plough here eventually turns up imperial coin, bone, or worse. It is the most multicultural region of the world: its free cities keep no single Kin as master.","settlements":["Highreach","Bridgewater","Ninebridge Hold","Ashford Market"],"factions":["crown-concord","goldhand-league","lantern-order","greycloak-company"],"commonKin":["human","halfling","dwarf","elf","goblin","kitsune","birdkin"],"creatures":["Sunder-wights (imperial dead that never rest)","Toll-trolls under old bridges","Fen drakes in the reed-country"],"resources":["Grain, wine, river-iron, imperial salvage, guild banking"],"conflicts":["Duchies quarrel over the vacant imperial throne","Salvage-rights wars over buried Old Empire vaults","Guilds versus nobility over city charters"],"landmarks":["The Sundered Throne (a shattered imperial seat no one may sit in)","The Nine Bridges of Ninebridge Hold","The Drowned Palace beneath Bridgewater"],"hooks":["A duke hires outsiders to open an imperial vault before a rival does","A dead emperor's crown surfaces in a river and three cities want it","The Sundered Throne begins to whisper again"]},{"id":"stormreach","name":"The Stormreach","climate":"Permanent storm-belt: chained thunderheads, standing lightning, wind that never sleeps","description":"A coastal expanse where the Storm that broke the sky still lives, wandering the land as walking tempests. People here do not shelter from weather so much as bargain with it. Stormreach folk read the sky like scripture and raise their halls on ridgelines to court the lightning rather than hide from it.","settlements":["Thundergate","Skybell Reach","Galecrag"],"factions":["stormwardens","skybell-choir","gale-riders"],"commonKin":["dragonborn","genasi","harengon","goliath","human","birdkin"],"creatures":["Living squalls (tempests with intent)","Thunder-eels in the surf","Storm-golems raised by old lightning"],"resources":["Storm-glass, charged crystal, sky-iron, weather augury"],"conflicts":["Rival storm-cults claim to speak for the living Storm","Coastal holds war over the few calm harbors","Debate on whether the Storm should be worshipped, fought, or freed"],"landmarks":["The Standing Bolt (a lightning strike frozen mid-air for a century)","Skybell Reach, whose bronze bells never stop ringing in the wind","The Eye, a permanent hole of calm at the storm's center"],"hooks":["The Storm speaks a name and it is your character's","A hold's Storm Bell has fallen silent for the first time in memory","Someone claims to have walked into the Eye and come back changed"]},{"id":"ironspine","name":"The Ironspine Mountains","climate":"Alpine and subterranean, bitter peaks over warm forge-deep halls","description":"The stone backbone of the continent: a titanic range riddled with dwarven forge-cities, goliath high-holds, and the tunnels of the Deep folk. The Ironspine is where the world keeps its metal and its grudges. Above the cloud line, sky-clans cross ancient bridges; below, forge-fires have burned without pause since before the Sundering.","settlements":["Durnhal","Cloudanvil","Crossbridge","Emberdeep"],"factions":["forgemoot","high-clans","vault-keepers"],"commonKin":["dwarf","goliath","orc","goblin","bearkin","birdkin"],"creatures":["Magma-wyrms","Rockjaw trolls","Tunnel-stalkers from the deeper dark"],"resources":["Iron, sky-iron, gemstone, rune-coal, master smithing"],"conflicts":["Forge-cities feud over ore-veins and forgotten vault claims","Deep folk and surface dwarves disagree on how far down is too far","High-clans and forgemoot argue over who owns the peaks versus the roots"],"landmarks":["The Everforge of Durnhal","The Nine Bridges above the cloud line","The Sealed Door of Emberdeep, which no one has opened and lived"],"hooks":["A forge-city's Everforge is dimming and no one knows why","A vault claim erupts into clan war","Something is knocking on the Sealed Door from the inside"]},{"id":"emerald-wilds","name":"The Emerald Wilds","climate":"Vast temperate-to-tropical old-growth forest, misted and green year round","description":"An immense living forest older than any kingdom, where elven realms, beast-kin ranges, and hidden groves overlap under one canopy. The Wilds are not empty wilderness but a contested green nation of many peoples who share the trees and rarely the rules. Cutting the wrong tree can start a war.","settlements":["Elarethil","Green Hollow","Thornwatch"],"factions":["greenwardens","thorn-court","canopy-pact"],"commonKin":["elf","wolfkin","owlkin","tigerkin","kitsune","halfling","birdkin"],"creatures":["Green-drakes","The Hunt (a spectral pack that rides the deep wood)","Root-wraiths"],"resources":["Hardwood, herbcraft, living-wood bows, rare game, druidic reagents"],"conflicts":["Elven high-realms versus wandering beast-kin ranges over hunting grounds","The Thorn Court's isolationism versus the Canopy Pact's open borders","Loggers and frontier settlers pressing the tree line"],"landmarks":["The Heartwood, a tree said to remember the whole forest","The Silent Glade where sound will not travel","Elarethil, a city grown, not built"],"hooks":["The Heartwood is sickening and blames outsiders","The Hunt has begun riding by day","A grove-treaty is broken and both sides want a neutral witness"]},{"id":"ashen-wastes","name":"The Ashen Wastes","climate":"Grey volcanic desert, ashfall, ember-storms, sudden lava","description":"Where an empire burned. The Ashen Wastes are the scorched grave of a lost civilization and the ember-fires never fully died. Orc ash-clans, ember-touched dragonborn, and scavenger goblins live off what the fire left, walking the ash between glass ruins and cinder-cones.","settlements":["Cinderhold","Glasswatch","Emberfoot Camp"],"factions":["ash-clans","ember-pilgrims","cinder-guild"],"commonKin":["orc","dragonborn","goblin","genasi","goliath"],"creatures":["Cinder-hounds","Ash-wraiths of the burned empire","Glass scorpions"],"resources":["Obsidian, ash-glass, sulfur, fire-salvage, forge-stone"],"conflicts":["Ash-clans raid one another over water and glass ruins","Pilgrims who believe the fire is holy versus those who want it out","Everyone versus what still walks the burned capital"],"landmarks":["The Glass Capital, a city fused to obsidian in a single night","The Everburn, a fire that has never gone out","The Ashfall Road paved with the bones of an army"],"hooks":["A map to an unburned vault in the Glass Capital","The Everburn is spreading","An ash-clan elder claims the fire is finally ready to speak"]},{"id":"frostbound-north","name":"The Frostbound North","climate":"Subarctic to arctic: fjords, glaciers, white winters, brief fierce summers","description":"A hard white country of fjords, ice-plains, and glacier-halls. The North breeds endurance and long memory. Northlander humans, frost-touched orcs and goliaths, and polar beast-kin share a land where the aurora is read as an ancestor-fire and the cold is treated as a living, judging thing.","settlements":["Fjordheim","Whitehall","Glacier's End"],"factions":["frost-moot","aurora-keepers","ice-reavers"],"commonKin":["human","orc","goliath","bearkin","wolfkin","owlkin"],"creatures":["Frost-wyrms","White stalkers","The Winter Hunt"],"resources":["Furs, whale-ivory, glacier-glass, amber, hardy longships"],"conflicts":["Ice-reaver raiders versus settled fjord-holds","Aurora-keepers and frost-moot argue over ancestor rites","Southern colonists pressing north for glacier-glass"],"landmarks":["The Aurora Vault, where the North keeps its dead kings under ice","The Frozen Fleet locked in a harbor of ice","The Long Bridge of glacier stone across a frozen fjord"],"hooks":["A dead king is thawing out of the Aurora Vault","The Winter Hunt has crossed south of its old bounds","The Frozen Fleet's ice is cracking"]},{"id":"sunscorch","name":"The Sunscorch Desert","climate":"Hot sand-sea and rock desert, killing days, cold star-bright nights","description":"A golden sea of dunes and buried cities under a merciless sun. The Sunscorch hides more history than any region, swallowed and preserved by the sand. Desert humans, lionkin prides, sun-elf caravans, and genasi flame-folk trade along oasis-roads and guard the secret of where the old cities sleep.","settlements":["Oasis of Karan","Sunspire","Dune's Mouth"],"factions":["caravan-league","sun-court","sand-readers"],"commonKin":["human","lionkin","elf","genasi","goblin","birdkin"],"creatures":["Sand-drakes","Dune-leviathans","Mirage-stalkers"],"resources":["Spice, salt, glass, sun-gold, buried antiquities"],"conflicts":["Caravan-league versus sun-court over oasis tariffs","Grave-robbers versus sand-readers who keep the buried cities sealed","Prides and city-folk over water rights"],"landmarks":["Sunspire, a mile-high needle that casts no shadow at noon","The Buried City of Karan-That-Was","The Mirror Flats where the sky reflects underfoot"],"hooks":["A sandstorm has uncovered a city that should have stayed buried","The sun-court's heir is lost in the deep dunes","Someone is selling maps to the Buried City and the sand-readers want them dead"]},{"id":"moonlit-vale","name":"The Moonlit Vale","climate":"Cool misted highland valley in perpetual dusk and moonlight","description":"A haunting valley where it is always evening. The Moon hangs low and the light never fully fades to dark or brightens to day. Kitsune tricksters, moon-elves, owlkin seers, and quiet human villages live by lunar tides and dream-omens. Nothing here is quite what it seems, and the Vale likes it that way.","settlements":["Duskhollow","Silvermere","Nine Lanterns"],"factions":["moon-court","dream-wardens","masked-consorts"],"commonKin":["kitsune","elf","owlkin","harengon","human","vampire"],"creatures":["Dream-eaters","Lantern-wisps","Mirror-things that wear borrowed faces"],"resources":["Moon-silver, dream-herbs, silk, illusion-craft, omens"],"conflicts":["Moon-court intrigue where duels are fought with secrets","Dream-wardens versus those who traffic in stolen dreams","The border where the Vale bleeds into the Shadowlands"],"landmarks":["Silvermere, a lake that shows not your face but your fate","The Hall of Nine Lanterns that must never all go dark","The Turning Wood where paths rearrange by moonlight"],"hooks":["One of the Nine Lanterns has gone out","A face in Silvermere is your own, older and afraid","A kitsune noble owes you a favor and that is more dangerous than a debt"]},{"id":"blackdeep","name":"The Blackdeep","climate":"Lightless subterranean world, warm near magma, cold in the far tunnels","description":"The underworld beneath the Ironspine and beyond: a whole hidden civilization of lightless kingdoms, fungal forests, and cavern-seas. The Deep dwarves, drow, cave goblins, and things older than either raise cities by the glow of stone. Down here, a lantern is a target and silence is a language.","settlements":["Lowvault","Glimmerreach","The Sunless Market"],"factions":["deep-conclave","drow-houses","lantern-smugglers"],"commonKin":["dwarf","elf","goblin","vampire","turtlekin"],"creatures":["Mind-lurkers","Glow-leviathans in the cavern-seas","The Pale Choir"],"resources":["Deep-crystal, glowcap, black-iron, blind-pearl, forbidden lore"],"conflicts":["Drow houses' endless succession wars","Deep-conclave versus surface expeditions","Who owns the Sunless Market and its neutral peace"],"landmarks":["The Sunless Market, the one place all Deep peoples keep the peace","The Glowfall, an underground waterfall of luminous stone","The Deepest Door, below which the Deep folk refuse to dig"],"hooks":["Something is coming up through the Deepest Door","A drow house hires surface blades for a war its own kind won't fight","The Glowfall is going dark, tunnel by tunnel"]},{"id":"sapphire-sea","name":"The Sapphire Sea","climate":"Warm bright ocean, trade winds, reef-shallows and open blue","description":"The great bright ocean and its thousand islands, ruled by no crown and crossed by every flag. Seaborn tide-folk, turtlekin island-elders, coastal humans, and birdkin sailors make the Sapphire Sea the world's marketplace and its most contested water. Above the waves it is trade; below, it is another world entirely.","settlements":["Port Meridian","Coralhold","Saltmarket"],"factions":["tide-covenant","free-captains","pearl-guild"],"commonKin":["seaborn","turtlekin","human","birdkin","halfling"],"creatures":["Reef-serpents","Storm-krakens","Siren-shoals"],"resources":["Pearl, coral, salt, fish, trade goods, shipwreck salvage"],"conflicts":["Free-captains versus the tide-covenant's toll-lines","Surface trade versus seaborn undersea claims","Reef territory wars between island turtlekin elders"],"landmarks":["Port Meridian, the neutral crossroads of all sea-trade","The Coral Throne of the tide-covenant","The Graveyard Reef where sunk fleets rest"],"hooks":["A free-captain needs a crew to raid a covenant toll-vault","The Graveyard Reef has surfaced a ship that sank a hundred years ago","Something in the deep is driving the reef-serpents ashore"]},{"id":"abyssal-trench","name":"The Abyssal Trench","climate":"Crushing lightless deep-ocean, cold, pressure, bioluminescent dark","description":"The bottom of the world's ocean, a trench so deep the sun is a rumor. Abyss-born seaborn and things without names keep court in the crushing dark around vents of black fire. Few surface folk go down and fewer return, and those that do speak of a drowned city that was never built by human hands.","settlements":["Vent's Heart","The Drowned Spire"],"factions":["abyss-choir","vent-wardens"],"commonKin":["seaborn","vampire","turtlekin"],"creatures":["Anglerdrakes","The Nameless (abyssal titans)","Ghost-shoals"],"resources":["Black-fire pearl, abyss-glass, deep-song, drowned relics"],"conflicts":["Abyss-choir cults versus surface seaborn who fear them","Vent-wardens guarding what sleeps near the black fire","Salvagers versus the crushing dark itself"],"landmarks":["The Drowned Spire, a tower rising from the trench floor","The Black Fire vents","The Silent Deep where even bioluminescence dies"],"hooks":["The Drowned Spire has lit up for the first time in an age","An abyss-choir hymn is being heard in surface harbors","Something the size of an island is moving up the trench"]},{"id":"skyward-isles","name":"The Skyward Isles","climate":"High-altitude floating islands, thin cold air, endless sky and cloud-seas","description":"Broken chunks of an ancient land that never fell, held aloft by old sky-magic and the living Storm. The Skyward Isles drift above the world, home to seraphim high-realms, birdkin aeries, harengon sky-clans, and the daring who cross between islands on gliders and bridges of chain and cloud. To be grounded here is to be lost.","settlements":["Highperch","Cloudspire","Windmoot"],"factions":["sky-covenant","aerie-clans","chain-bridgers"],"commonKin":["seraphim","birdkin","harengon","genasi","owlkin"],"creatures":["Sky-rays","Roc-broods","Cloud-leviathans"],"resources":["Skystone, cloud-silk, updraft-crystal, feather-gold"],"conflicts":["Aerie-clans versus sky-covenant over island claims","Isles that are slowly sinking and who gets the lifeboats","Ground-born refugees seeking asylum aloft"],"landmarks":["Cloudspire, the highest inhabited point in the world","The Chain Bridges strung between drifting isles","The Sinking Isle, dropping a hand-span each year"],"hooks":["An isle has begun to fall and thousands live on it","A Chain Bridge is cut and someone profits","The sky-covenant seeks proof of what holds the isles up before it fails"]},{"id":"celestial-heights","name":"The Celestial Heights","climate":"Rarefied luminous upper heaven, starlight, aurora, unearthly stillness","description":"The highest realm mortals can reach, a place of star-fire and impossible light where the seraphim keep their oldest halls and the sky is close enough to touch. The Heights are less a country than a threshold, half in the world and half out of it. Time runs strangely here and few who climb come down unchanged.","settlements":["Dawnhold","The Star Court"],"factions":["radiant-choir","star-wardens","fallen-covenant"],"commonKin":["seraphim","genasi","owlkin"],"creatures":["Light-wardens","Star-moths the size of ships","The Fallen (seraphim who chose the ground)"],"resources":["Starlight-glass, radiant ore, celestial song, prophecy"],"conflicts":["Radiant-choir orthodoxy versus the fallen-covenant's heresy","Whether mortals should be allowed to climb at all","A schism over a prophecy of the sky breaking again"],"landmarks":["The Star Court, where the constellations are said to hold council","The Threshold, edge of the world and the beyond","Dawnhold, first light every morning"],"hooks":["A prophecy names your character in the Star Court's records","A Fallen seraph asks you to carry a message the choir has forbidden","The stars over the Threshold have begun to go out"]},{"id":"shadowlands","name":"The Shadowlands","climate":"Twilight umbral country, no true day, cold mist, long shadows with minds","description":"A dim border-country where the light of the world thins and the dark grows teeth. The Shadowlands are shunned and inhabited both: shadow-touched lineages, exiled vampires, night-hunters, and refugees who had nowhere brighter to go. It is not evil so much as unlit, and things that hate the sun have long memories here.","settlements":["Umbral Watch","Gloamhold","The Grey Market"],"factions":["night-court","shadow-wardens","the-unlit"],"commonKin":["vampire","kitsune","elf","wolfkin","goblin","owlkin"],"creatures":["Shade-hounds","Umbral-stalkers","The Hollow Men"],"resources":["Shadow-silk, umbral-glass, night-bloom, secrets"],"conflicts":["Night-court vampire politics versus the living who share their dusk","Shadow-wardens holding the border against what is deeper in","The Unlit cult that wants to put out the sun for good"],"landmarks":["Gloamhold, a fortress-city that has never seen dawn","The Threshold of Long Shadows","The Grey Market where the living and the returned trade as equals"],"hooks":["The border-light is failing and the dark is advancing","A night-court noble seeks a living envoy no one will miss","The Unlit have found something that can dim a sun"]},{"id":"elemental-marches","name":"The Elemental Marches","climate":"Reality-thin borderland where fire, water, stone, storm and wind realms bleed through","description":"The frontier where the raw elemental realms press against the world and the two leak into each other. Rivers of flame, floating stone, standing storms, and pools of living water share one impossible country. Genasi elemental-folk, storm-touched dragonborn, and stone-goliaths guard the Marches, keeping the elements from spilling further inland.","settlements":["Fourwinds","Emberford","Stonegate"],"factions":["marchwardens","elemental-pacts","riftwatch"],"commonKin":["genasi","dragonborn","goliath","orc","seraphim"],"creatures":["Elementals of every kind","Rift-drakes","Living storms and lava-serpents"],"resources":["Pure elemental essence, rift-crystal, primal reagents, tempered alloys"],"conflicts":["Marchwardens versus elemental-pacts over how much to bargain with the realms","Rifts widening and who caused them","Cults seeking to open a rift entirely"],"landmarks":["Fourwinds, where four elemental realms meet at one crossroads","The Standing Rift, a permanent tear into the storm-realm","The Tempered Gate, forged to hold an elemental tide"],"hooks":["A rift is widening and the Tempered Gate is failing","An elemental-pact has offered your character power for a terrible price","Something walked out of the Standing Rift wearing a person's shape"]}],"history":[{"id":"first-age","age":"The First Age (the Age Before)","span":"before recorded years","summary":"The world before the sky broke. Almost nothing survives but ruins, legends, and the buried cities the sand and ice keep. Every culture claims descent from it and none can prove it.","events":["The raising of the first cities by hands no living Kin remembers","The making of the sky-magic that still holds the Skyward Isles aloft","The first bargains with the elemental realms"]},{"id":"age-of-crowns","age":"The Age of Crowns","span":"the long empire","summary":"The Old Empire rose in the Crownlands and spread across most of Aethyr, uniting many Kin under one throne. Its roads, coins, and vaults are still everywhere underfoot.","events":["The founding of the Old Empire and the Sundered Throne","The Concord of Kin that first bound many peoples under one law","The imperial vaults sealed against a coming catastrophe no one heeded"]},{"id":"war-of-broken-skies","age":"The War of Broken Skies","span":"the catastrophe","summary":"A war fought partly in the heavens tore open the sky. Whether it was hubris, betrayal, or an outside power, it let the Storm into the world. The Skyward Isles date from here, when land was flung upward and never came down.","events":["The breaking of the sky and the descent of the living Storm","The tearing loose of the Skyward Isles","The first Fallen seraphim, who chose the ground over the Heights"]},{"id":"great-sundering","age":"The Great Sundering","span":"the fall of empire","summary":"With the sky broken, the Old Empire shattered. Its capital was lost, its throne sundered, and the united peoples scattered into the survivor-cultures of today.","events":["The fall of the imperial capital","The Sundering of the Throne, which no one has since been able to claim","The scattering of the Kin into their homelands"]},{"id":"stormfall","age":"The Stormfall","span":"the drowned years","summary":"The unleashed Storm ravaged the coasts and raised the Stormreach as a permanent tempest-belt. Whole coastal nations drowned; the seaborn say some simply moved below the waves.","events":["The permanent storm settling over the Stormreach","The drowning of the coastal kingdoms","The seaborn descent beneath the Sapphire Sea"]},{"id":"age-of-ash","age":"The Age of Ash","span":"the burning of the south","summary":"A second lost civilization in the south burned in a single generation, leaving the Ashen Wastes and the Glass Capital. The fire never fully went out.","events":["The burning of the southern empire","The fusing of the Glass Capital in one night","The kindling of the Everburn that still burns"]},{"id":"blood-wars","age":"The Blood Wars","span":"the long night","summary":"As light failed at the world's edges, the vampire courts rose and the Shadowlands spread. The Blood Wars were less one war than a century of border-conflicts between the living and the returned that finally ended in uneasy truce.","events":["The rise of the night-courts in the Shadowlands","The century of border-wars between the living and the returned","The Dusk Accord that ended open war and drew the shadow-border"]},{"id":"shattering-old-empire","age":"The Shattering of the Old Empire (last echoes)","span":"the final collapse","summary":"The last imperial successor-states fell, salvage-lords and free cities replaced kings, and the guilds and companies that rule the Crownlands today took power in the vacuum.","events":["The fall of the last successor-kingdom","The chartering of the free cities and merchant guilds","The beginning of the salvage-wars over imperial vaults"]},{"id":"age-of-legends","age":"The Age of Legends (the present day)","span":"now","summary":"The current age. The great empires are gone and the world is wide open. There is no single throne, no single power, and no shortage of ruins, oaths, and vanished cities waiting for someone bold enough to matter. This is the age of adventurers.","events":["The opening of the imperial vaults by freelance blades","The waking of things that slept through the fall","The first signs, some say, that the sky may break a second time"]}],"factions":[{"id":"crown-concord","name":"The Crown Concord","type":"Political league","region":"crownlands","align":"Order / neutral","desc":"A fractious council of Crownlands duchies and free cities that meets to prevent open war over the vacant imperial throne. It agrees on almost nothing except that no one else should sit the Sundered Throne.","goals":["Keep the peace between duchies","Control imperial salvage rights","Prevent any single power from claiming the throne"],"allies":["goldhand-league","lantern-order"],"rivals":["greycloak-company"]},{"id":"goldhand-league","name":"The Goldhand League","type":"Merchant guild","region":"crownlands","align":"Self-interested","desc":"The banking and trade guild that quietly funds half the Crownlands. It fields no army but owns many, and a Goldhand ledger has toppled more lords than any sword.","goals":["Protect trade routes and charters","Profit from every war without fighting one","Buy influence in every court"],"allies":["crown-concord","pearl-guild"],"rivals":["greycloak-company"]},{"id":"lantern-order","name":"The Lantern Order","type":"Wandering keepers","region":"crownlands","align":"Good-leaning / neutral","desc":"An order of lantern-bearing wardens who seal dangerous imperial vaults and lay imperial dead to rest. They are trusted because they take no side and want no throne.","goals":["Seal what the Old Empire buried","Lay the sunder-wights to rest","Keep dangerous salvage out of ambitious hands"],"allies":["crown-concord","vault-keepers"],"rivals":["cinder-guild"]},{"id":"greycloak-company","name":"The Greycloak Company","type":"Mercenary company","region":"crownlands","align":"Mercenary","desc":"The largest free company in the Crownlands, greycloaked sell-swords who fight for whoever pays and remember whoever doesn't. Many adventurers get their start under a grey cloak.","goals":["Take the richest contracts","Grow into a power in its own right","Settle old scores from unpaid contracts"],"allies":[],"rivals":["crown-concord","goldhand-league"]},{"id":"stormwardens","name":"The Stormwardens","type":"Weather-cult order","region":"stormreach","align":"Zealous / neutral","desc":"Storm-priests who claim to read and sometimes steer the living Storm. They guard the ridgeline halls and decide, dangerously, when the Storm is angry.","goals":["Interpret the will of the Storm","Protect the ridgeline holds","Prevent others from provoking the tempest"],"allies":["skybell-choir"],"rivals":["gale-riders"]},{"id":"skybell-choir","name":"The Skybell Choir","type":"Bell-ringing devotional order","region":"stormreach","align":"Devout","desc":"Keepers of the bronze bells that never stop ringing in the wind. They believe the bells keep the worst of the Storm at bay and that silence means catastrophe.","goals":["Keep the bells ringing","Train new ringers","Warn the holds when a bell falls silent"],"allies":["stormwardens"],"rivals":[]},{"id":"gale-riders","name":"The Gale Riders","type":"Sky-raider outfit","region":"stormreach","align":"Wild / free","desc":"Daredevils who ride the wind on gliders and storm-broken mounts, raiding calm harbors and racing the lightning. They think the Stormwardens are cowards.","goals":["Ride and raid the storm-front","Free the Storm from those who would cage it","Live loud and die aloft"],"allies":["aerie-clans"],"rivals":["stormwardens"]},{"id":"forgemoot","name":"The Forgemoot","type":"Dwarven forge-council","region":"ironspine","align":"Order / traditional","desc":"The council of forge-city masters that sets the price of steel and the law of the peaks. Slow, proud, and unmovable, the Forgemoot has outlasted every empire that tried to command it.","goals":["Control ore and smithing rights","Uphold the old forge-law","Keep the vaults sealed and the grudges recorded"],"allies":["vault-keepers","high-clans"],"rivals":["deep-conclave"]},{"id":"high-clans","name":"The High Clans","type":"Goliath mountain confederation","region":"ironspine","align":"Honorable / independent","desc":"The sky-bridge clans of the high peaks, goliath and their allies, who measure worth by the Crossing of Nine Bridges and answer to no forge-city.","goals":["Guard the high passes","Uphold clan honor and the Crossing","Stay free of the forge-cities' politics"],"allies":["forgemoot"],"rivals":[]},{"id":"deep-conclave","name":"The Deep Conclave","type":"Subterranean confederation","region":"blackdeep","align":"Secretive / neutral","desc":"The uneasy alliance of Deep peoples who keep the Sunless Market neutral and the surface out. It speaks with one voice only when the deeper dark stirs.","goals":["Keep the Sunless Market's peace","Bar surface expeditions","Watch the Deepest Door"],"allies":["drow-houses"],"rivals":["forgemoot","vault-keepers"]},{"id":"greenwardens","name":"The Greenwardens","type":"Druidic forest order","region":"emerald-wilds","align":"Nature / neutral","desc":"Guardians of the Emerald Wilds who answer to the Heartwood, not to any crown. They mediate between the forest's many peoples and punish those who cut too deep.","goals":["Protect the Heartwood and the old growth","Mediate grove-treaties","Heal what the loggers and the Hunt wound"],"allies":["canopy-pact"],"rivals":["thorn-court"]},{"id":"tide-covenant","name":"The Tide Covenant","type":"Seaborn maritime power","region":"sapphire-sea","align":"Order / imperial","desc":"The seaborn confederation that claims the deep water and levies tolls on surface trade. It sees itself as the sea's rightful government and the free-captains as pirates.","goals":["Control undersea and reef territory","Levy the toll-lines","Bring the surface trade to heel"],"allies":["pearl-guild"],"rivals":["free-captains"]},{"id":"free-captains","name":"The Free Captains","type":"Pirate-merchant confederacy","region":"sapphire-sea","align":"Free / chaotic","desc":"A loose brotherhood of independent ship-captains who refuse the covenant's tolls and keep Port Meridian free. Half smugglers, half heroes, depending on the harbor.","goals":["Keep the sea-lanes free","Break the toll-lines","Answer to no crown, above or below the waves"],"allies":["gale-riders"],"rivals":["tide-covenant"]},{"id":"sky-covenant","name":"The Sky Covenant","type":"Skyward island league","region":"skyward-isles","align":"Order / lofty","desc":"The governing pact of the drifting isles, seraphim and birdkin and harengon together, charged with keeping the isles aloft and the chain-bridges open.","goals":["Keep the isles from falling","Regulate island claims and bridges","Discover what still holds the isles up"],"allies":["radiant-choir"],"rivals":["aerie-clans"]},{"id":"night-court","name":"The Night Court","type":"Vampire aristocracy","region":"shadowlands","align":"Old / ambiguous","desc":"The ruling vampire houses of the Shadowlands, ancient, patient, and bound by the Dusk Accord. Not all are villains; many simply intend to outlive the problem.","goals":["Hold the shadow-border","Preserve the Dusk Accord","Advance house politics across centuries"],"allies":["shadow-wardens"],"rivals":["the-unlit"]},{"id":"the-unlit","name":"The Unlit","type":"Doomsday cult","region":"shadowlands","align":"Hostile","desc":"A cult, drawn from every Kin, that believes the sun is a wound and means to put it out. The one thing the Night Court and the living agree must be stopped.","goals":["Extinguish the sun","Spread the shadow-border","Recover anything that can dim a light"],"allies":[],"rivals":["night-court","shadow-wardens","radiant-choir"]},{"id":"radiant-choir","name":"The Radiant Choir","type":"Celestial order","region":"celestial-heights","align":"Devout / orthodox","desc":"The seraphim orthodoxy of the Celestial Heights, keepers of star-fire and the oldest prophecies. Rigid, luminous, and increasingly afraid of a prophecy they cannot silence.","goals":["Guard the Threshold","Preserve celestial orthodoxy","Prevent a second breaking of the sky"],"allies":["sky-covenant","star-wardens"],"rivals":["fallen-covenant","the-unlit"]},{"id":"marchwardens","name":"The Marchwardens","type":"Elemental frontier order","region":"elemental-marches","align":"Order / grim","desc":"The border-guard of the Elemental Marches, sworn to keep the elemental realms from spilling inland and to watch the rifts. They distrust anyone who bargains with the elements.","goals":["Hold the elemental border","Watch and seal the rifts","Keep the Tempered Gate standing"],"allies":["riftwatch"],"rivals":["elemental-pacts"]}],"settlements":[{"id":"highreach","name":"Highreach","region":"crownlands","populationType":"Great walled market-city, ~120,000","primaryKin":"human","mixedKin":["human","dwarf","halfling","elf","goblin","kitsune","birdkin"],"government":"Elected Lord-Mayor and a guild-council","landmark":"The Sundered Throne kept under glass in the old imperial hall","conflict":"Guilds and old nobility struggle for control of the throne-hall and what it symbolizes","services":["Guild banks","Grand market","Adventurers' registry","Imperial archive"],"rumors":["The Throne whispered a name last winter","A Goldhand banker is buying every vault-map in the city"],"hooks":["Guard, or steal, the Sundered Throne","Investigate the whispering in the throne-hall"]},{"id":"bridgewater","name":"Bridgewater","region":"crownlands","populationType":"River port on stilts and bridges, ~40,000","primaryKin":"human","mixedKin":["human","halfling","seaborn","goblin"],"government":"River-guild syndicate","landmark":"The Drowned Palace visible beneath the clear river","conflict":"Salvage crews fight over the right to dive the Drowned Palace","services":["River trade","Diving outfitters","Fences and salvage brokers"],"rumors":["Lights move in the Drowned Palace at night","A diver came up speaking a dead imperial tongue"],"hooks":["Dive the Drowned Palace","Find out what the diver saw before the guild silences him"]},{"id":"ninebridge-hold","name":"Ninebridge Hold","region":"crownlands","populationType":"Fortress-town, ~8,000","primaryKin":"human","mixedKin":["human","dwarf","goliath"],"government":"Hereditary Bridge-Warden","landmark":"The Nine Bridges over a gorge, each a coming-of-age crossing","conflict":"A bridge is failing and the Warden hides it to avoid losing face","services":["Toll-road control","Bridge-guides","Mountain provisioning"],"rumors":["The seventh bridge groans in the wind now","The Warden's heir refused the Crossing"],"hooks":["Repair or re-consecrate a failing bridge","Escort a coward's Crossing"]},{"id":"thundergate","name":"Thundergate","region":"stormreach","populationType":"Ridge-city in the storm-belt, ~30,000","primaryKin":"dragonborn","mixedKin":["dragonborn","genasi","human","harengon"],"government":"Storm-warden council","landmark":"The Standing Bolt, frozen lightning above the gate","conflict":"Stormwardens and Gale Riders fight over whether to cage or free the Storm","services":["Storm-glass forges","Weather-augury","Sky-iron trade"],"rumors":["The Standing Bolt flickered, which it has never done","A Gale Rider heard the Storm say a name"],"hooks":["Discover why the Standing Bolt is dying","Broker peace, or pick a side, in the storm-cult feud"]},{"id":"skybell-reach","name":"Skybell Reach","region":"stormreach","populationType":"Cliff-town of bells, ~12,000","primaryKin":"human","mixedKin":["human","dragonborn","birdkin"],"government":"The Skybell Choir","landmark":"Ten thousand bronze bells that ring without pause","conflict":"One great bell has fallen silent and the Choir is terrified of what it means","services":["Bell-craft","Storm-warning network","Devotional lodging"],"rumors":["The silent bell was the oldest one","Something climbed the bell-tower and did not come down"],"hooks":["Find why the great bell fell silent","Recover a bell-ringer lost in the tower"]},{"id":"durnhal","name":"Durnhal","region":"ironspine","populationType":"Dwarven forge-city, ~90,000","primaryKin":"dwarf","mixedKin":["dwarf","goliath","orc","goblin"],"government":"Forgemoot seat","landmark":"The Everforge, burning since before the Sundering","conflict":"The Everforge is dimming and rival clans blame one another","services":["Master smithing","Rune-work","Ore exchange","Grudge-archive"],"rumors":["The Everforge dims when a certain vault is opened below","A forge-master has gone missing in the deep levels"],"hooks":["Find why the Everforge is failing","Recover a stolen master-rune"]},{"id":"cloudanvil","name":"Cloudanvil","region":"ironspine","populationType":"High-clan sky-hold, ~5,000","primaryKin":"goliath","mixedKin":["goliath","dwarf","birdkin"],"government":"Clan-moot","landmark":"An anvil-shaped peak above the cloud line","conflict":"A vault-claim dispute threatens to become a clan war","services":["Sky-iron","Bridge-guides","Clan hospitality"],"rumors":["Something is nesting on the anvil-peak","The Crossing has grown deadlier this season"],"hooks":["Mediate the vault-claim before it turns to war","Clear the anvil-peak of its new tenant"]},{"id":"emberdeep","name":"Emberdeep","region":"ironspine","populationType":"Deep forge-outpost, ~15,000","primaryKin":"dwarf","mixedKin":["dwarf","goblin","orc"],"government":"Vault-keeper garrison","landmark":"The Sealed Door no one has opened and lived","conflict":"Something knocks on the Sealed Door from the far side","services":["Deep-forging","Vault-warding","Expedition supply"],"rumors":["The knocking keeps a rhythm now","A vault-keeper deserted rather than stand another watch"],"hooks":["Stand watch on the Sealed Door","Discover what the knocking is spelling out"]},{"id":"elarethil","name":"Elarethil","region":"emerald-wilds","populationType":"Grown elven city, ~50,000","primaryKin":"elf","mixedKin":["elf","owlkin","kitsune","halfling"],"government":"The Thorn Court","landmark":"A city of living trees woven into towers","conflict":"The Thorn Court's isolationism is splitting the city against the Canopy Pact","services":["Living-wood craft","Herbcraft","Ancient library","Grove-passage"],"rumors":["The Heartwood is sickening","A Thorn Court noble was found with logger's coin"],"hooks":["Carry a message across the Court's closed borders","Find the source of the Heartwood's sickness"]},{"id":"green-hollow","name":"Green Hollow","region":"emerald-wilds","populationType":"Frontier forest-town, ~6,000","primaryKin":"human","mixedKin":["human","wolfkin","halfling","tigerkin"],"government":"Frontier council","landmark":"The tree line where farm meets old growth","conflict":"Settlers press the tree line and the beast-kin ranges push back","services":["Logging and trade","Ranger-guides","Frontier market"],"rumors":["The Hunt rode past the town by daylight","A wolfkin range has gone quiet"],"hooks":["Broker a border between settlers and beast-kin","Investigate why the Hunt rides by day"]},{"id":"cinderhold","name":"Cinderhold","region":"ashen-wastes","populationType":"Ash-clan stronghold, ~10,000","primaryKin":"orc","mixedKin":["orc","dragonborn","goblin","genasi"],"government":"War-chief and elder-circle","landmark":"A fortress built into a dormant cinder-cone","conflict":"Ash-clans raid Cinderhold for its rare water-cistern","services":["Fire-salvage market","Obsidian craft","Caravan staging"],"rumors":["The Everburn is spreading toward the hold","An elder heard the fire speak"],"hooks":["Defend the water-cistern from raiders","Escort a pilgrim into the Everburn"]},{"id":"glasswatch","name":"Glasswatch","region":"ashen-wastes","populationType":"Ruin-edge outpost, ~3,000","primaryKin":"goblin","mixedKin":["goblin","orc","human"],"government":"Cinder-guild charter","landmark":"Overlook of the fused Glass Capital","conflict":"Everyone wants a guide into the Glass Capital and few guides return","services":["Salvage brokers","Ruin-guides","Ash-glass trade"],"rumors":["A vault in the Glass Capital never burned","The ash-wraiths are following salvagers home"],"hooks":["Guide an expedition into the Glass Capital","Recover an unburned relic before a rival crew"]},{"id":"fjordheim","name":"Fjordheim","region":"frostbound-north","populationType":"Northlander fjord-hold, ~20,000","primaryKin":"human","mixedKin":["human","orc","goliath","bearkin"],"government":"Jarl and the frost-moot","landmark":"The Aurora Vault where dead kings lie under ice","conflict":"A dead king is thawing out of the Aurora Vault","services":["Longship yards","Fur and amber trade","Ancestor-rites"],"rumors":["The aurora has changed color over the vault","The oldest king's tomb is cracked open"],"hooks":["Guard, or investigate, the thawing Aurora Vault","Sail against the ice-reavers"]},{"id":"whitehall","name":"Whitehall","region":"frostbound-north","populationType":"Glacier-hall town, ~9,000","primaryKin":"goliath","mixedKin":["goliath","human","owlkin","wolfkin"],"government":"Aurora-keeper circle","landmark":"A hall carved inside a living glacier","conflict":"The Winter Hunt has crossed south of its old bounds","services":["Glacier-glass","Ancestor-augury","Cold-weather outfitting"],"rumors":["The Hunt takes only those who break an oath","A keeper walked into the glacier and never came out"],"hooks":["Turn back or appease the Winter Hunt","Recover a keeper lost in the glacier"]},{"id":"oasis-of-karan","name":"The Oasis of Karan","region":"sunscorch","populationType":"Caravan oasis-city, ~35,000","primaryKin":"human","mixedKin":["human","lionkin","elf","genasi","goblin"],"government":"Caravan-league council","landmark":"The last great spring before the deep dunes","conflict":"The league and the sun-court fight over oasis tariffs","services":["Caravan hire","Spice and salt market","Sand-reader guides"],"rumors":["A storm uncovered a city in the deep dunes","Someone is selling maps to Karan-That-Was"],"hooks":["Escort a caravan to a newly-uncovered ruin","Protect, or steal, the buried-city maps"]},{"id":"sunspire","name":"Sunspire","region":"sunscorch","populationType":"Sun-court seat, ~28,000","primaryKin":"lionkin","mixedKin":["lionkin","human","elf","seraphim"],"government":"The Sun Court","landmark":"A mile-high needle that casts no shadow at noon","conflict":"The sun-court's heir is lost in the deep dunes","services":["Sun-gold trade","Court patronage","Astronomy and augury"],"rumors":["The Spire's tip has begun to glow at night","The lost heir was seen alive in a mirage"],"hooks":["Search the dunes for the lost heir","Learn why the Spire glows"]},{"id":"duskhollow","name":"Duskhollow","region":"moonlit-vale","populationType":"Vale market-town in eternal dusk, ~15,000","primaryKin":"kitsune","mixedKin":["kitsune","elf","owlkin","harengon","human"],"government":"The Moon Court (by masks and favors)","landmark":"Silvermere, the lake that shows your fate","conflict":"One of the Nine Lanterns has gone out and the dark is creeping in","services":["Illusion-craft","Dream-herbs","Omen-reading","Masked salons"],"rumors":["A face in Silvermere wept without a person","A kitsune noble is collecting favors, which never ends well"],"hooks":["Relight the failed Lantern","Repay, or escape, a kitsune's dangerous favor"]},{"id":"silvermere-town","name":"Silvermere","region":"moonlit-vale","populationType":"Lakeside seer-village, ~4,000","primaryKin":"owlkin","mixedKin":["owlkin","elf","kitsune"],"government":"Dream-warden circle","landmark":"The fate-showing lake it is named for","conflict":"Someone is trafficking stolen dreams and the wardens are hunting them","services":["Dream-reading","Omen augury","Quiet lodging"],"rumors":["A dream-thief sells other people's memories in Duskhollow","The lake showed the same fate to three strangers"],"hooks":["Hunt the dream-thief","Discover why one fate is shared by three"]},{"id":"lowvault","name":"Lowvault","region":"blackdeep","populationType":"Deep dwarf under-city, ~40,000","primaryKin":"dwarf","mixedKin":["dwarf","goblin","elf"],"government":"Deep Conclave seat","landmark":"The Sunless Market, neutral ground for all Deep peoples","conflict":"Something is coming up through the Deepest Door below the city","services":["Deep-crystal trade","Glowcap farming","Neutral fence-market"],"rumors":["The Deepest Door's wards are cracking","A drow house is hiring surface blades in secret"],"hooks":["Reinforce or investigate the Deepest Door","Broker a deal in the Sunless Market that no one else can"]},{"id":"glimmerreach","name":"Glimmerreach","region":"blackdeep","populationType":"Drow house-city, ~25,000","primaryKin":"elf","mixedKin":["elf","goblin","vampire"],"government":"Rival drow houses","landmark":"The Glowfall, a waterfall of luminous stone","conflict":"A house-succession war has spilled into the tunnels","services":["Blind-pearl trade","Assassin-brokers","Forbidden lore"],"rumors":["The Glowfall is going dark tunnel by tunnel","A house matron seeks an outsider she can trust precisely because they are expendable"],"hooks":["Take a side, or coin, in the house war","Find why the Glowfall is dying"]},{"id":"port-meridian","name":"Port Meridian","region":"sapphire-sea","populationType":"Free port and world-market, ~80,000","primaryKin":"human","mixedKin":["human","seaborn","turtlekin","birdkin","halfling","goblin"],"government":"Free-captain assembly","landmark":"A neutral harbor open to every flag","conflict":"The tide-covenant is tightening its toll-lines around the free port","services":["World trade","Ship-hire","Salvage market","Every rumor for sale"],"rumors":["The Graveyard Reef surfaced a century-sunk ship","The covenant will blockade the port by winter"],"hooks":["Run a covenant blockade","Salvage the newly-surfaced wreck before the covenant claims it"]},{"id":"coralhold","name":"Coralhold","region":"sapphire-sea","populationType":"Seaborn reef-city (half submerged), ~30,000","primaryKin":"seaborn","mixedKin":["seaborn","turtlekin"],"government":"Tide Covenant Coral Throne","landmark":"The living Coral Throne of the covenant","conflict":"Reef-serpents are fleeing something in the deep and driving ashore","services":["Pearl and coral trade","Undersea passage","Tide-reading"],"rumors":["The abyss-choir's song has been heard on the reef","The Coral Throne is growing in a strange new shape"],"hooks":["Find what is driving the reef-serpents ashore","Carry a covenant message to the surface courts"]},{"id":"highperch","name":"Highperch","region":"skyward-isles","populationType":"Sky-isle aerie-town, ~10,000","primaryKin":"birdkin","mixedKin":["birdkin","seraphim","harengon","genasi"],"government":"Aerie-clan council","landmark":"A town clinging to the underside and top of a drifting isle","conflict":"This isle has begun to sink and the lifeboats are few","services":["Glider-craft","Skystone trade","Chain-bridge passage"],"rumors":["The sky-covenant knows what holds the isles up and won't say","A bridge was cut on purpose"],"hooks":["Evacuate a sinking isle","Find who cut the chain-bridge and why"]},{"id":"dawnhold","name":"Dawnhold","region":"celestial-heights","populationType":"Seraphim high-hall, ~7,000","primaryKin":"seraphim","mixedKin":["seraphim","genasi","owlkin"],"government":"The Radiant Choir","landmark":"The Threshold, edge of the world and the beyond","conflict":"A forbidden prophecy of the sky breaking again is splitting the Choir","services":["Starlight-glass","Prophecy and augury","Pilgrim lodging"],"rumors":["The stars over the Threshold are going out one by one","A Fallen seraph was seen climbing back up"],"hooks":["Carry a Fallen's forbidden message","Learn which prophecy the Choir is hiding"]},{"id":"gloamhold","name":"Gloamhold","region":"shadowlands","populationType":"Sunless fortress-city, ~35,000","primaryKin":"vampire","mixedKin":["vampire","kitsune","elf","goblin","wolfkin"],"government":"The Night Court","landmark":"A city that has never seen dawn","conflict":"The Unlit cult is gaining ground and the shadow-border is failing","services":["Shadow-silk","Night-market","Blood-accord brokers"],"rumors":["The Unlit found something that can dim a sun","A Night Court house seeks a living envoy no one will miss"],"hooks":["Carry a Night Court envoy's mission into daylight","Infiltrate the Unlit before they act"]},{"id":"fourwinds","name":"Fourwinds","region":"elemental-marches","populationType":"Frontier crossroads-town, ~14,000","primaryKin":"genasi","mixedKin":["genasi","dragonborn","goliath","orc"],"government":"Marchwarden garrison","landmark":"The crossroads where four elemental realms meet","conflict":"The Standing Rift is widening and the Tempered Gate is failing","services":["Elemental-essence trade","Rift-warding","Primal reagent market"],"rumors":["Something walked out of the Standing Rift wearing a person's face","An elemental-pact is offering power for a terrible price"],"hooks":["Reinforce the failing Tempered Gate","Hunt the thing that came out of the rift"]}],"kin":{"human":{"origin":"No one remembers where humans began, and humans have made that a strength: they claim every region as half-home and settle where others will not.","homeland":"The Crownlands, but truly everywhere","regions":["crownlands","frostbound-north","sunscorch","stormreach"],"culture":"Humanity is not one people but a hundred. A Crownlands banker, a Northlander reaver, a Sunscorch caravaneer and a Stormreach sky-reader share almost nothing but a lifespan and a stubborn refusal to stay put.","society":"Wildly varied: merchant republics, fjord-jarldoms, desert caravan-leagues, storm-cults. What unites them is adaptability and the habit of borrowing every neighbor's best idea.","government":"From guild-councils to elected mayors to hereditary jarls, depending on the branch.","beliefs":"Humans keep no single faith. Many blend ancestor-honor, local spirits, and imported traditions freely, and are famous for founding new religions when old ones bore them.","traditions":["The Wanderyear, a rite of leaving home to see the world before settling","Guest-right, sacred in most human cultures: harm to a guest is the worst dishonor","Naming-days that mark a child at one year, when survival was once uncertain"],"language":"Trade-Common, the world's shared tongue, is a human invention that spread everywhere.","architecture":"Whatever the land allows, copied and improved: stone in the mountains, longhalls in the north, stilts on the rivers.","clothing":"Practical and regional, from fur-and-amber in the north to dust-veils in the desert.","food":"Omnivorous and inventive; human cooking absorbs every neighbor's spice.","occupations":["Merchants and bankers","Soldiers and sell-swords","Sailors and caravaneers","Farmers and frontier settlers","Diplomats and spies"],"military":"Humans rarely field the strongest warriors, so they win with numbers, logistics, coin, and clever alliances. The Greycloak Company is the largest free company in the world.","factions":["crown-concord","goldhand-league","greycloak-company","frost-moot"],"relations":{"elf":"Old rivals and older trading partners; humans envy elven memory, elves distrust human haste.","dwarf":"Reliable allies bound by centuries of trade contracts.","goblin":"Uneasy neighbors in every city; prejudice runs both ways.","orc":"From blood-feud to blood-brotherhood depending on the border."},"history":["Founded the Old Empire and the Sundered Throne","Scattered furthest in the Great Sundering and so survived best","Built the free cities and guilds that rule the Crownlands now"],"legends":["The First Wanderer, said to have walked out of the burning First Age carrying only a lantern","The Nameless Emperor, whose true name was struck from every record after the Sundering"],"stereotypes":["Grasping and short-lived (say the elves)","Endlessly adaptable and quietly ruthless","Will trade with anyone, betray nearly as many"],"rpHooks":["Your family holds a charter to a city that no longer exists","You were raised in one human culture and exiled to a wholly different one"],"advHooks":["An imperial vault under your home town is about to be opened by a rival","A dead emperor's crown surfaces and your bloodline is named in the old records"],"greeting":"Hands open, palms up: 'Roads meet.'","oath":"'By hearth and road, I hold.'","colors":["Depends on branch; imperial gold and crimson for old Crownlands lines"],"symbol":"The open road, or a lantern for the Wanderyear"},"elf":{"origin":"The elves say they remember the First Age directly, and they will not let anyone forget it.","homeland":"The Emerald Wilds, with realms in the Moonlit Vale, Sunscorch, and Blackdeep","regions":["emerald-wilds","moonlit-vale","blackdeep","sunscorch"],"culture":"Long-lived and long-memoried, elves fracture along lines older than most kingdoms. Wood-realm, high-realm, moon-court, sun-caravan, and the exiled drow of the Deep are practically different peoples who happen to share pointed ears and centuries.","society":"Ancient, hierarchical, riven by feuds that ordinary folk have forgotten but elves never do. A slight from three hundred years ago is current events.","government":"Realm-courts and bloodline houses; the Thorn Court of the Wilds and the drow houses of the Deep could not be more different.","beliefs":"Reverence for memory, ancestry, and the living world. Wood elves keep nature-faith, moon elves read lunar omens, drow keep older and darker traditions in the dark.","traditions":["The Century Rite, a coming-of-age at a full century, not a mere adulthood","Memory-weaving, songs that encode a house's entire history","The keeping of grudge-names and favor-names alike, both inherited"],"language":"Old Elvish, a language with tenses for events centuries past, still spoken at court.","architecture":"Grown rather than built in the Wilds; carved and luminous in the Deep; silver and glass in the Vale.","clothing":"Living-wood and leaf-weave in the forest, moon-silk in the Vale, shadow-silk among the drow.","food":"Refined, foraged, and slow; a wood-elf feast can last a night, a drow one is a quiet, careful thing.","occupations":["Rangers and grove-keepers","Loremasters and archivists","Assassins and house-agents (drow)","Enchanters and illusionists","Diplomats with impossibly long patience"],"military":"Precision over mass: living-wood bows, ambush, and centuries of drilled discipline. Elven armies are small, old, and terrifyingly coordinated.","factions":["greenwardens","thorn-court","drow-houses","moon-court"],"relations":{"human":"Fond exasperation; humans are children who keep rearranging the furniture of the world.","dwarf":"Grudging respect between two peoples who both keep grudges forever.","wolfkin":"Contested hunting-grounds in the Wilds, sometimes war, sometimes marriage.","vampire":"Drow and night-courts share the dark and little trust."},"history":["Claim the oldest unbroken records of any Kin","The Thorn Court's isolation dates to a betrayal in the War of Broken Skies","The drow descended into the Blackdeep in an exile no elf above will fully explain"],"legends":["The Grief of Elarethil, a war fought over one broken oath","The First Grove, said to still exist for those who deserve to find it"],"stereotypes":["Aloof and condescending","Beautiful and cruel (the drow especially)","Can hold a grudge past the death of empires"],"rpHooks":["You were exiled for refusing an ancestral oath your house swore before you were born","Your house has a grudge-name that is your character's to either honor or finally end"],"advHooks":["The Heartwood is sickening and your house is blamed","A drow house-matron summons you home for a war you fled"],"greeting":"A slight bow with one hand over the heart: 'Long roots to you.'","oath":"'By root and memory, unbroken.'","colors":["Forest green and silver; the drow answer in black and blind-pearl white"],"symbol":"A tree whose roots and branches mirror one another"},"dwarf":{"origin":"Dwarves say they were made in the Ironspine's forge-fires and will return to them, and their whole culture is an argument about how.","homeland":"The Ironspine Mountains and the Blackdeep","regions":["ironspine","blackdeep","crownlands"],"culture":"Forge-city dwarves, high-mountain clans, and the Deep folk disagree bitterly on how deep is too deep and how old law should bend. All three keep grudges in written archives and settle debts across generations.","society":"Clan-and-guild, organized around forge-holds and the Forgemoot. Craft is identity; a dwarf is known by what their hands make and what their family owes.","government":"The Forgemoot council of masters above; clan-moots and the Deep Conclave elsewhere.","beliefs":"Ancestor-reverence and the sanctity of craft. The dead are honored in the stone they cut; a masterwork is a prayer.","traditions":["The Grudge-Archive and the Favor-Archive, both meticulously kept","A dwarf's first masterwork, presented to earn adult standing","Beard-rites and rune-braids that record deeds and debts"],"language":"Old Dwarvish, written in runes that double as smithing-marks.","architecture":"Vaulted halls, everforges, and stonework meant to outlast the mountains it is cut from.","clothing":"Layered work-leathers, rune-braided beards (of any gender), and heirloom metalwork.","food":"Deep-mushroom, cave-fish, hearty stone-oven bread, and ales aged in vault-cellars.","occupations":["Master smiths and runewrights","Miners and vault-keepers","Engineers and bridge-builders","Merchants of steel and gem"],"military":"Heavy, patient, and immovable: rune-forged plate, shield-walls, and forge-artillery. Dwarves rarely start wars but never seem to lose the long ones.","factions":["forgemoot","vault-keepers","deep-conclave","high-clans"],"relations":{"human":"Long-contracted allies; a dwarf keeps a bargain past the grave.","elf":"Two grudge-keeping peoples who respect each other precisely for it.","goliath":"Mountain-sharers, sometimes rivals for the peaks, often allies.","goblin":"Old prejudice, though the forge-cities quietly depend on goblin labor."},"history":["The Everforges have burned since before the Sundering","Refused to fall with the Old Empire and so kept their halls","The split between surface and Deep dwarves dates to the digging of the Deepest Door"],"legends":["The First Smith, who forged the first sky-iron from a fallen star","The Grudge That Ended a Kingdom, a debt paid three centuries late"],"stereotypes":["Stubborn and grudge-bound","Greedy for gold (unfairly; most crave craft, not coin)","Suspicious of anything above the tree line or below the Deepest Door"],"rpHooks":["Your family owes a blood-debt to another clan, recorded and unpaid","You are the first of your line to leave the forge-hold for the surface"],"advHooks":["Your hold's Everforge is dimming and the elders blame a rival clan","Something is knocking on the Sealed Door your clan is sworn to guard"],"greeting":"A forearm clasp: 'Stone remembers.'","oath":"'By forge and ledger, I stand.'","colors":["Iron grey, forge-orange, and clan-gold"],"symbol":"A hammer crossed with an open ledger"},"halfling":{"origin":"Halflings never built an empire and consider that their greatest achievement.","homeland":"The green Crownlands, the Emerald Wilds' edges, and every river and road","regions":["crownlands","emerald-wilds","sapphire-sea"],"culture":"Hearth-halflings of settled shires, river-folk of the barge-roads, hill-clans, and wandering wanderfoot caravans. They value comfort, luck, and belonging, and are underestimated by everyone, which suits them.","society":"Family-and-community above all; a shire runs on shared meals and quiet reputation, not law.","government":"Informal councils of elders and the loudest cook in the room; wanderfoot caravans follow a road-elder.","beliefs":"Luck as a living thing to be courted; hearth-spirits and road-spirits honored with small daily offerings.","traditions":["The Long Table, a communal feast where grievances must be spoken and then dropped","The Luck-token passed to a child leaving home","First-Foot, the belief that who crosses your threshold first shapes your year"],"language":"A soft dialect of Trade-Common full of food-metaphors and understatement.","architecture":"Round-doored hill-homes, snug barge-cabins, and rambling caravan-wagons.","clothing":"Comfortable, layered, pocketed; bright waistcoats among the river-folk.","food":"The center of the culture: many meals, generous portions, and rivalrous pie.","occupations":["Cooks, brewers, and innkeepers","Farmers and river-traders","Scouts and burglars (quietly the best)","Luck-readers and storytellers"],"military":"No standing armies; halflings survive by being not worth conquering, and by scouts and slingers who no one sees coming.","factions":["goldhand-league","free-captains"],"relations":{"human":"Warm and constant neighbors; half of every human city has a halfling quarter.","goblin":"Surprising friendship; two small peoples the big folk overlook.","elf":"Fond guests in the Wilds, tolerated for their manners."},"history":["Endured every empire by being beneath its notice","Sheltered refugees of the Sundering along their river-roads","Kept trade alive during the Blood Wars when larger folk hid"],"legends":["The Luckless Wanderer, who gave away his luck and became the luckiest of all","The Pie That Ended a Siege"],"stereotypes":["Soft, harmless, and greedy for comfort","Secretly the finest thieves and scouts alive","Underfoot and everywhere"],"rpHooks":["You inherited a luck-token said to have saved nine lives","You are a wanderfoot who lost the caravan road home"],"advHooks":["Your shire sits atop an imperial vault a duke means to seize","A luck-token you carry is wanted by someone who kills for it"],"greeting":"A shared bite of whatever you are eating: 'Sit, then.'","oath":"'By hearth and luck, I keep faith.'","colors":["Wheat-gold, hearth-red, river-green"],"symbol":"A crossed spoon and door-key"},"orc":{"origin":"Orcs carry the memory of the burning south in their bones, and every clan tells the story differently.","homeland":"The Ashen Wastes and the Frostbound North, with clans in the Ironspine and Marches","regions":["ashen-wastes","frostbound-north","ironspine","elemental-marches"],"culture":"Ash-clans of the burned south, frost-clans of the white north, iron-clans of the mountains, war-clans of the border. Orc culture prizes oaths and earned names, and the idea that every orc is a warrior is a lie ash-clan scholars find insulting.","society":"Clan-bound, meritocratic within the clan: you are what you have earned, not what you were born. Elders, smiths, and oath-keepers hold as much power as war-chiefs.","government":"War-chief and elder-circle, chosen by deed and consent, not blood.","beliefs":"Ancestor-fire and oath-binding; a broken oath is a kind of death. Ash-clans hold the fire itself half-sacred.","traditions":["The Earning of the Name, where a child's given name is replaced by a deed-name at adulthood","Oath-scars, ritual marks that record binding promises","The Ash-Vigil, a night spent alone in the burned lands to hear the ancestors"],"language":"Old Orcish, guttural and precise, with a whole grammar for oaths.","architecture":"Cinder-cone strongholds in the south, longbarrows and ice-halls in the north.","clothing":"Scarred leather and oath-marks; furs in the north, ash-cloth in the south.","food":"Fire-roasted and preserved; ash-clans salt-cure, frost-clans smoke and freeze.","occupations":["Warriors and oath-keepers","Smiths and ash-glass workers","Scholars and clan-historians","Caravan-guards and mercenaries"],"military":"Disciplined shock-troops bound by oath; an orc war-band fights as one because breaking formation breaks an oath. Not berserkers but the steadiest infantry in the world.","factions":["ash-clans","frost-moot","greycloak-company"],"relations":{"human":"Border-neighbors who are as often kin by marriage as enemies by war.","dwarf":"Mountain rivals and forge-partners; both respect an oath.","goliath":"Highland cousins in strength and honor-code.","goblin":"Ash-clans and cave-goblins share the Wastes uneasily."},"history":["Survived the Age of Ash that burned their first homeland","Oath-bands held the line during the Blood Wars","Frost and ash clans are one people split by the catastrophe that scattered them"],"legends":["The Oathbreaker's Ash, a clan erased for one broken word","The First Name-Earner, who took a deed-name no one has dared repeat"],"stereotypes":["Brutish and warlike (ash-clan scholars would like a word)","Honorable to a fault about oaths","All muscle, no thought (wrong, and dangerous to believe)"],"rpHooks":["You refused the deed-name your clan chose and left rather than take it","Your clan owes a blood-oath your character must fulfill or break"],"advHooks":["The Everburn is spreading toward your clan's stronghold","An ancestor-fire vigil showed you a name that should be dead"],"greeting":"Fist to chest, then out: 'Oaths hold.'","oath":"'By ash and word, I am bound.'","colors":["Ash-grey and ember-red; frost-clans answer in white and iron"],"symbol":"A hand scarred with an oath-mark"},"dragonborn":{"origin":"Dragonborn carry a spark of the elemental realms in their blood, and where that spark burns hottest shapes who they become.","homeland":"The Stormreach and the Elemental Marches","regions":["stormreach","elemental-marches","ashen-wastes"],"culture":"Storm-scaled, ember-scaled, frost-scaled, tide-scaled: dragonborn cluster by the element in their blood, and those bloodlines carry old philosophies about what their fire is for. A storm-drakari and a frost-scale share a shape and almost nothing else.","society":"Bloodline-clans built around an elemental affinity, tied to the regions where that element runs strong.","government":"Elder-scaled councils and, in the Stormreach, the storm-warden orders.","beliefs":"The element in the blood is a trust, not a weapon: to be spent wisely. Some worship the elemental realms, some guard against them.","traditions":["The First Breath, a coming-of-age when a young dragonborn's elemental breath first wakes","Scale-marking to record lineage and deeds","The Tempering, a rite of mastering one's own element before it masters you"],"language":"Draconic, resonant and hard, said to be the oldest spoken tongue.","architecture":"Storm-courting ridge-halls, ember-forges, ice-vaults, tide-temples.","clothing":"Minimal over the scales; ceremonial scale-cloaks and element-marked sashes.","food":"Element-touched: storm-charged brine, ember-roast, frost-cured.","occupations":["Storm-readers and weather-wardens","Smiths and elementalists","Marchwardens guarding the elemental border","Warriors and breath-champions"],"military":"Breath-champions and disciplined elemental cavalry; a frost-scale line and an ember-clan fight in utterly different styles.","factions":["stormwardens","marchwardens","elemental-pacts"],"relations":{"genasi":"Kindred elemental-blooded folk; sometimes allies, sometimes rivals for the same realms.","goliath":"Fellow guardians of hard frontiers.","human":"Storm-reach neighbors and trading partners."},"history":["The Stormreach clans date from the Stormfall that settled the tempest","Guarded the Elemental Marches since the rifts first opened","Frost and tide scales trace to the drowning coasts of the Stormfall"],"legends":["The First Breath, drawn from the broken sky itself","The Tempered One, a dragonborn who held an elemental tide alone at the Gate"],"stereotypes":["Proud and hot-blooded","All of them spellcasters (false; many never use their breath in a fight)","Slaves to their element (an insult; mastery is the whole point)"],"rpHooks":["Your breath woke wrong, in an element that is not your bloodline's","You are sworn to guard a rift your ancestors opened"],"advHooks":["The Standing Rift is widening and your bloodline is oath-bound to hold it","Something walked out of the rift wearing your clan's scale-marks"],"greeting":"A breathed word and a bowed head: 'Spark to spark.'","oath":"'By the fire I carry and do not spend, I hold.'","colors":["By bloodline: storm-violet, ember-red, frost-white, tide-blue"],"symbol":"A scaled spiral around an elemental sigil"},"harengon":{"origin":"Harengon move where they are needed and are never quite where they were, a people of couriers, dancers, and scouts.","homeland":"The Stormreach, the Moonlit Vale, and the Skyward Isles","regions":["stormreach","moonlit-vale","skyward-isles","emerald-wilds"],"culture":"Moon-hares of the Vale, storm-hares of the tempest coast, wild-hares of the open country, dusk-hares of the shadow-border. Swift, curious, and impossible to fence in, harengon build cultures around motion: the courier's road, the dancer's ring, the scout's trail.","society":"Loose warrens and travelling troupes; status comes from what you have seen and how fast you brought word of it.","government":"Warren-elders and troupe-leaders; harengon distrust thrones on principle.","beliefs":"The moon and the road; luck earned in motion, never in stillness. Duskhares keep quieter, stranger faiths near the shadow.","traditions":["The First Run, a young harengon's solo journey between two distant warrens","Moon-dances timed to lunar tides","The Courier's Word, a promise to carry a message that must never be broken"],"language":"A quick, rhythmic Trade-Common dialect, half spoken half signed at speed.","architecture":"Burrow-warrens and knock-down troupe camps; nothing meant to stay.","clothing":"Light, layered for speed, hung with luck-charms and courier-tokens.","food":"Foraged and portable; road-cakes, field greens, and shared trail-stew.","occupations":["Couriers and message-runners","Scouts and pathfinders","Dancers and performers","Sky-gliders in the Isles"],"military":"Skirmishers and scouts, never a line; harengon win by never being where the blow lands.","factions":["gale-riders","moon-court","sky-covenant"],"relations":{"kitsune":"Vale neighbors; a harengon and a kitsune in one room is either a friendship or a con.","birdkin":"Sky-cousins and racing rivals in the Isles.","human":"Employers, audiences, and occasional adopted kin."},"history":["Carried word between scattered peoples through the Great Sundering","The storm-hares learned to run the tempest coast during the Stormfall","Kept the Skyward chain-bridges' message-lines open"],"legends":["The Courier Who Outran the Storm","The First Run that circled the whole world, or so the troupes claim"],"stereotypes":["Flighty and unreliable (yet they never drop a message)","Can't sit still","All charm, no substance"],"rpHooks":["You carry a Courier's Word you cannot deliver because the recipient is dead","You are the first of your warren to refuse the road and stay put"],"advHooks":["A message you carried has started a war you must now stop","The moon-dance omens named your character for something you don't understand"],"greeting":"A quick double-tap of the foot: 'Swift roads.'","oath":"'By moon and the message, I run true.'","colors":["Moon-silver, dusk-grey, storm-violet"],"symbol":"A running hare beneath a crescent"},"wolfkin":{"origin":"Wolfkin remember in the blood the packs that first crossed the Emerald Wilds and the frozen north together.","homeland":"The Emerald Wilds and the Frostbound North","regions":["emerald-wilds","frostbound-north","shadowlands"],"culture":"Dire-packs of the deep Wilds, frost-packs of the north, shadow-packs of the border, moon-packs and storm-packs. Wolfkin build everything around the pack-bond, but what a pack is for, hunting, guarding, wandering, differs sharply between them.","society":"Pack-and-range; loyalty is sacred, the lone wolf is pitied or feared. Leadership is earned and can be lost in a season.","government":"Pack-alphas and range-moots where packs share hunting-law.","beliefs":"The moon, the hunt, and the ancestors who run beside the pack unseen. To hunt without need is taboo.","traditions":["The First Hunt, a young wolfkin's solo hunt to earn a pack-name","The Howl-Moot, where packs sing their news and their dead","Range-marking treaties that keep peace between packs"],"language":"A growled dialect layered with scent-signs and howl-song.","architecture":"Den-camps and range-lodges; the north builds ice-dens, the Wilds root-hollows.","clothing":"Fur, hide, and pack-tokens; scars worn openly as record.","food":"Hunted and shared by rank and need; the pack eats before the strongest.","occupations":["Hunters and trackers","Range-wardens and scouts","Guardians and pack-warriors","Frontier guides"],"military":"Pack-tactics: coordinated, relentless, terrifying in the dark. Wolfkin flank and exhaust rather than charge.","factions":["greenwardens","frost-moot","shadow-wardens"],"relations":{"elf":"Wilds rivals and sometimes marriage-kin over shared hunting-grounds.","owlkin":"Night-hunters who respect one another's silence.","vampire":"Shadow-pack and night-court share a wary border."},"history":["Ran with the beast-kin migrations of the First Age","Held the northern passes during the Winter Hunt's first crossing","Shadow-packs took the border no one else would keep"],"legends":["The Pack That Ran the World","The Lone Wolf who became the first range-warden after losing everyone"],"stereotypes":["Savage and territorial","Slaves to instinct (the elders find this laughable)","Can't survive alone (mostly true, and they know it)"],"rpHooks":["You were cast out of your pack and carry the shame of a lone-wolf name","Your pack owes a range-treaty debt that only you can pay"],"advHooks":["The Hunt is riding by daylight and your range is in its path","A rival pack has broken the range-treaty and named your pack for the blame"],"greeting":"A brief touch of foreheads: 'Pack runs on.'","oath":"'By moon and pack, I do not run alone.'","colors":["Grey, frost-white, shadow-black by pack"],"symbol":"A howling wolf beneath a full moon"},"owlkin":{"origin":"Owlkin are the world's watchers, keepers of what happens while everyone else sleeps.","homeland":"The Emerald Wilds, the Moonlit Vale, and the Frostbound North","regions":["emerald-wilds","moonlit-vale","frostbound-north","celestial-heights"],"culture":"Great-owls of the deep forest, snow-owls of the north, night-owls of the Vale, ghost-owls of the shadow, sun-owls of the heights. Owlkin cultures prize silence, patience, and knowledge; they are the seers, librarians, and night-sentinels of a dozen realms.","society":"Roost-orders organized around learning and watch-keeping; elders are those who have simply seen the most.","government":"Roost-conclaves and seer-circles; decisions are slow and heavily debated.","beliefs":"The stars, the night, and the sacred duty of the witness. To see and say nothing can be a grave sin or a sacred trust, depending on the roost.","traditions":["The Long Watch, a solitary vigil that marks adulthood","Star-reading and dream-augury","The keeping of Witness-books, records of what the roost has seen"],"language":"A soft, hooting tongue full of pauses that carry meaning.","architecture":"High roost-towers and library-spires with wide night-windows.","clothing":"Muffling feather-cloaks and quiet robes; scholar's greys and night-blues.","food":"Simple and quiet; the owlkin eat little and think much.","occupations":["Seers and augurs","Scholars and librarians","Night-sentinels and watch-keepers","Dream-wardens in the Vale"],"military":"Silent night-scouts and ambush-archers; owlkin are the eyes of an army, rarely its fist.","factions":["dream-wardens","aurora-keepers","radiant-choir"],"relations":{"kitsune":"Vale co-conspirators and rivals in the trade of secrets.","wolfkin":"Fellow night-hunters, mutually respectful.","seraphim":"Star-readers who look to the same heights."},"history":["Kept the Witness-books through every age, the closest thing to unbroken history","Watched the sky break and recorded it when others fled","Dream-wardens rose to guard against the Vale's dream-thieves"],"legends":["The Watcher Who Never Slept and saw the first dawn twice","The Lost Witness-book that recorded the Nameless Emperor's true name"],"stereotypes":["Cold and unknowable","Hoarders of secrets","All watching, never acting"],"rpHooks":["Your roost keeps a Witness-book with a page torn out, and you mean to find it","You broke the Long Watch and saw something you were not meant to"],"advHooks":["A dream-thief is stealing from the Vale and your roost sent you to end it","A page from a lost Witness-book surfaces naming your character"],"greeting":"A slow blink and a bow: 'Well seen.'","oath":"'By star and silence, I bear witness.'","colors":["Scholar-grey, night-blue, snow-white"],"symbol":"An open eye within a crescent of feathers"},"tigerkin":{"origin":"Tigerkin are solitary sovereigns, each said to be the ruler of whatever ground they stand on.","homeland":"The Emerald Wilds, with lines in the Sunscorch, Stormreach, and Shadowlands","regions":["emerald-wilds","sunscorch","stormreach","shadowlands"],"culture":"Jungle bengals, white tigers of the cold heights, shadow-tigers of the border, storm-tigers of the coast, ancient-tigers of the old bloodlines. Tigerkin prize independence, personal honor, and single combat; their societies are looser than most beast-kin because a tiger bows to no pack.","society":"Territory-holders bound by codes of challenge and hospitality rather than by clans; a tigerkin's word and ground are everything.","government":"No thrones; territory-elders arbitrate disputes and
