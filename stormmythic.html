 honor-challenges.","beliefs":"Personal honor as sacred law; the sun for the bengals, the moon for the shadow-lines, the storm for the coast.","traditions":["The Claiming, a young tigerkin marking a first territory to earn adulthood","Single-combat challenges to settle honor, rarely to the death","Guest-law: a tigerkin's home is inviolable sanctuary"],"language":"A low, resonant tongue of few words and heavy silences.","architecture":"Solitary strongholds and territory-shrines; tigerkin build for one, not many.","clothing":"Marked with personal sigils and trophies of honor-duels.","food":"Hunted alone and eaten with ceremony; sharing a kill is a deep bond.","occupations":["Champions and duelists","Solitary hunters and wardens","Bodyguards and honor-arbiters","Wandering swords"],"military":"Elite single combatants and shock-champions; tigerkin do not form lines, they break them.","factions":["greenwardens","thorn-court","sun-court"],"relations":{"lionkin":"Ancient rivalry of the solitary and the pride; respect edged with disdain.","wolfkin":"The lone versus the pack, a philosophical feud.","human":"Prized champions and feared duelists in human courts."},"history":["The ancient-tiger lines claim descent from the First Age's great hunters","White tigers withdrew to the cold heights during the Age of Ash","Shadow-tigers took to the border in the Blood Wars"],"legends":["The Tiger Who Held a Bridge Alone against an army","The First Claiming, a territory said to be the whole world"],"stereotypes":["Arrogant loners","Deadly and vain","Unable to work with others (until they choose to, and then absolutely)"],"rpHooks":["You lost your first territory and wander to reclaim your honor","You owe a life-debt from a guest-law sanctuary you once broke"],"advHooks":["An honor-challenge has followed you across the world and will not end","Your ancient bloodline is said to return in a time of breaking"],"greeting":"A measured nod, claws sheathed and shown: 'Your ground is yours.'","oath":"'By claw and honor, my word holds.'","colors":["Ember-orange and black; white and slate for the cold lines"],"symbol":"A single tiger's eye over crossed claws"},"bearkin":{"origin":"Bearkin are the settled guardians of the wild places, slow to anger and impossible to move.","homeland":"The Frostbound North and the Ironspine, with lines in the Emerald Wilds","regions":["frostbound-north","ironspine","emerald-wilds"],"culture":"Brown-bears of the forest, polar-bears of the ice, black-bears of the hills, cave-bears of the deep, great-bears of the old bloodlines. Bearkin cultures are hearth-centered and protective; they hibernate through the hardest season and wake as the fiercest guardians a community can have.","society":"Family-holds and guardian-lodges; a bearkin belongs to those they protect, not to a clan.","government":"Hold-elders and guardian-councils; slow, deliberate, consensus-bound.","beliefs":"The cycle of sleep and waking, the sanctity of the hearth, and the ancestors who guard from the long sleep.","traditions":["The First Winter, a young bearkin's first solitary hibernation-vigil","Hearth-guarding oaths sworn to a family or place","The Waking Feast that ends the winter sleep"],"language":"A deep, slow tongue; bearkin famously never waste a word.","architecture":"Heavy hearth-lodges and cave-holds built to shelter many and outlast storms.","clothing":"Thick furs and hearth-marks; layered and practical.","food":"Enormous seasonal feasts before the sleep; foraged, fished, and preserved.","occupations":["Guardians and protectors","Herbalists and healers","Hearth-keepers and provisioners","Frontier defenders"],"military":"Immovable defenders and shield-bearers; a roused bearkin holds a doorway against an army.","factions":["frost-moot","high-clans","greenwardens"],"relations":{"goliath":"Northern kin in temperament; both value patience and strength held in reserve.","human":"Beloved guardians of frontier towns.","wolfkin":"Forest-sharers, wary but rarely at war."},"history":["Guarded the northern holds through the Stormfall's worst winters","The cave-bear lines withdrew into the Ironspine during the Age of Ash","Woke as guardians when the Winter Hunt first crossed south"],"legends":["The Great Bear who slept a hundred years and woke to save a dying hold","The First Winter that lasted an age"],"stereotypes":["Slow and lazy (until roused, and then it is far too late)","Gentle giants","Sleep through every crisis"],"rpHooks":["You woke early from the First Winter to find your hold gone","You are hearth-sworn to protect someone who has left and needs you"],"advHooks":["The Winter Hunt is bearing down on the hold you are sworn to guard","Your great-bear bloodline is said to wake only when the world is breaking"],"greeting":"A slow, full embrace: 'Warm hearth to you.'","oath":"'By hearth and the long sleep, I guard.'","colors":["Earth-brown, snow-white, hearth-red"],"symbol":"A bear curled around a hearth-fire"},"lionkin":{"origin":"Lionkin are the pride-peoples, who believe that no one stands alone and that a crown is only as real as those who kneel and those who rise.","homeland":"The Sunscorch Desert, with prides in the Crownlands and Stormreach","regions":["sunscorch","crownlands","celestial-heights"],"culture":"Sun-lions of the desert court, desert-lions of the deep dunes, mountain-lions of the high passes, golden-lions of the old royal lines, dusk-lions of the shadow-border. Lionkin build proud, sun-warmed societies of prides and courts, where loyalty and rulership are the great questions.","society":"Pride-and-court; a lionkin's worth is measured by the pride they lift and the pride that lifts them. Ambition is respected when it serves the whole.","government":"Sun-courts and pride-councils; the Sun Court of Sunspire is the grandest.","beliefs":"The sun as the source of rightful rule; the pride as sacred family; ancestor-kings who watch from the light.","traditions":["The Sun-Rite, a coming-of-age at the summer solstice","The Pride-Oath binding a lionkin to defend their court","Golden-mane braiding that marks rank and deed"],"language":"A rolling, proud dialect made for oratory and command.","architecture":"Sun-warmed courts, needle-spires, and open colonnades of gold stone.","clothing":"Sun-gold and desert-white; manes groomed and ornamented by rank.","food":"Communal court-feasts; the pride eats together, ruler and hunter alike.","occupations":["Rulers and courtiers","Champions and pride-guards","Diplomats and orators","Caravan-lords"],"military":"Coordinated pride-cavalry and champion-led lines; lionkin fight for one another, not for spoils.","factions":["sun-court","caravan-league","crown-concord"],"relations":{"tigerkin":"Ancient rivals; the pride and the loner will never agree on what strength is for.","human":"Desert trade-partners and court-allies.","seraphim":"Both revere the light; sun-court and radiant-choir keep old ties."},"history":["Founded the Sun Court after the Sunscorch swallowed the old kingdoms","Golden-lion royal lines claim descent from the buried desert empires","Held the oasis-roads open through the Age of Ash"],"legends":["The First Sun-King, crowned by the light itself","The Pride That Would Not Break at the fall of a city"],"stereotypes":["Proud and domineering","Obsessed with rank and rulership","All roar, expecting others to kneel"],"rpHooks":["You are a pride-less lionkin, cast out and seeking a court to call your own","You carry a golden-lion claim to a throne that no longer exists"],"advHooks":["The Sun Court's heir is lost in the deep dunes and your pride is blamed","A buried desert empire's crown surfaces and your bloodline is named"],"greeting":"A raised chin and open hand: 'Rise, and be seen.'","oath":"'By sun and pride, I hold my court.'","colors":["Sun-gold and desert-white"],"symbol":"A lion's mane rayed like the sun"},"birdkin":{"origin":"Birdkin are the most varied of all the beast-kin, a whole sky of peoples who share only wings and the horizon.","homeland":"Everywhere with sky: the Skyward Isles, the Sapphire Sea coasts, the Crownlands, and beyond","regions":["skyward-isles","sapphire-sea","crownlands","emerald-wilds","stormreach"],"culture":"There is no single birdkin culture: ravens and crows keep clever, secretive city-guilds; eagles and hawks hold proud highland aeries; sea-birds crew the world's ships; songbirds and cardinals fill the market-quarters with music; vultures keep the solemn death-rites others shun. Each bird-line is nearly its own people.","society":"Aerie-clans, city-guilds, ship-crews, and roving flocks; birdkin organize by trade and temperament as much as by blood.","government":"Aerie-councils in the heights, guild-charters in the cities, ship-articles at sea.","beliefs":"The open sky and the freedom of it; many birdkin honor the wind, the stars, or the ancestors who fly ahead.","traditions":["The First Flight, a fledgling's solo crossing to earn adult standing","Flock-songs that carry news and history across great distances","Feather-gifts exchanged to seal bonds and bargains"],"language":"A whistling, song-laced Trade-Common that carries far on the wind.","architecture":"Aerie-towers, cliff-roosts, and market-quarter rookeries.","clothing":"Light and bright, feather-marked by line and deed.","food":"As varied as the lines: sea-fish, grain, fruit, or the vultures' solemn shares.","occupations":["Sky-couriers and scouts","Sailors and navigators","Merchants and city-guilders","Musicians, criers, and death-keepers"],"military":"Aerial scouts, sky-cavalry, and cliff-archers; birdkin own the air above any battle.","factions":["aerie-clans","sky-covenant","free-captains","goldhand-league"],"relations":{"harengon":"Sky-cousins and racing rivals in the Isles.","seraphim":"The winged and the wingless-of-heaven share the high air uneasily.","human":"Partners in every port and market-quarter."},"history":["Kept the message-lines open across every scattered region after the Sundering","The sea-bird lines crewed the fleets that mapped the Sapphire Sea","Aerie-clans settled the Skyward Isles when the land first flew"],"legends":["The First Flight that circled the broken world","The Raven Who Stole a King's True Name"],"stereotypes":["Flighty, thieving, gossip-carriers (the raven-lines lean in)","Proud aerie-snobs (the eagle-lines)","Can't be pinned down"],"rpHooks":["You failed your First Flight and have something to prove","Your line keeps a flock-song with a verse no one will explain"],"advHooks":["A message your line carried has sparked a war","A sinking Skyward isle holds your aerie and few lifeboats remain"],"greeting":"A brush of the back of the hand, like a passing wing: 'Fair skies.'","oath":"'By wind and horizon, I fly true.'","colors":["As many as there are birds"],"symbol":"A single feather against an open sky"},"vampire":{"origin":"Vampires are the returned: those who did not stay dead, whether by curse, bargain, bloodline, or the long dark of the Blood Wars.","homeland":"The Shadowlands and the Moonlit Vale, with old houses in the Blackdeep and Abyssal Trench","regions":["shadowlands","moonlit-vale","blackdeep","abyssal-trench"],"culture":"Blood-born fledglings, night-born house-scions, crimson warrior-lines, moon-blood mystics, and the truly ancient. Vampire society runs on patience, debt, and the Dusk Accord; not all are villains, and the oldest have seen too many ages to bother with cruelty for its own sake.","society":"House-and-court, bound by centuries-old accords and blood-debts. Age is authority; the young serve, the ancient rule and rarely stir.","government":"The Night Court and its rival houses; law is precedent, and precedent is very, very old.","beliefs":"The long view: that all things pass and the patient inherit. Death-traditions, ancestor-communion, and the Dusk Accord that keeps the peace with the living.","traditions":["The Turning-Vigil, the first night of the returned, spent under a house's protection","Blood-accords, binding promises sealed in a drop of blood","The Century-Court, when houses settle debts once every hundred years"],"language":"Old courtly dialects, several of them dead languages the vampires simply never stopped speaking.","architecture":"Sunless halls, mirror-less courts, and deep house-vaults.","clothing":"Timeless formal wear centuries out of fashion, worn with total confidence.","food":"Blood, given or taken; the Accord governs how, and violating it is the gravest crime.","occupations":["House-scions and courtiers","Brokers of secrets and old debts","Night-wardens of the shadow-border","Keepers of very long memory"],"military":"Old, disciplined night-guard and duelists; vampires fight the way they live, patiently and to win.","factions":["night-court","shadow-wardens","the-unlit"],"relations":{"kitsune":"Vale intriguers who trade in the same currency of secrets.","wolfkin":"Shadow-border neighbors, wary across a long truce.","seraphim":"Ancient opposites of dark and light, bound by an even more ancient wariness."},"history":["Rose to power during the Blood Wars as the light failed","The Dusk Accord ended the open wars and drew the shadow-border","The oldest houses remember the sky breaking, and keep what they saw to themselves"],"legends":["The First Returned, who bargained back from death and set the Accord","The Ancient who has not woken in three hundred years and whose house waits"],"stereotypes":["Bloodthirsty monsters (the young, sometimes; the old find it gauche)","Scheming aristocrats","All of them evil (the Accord and the war against the Unlit say otherwise)"],"rpHooks":["You are newly returned and do not yet know which house made you","Your house owes a blood-accord your character must honor across the ages"],"advHooks":["The Unlit mean to put out the sun and even your house wants them stopped","An ancient of your house is waking, and no one knows what it will want"],"greeting":"A slow, formal bow, never offering the throat: 'Long nights.'","oath":"'By blood and accord, I keep my word past death.'","colors":["Crimson, black, and old-gold"],"symbol":"A closed eye above a single drop"},"seaborn":{"origin":"Seaborn are the peoples of the water, some who always lived below and some who went down when the coasts drowned.","homeland":"The Sapphire Sea and the Abyssal Trench","regions":["sapphire-sea","abyssal-trench","stormreach"],"culture":"Tide-born of the shallows, reef-born of the coral cities, deep-born of the cold dark, storm-tide of the tempest coast, abyss-born of the trench, pearl-born of the trade-currents. Seaborn cultures range from bright reef-market societies to the alien, hymn-singing courts of the abyss.","society":"Current-and-covenant; the Tide Covenant binds many, but the deep and abyssal folk keep their own strange orders.","government":"The Coral Throne of the covenant above; the abyss-choir and deeper councils below.","beliefs":"The tides as breath of the world; ancestor-currents that carry the dead out to sea; the abyss-folk keep faiths the surface finds disturbing.","traditions":["The First Descent, a young seaborn's dive into deeper water to earn adulthood","Tide-singing that marks births, deaths, and the turning currents","Pearl-gifting to seal bonds and treaties"],"language":"A fluid, tonal tongue that carries through water; the abyss-choir sing it in registers the surface cannot hear.","architecture":"Living coral cities, current-shaped halls, and the vent-lit spires of the deep.","clothing":"Current-woven kelp-silk and pearl; the deep-folk go bare but for bio-luminous marks.","food":"Fish, kelp, urchin, and the strange harvests of the vents.","occupations":["Traders and pearl-divers","Tide-singers and current-readers","Covenant wardens and toll-keepers","Abyssal keepers of drowned relics"],"military":"Undersea raiders and reef-guard; seaborn fight in three dimensions and drag foes down where they cannot follow.","factions":["tide-covenant","pearl-guild","abyss-choir"],"relations":{"turtlekin":"Island-and-reef kin; the covenant and the turtle-elders share long ties.","human":"Surface trade-partners and toll-rivals in every port.","vampire":"The abyss and the drowned dark share unsettling neighbors."},"history":["Some descended when the coasts drowned in the Stormfall","The Tide Covenant rose to govern the deep water after the drowning","The abyss-choir emerged from the trench in an age no surface record names"],"legends":["The First Descent that reached the trench floor and came back singing","The Drowned City that was never built by hands from above"],"stereotypes":["Cold and unknowable (the deep-folk especially)","Grasping toll-takers (say the free-captains)","The abyss-born are all cultists (the surface fears what it can't hear)"],"rpHooks":["You were born below and are the first of your current to walk on land","You carry a drowned relic your abyss-kin want returned to the dark"],"advHooks":["The reef-serpents are fleeing something in the deep and driving ashore","The abyss-choir's hymn is being heard in surface harbors and no one knows why"],"greeting":"A rippling hand-sign, palm turned like a current: 'Fair tides.'","oath":"'By tide and current, I return.'","colors":["Reef-teal, deep-blue, pearl-white; abyssal black-and-glow"],"symbol":"A spiraling wave around a single pearl"},"turtlekin":{"origin":"Turtlekin are the long-memoried elders of the islands and rivers, who measure time in tides and think in generations.","homeland":"The Sapphire Sea islands, with lines on the rivers and the deep reefs","regions":["sapphire-sea","crownlands","blackdeep"],"culture":"Shell-guards of the island holds, sea-turtles of the open water, river-backs of the inland waterways, terrapins of the marsh-villages, ancient-shells of the oldest lines. Turtlekin cultures are patient, lawful, and deeply communal; they are the mediators and record-keepers of the sea-peoples.","society":"Elder-councils where the oldest shell speaks last and decides most; slow, careful, consensus-bound.","government":"Island elder-circles and river-moots; turtlekin are famous neutral arbiters.","beliefs":"The long tide, the sanctity of the given word, and the ancestors carried in the shell. Patience is the highest virtue.","traditions":["The Shell-Marking, a life-record carved slowly into one's own shell over decades","The Elder-Circle, where disputes are heard across many days","The keeping of tide-law, treaties turtlekin memorize for all parties"],"language":"A slow, deliberate tongue; a turtlekin sentence can take a while and always means exactly what it says.","architecture":"Low, storm-proof island holds and stilt-villages built to endure centuries.","clothing":"Simple and marked with shell-sigils; turtlekin adorn the shell, not the body.","food":"Sea-greens, shellfish, and slow-cooked communal stews.","occupations":["Arbiters and lawspeakers","Record-keepers and historians","Island-guardians and reef-wardens","Ferry-keepers and pilots"],"military":"Immovable island-guard; a turtlekin shield-line simply does not break, and they are content to wait out any siege.","factions":["tide-covenant","pearl-guild","deep-conclave"],"relations":{"seaborn":"Reef-and-island kin; turtle elders often arbitrate covenant disputes.","human":"Trusted neutral parties in port-town law.","halfling":"Fellow small, underestimated, community-first folk who get along famously."},"history":["Kept the tide-law that let the sea-peoples trade after the Stormfall","Their ancient-shell elders are living records older than most kingdoms","Mediated the treaties that made Port Meridian a free port"],"legends":["The Ancient Shell who remembers the First Age and speaks of it once a century","The Elder Who Outwaited a War"],"stereotypes":["Impossibly slow","Stubborn and unmovable","Boring (until you need a fair judge, and then there is no one better)"],"rpHooks":["You are a young turtlekin who left before your Shell-Marking was complete","Your elder-circle entrusted you with a tide-law treaty to deliver intact"],"advHooks":["A tide-law treaty you carry could stop or start a reef-war","Your island hold sits above something the Deep Conclave wants sealed"],"greeting":"A slow bow with both hands on the chest: 'Long tides carry you.'","oath":"'By shell and tide-law, my word endures.'","colors":["Shell-green, river-brown, deep-teal"],"symbol":"A carved shell ringed with tide-marks"},"kitsune":{"origin":"Kitsune are the shapers of story and secret, whose oldest lines are said to grow a new tail with each age of cunning survived.","homeland":"The Moonlit Vale and the Shadowlands","regions":["moonlit-vale","shadowlands","emerald-wilds"],"culture":"Red-tails of the courts and markets, silver-tails of the old noble lines, shadow-tails of the border, frost-tails of the cold Vale, sun-tails of the rare bright days, and the whispered void-tails. Kitsune build cultures of intrigue, art, and favor; a kitsune's greatest weapon and worst danger is the debt owed and the story told.","society":"Court-and-favor; status is a web of debts, secrets, and reputations. Nothing is owned so much as owed.","government":"The Moon Court, ruled by masks, favors, and whoever holds the most dangerous secrets.","beliefs":"The moon, the mask, and the sacred weight of a promise; to a kitsune, a favor freely given is a bond stronger than any chain.","traditions":["The First Mask, a coming-of-age when a young kitsune is given, or takes, their court-face","Favor-debts, tracked with absolute precision and never forgiven, only repaid","Tale-telling contests where reputations are made and unmade"],"language":"A layered, allusive dialect where the second meaning matters more than the first.","architecture":"Silk-walled salons, mirror-halls, and the shifting paths of the Turning Wood.","clothing":"Exquisite masks, moon-silk, and layered robes that conceal as much as they display.","food":"Delicate, artful, and ceremonial; a kitsune meal is a conversation.","occupations":["Courtiers and favor-brokers","Illusionists and artists","Spies and negotiators","Storytellers and keepers of secrets"],"military":"Rarely open war; kitsune fight with illusion, misdirection, and the ruin of reputations. Their few soldiers are masked infiltrators.","factions":["moon-court","masked-consorts","night-court"],"relations":{"harengon":"Vale co-conspirators; a kitsune and a harengon scheme is a beautiful, dangerous thing.","vampire":"Fellow players of the long game of secrets.","owlkin":"Rivals and partners in the trade of what is known."},"history":["Kept the Moonlit Vale independent through intrigue when armies failed","The silver-tail houses are older than the Sundering they quietly survived","Rose as brokers between the living and the night-courts after the Blood Wars"],"legends":["The Nine-Tailed One who owns a favor from everyone who ever lived","The Tale That Toppled a Throne with no army at all"],"stereotypes":["Tricksters and liars (they prefer 'storytellers')","Never to be trusted","All schemes, no loyalty (yet a repaid favor is sacred)"],"rpHooks":["You owe a favor-debt you cannot repay and cannot escape","You took a court-mask that belonged to someone who wants it back"],"advHooks":["A kitsune noble's favor has made your character a piece in a Moon Court game","One of the Nine Lanterns has gone out and your house is blamed"],"greeting":"A masked bow and a knowing smile: 'What a story you must have.'","oath":"'By moon and mask, a favor owed is a favor kept.'","colors":["Moon-silver, court-crimson, shadow-violet"],"symbol":"A fox-mask beneath a crescent, with many tails"},"seraphim":{"origin":"Seraphim are the winged folk of the high places, descended from those who dwelt near the broken sky and did not fully fall.","homeland":"The Celestial Heights and the Skyward Isles","regions":["celestial-heights","skyward-isles","elemental-marches"],"culture":"Dawn-wings of first light, star-born of the constellations' service, radiant orthodoxy of the choir, high-wings of the drifting isles, and the astral seers of the Threshold. Seraphim cultures are luminous and rigid, torn between the choir's orthodoxy and the Fallen who chose the ground and its freedoms.","society":"Choir-and-order, deeply hierarchical, structured by proximity to the light. The great schism is between the Radiant Choir and the Fallen Covenant.","government":"The Radiant Choir and the Star Court above; the Fallen keep looser, exiled communities below.","beliefs":"The star-fire and the sanctity of the sky; a duty to guard the Threshold and prevent the sky breaking again. The Fallen believe the light must be lived among mortals, not hoarded above them.","traditions":["The Ascension-Rite, a young seraph's first climb to the Threshold","Star-song devotions timed to the constellations","The Choosing, when a seraph may keep the Heights or become Fallen and take the ground"],"language":"Celestial, a resonant, chiming tongue said to be half-song.","architecture":"Star-glass halls, radiant spires, and the impossible geometries of the Heights.","clothing":"Light-woven robes and star-glass ornaments; the Fallen dress plainly among mortals.","food":"Little and luminous above; the Fallen learn mortal fare and mostly enjoy it.","occupations":["Choristers and star-wardens","Prophets and augurs","Threshold-guardians","Fallen healers, teachers, and wanderers among mortals"],"military":"Radiant guardians and light-wardens; seraphim fight rarely and terribly, wielding star-fire against the dark.","factions":["radiant-choir","star-wardens","fallen-covenant"],"relations":{"vampire":"Ancient opposites; light and dark bound by wary old accords.","genasi":"Kindred of the upper realms who share the high, thin air.","owlkin":"Fellow star-readers, respected across the schism.","the-unlit":"Sworn enemies; the Unlit would put out the very light seraphim guard."},"history":["Their line dates from the War of Broken Skies, when the sky first broke","The first Fallen chose the ground during that war and were exiled","The Choir's schism deepens over a forbidden prophecy of a second breaking"],"legends":["The First Fallen, who traded the Heights for a single mortal life and never regretted it","The Prophecy the Choir Forbids, said to name the sky's second breaking"],"stereotypes":["Serene and holy (the Choir cultivates it)","Judgmental and cold","All of them good (the Choir's rigidity and the Fallen's heresy both complicate that)"],"rpHooks":["You are Fallen, exiled from the Heights for choosing the ground","The Choir's records name your character in a prophecy they mean to silence"],"advHooks":["The stars over the Threshold are going out and the Choir is fracturing","A Fallen asks you to carry a message the Choir has forbidden"],"greeting":"A touch of two fingers to the brow, then up: 'Light keep you.'","oath":"'By star-fire and the Threshold, I hold the sky.'","colors":["Dawn-gold, star-white, and radiant blue"],"symbol":"A rayed star between two wings"},"goliath":{"origin":"Goliath are the giant-blooded of the high and hard places, who believe the mountains test the worthy and remember the failures.","homeland":"The Ironspine Mountains and the Frostbound North","regions":["ironspine","frostbound-north","elemental-marches"],"culture":"Stone-blooded of the peaks, frost-blooded of the north, storm-blooded of the tempest heights, mountain-born clans, and the rare titan-born of the oldest lines. Goliath cultures are honor-bound and competitive in the best sense: they measure themselves against the mountain, not against the weak.","society":"Clan-and-crossing; standing is earned through trials, the greatest being the Crossing of Nine Bridges. A goliath keeps a fair tally of their own deeds and expects the same of others.","government":"Clan-moots and the High Clans confederation; leadership is trial-earned and provisional.","beliefs":"The mountain as impartial judge, the storm as a test, and ancestors who watch from the high stones. Fairness is sacred; a rigged contest is the deepest shame.","traditions":["The Crossing of Nine Bridges, the great coming-of-age pilgrimage above the cloud line","The Fair Tally, an honest reckoning of one's own deeds and failures","The Stone-Bell rite, ringing a household bell said to be forged from a first survivor's armor"],"language":"A resonant, echoing highland tongue built to carry across peaks.","architecture":"Fortress-holds cut into mountainsides and sky-bridges strung above the clouds.","clothing":"Stone-grey wraps and clan-marks; heavy furs in the north.","food":"Hardy mountain fare, sky-goat, glacier-fish, and trial-feasts.","occupations":["Bridge-guides and high-wardens","Champions and trial-keepers","Miners and stone-cutters","Marchwardens of the elemental frontier"],"military":"Elite mountain infantry and champions; goliath fight fair, hit like an avalanche, and never claim a victory they did not earn.","factions":["high-clans","forgemoot","marchwardens"],"relations":{"dwarf":"Peak-and-root neighbors; rivals for the mountains, partners against the deep dark.","orc":"Highland kin in honor-code and strength.","bearkin":"Northern kin in patience and guardianship."},"history":["Kept the high passes and sky-bridges through every age","The Crossing of Nine Bridges predates the Old Empire","Titan-born lines are said to descend from the giants of the First Age"],"legends":["The First Survivor of the Skyfall, whose armor became the first Storm-Bell","The Titan-Born who held a bridge until the mountain itself gave way"],"stereotypes":["Grim and humorless (they are simply serious about fairness)","All brawn","Obsessed with pointless trials (the trials are the point)"],"rpHooks":["You failed your Crossing of Nine Bridges and wander to earn your standing","Your household Storm-Bell has cracked, an ill omen you must answer"],"advHooks":["A vault-claim dispute is about to turn your clan-moot into a clan war","The Crossing has grown deadly and something is picking off the young on the bridges"],"greeting":"A firm clasp of the forearm, deed for deed: 'Fair stone to you.'","oath":"'By the mountain's fair judgment, I earn my place.'","colors":["Stone-grey, frost-white, storm-violet"],"symbol":"Nine bridges over a peak"},"goblin":{"origin":"Goblins are the survivors and scavengers who thrive where the great peoples cannot, and who are far cleverer than the great peoples like to admit.","homeland":"The Blackdeep, the Ashen Wastes, and the underside of every city","regions":["blackdeep","ashen-wastes","crownlands","ironspine"],"culture":"Cave-goblins of the Deep, scrap-goblins of the salvage-yards, night-goblins of the shadow, redcaps of the old blood-rites, and moss-goblins of the quiet wilds. Goblin cultures prize cleverness, community, and making much from little; not all are wicked, and the redcaps' fearsome reputation is a story most goblins resent.","society":"Warren-and-crew; survival is collective, and a good idea from anyone is worth more than a title. Goblins share what they scavenge or the warren fails.","government":"Warren-councils and crew-bosses chosen for cleverness, not strength.","beliefs":"The luck of the overlooked, the spirits of scrap and stone, and the old, darker rites the redcaps keep. Cleverness is a kind of prayer.","traditions":["The First Find, a young goblin's rite of building something useful from pure scrap","Warren-sharing, where hoarding from the crew is the gravest crime","The Redcaps' old blood-rites, feared and misunderstood even among goblins"],"language":"A fast, slangy, invention-rich tongue full of borrowed words and coined ones.","architecture":"Ingenious warren-tunnels, scrap-forts, and hidden Deep-cities lit by glowcap.","clothing":"Patchwork, pocketed, and cleverly made from whatever the great folk threw away.","food":"Resourceful and communal; goblins can make a feast from a famine.","occupations":["Tinkers, scavengers, and engineers","Smugglers and fixers","Deep-miners and glowcap-farmers","Alchemists and demolitionists"],"military":"Traps, tunnels, ambush, and clever devices; goblins never fight fair because fighting fair is how the small die.","factions":["cinder-guild","lantern-smugglers","deep-conclave"],"relations":{"halfling":"Two overlooked small peoples who get on famously.","dwarf":"Old prejudice, though the forge-cities quietly run on goblin labor.","orc":"Ash-clan and cave-goblin share the Wastes uneasily but honestly."},"history":["Survived every catastrophe by being beneath notice and quick to adapt","Kept the Sunless Market and the smuggling-lines running in the dark ages","Redcaps' reputation dates to a blood-war the other lines refuse to own"],"legends":["The Tinker Who Built a City from a Scrapheap","The First Find that turned out to be a fallen star"],"stereotypes":["Wicked, thieving, and cowardly (mostly slander)","Redcaps are all murderers (a story goblins hate)","Too dim to matter (a fatal underestimation)"],"rpHooks":["You built something from scrap that a powerful person now wants back","You left the warren rather than take part in a redcap rite"],"advHooks":["Something is coming up through the Deepest Door your Deep-warren guards","A device you built has fallen into the wrong hands and must be recovered"],"greeting":"A quick showing of empty, then busy, hands: 'What've we got, then?'","oath":"'By luck and the warren, I share and I survive.'","colors":["Scrap-brown, glowcap-green, redcap-crimson"],"symbol":"A cog wound with a lucky knot"},"genasi":{"origin":"Genasi carry a living piece of the elemental realms, and where that element runs strongest shapes a wholly different people.","homeland":"The Elemental Marches and the Stormreach","regions":["elemental-marches","stormreach","celestial-heights"],"culture":"Flame-born of the fire-realm's edge, tide-born of the living waters, stone-born of the deep earth, wind-born of the high air, storm-born of the tempest, frost-born of the elemental cold. Genasi cluster by element, and each element carries its own temper, art, and philosophy, so that a flame-born and a tide-born share only the fact of being part-elemental.","society":"Element-pact communities on the frontier of the Marches, each bound to and wary of the realm in their blood.","government":"Elemental-pact councils and the marchwarden orders that watch them.","beliefs":"The element as both gift and danger; many genasi tend shrines to their realm, some to worship it, some to keep it at bay. The element is a relationship, not a fate.","traditions":["The First Kindling, when a young genasi's elemental nature fully wakes","Element-tending, the daily care of a shrine or spring tied to one's realm","The Pact-Renewal, reaffirming the bargain that keeps a community's element in balance"],"language":"Trade-Common laced with elemental cant, each element with its own dialect and idiom.","architecture":"Element-shaped: flame-forges, water-halls, floating-stone holds, storm-spires.","clothing":"Element-marked and practical; flame-born favor ember-cloth, tide-born flowing weaves.","food":"Element-touched fare, from ember-seared to spring-chilled.","occupations":["Elementalists and pact-tenders","Marchwardens and rift-watchers","Smiths, healers, and artisans of their element","Guides across the elemental frontier"],"military":"Elemental adepts and pact-champions; a storm-born line and a stone-born line wage war in completely different ways.","factions":["elemental-pacts","marchwardens","riftwatch"],"relations":{"dragonborn":"Kindred elemental-blooded folk; sometimes allies, sometimes rivals for the same realms.","seraphim":"Wind and storm genasi share the high realms with the winged.","goliath":"Stone-born and stone-blooded find easy kinship."},"history":["Settled the Elemental Marches when the rifts first opened","The pact-communities have kept the elements from spilling inland for ages","Storm-born lines trace to the Stormfall, frost-born to the drowning cold"],"legends":["The First Kindling, a spark drawn straight from the elemental realm","The Pact-Keeper who held a rift closed with their own body"],"stereotypes":["All of them spellcasters (false; many never wield their element as a weapon)","Cold, hot-headed, or aloof depending on the element","Not quite people (an old and cruel prejudice)"],"rpHooks":["Your element kindled wrong, in a realm that is not your line's","You are pact-bound to tend a shrine you fled"],"advHooks":["The Standing Rift is widening and your pact is failing to hold it","An elemental-pact offered your character power for a price you must now pay or refuse"],"greeting":"A palm briefly kindled with one's element and shown: 'Balance to you.'","oath":"'By the element I carry and keep in balance, I hold.'","colors":["By element: flame-red, tide-blue, stone-ochre, wind-white, storm-violet, frost-cyan"],"symbol":"A ring of the six elemental sigils"}},"lineage":{"ln-northlander":{"region":"frostbound-north","homeland":"The fjord-holds around Fjordheim","environment":"Ice-plains, glacier-fed fjords, and long white winters","culture":"Northlanders measure a life by the winters survived and the oaths kept through them. Every fjord-hold keeps a Saga-Stone where the year's dead and deeds are carved before the ice takes the names.","tradition":"The Aurora-Vigil, where the young sit a night beneath the northern lights to be judged worthy by the ancestor-fire.","appearance":"Weather-hardened, pale, amber and bone ornaments, storm-braided hair.","naming":"A given name plus an earned deed-name (Yrsa Ice-Walker).","occupations":["Longship reavers and traders","Fjord-farmers and whalers","Saga-keepers"],"allies":["Frost-clan orcs","Bearkin guardians"],"rivals":["Ice-reaver raiders","Southern glacier-glass colonists"],"landmark":"The Aurora Vault of Fjordheim, where dead kings lie under ice","hooks":["A dead king is thawing out of the Aurora Vault your hold guards","You are the first of your hold to sail south instead of raiding","Your family's name was struck from the Saga-Stone and you mean to earn it back"]},"ln-coastborn":{"region":"sapphire-sea","homeland":"The trade-towns of the Crownlands coast and Port Meridian","environment":"Warm harbors, tide-flats, and busy sea-lanes","culture":"Coastborn humans live by the tide-tables and the harbor-bell, a mercantile, cosmopolitan people who trust a signed contract more than any crown. Half of any Coastborn town is other Kin, and they like it that way.","tradition":"The Launching, a coming-of-age where the young must sail a small boat out of sight of land and return.","appearance":"Sun-weathered, practical sea-cloth, guild-tokens and knot-charms.","naming":"Given name plus a harbor or ship-name (Del of Saltmarket).","occupations":["Sailors and navigators","Merchants and dock-factors","Shipwrights and pilots"],"allies":["Seaborn traders","Turtlekin pilots","Free Captains"],"rivals":["Tide Covenant toll-keepers","Reef-raiders"],"landmark":"Port Meridian, the free harbor open to every flag","hooks":["A covenant blockade is strangling your home harbor","You inherited a ship with a debt and a secret hold","A century-sunk wreck has surfaced on the Graveyard Reef and your family owned it"]},"ln-highlander":{"region":"ironspine","homeland":"The fortress-cities of the Crownspine ridgelines","environment":"High mountain passes, cloud-line ridges, ancient suspension bridges","culture":"Highlanders of the Crownspine build fortress-cities into the mountainsides and measure adulthood by the Crossing of Nine Bridges, a pilgrimage above the cloud line. Every household keeps a Storm Bell, said to be forged from the armor of the first warrior to survive the Skyfall.","tradition":"The Crossing of Nine Bridges, a deadly rite across ancient chain-spans above the clouds.","appearance":"Wind-burned, wrapped in clan-plaid, iron bridge-tokens for each crossing.","naming":"Given name plus a clan-and-peak name (Maerin of Bridgehold).","occupations":["Bridge-wardens and guides","High-pass traders","Mountain soldiers"],"allies":["Goliath high-clans","Dwarven forge-cities"],"rivals":["Rival ridge-clans","Vault-claim raiders"],"landmark":"The Nine Bridges of Ninebridge Hold","hooks":["A bridge is failing and the Warden hides it to save face","Your household's Storm Bell cracked, an ill omen you must answer","You refused the Crossing and are called coward until you make it"]},"ln-desertborn":{"region":"sunscorch","homeland":"The oasis-cities and caravan-roads of the Sunscorch","environment":"Dune-seas, killing daytime heat, cold star-bright nights","culture":"Desertborn live by water-law and the caravan-road, a people for whom hospitality is survival and a shared canteen is a sacred bond. They read the dunes for the buried cities that the sand keeps and the sand-readers forbid.","tradition":"The Water-Oath, where sharing your last water with a stranger binds you both as kin for life.","appearance":"Dust-veiled, layered sun-robes, sun-gold jewelry, sand-scoured skin.","naming":"Given name plus an oasis or caravan-name (Sael of Karan).","occupations":["Caravaneers and guides","Spice and salt traders","Sand-readers and antiquarians"],"allies":["Lionkin prides","Sun-elf caravans","Genasi flame-folk"],"rivals":["Grave-robbers","Oasis tariff-lords"],"landmark":"The Buried City of Karan-That-Was","hooks":["A sandstorm uncovered a city that should have stayed buried","You carry a map the sand-readers would kill to keep hidden","Your caravan's water-oath partner betrayed the road"]},"ln-cityborn":{"region":"crownlands","homeland":"The great walled market-cities like Highreach","environment":"Crowded guild-quarters, walled streets, imperial ruins beneath the cellars","culture":"Cityborn are the guild-and-charter humans of the Crownlands' free cities, raised among a dozen Kin in one street. Ambition here is measured in charters won and ledgers balanced, and everyone is three favors from the Goldhand League.","tradition":"The Charter-Day, when a young citizen is entered into a guild's rolls and gains a name in the city's records.","appearance":"Well-dressed by trade and station, guild-badges, city-fashion.","naming":"Given name plus a guild or district (Corin of the Lantern Ward).","occupations":["Guild artisans and clerks","Merchants and bankers","Ward-officers and fixers"],"allies":["Halfling quarters","Dwarven guild-partners","Kitsune brokers"],"rivals":["Rival guilds","Salvage-lords"],"landmark":"The Sundered Throne kept under glass in Highreach's imperial hall","hooks":["The Sundered Throne in your city whispered a name last winter","Your guild charter is being stolen out from under you","An imperial vault opened beneath your district and something came up"]},"ln-wildborn-h":{"region":"emerald-wilds","homeland":"The frontier forest-towns like Green Hollow","environment":"The tree line where farmland meets old-growth Wilds","culture":"Wildborn humans are frontier folk who live where the Emerald Wilds press against settled land, half-farmer and half-ranger. They keep the old woodland courtesies to avoid waking what sleeps under the canopy, and they know the Hunt by its horn.","tradition":"The Tree-Line Truce, small daily offerings left at the forest edge to keep peace with the Wilds' peoples.","appearance":"Practical woodcraft leathers, green dyes, charms of bone and bark.","naming":"Given name plus a homestead or wood-name (Bram of Thornwatch).","occupations":["Rangers and frontier scouts","Loggers and hunters","Beast-kin traders"],"allies":["Wolfkin ranges","Wood elves","Halfling settlers"],"rivals":["Deep-wood predators","Reckless loggers"],"landmark":"The tree line at Green Hollow where farm meets old growth","hooks":["The Hunt rode past your town by daylight for the first time","A wolfkin range has gone silent and the settlers are blamed","You crossed the tree-line truce and owe the forest a debt"]},"ln-stormtouched":{"region":"stormreach","homeland":"The ridge-holds of the Stormreach storm-belt","environment":"Permanent storm-belt of chained thunderheads and standing lightning","culture":"Stormtouched humans were born under the living Storm and marked by it, their hair and eyes lit faintly with static. They court the lightning rather than hide from it, and the Stormwardens watch them closely for signs the Storm has claimed one as its own.","tradition":"The Reading of the Sky, where every Stormtouched child is taught to name a storm's mood before they can name the days.","appearance":"Static-lit hair, storm-grey eyes, faint lightning-scars, storm-glass ornaments.","naming":"Given name plus a storm-omen (Ilsa Thunder-Marked).","occupations":["Storm-readers and weather-wardens","Sky-iron traders","Gale Riders"],"allies":["Storm-scaled dragonborn","Storm genasi"],"rivals":["Rival storm-cults","Those who fear the Storm-claimed"],"landmark":"The Standing Bolt, frozen lightning above Thundergate","hooks":["The Storm spoke a name and it is yours","The Standing Bolt flickered the day you were born","The Stormwardens want you tested to see what the Storm made you"]},"ln-highelf":{"region":"emerald-wilds","homeland":"The high-realm courts near grown-city Elarethil","environment":"Ancient canopy cities and luminous grown-wood spires","culture":"High Elves keep the oldest unbroken courts in the world, where a slight from three centuries past is still on the docket. They regard themselves as the keepers of the First Age's memory and rarely let anyone forget the debt.","tradition":"The Century Rite, a coming-of-age withheld until a full hundred years, when memory-weavings of the whole life are sung.","appearance":"Tall, poised, living-wood circlets, robes of leaf-weave and silver.","naming":"A long house-name and a personal name in Old Elvish (Aeltheri of House Vaelor).","occupations":["Loremasters and archivists","Court diplomats","Enchanters"],"allies":["Greenwardens","Moon elves"],"rivals":["The isolationist Thorn Court","Human salvagers of elven ruins"],"landmark":"The Heartwood, said to remember the whole forest","hooks":["You were exiled for refusing an oath your house swore before your birth","A grudge-name three centuries old is now yours to end or honor","The Heartwood is sickening and your court is blamed"]},"ln-woodelf":{"region":"emerald-wilds","homeland":"The green-hollow ranges of the deep Wilds","environment":"Old-growth forest, mist-groves, and living hunting-trails","culture":"Wood Elves live in the forest rather than above it, keeping nature-faith and grove-law over court and crown. They share the canopy with beast-kin ranges, and cutting the wrong tree can start a war that the Greenwardens must judge.","tradition":"The Grove-Naming, where a young wood elf is given into the keeping of a particular grove-spirit for life.","appearance":"Lithe, bark-toned skin-marks, living-wood bows, leaf-cloaks.","naming":"Given name tied to a grove or season (Faenor Springthorn).","occupations":["Rangers and grove-keepers","Herbcrafters","Living-wood bowyers"],"allies":["Wolfkin ranges","Owlkin seers","Wildborn humans"],"rivals":["Thorn Court isolationists","Loggers"],"landmark":"The Silent Glade where sound will not travel","hooks":["Your grove-spirit has fallen silent and you must learn why","A grove-treaty is broken and both sides want you as witness","The Hunt has begun riding by day through your range"]},"ln-drow":{"region":"blackdeep","homeland":"The drow house-city Glimmerreach in the Blackdeep","environment":"Lightless caverns lit by glowfall and deep-crystal","culture":"The Drow descended into the Blackdeep in an exile no surface elf will fully explain, and there built house-cities ruled by matriarchs and endless succession-wars. Not all are cruel, but all are careful, for in the dark a lantern is a target.","tradition":"The Silence-Rite, where a young drow proves they can move, hunt, and kill without a sound.","appearance":"Ashen or dusk-dark skin, white and silver hair, blind-pearl eyes, shadow-silk.","naming":"House-name and personal name, often with a shadow-epithet (Xel'ryn of House Mornvael).","occupations":["House-agents and assassins","Deep-traders","Forbidden loremasters"],"allies":["Deep Conclave","Blackdeep goblins"],"rivals":["Rival drow houses","Surface elves","Forge-city dwarves"],"landmark":"The Glowfall, an underground waterfall of luminous stone","hooks":["A house-matron summons you home for a war you fled","The Glowfall is going dark tunnel by tunnel","You were made expendable precisely so a house could trust you"]},"ln-elarin":{"region":"moonlit-vale","homeland":"The silver villages of the Moonlit Vale's edge","environment":"Perpetual dusk, moon-silvered mist, and turning woods","culture":"The Elarin are the twilight elves of the Vale's border, neither fully of the moon-courts nor the Wilds, keepers of threshold-lore and the paths between places. They are famed guides for those who must cross where the Vale bleeds into the Shadowlands.","tradition":"The Threshold-Walk, a rite of crossing the Turning Wood alone and returning by a different path than one left.","appearance":"Dusk-pale, silver-eyed, grey and violet weaves, threshold-charms.","naming":"Given name plus a path or threshold (Ilyra Duskgate).","occupations":["Threshold-guides and wayfinders","Border-wardens","Omen-readers"],"allies":["Kitsune of the Vale","Owlkin seers"],"rivals":["Shadowland raiders","Those who abuse the crossing-paths"],"landmark":"The Turning Wood where paths rearrange by moonlight","hooks":["A path in the Turning Wood now leads somewhere it never did","You must guide someone across the shadow-border who should not cross","You returned from the Threshold-Walk by a path that no longer exists"]},"ln-moonelf":{"region":"moonlit-vale","homeland":"The moon-courts around Silvermere","environment":"Moonlit lakes, dusk-gardens, and dream-tides","culture":"Moon Elves live by lunar tides and dream-omens in the courts of the Vale, reading fate in the fate-showing waters of Silvermere. Their politics are fought with secrets and omens, and a shared dream can seal an alliance or start a feud.","tradition":"The Fate-Gazing, when a young moon elf first looks into Silvermere and is told, or refuses to be told, their fate.","appearance":"Luminous pale skin, moon-silver hair, dream-silk robes, lunar tattoos.","naming":"Given name plus a lunar phase (Seluné Waning-Star).","occupations":["Dream-readers and omen-scribes","Court diplomats","Illusionists"],"allies":["Owlkin dream-wardens","High elves"],"rivals":["Dream-thieves","Rival moon-houses"],"landmark":"Silvermere, the lake that shows not your face but your fate","hooks":["Silvermere showed you a fate you refuse to accept","A dream-thief is stealing memories from your court","Three strangers were shown the same fate and one is you"]},"ln-sunelf":{"region":"sunscorch","homeland":"The sun-caravans and oasis-courts of the Sunscorch","environment":"Golden dune-seas and oasis gardens under a killing sun","culture":"Sun Elves are the desert-caravan elves who traded the shaded courts for the open sun, keepers of star-charts and oasis-law along the Sunscorch roads. Where other elves hoard memory, sun elves trade it, selling old maps and older secrets.","tradition":"The Star-Reckoning, where a young sun elf must navigate the deep dunes by star-chart alone.","appearance":"Bronze-gold skin, sun-white hair, desert weaves and sun-gold ornaments.","naming":"Given name plus a star or oasis (Aurelin of the Twin Stars).","occupations":["Caravan-masters and cartographers","Star-navigators","Oasis-brokers"],"allies":["Desertborn humans","Lionkin sun-courts"],"rivals":["Grave-robbers","Tariff-lords of the oasis"],"landmark":"Sunspire, the mile-high needle that casts no shadow at noon","hooks":["Your caravan's star-chart leads to a city the sand-readers sealed","The Sunspire's tip has begun to glow and only you noticed","A rival is selling forged maps under your family's mark"]},"ln-starelf":{"region":"celestial-heights","homeland":"The star-courts near the Threshold of the Celestial Heights","environment":"Rarefied luminous heights of starlight and aurora","culture":"Star Elves are the rarest elven line, dwelling at the edge of the Celestial Heights among the seraphim, keepers of constellation-lore and the oldest prophecies. They are half in the world and half out of it, and time runs strangely where they live.","tradition":"The Constellation-Naming, where a newborn is bound to a star-pattern that guides and, some say, dooms them.","appearance":"Star-pale, luminous eyes, hair like captured light, star-glass ornaments.","naming":"Given name plus a constellation (Vaeloth of the Crown of Nine).","occupations":["Prophets and star-readers","Threshold-scholars","Celestial envoys"],"allies":["Seraphim of the Radiant Choir","Owlkin star-readers"],"rivals":["The Unlit","Those who would silence prophecy"],"landmark":"The Star Court where the constellations hold council","hooks":["Your bound constellation has begun to go dark","A prophecy in the Star Court names your character","A Fallen seraph asks you to carry word the Choir forbids"]},"ln-durnak":{"region":"ironspine","homeland":"The forge-city Durnhal","environment":"Vaulted forge-halls above warm forge-deeps","culture":"The Durnak are the great forge-city dwarves of Durnhal, keepers of the Everforge that has burned since before the Sundering. Their whole society is craft-and-ledger: a dwarf is known by their masterwork and the debts recorded in their beard-braids.","tradition":"The First Masterwork, presented before the Forgemoot to earn adult standing and a maker's-mark.","appearance":"Broad, soot-marked, rune-braided beards, heirloom metalwork.","naming":"Given name, clan-name, and maker's-mark (Thordin Ironvault, Mark of the Twin Anvils).","occupations":["Master smiths and runewrights","Vault-keepers","Ore-merchants"],"allies":["Vault-keepers","Goliath high-clans"],"rivals":["Deep dwarves","Vault-claim raiders"],"landmark":"The Everforge of Durnhal","hooks":["The Everforge is dimming and rival clans blame each other","Your first masterwork was stolen before its presentation","A forge-master vanished in the deep levels below the city"]},"ln-mountain":{"region":"ironspine","homeland":"The mountain-clan holds of the high Ironspine","environment":"Alpine peaks, mountain-halls, and mining tunnels","culture":"Mountain Dwarves keep the old clan-holds and mining-law of the high peaks, less refined than the forge-cities but prouder of their independence. They quarry the ore the everforges need and never let the Forgemoot forget who digs it.","tradition":"The Vein-Right, an inherited claim to a particular ore-vein that a dwarf must work to keep.","appearance":"Weather-hardened, plaid-wrapped, mining-lamp scars, stone-tokens.","naming":"Given name plus a clan and peak (Vera Stonehelm of Greypeak).","occupations":["Miners and quarry-masters","Stone-cutters","Mountain traders"],"allies":["Forge-cities (as customers)","Goliaths"],"rivals":["Rival mining clans","Deep dwarves over the lower veins"],"landmark":"Cloudanvil, the anvil-shaped peak of the high clans","hooks":["A vein-right dispute is about to become a clan war","Your clan's oldest mine broke into something older","The Forgemoot means to seize your family's vein"]},"ln-deep":{"region":"blackdeep","homeland":"The under-city Lowvault in the Blackdeep","environment":"Lightless deep tunnels, fungal forests, cavern-seas","culture":"Deep Dwarves dwell far below the forge-cities in Lowvault, keeping the Deep Conclave's peace and the surface out. They dig deeper than any other dwarves dare, and they alone keep watch on the Deepest Door, below which even they refuse to go.","tradition":"The Deep-Watch, a solitary vigil kept over the Deepest Door as a rite of trust.","appearance":"Pale, large-eyed, glowcap-lit, black-iron ornaments.","naming":"Given name plus a depth or vault (Brakka of the Ninth Deep).","occupations":["Deep-miners and vault-wardens","Glowcap-farmers","Neutral fence-traders"],"allies":["Deep Conclave","Blackdeep drow (uneasily)"],"rivals":["Surface forge-cities","Whatever knocks on the Deepest Door"],"landmark":"The Deepest Door, below which the Deep folk refuse to dig","hooks":["Something is coming up through the Deepest Door you guard","The Glowfall is going dark and the Deep is losing its light","A surface expedition wants you to guide them past the Conclave's ban"]},"ln-forgeborn":{"region":"ironspine","homeland":"The rune-forges of Emberdeep and Durnhal","environment":"Rune-lit deep-forges and enchanting-vaults","culture":"Forgeborn are the runewright dwarves, born to families that bind magic into steel. Their masterworks are prayers in metal, and a Forgeborn is buried with their finest rune, that their craft may speak for them to the ancestors.","tradition":"The Rune-Waking, when a young Forgeborn inscribes their first living rune and it either wakes or shatters.","appearance":"Rune-scarred hands, glowing forge-marks, ember-cloth aprons.","naming":"Given name plus a rune-lineage (Kild Emberrune).","occupations":["Runewrights and enchanters","Master smiths","Vault-warders"],"allies":["Durnak forge-cities","Vault-keepers"],"rivals":["Rune-thieves","Cinder-guild salvagers"],"landmark":"The Sealed Door of Emberdeep","hooks":["A living rune you forged has begun to change on its own","Your family's master-rune was stolen","The knocking on the Sealed Door keeps the rhythm of a rune you know"]},"ln-stoneborn":{"region":"ironspine","homeland":"The stonemason-holds of the Ironspine passes","environment":"Carved cliff-holds and bridge-quarries","culture":"Stoneborn are the builder-dwarves, masons and bridge-wrights whose stonework is meant to outlast the mountains it is cut from. They hold that the dead live on in the stone they shaped, and a Stoneborn hall is a graveyard and a monument at once.","tradition":"The Setting of the First Stone, laid by a young Stoneborn to found something meant to stand for centuries.","appearance":"Dust-grey, calloused, chisel-marked, stone-bead braids.","naming":"Given name plus a work or hold (Dwalia of the Long Bridge).","occupations":["Masons and bridge-builders","Engineers","Tomb-wardens"],"allies":["Goliath bridge-clans","Mountain dwarves"],"rivals":["Careless demolitionists","Vault-raiders"],"landmark":"The Long Bridge of glacier stone across a frozen fjord","hooks":["A bridge your ancestors built is failing and only your family's stone-lore can save it","A tomb you set is being robbed","Your first stone was laid on cursed ground"]},"ln-runebeard":{"region":"ironspine","homeland":"The runebeard enclaves within the forge-cities","environment":"Sealed rune-vaults and archive-forges","culture":"Runebeards are the loremaster-dwarves who keep the grudge-archives and favor-archives, their beards braided with rune-rings that record every debt and deed of their line. They are the memory and the conscience of the forge-cities, feared for what they remember.","tradition":"The Braiding of the First Ring, when a young Runebeard is entrusted with their line's ledger of debts.","appearance":"Elaborate rune-ringed beards, ink-stained fingers, archive-keys.","naming":"Given name plus a ledger-line (Balgrim of the Iron Ledger).","occupations":["Archivists and lawspeakers","Grudge-keepers","Rune-scholars"],"allies":["Forgemoot","Durnak forge-cities"],"rivals":["Those who would erase a recorded debt","Deep dwarves over disputed grudges"],"landmark":"The Grudge-Archive of Durnhal","hooks":["A grudge in your ledger names someone you love","Someone is trying to erase a debt from the archive","The Grudge That Ended a Kingdom has come due in your generation"]},"ln-hearthborn":{"region":"crownlands","homeland":"The settled shires of the green Crownlands","environment":"Rolling farm-shires, round-doored hill-homes, hedgerow lanes","culture":"Hearthborn halflings keep the settled shires where a good reputation and a fuller table matter more than any law. A shire runs on the Long Table, shared meals where grievances are spoken once and then dropped forever.","tradition":"The Long Table, a communal feast where every quarrel must be aired and then buried under the next course.","appearance":"Comfortable, waistcoated, apple-cheeked, luck-charms on watch-chains.","naming":"Given name plus a family and shire (Poppy Underhill of Greenmeadow).","occupations":["Cooks, brewers, innkeepers","Farmers","Quiet burglars and scouts"],"allies":["Cityborn humans","Crownlands goblins"],"rivals":["Greedy tax-lords","Salvage-lords eyeing shire land"],"landmark":"The great Long Tables of the shire-moots","hooks":["Your shire sits atop an imperial vault a duke means to seize","A recipe your family guards is worth killing for","You are the first Hearthborn in memory to leave the shire for good"]},"ln-riverfoot":{"region":"sapphire-sea","homeland":"The barge-roads and river-ports of the Crownlands","environment":"Slow rivers, stilt-towns, and busy barge-lanes","culture":"Riverfoot halflings live on the water, a barge-folk of traders and pilots who know every current and every fence between the mountains and the sea. Their homes float, their loyalties run deep, and their gossip travels faster than the tide.","tradition":"First-Foot, the belief that whoever first crosses a barge's deck at new year shapes its luck.","appearance":"Bright waistcoats, river-tan, knot-charms, pole-callused hands.","naming":"Given name plus a barge or river (Milo Quickcurrent).","occupations":["River-traders and pilots","Barge-wrights","Smugglers and fences"],"allies":["Coastborn humans","Turtlekin pilots","Bridgewater guilds"],"rivals":["Toll-trolls","River-guild rivals"],"landmark":"The Drowned Palace beneath Bridgewater","hooks":["Your barge was chosen to smuggle something you were not told about","A diver in Bridgewater came up speaking a dead tongue","The river-guild wants your family's oldest route"]},"ln-hillborn":{"region":"crownlands","homeland":"The hill-clan holds of the Crownlands uplands","environment":"Rolling hill-country, sheep-downs, standing stones","culture":"Hillborn halflings keep the old hill-clans and the standing-stone rites, a hardier, more clannish folk than their shire cousins. They herd the downs, mind the old stones, and remember the songs of who lies beneath them.","tradition":"The Standing-Stone Vigil, a night spent among the old stones to be welcomed into the clan.","appearance":"Weather-brown, homespun and wool, stone-charms and sling-cords.","naming":"Given name plus a hill-clan (Rowan of the Grey Downs).","occupations":["Herders and wool-traders","Slingers and scouts","Stone-keepers"],"allies":["Hearthborn shires","Mountain dwarves"],"rivals":["Down-raiders","Those who disturb the old stones"],"landmark":"The old standing stones of the Grey Downs","hooks":["Something has been disturbed among your clan's standing stones","A stone-vigil showed you a song about the buried dead","Raiders are driving your clan off the downs"]},"ln-meadowborn":{"region":"emerald-wilds","homeland":"The meadow-villages at the edge of the Emerald Wilds","environment":"Wildflower meadows where forest meets farmland","culture":"Meadowborn halflings live in the flower-country at the Wilds' edge, keepers of bee-lore, herb-craft, and the small courtesies that keep the forest peoples friendly. They are the Wilds' most trusted human-sized neighbors, and their honey seals more treaties than swords.","tradition":"The Blooming, a spring rite where the young plant a meadow whose flowers will bloom the year they come of age.","appearance":"Flower-crowned, sun-freckled, herb-dyed cloth, bee-charms.","naming":"Given name plus a flower or meadow (Clover Honeyfield).","occupations":["Beekeepers and herbalists","Meadow-farmers","Forest-edge traders"],"allies":["Wood elves","Wildborn humans","Owlkin"],"rivals":["Blight-bringers","Loggers"],"landmark":"The wildflower meadows of the Wilds' edge","hooks":["A blight is spreading from the forest into your meadows","Your family's honey is the only cure for a spreading sickness","The Wilds have called in a debt your village owes"]},"ln-wanderfoot":{"region":"crownlands","homeland":"The caravan-roads, everywhere and nowhere","environment":"The open road, in rambling caravan-wagons","culture":"Wanderfoot halflings never settled, a caravan-folk of tinkers, traders, and story-keepers who follow the road-elders from town to town. They carry news, mend what is broken, and know the roads better than any map, and they never sleep twice in one place if they can help it.","tradition":"The Luck-Token, passed to a young Wanderfoot on their first road, said to hold the luck of every mile the family has walked.","appearance":"Layered travelling-cloth, road-dust, jingling charm-belts, patched wagons.","naming":"Given name plus a road-name (Fen of the Long Way).","occupations":["Tinkers and traders","Storytellers and news-carriers","Scouts and guides"],"allies":["Riverfoot barge-folk","Wandering harengon"],"rivals":["Road-bandits","Towns that bar the caravans"],"landmark":"The great trade-crossroads of the Crownlands","hooks":["You lost the caravan road home and must find it again","A luck-token you carry is wanted by someone who kills for it","The road-elder entrusted you with a debt older than the caravan"]},"ln-luckborn":{"region":"crownlands","homeland":"Scattered among every halfling community","environment":"Wherever fortune is courted and feared","culture":"Luckborn halflings are those said to be touched by living luck, born on a lucky hour and marked by uncanny fortune. Other halflings both prize and fear them, for a Luckborn's good luck has a way of spending someone else's, and the Luckless Wanderer's tale is a warning they all know.","tradition":"The Reckoning of Luck, where a Luckborn learns to give away fortune before it turns and takes from those they love.","appearance":"Ordinary but for uncanny near-misses; four-leaf and coin charms worn openly.","naming":"Given name plus a luck-omen (Tansy Ninelives).","occupations":["Luck-readers and gamblers","Scouts (they always survive)","Charm-makers"],"allies":["Fellow halflings","Kitsune (who understand debts of fortune)"],"rivals":["Those whose luck was spent","Curse-bringers"],"landmark":"The shrine of the Luckless Wanderer","hooks":["Your luck has begun to fail and you must learn why","Someone believes your luck was stolen from them","You carry a luck-token said to have saved nine lives"]},"ln-ironblood":{"region":"ironspine","homeland":"The iron-clan holds of the Ironspine","environment":"Mountain forges and iron-mines shared with the dwarves","culture":"Ironblood orcs are the mountain-clans who share the Ironspine with the dwarves, master smiths and shield-bearers whose oaths are literally forged into their armor. An Ironblood's oath-scars and armor-runes are read as a resume of every promise they have kept.","tradition":"Oath-scars, ritual marks made when a binding promise is sworn, and armor-runes forged to record it.","appearance":"Broad, iron-grey, oath-scarred, rune-etched plate.","naming":"Given name and a deed-name earned young (Grukka Shield-Sworn).","occupations":["Smiths and shield-bearers","Oath-keepers and arbiters","Mountain soldiers"],"allies":["Ironspine dwarves","Goliath clans"],"rivals":["Oathbreaker clans","Vault-raiders"],"landmark":"The shared forge-holds of the Ironspine","hooks":["An oath forged into your armor now binds you to a cause you doubt","Your clan owes a blood-oath only you can fulfill","A rival clan claims your oath-scars are false"]},"ln-ashborn":{"region":"ashen-wastes","homeland":"The cinder-cone stronghold Cinderhold","environment":"Grey volcanic desert, ashfall, and ember-storms","culture":"Ashborn orcs are the ash-clans of the burned south, who live off what the fire left and hold the Everburn half-sacred. Their scholars keep the true history of the Age of Ash and bristle at the lie that every orc is only a warrior.","tradition":"The Ash-Vigil, a night spent alone in the burned lands to hear the ancestors in the ember-wind.","appearance":"Ash-grey skin, ember-red eyes, salt-cured leathers, ash-marks.","naming":"Given name and an ash-deed (Vorag Ember-Walker).","occupations":["Fire-salvagers and obsidian-smiths","Clan-historians","Caravan-guards"],"allies":["Ember-scaled dragonborn","Ash-wastes goblins"],"rivals":["Raiding ash-clans","Ember-pilgrims who worship the fire"],"landmark":"The Glass Capital, fused to obsidian in a single night","hooks":["The Everburn is spreading toward your stronghold","An ash-vigil showed you a name that should be dead","A vault in the Glass Capital never burned and everyone wants it"]},"ln-frostborn-o":{"region":"frostbound-north","homeland":"The ice-halls of the frost-clans","environment":"Arctic ice-plains, glacier-halls, and frozen fjords","culture":"Frostborn orcs are the frost-clans of the north, one people with the ash-clans until the catastrophe scattered them. They keep longbarrows and ice-halls, smoke and freeze their winters' meat, and hold that the cold itself judges the worthy.","tradition":"The Earning of the Name in the deep winter, when a young orc's given name is replaced by a deed done in the cold.","appearance":"Frost-white skin, pale eyes, heavy furs, iron oath-marks.","naming":"Given name and a cold-deed (Skarn Frost-Sworn).","occupations":["Hunters and ice-fishers","Warriors and oath-keepers","Fur-traders"],"allies":["Northlander humans","Bearkin","Frost goliaths"],"rivals":["Ice-reavers","The Winter Hunt"],"landmark":"The Frozen Fleet locked in a harbor of ice","hooks":["The Winter Hunt has crossed into your clan's range","A frost-clan and ash-clan reunion could heal or reopen an ancient split","The Frozen Fleet's ice is cracking and something rides in it"]},"ln-wildborn-o":{"region":"emerald-wilds","homeland":"The free ranges at the Wilds' frontier","environment":"Forest-edge frontier, open plains, and beast-kin ranges","culture":"Wildborn orcs are the free-range clans who refuse both the mountain forges and the fixed holds, roaming the frontier and living by the older, wilder oaths. They ride, hunt, and raid by a code that the settled clans find crude and the settled clans cannot match in open country.","tradition":"The Free-Oath, sworn to the land itself rather than to any hold, and never to be fenced.","appearance":"Lean, sun-marked, hide and bone, wind-worn oath-marks.","naming":"Given name and a range-deed (Ureth Plains-Runner).","occupations":["Riders and outriders","Frontier hunters","Mercenary skirmishers"],"allies":["Wolfkin ranges","Wildborn humans"],"rivals":["Settled clans","Fence-building settlers"],"landmark":"The open frontier ranges of the Wilds' edge","hooks":["Settlers are fencing the range your free-oath is sworn to","Your clan's old raiding-debt has come back to find you","The Hunt now rides the same range as your clan"]},"ln-warborn":{"region":"elemental-marches","homeland":"The war-clan holds of the Marches border","environment":"The contested elemental frontier and old battlefields","culture":"Warborn orcs are the border war-clans, oath-band infantry sworn to hold the Elemental Marches against what spills from the rifts. They are the steadiest soldiers in the world, fighting as one because breaking formation breaks an oath, and they hire out as the most disciplined mercenaries alive.","tradition":"The Band-Oath, sworn between an entire war-band so that each fights for the others unto death.","appearance":"Scarred, disciplined, matched war-plate, band-marks shared across the unit.","naming":"Given name and a battle-deed (Morg Gate-Holder).","occupations":["Oath-band soldiers","Marchwardens","Elite mercenaries"],"allies":["Marchwardens","Storm dragonborn"],"rivals":["Rift-cults","Oathbreakers"],"landmark":"The Tempered Gate, forged to hold an elemental tide","hooks":["The Standing Rift is widening and your band is oath-bound to hold it","Your war-band's oath was broken and you alone survived to answer for it","A mercenary contract turns out to serve a rift-cult"]},"ln-bloodmoon":{"region":"shadowlands","homeland":"The shadow-border clans near the Vale","environment":"Twilight border-country where the light thins","culture":"Bloodmoon orcs are the shadow-touched clans of the border, marked by the red moon under which they keep their oaths. Feared by other orcs for the darker rites they inherited from the Blood Wars, they hold the shadow-border that no settled clan will keep.","tradition":"The Bloodmoon Oath, sworn only under the red moon and never spoken of by daylight.","appearance":"Dusk-dark skin, red-moon eyes, shadow-marked oath-scars, dark iron.","naming":"Given name and a moon-deed (Kravok Redmoon-Sworn).","occupations":["Border-wardens and night-hunters","Shadow-guides","Oath-keepers of the dark"],"allies":["Shadow-wardens","Night-court vampires (uneasily)"],"rivals":["The Unlit","Clans who fear the bloodmoon rites"],"landmark":"The Threshold of Long Shadows","hooks":["A bloodmoon oath binds you to a cause you no longer believe","The Unlit are recruiting from your border-clan","Other orcs have named your clan for a Blood Wars crime you did not commit"]},"ln-drakari":{"region":"stormreach","homeland":"The ridge-city Thundergate","environment":"The permanent storm-belt of chained thunderheads","culture":"The Drakari are the storm-scaled dragonborn of the Stormreach, born under the living Storm and taught to read its moods before they can name the days. Their whole culture courts the lightning, raising ridge-halls to catch it, and the Stormwardens draw their oracles from Drakari lines.","tradition":"The First Breath, when a young Drakari's storm-breath first wakes, timed if possible to a passing tempest.","appearance":"Storm-violet scales, static-lit crests, storm-glass ornaments.","naming":"Draconic given name and a storm-omen (Vaethyr Skyborn).","occupations":["Storm-readers and weather-wardens","Sky-iron smiths","Storm-champions"],"allies":["Storm genasi","Stormtouched humans"],"rivals":["Gale Riders","Rival storm-cults"],"landmark":"The Standing Bolt above Thundergate","hooks":["Your storm-breath woke wrong, in an element not of the storm","The Standing Bolt is dying and your line's oracles are blamed","The Storm spoke a name in your voice"]},"ln-stormborn-d":{"region":"stormreach","homeland":"The wandering storm-camps of the Stormreach coast","environment":"The storm-front where tempest meets sea","culture":"Stormborn dragonborn ride the storm-front itself, a bolder, wilder cousin to the ridge-bound Drakari, kin to the Gale Riders in spirit. They believe the Storm should be freed, not caged, and their feud with the Stormwardens is the great argument of the Stormreach.","tradition":"The Storm-Ride, a rite of gliding the leading edge of a living tempest and returning alive.","appearance":"Wind-scoured violet-and-grey scales, glider-harnesses, storm-charms.","naming":"Draconic given name and a wind-deed (Zerath Gale-Rider).","occupations":["Gale Riders and sky-raiders","Storm-glass runners","Free scouts"],"allies":["Gale Riders","Harengon storm-runners"],"rivals":["Stormwardens","Ridge-bound Drakari"],"landmark":"The Eye, the permanent hole of calm at the storm's center","hooks":["You claim to have walked into the Eye and come back changed","The Stormwardens mean to cage the Storm your kin would free","A storm-ride went wrong and left you owing the tempest"]},"ln-wyrmblood":{"region":"ironspine","homeland":"The old wyrm-halls of the deep Ironspine","environment":"Ancient stone halls and hoard-vaults","culture":"Wyrmblood dragonborn keep the oldest bloodlines, said to carry the truest spark of the ancient wyrms, and they hold themselves to old draconic law and long memory. Proud and hoard-minded, they guard relics of the First Age and reckon debts in centuries.","tradition":"The Hoard-Trust, where each Wyrmblood is given one relic to guard for life and answer for to the ancestors.","appearance":"Deep-jeweled scales, ancient ornaments, hoard-marks.","naming":"Long draconic name with an ancestral epithet (Aurdrakoth of the Elder Coil).","occupations":["Relic-keepers and loremasters","Draconic lawspeakers","Vault-guardians"],"allies":["Wyrmblood forge-dwarves","Ancient tigerkin lines"],"rivals":["Relic-thieves","Those who covet the hoard-trusts"],"landmark":"The wyrm-halls of the deep Ironspine","hooks":["The relic you were trusted to guard has been stolen","An old draconic debt has come due against your line","Your hoard-trust is older and stranger than you were told"]},"ln-emberborn":{"region":"ashen-wastes","homeland":"The ember-forges of the Ashen Wastes","environment":"Volcanic wastes, ember-storms, and lava-forges","culture":"Emberborn dragonborn are the fire-scaled folk of the Ashen Wastes, master forge-smiths who work the lava-forges and walk the Everburn unburned. They tend the sacred fire alongside the ash-clans and believe their breath is a trust to temper, not to spend.","tradition":"The Tempering, a rite of mastering one's own ember-breath before it masters the wielder.","appearance":"Ember-red scales, heat-shimmer eyes, forge-marked, lava-glass ornaments.","naming":"Draconic given name and a fire-deed (Pyrrha Embertongue).","occupations":["Lava-forge smiths","Ember-pilgrims and fire-tenders","Wasteland guides"],"allies":["Ashborn orcs","Flame genasi"],"rivals":["Those who would douse the Everburn","Cinder-guild profiteers"],"landmark":"The Everburn, the fire that has never gone out","hooks":["Your ember-breath is growing beyond your Tempering","The Everburn is spreading and only a fire-tender can turn it","A pilgrim asks you to guide them into the heart of the fire"]},"ln-frostscale":{"region":"frostbound-north","homeland":"The ice-vaults of the Frostbound North","environment":"Glaciers, frozen fjords, and ice-temples","culture":"Frostscale dragonborn are the cold-blooded northern line, keepers of ice-vaults and glacier-lore whose breath is the killing frost. Traced to the drowning cold of the Stormfall, they are patient and still where the ember-lines are fierce, and they guard what the ice preserves.","tradition":"The Stillness, a rite of holding one's frost-breath in perfect check through a long night of cold.","appearance":"Frost-white and cyan scales, frost-rimed crests, ice-glass ornaments.","naming":"Draconic given name and a frost-deed (Serixis Frostcoil).","occupations":["Ice-vault wardens","Glacier-glass workers","Cold-lore keepers"],"allies":["Northlander humans","Frost genasi","Polar bearkin"],"rivals":["Ice-reavers","Grave-thieves of the ice-vaults"],"landmark":"The ice-temples of the glacier-halls","hooks":["Something the ice preserved is thawing under your watch","Your frost-breath will not still and the cold is spreading","An ice-vault your line guards has been broken open"]},"ln-tideborn-d":{"region":"sapphire-sea","homeland":"The tide-temples of the Sapphire coast","environment":"Warm coasts, tide-pools, and reef-shallows","culture":"Tideborn dragonborn are the water-scaled coastal line, keepers of tide-temples whose breath is the surging sea. Kin to the seaborn by long tradition, they read the tides as scripture and hold their breath a trust to the water rather than a weapon.","tradition":"The Tide-Reading, where a young Tideborn learns to name the tide's turning before the harbor-bell.","appearance":"Tide-blue scales, wave-marked crests, pearl-and-coral ornaments.","naming":"Draconic given name and a tide-omen (Nerixis Tidecoil).","occupations":["Tide-priests and coast-wardens","Reef-guides","Coastal champions"],"allies":["Seaborn tide-folk","Coastborn humans","Turtlekin"],"rivals":["Reef-raiders","Abyss-choir cultists"],"landmark":"The tide-temples of the Sapphire coast","hooks":["The tides are reading wrong and your temple fears the abyss","Reef-serpents are fleeing something and driving ashore near your temple","Your tide-breath answered a call from the deep"]},"ln-moonhare":{"region":"moonlit-vale","homeland":"The dusk-warrens of the Moonlit Vale",
