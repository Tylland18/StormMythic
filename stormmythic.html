the Dusk Mask).","occupations":["Spies and shadow-walkers","Living-and-dead brokers","Border-agents"],"allies":["Night-court vampires","Duskhares","Shadow wolves"],"rivals":["The Unlit","Those they have out-schemed"],"landmark":"The Threshold of Long Shadows","hooks":["A secret you brokered between the living and the dead has surfaced","The Unlit tried to recruit you and now want you silenced","Your shadow-mask hides a favor that could damn you"]},"ln-frosttail":{"region":"moonlit-vale","homeland":"The cold high-Vale courts near the frost-line","environment":"The frost-touched heights of the Moonlit Vale","culture":"Frosttails are the cold-court kitsune of the Vale's high frost-line, reserved and precise, keepers of the sharpest bargains and the coolest heads. Their favors come with exacting terms, and their winter-court intrigues are famously merciless and clean.","tradition":"The Frost-Bargain, a favor sealed in ice-clear terms that neither party may misread.","appearance":"Frost-white fur, ice-marked masks, frost-silk finery, cold-eyed.","naming":"Given name plus a frost-court (Yuki-onna of the Pale Court).","occupations":["Precise negotiators","Cold-court intriguers","Contract-brokers"],"allies":["Moon elves","Frostscale dragonborn"],"rivals":["Rival brokers","Warm-court kitsune"],"landmark":"The frost-line courts of the high Vale","hooks":["A frost-bargain you sealed is being twisted against you","A rival warm-court is undermining your winter-court","Your exacting terms trapped the wrong person"]},"ln-suntail":{"region":"sunscorch","homeland":"The rare bright-day courts of the desert oases","environment":"The sunlit oasis-courts of the Sunscorch","culture":"Suntails are the rare sunlit kitsune who left the Vale's dusk for the desert's bright courts, storytellers and open-faced charmers who trade in reputation rather than shadow. Warmer than their Vale kin, they are the beloved tale-tellers and mediators of the sun-courts.","tradition":"The Open-Mask, a court-face worn in daylight that hides nothing, a rite of chosen honesty.","appearance":"Golden fur, bright open masks, sun-silk finery, story-tokens.","naming":"Given name plus a sun-court (Hana of the Golden Court).","occupations":["Storytellers and reputation-brokers","Court mediators","Sun-court entertainers"],"allies":["Sun elves","Sunfeather birdkin","Lionkin courts"],"rivals":["Shadow-court kitsune","Slanderers"],"landmark":"Sunspire, the shadowless needle","hooks":["A story you told has taken on a dangerous life of its own","A shadow-kitsune is spreading a lie under your open-mask","Your reputation is currency and someone is counterfeiting it"]},"ln-voidtail":{"region":"shadowlands","homeland":"The deepest shadow-enclaves of the Shadowlands","environment":"The lightless heart of the Shadowlands","culture":"Voidtails are the whispered kitsune line touched by the true dark, rare and unsettling, who trade in the void's secrets and the faiths the Unlit twist. Not necessarily evil, but always dangerous, they walk closest to the deepest shadow and pay a price for it.","tradition":"The Void-Mask, a rite few speak of, said to let the wearer hear the dark itself.","appearance":"Void-black fur, star-absent masks, shadow-silk, eyes like held dark.","naming":"A whispered name plus a void-mask (Kuro of the Hollow Mask).","occupations":["Void-secret brokers","Deep-shadow walkers","Unlit-watchers (or Unlit agents)"],"allies":["Shadowtails (warily)","Ghost owls"],"rivals":["The Radiant Choir","Those who fear the void"],"landmark":"The Grey Market where living and returned trade","hooks":["Your void-mask let you hear something the Unlit are planning","You are suspected of being an Unlit agent and must prove otherwise","The dark whispered a secret you cannot un-know"]},"ln-dawnwing":{"region":"celestial-heights","homeland":"The dawn-halls of Dawnhold","environment":"The luminous heights at the edge of first light","culture":"Dawnwings are the first-light seraphim, heralds of morning who greet the dawn at the Threshold and carry its light down to the world. Hopeful where the Choir is grim, they are the most outward-facing seraphim, and many become the healers and teachers the world actually meets.","tradition":"The Ascension-Rite, a young Dawnwing's first climb to the Threshold to greet the dawn.","appearance":"Gold-white wings, dawn-lit robes, first-light halos.","naming":"Given name plus a dawn-epithet (Auriel Firstlight).","occupations":["Heralds and messengers of the Choir","Healers and teachers among mortals","Threshold-greeters"],"allies":["Sun owls","Fallen Covenant (sympathetically)"],"rivals":["The Unlit","Choir hardliners"],"landmark":"The Threshold at the edge of the world","hooks":["The dawn you greet has begun coming late","The Choir forbids you to carry a warning the world needs","You feel the pull to become Fallen and live among mortals"]},"ln-starborn-s":{"region":"celestial-heights","homeland":"The Star Court of the Celestial Heights","environment":"The rarefied star-fields and constellation-halls","culture":"Starborn are the constellation-serving seraphim, born to a star-pattern and sworn to its watch, keepers of the oldest prophecies at the Star Court. Bound to the constellations that guide and, some say, doom them, they are the Choir's prophets and its most burdened members.","tradition":"The Constellation-Binding, when a young Starborn is bound to the star-pattern they will serve for life.","appearance":"Star-pale, constellation-marked wings, star-glass regalia.","naming":"Given name plus a constellation (Vaeleth of the Crown of Nine).","occupations":["Prophets and star-wardens","Court-scholars","Constellation-keepers"],"allies":["Star elves","Sun owls"],"rivals":["The Unlit","Those who would silence prophecy"],"landmark":"The Star Court where the constellations hold council","hooks":["Your bound constellation is going dark, star by star","A prophecy names you and the Choir wants it buried","The stars over the Threshold are failing and you foresaw it"]},"ln-radiant":{"region":"celestial-heights","homeland":"The radiant orthodoxy of the Choir's high halls","environment":"The blazing luminous heart of the Heights","culture":"Radiant are the orthodox seraphim, the star-fire wielders and Threshold-guardians who form the core of the Radiant Choir. Rigid, luminous, and increasingly afraid of a prophecy they cannot silence, they hold the line against the dark and against their own doubting kin.","tradition":"The Kindling of the Star-Fire, when a Radiant first calls the light that they will wield in the Threshold's defense.","appearance":"Blazing-white wings, radiant armor, star-fire halos.","naming":"Given name plus a choir-rank (Seraphiel of the High Choir).","occupations":["Threshold-guardians","Star-fire wardens","Choir-orthodox enforcers"],"allies":["Star-wardens","Sky Covenant"],"rivals":["The Unlit","Fallen Covenant","Doubters within"],"landmark":"The Threshold, edge of the world and beyond","hooks":["A prophecy of the sky breaking again is fracturing your Choir","You are ordered to silence a Fallen you believe is right","The star-fire you wield is dimming with the stars"]},"ln-highwing":{"region":"skyward-isles","homeland":"The drifting sky-realms of the Skyward Isles","environment":"Floating islands and the high cloud-seas","culture":"Highwings are the sky-isle seraphim who dwell among the drifting islands rather than the far Heights, wardens of the Sky Covenant charged with keeping the isles aloft. More worldly than their Heights-bound kin, they work alongside birdkin and harengon and know the isles are sinking.","tradition":"The Isle-Warding, a rite of tending the old sky-magic that holds a drifting island up.","appearance":"Broad cloud-grey wings, skystone regalia, updraft-charms.","naming":"Given name plus an isle (Caelor of Cloudspire).","occupations":["Sky-covenant wardens","Isle-keepers","Chain-bridge guardians"],"allies":["Birdkin aeries","Harengon sky-clans","Radiant Choir"],"rivals":["Aerie-clan separatists","The Unlit"],"landmark":"Cloudspire, the highest inhabited point","hooks":["An isle you ward has begun to fall and thousands live on it","The Covenant hides what holds the isles up and you mean to learn it","A chain-bridge was cut and you saw who did it"]},"ln-astral":{"region":"celestial-heights","homeland":"The Threshold-seers of the outer Heights","environment":"The half-real edge where the world meets the beyond","culture":"Astral seraphim dwell at the very Threshold, seers half in the world and half out of it, who gaze into the beyond and return changed. Rarest and strangest of their kin, they speak in prophecy and are trusted and feared for how much of the other side they carry.","tradition":"The Threshold-Gazing, a rite of looking into the beyond and returning able to say what was seen.","appearance":"Translucent star-flecked wings, void-touched eyes, astral regalia.","naming":"Given name plus an astral epithet (Ithuriel Farsight).","occupations":["Threshold-seers and prophets","Beyond-watchers","Astral scholars"],"allies":["Star elves","Starborn seraphim"],"rivals":["The Unlit","Those who fear the beyond"],"landmark":"The Threshold, edge of the world and beyond","hooks":["Your Threshold-gazing showed the sky breaking a second time","Something from the beyond followed your gaze back","The Choir needs, and fears, what you saw"]},"ln-stoneblood":{"region":"ironspine","homeland":"The stone-holds of the high Ironspine","environment":"Alpine peaks and mountain fortress-holds","culture":"Stonebloods are the mountain-hold goliaths, the core of the High Clans, who measure worth against the mountain and keep the fairest tallies of any people. Their word is stone, and a Stoneblood who claims a victory they did not earn is exiled in shame.","tradition":"The Crossing of Nine Bridges, the great coming-of-age pilgrimage above the cloud line.","appearance":"Stone-grey skin, granite-patterned marks, clan-wraps, bridge-tokens.","naming":"Given name plus a clan-and-peak (Korra of the Grey Crossing).","occupations":["Bridge-guides and high-wardens","Champions and trial-keepers","Stone-cutters"],"allies":["Mountain dwarves","Ironblood orcs","Eagle birdkin"],"rivals":["Vault-claim rivals","Cheaters of the trials"],"landmark":"The Nine Bridges above the cloud line","hooks":["You failed your Crossing and wander to earn your standing","A vault-claim dispute threatens your clan-moot","The Crossing has grown deadly and something hunts the young on the bridges"]},"ln-frostblood":{"region":"frostbound-north","homeland":"The glacier-holds of the Frostbound North","environment":"Arctic peaks, glacier-halls, and ice-fields","culture":"Frostbloods are the northern goliaths of the glacier-holds, who test themselves against the killing cold as their southern kin test themselves against the mountain. Stoic and enduring, they hold the north's high passes and keep the aurora-vigils alongside the human jarls.","tradition":"The Ice-Crossing, a northern trial of crossing a glacier-field alone in deep winter.","appearance":"Frost-white skin, ice-blue marks, heavy furs, glacier-tokens.","naming":"Given name plus a glacier (Thura of the White Glacier).","occupations":["Glacier-wardens and guides","North champions","Aurora-keepers' guards"],"allies":["Northlanders","Frost orcs","Polar bears"],"rivals":["Ice-reavers","The Winter Hunt"],"landmark":"Whitehall, carved inside a living glacier","hooks":["The Winter Hunt has crossed into your clan's passes","Your Ice-Crossing found something frozen that should stay frozen","The glacier-hold's ice is failing"]},"ln-stormblood":{"region":"stormreach","homeland":"The tempest-height holds of the Stormreach","environment":"Storm-lashed high ridges and lightning-struck peaks","culture":"Stormbloods are the tempest-height goliaths who court the Storm as a test, raising holds where the lightning strikes and crossing sky-bridges in the teeth of the gale. Kin to the Stormreach's dragonborn and genasi, they hold the storm-country's highest ground.","tradition":"The Storm-Crossing, a trial of crossing a sky-bridge during a living tempest.","appearance":"Storm-grey skin, lightning-scar marks, storm-glass tokens.","naming":"Given name plus a storm-peak (Volk of the Thunder Ridge).","occupations":["Storm-height wardens","Sky-bridge guides","Storm champions"],"allies":["Storm dragonborn","Storm genasi","Gale Riders"],"rivals":["Stormwardens (over the Storm's nature)","Rival clans"],"landmark":"The Standing Bolt above Thundergate","hooks":["A storm-crossing killed a young clanmate and the clan blames you","The Storm spoke during your crossing","Your ridge-hold's storm-bridge is failing"]},"ln-mountainborn":{"region":"ironspine","homeland":"The deep mining-holds of the Ironspine","environment":"Mountain mines, quarries, and stone-halls","culture":"Mountainborn are the miner-and-mason goliaths who work the stone rather than cross the bridges, quieter and more settled than the high clans. They quarry the great stone the forge-cities and bridge-builders need, and they hold that patient work honors the mountain as much as any trial.","tradition":"The First Quarry, a rite of cutting one's first great stone for a work meant to endure.","appearance":"Dust-grey skin, quarry-marked, mason's wraps, chisel-tokens.","naming":"Given name plus a quarry or work (Dorn of the Deep Quarry).","occupations":["Miners and quarry-masters","Masons and stone-cutters","Hold-builders"],"allies":["Mountain dwarves","Stoneborn dwarves"],"rivals":["Careless demolitionists","Vault-raiders"],"landmark":"The great quarries of the Ironspine","hooks":["Your quarry broke into something older than the mountain","A stone you cut was for a work now cursed","Vault-raiders are tunneling through your family's mine"]},"ln-titanborn":{"region":"elemental-marches","homeland":"The oldest giant-holds near the Elemental Marches","environment":"Ancient battlefields and titan-ruins of the frontier","culture":"Titanborn are the rare eldest goliath bloodline, said to descend from the giants of the First Age, who guard the titan-ruins and the elemental frontier. Legend says a Titanborn held a bridge until the mountain gave way, and their line rises when the world needs an immovable thing.","tradition":"The Titan-Vigil, a pilgrimage to an ancestral giant-ruin to hear the first giants' charge.","appearance":"Massive even for goliaths, ancient-marked skin, first-age relic-tokens.","naming":"Given name plus a titan-hold (Grommok of the Fallen Titan).","occupations":["Frontier guardians","Titan-ruin keepers","Elder champions"],"allies":["Marchwardens","Great bears","Wyrmblood dragonborn"],"rivals":["Rift-cults","Relic-thieves"],"landmark":"The titan-ruins of the elemental frontier","hooks":["Your line rises when the world needs holding, and the rifts are widening","A titan-ruin you guard has been breached","The first giants' charge in your Titan-Vigil named a coming doom"]},"ln-cavegoblin":{"region":"blackdeep","homeland":"The Deep-warrens of Lowvault","environment":"Lightless Deep tunnels and glowcap caverns","culture":"Cave Goblins are the Deep-dwelling goblins of the Blackdeep, tunnel-clever survivors who farm glowcap and keep the Sunless Market running. Communal and inventive, they share every find with the warren, and they watch the Deepest Door alongside the dwarves.","tradition":"The First Find, building something useful from pure scrap and giving it to the warren.","appearance":"Pale, large-eyed, glowcap-lit, patchwork tunnel-gear.","naming":"Given name plus a warren (Nix of the Ninth Warren).","occupations":["Tinkers and glowcap-farmers","Deep-scavengers","Sunless Market traders"],"allies":["Deep dwarves","Blackdeep drow (as neighbors)"],"rivals":["Tunnel-stalkers","Whatever knocks on the Deepest Door"],"landmark":"The Sunless Market, neutral ground of the Deep","hooks":["Something is coming up through the Deepest Door your warren watches","The Glowfall is going dark and your farms with it","A device you built has been stolen for a war"]},"ln-scrapborn":{"region":"ashen-wastes","homeland":"The salvage-yards of Glasswatch","environment":"Ruin-fields and scrap-forts of the Ashen Wastes","culture":"Scrapborn are the salvage-yard goblins of the wastes, engineers and demolitionists who make wonders from the wreckage of the burned empire. Bold and inventive, they guide expeditions into the Glass Capital and build the strangest, most useful devices in the world.","tradition":"The Scrap-Trial, a rite of building a working machine from a heap of ruin-salvage.","appearance":"Soot-marked, goggled, tool-belted, scrap-plate armor.","naming":"Given name plus a favorite build (Wexa Gearspit).","occupations":["Engineers and demolitionists","Ruin-guides and salvagers","Alchemists"],"allies":["Ashborn orcs","Cinder-guild"],"rivals":["Rival salvage-crews","Ash-wraiths"],"landmark":"The Glass Capital, fused to obsidian in a night","hooks":["A machine you built has fallen into the wrong hands","A vault in the Glass Capital never burned and you can reach it","A rival crew stole your map to the unburned ruin"]},"ln-nightgoblin":{"region":"shadowlands","homeland":"The shadow-warrens of the Shadowlands","environment":"Twilight border-tunnels and gloom-warrens","culture":"Night Goblins are the shadow-dwelling goblins of the border, smugglers and shadow-runners who move goods and secrets through the dusk. Wary and quick, they run the Grey Market's underside and know the safe ways through the failing light.","tradition":"The Gloom-Run, a rite of moving a cargo through the shadow-border and back unseen.","appearance":"Dusk-dark skin, night-eyes, muffled dark gear, smuggler's charms.","naming":"Given name plus a run (Skritch of the Grey Run).","occupations":["Smugglers and shadow-runners","Grey Market fixers","Border-scouts"],"allies":["Duskhares","Shadowtail kitsune"],"rivals":["The Unlit","Shadow-border patrols"],"landmark":"The Grey Market where living and returned trade","hooks":["A cargo you ran turned out to be Unlit contraband","The shadow-border is closing your safe routes","You smuggled a person who is worth more than you were told"]},"ln-redcap":{"region":"shadowlands","homeland":"The old blood-rite warrens of the border","environment":"Grim border-holds and old battle-grounds","culture":"Redcaps are the goblins of the old blood-rites, feared and misunderstood even among their own kind for the reputation the Blood Wars left them. In truth most Redcaps are grim border-guards bound by old, harsh traditions they did not choose, and the tale that they are all murderers is one goblins hate to tell.","tradition":"The Reddening, a fraught coming-of-age blood-rite most Redcaps spend their lives reckoning with.","appearance":"Blood-marked caps, grim, battle-scarred, old-rite tokens.","naming":"Given name plus a grim epithet (Grukt Redcap).","occupations":["Border-guards and enforcers","Old-rite keepers","Mercenaries no one else will hire"],"allies":["Bloodmoon orcs","Night goblins (uneasily)"],"rivals":["Those who fear the Redcap name","The Unlit"],"landmark":"The old battle-grounds of the border","hooks":["You left the warren rather than complete the Reddening","Someone commits crimes and blames your Redcap name","The old blood-rite binds you to a debt you would break"]},"ln-mossborn":{"region":"emerald-wilds","homeland":"The quiet forest-warrens of the Emerald Wilds","environment":"Mossy old-growth hollows and root-warrens","culture":"Mossborn are the gentle forest goblins of the Wilds, herbalists and root-warren keepers who live quietly among the trees and keep peace with the Greenwardens. Contrary to every goblin stereotype, they are healers and gardeners, and their moss-lore mends what the forest wounds.","tradition":"The Root-Tending, a rite of nursing a stretch of forest back to health to earn a warren's trust.","appearance":"Moss-green skin, leaf-and-bark gear, herb-pouches, root-charms.","naming":"Given name plus a hollow (Fennit of the Green Hollow).","occupations":["Herbalists and healers","Root-warren keepers","Forest-tenders"],"allies":["Wood elves","Meadowborn halflings","Mossborn's Greenwardens"],"rivals":["Blight-bringers","Reckless loggers"],"landmark":"The mossy hollows of the deep Wilds","hooks":["A blight is spreading through the forest you tend","Your moss-lore is the only cure for a spreading sickness","The Wilds have called in a debt your warren owes"]},"ln-boomborn":{"region":"ironspine","homeland":"The blast-mining outposts of the Ironspine and wastes","environment":"Mining tunnels and demolition-yards","culture":"Boomborn are the demolitionist goblins, reckless geniuses of blast-mining and alchemy who clear the tunnels and bring down the walls no one else can. Loud, singed, and grinning, they are prized and feared for their love of a controlled, or barely-controlled, explosion.","tradition":"The First Blast, a rite of setting a single perfect charge to prove one can be trusted with a bigger one.","appearance":"Singed, wild-eyed, blast-goggled, charge-belts and fuse-charms.","naming":"Given name plus a blast (Kabang of the Deep Cut).","occupations":["Blast-miners and demolitionists","Alchemists and firework-makers","Siege-engineers"],"allies":["Scrapborn engineers","Dwarven miners","Cinder-guild"],"rivals":["Nervous employers","Rival blast-crews"],"landmark":"The mining-deeps of the Ironspine","hooks":["Your last blast opened something that should have stayed sealed","A rival crew wants your secret charge-formula","You are the only one who can safely bring down a failing structure"]},"ln-flameborn":{"region":"elemental-marches","homeland":"The flame-forges of Emberford","environment":"Rivers of fire and the fire-realm's leaking edge","culture":"Flameborn are the fire-realm genasi of the Marches, pact-tenders who keep the flame in balance and work the living-fire forges. Passionate and disciplined at once, they tend fire-shrines and hold that their flame is a relationship to keep, not a weapon to spend.","tradition":"The First Kindling, when a young Flameborn's inner fire fully wakes, tended at a fire-shrine.","appearance":"Ember-skinned, flame-haired, heat-shimmer eyes, ember-cloth.","naming":"Given name plus a flame (Cinder of the Bright Forge).","occupations":["Flame-pact tenders","Living-fire smiths","Marchwardens of the fire-border"],"allies":["Emberborn dragonborn","Ashborn orcs"],"rivals":["Rift-cults","Those who would douse the pacts"],"landmark":"Emberford, at the fire-realm's edge","hooks":["Your inner fire kindled beyond your control","A fire-pact you tend is failing and the flame is spreading","An elemental-pact offered you power for a burning price"]},"ln-tideborn-g":{"region":"elemental-marches","homeland":"The water-halls of the Marches springs","environment":"Pools of living water where the water-realm leaks through","culture":"Tideborn genasi are the water-realm folk of the Marches, keepers of the living springs whose bodies flow like the water in their blood. Calm and adaptable, they tend water-shrines and mediate the frontier's disputes, for water shapes itself to any vessel.","tradition":"The Spring-Tending, the lifelong care of a living-water spring tied to one's pact.","appearance":"Water-blue skin, flowing forms, spring-marked, water-woven wraps.","naming":"Given name plus a spring (Nerin of the Clear Spring).","occupations":["Water-pact tenders","Frontier mediators","Healers"],"allies":["Tideborn dragonborn","Seaborn"],"rivals":["Rift-cults","Those who would drain the springs"],"landmark":"The living-water springs of the Marches","hooks":["Your spring is running strange and the pact fears the rift","A rift is flooding the frontier and your pact must hold it","You are asked to mediate a feud that wants no peace"]},"ln-stoneborn-g":{"region":"elemental-marches","homeland":"The floating-stone holds of Stonegate","environment":"Floating stone and the earth-realm's leaking edge","culture":"Stoneborn genasi are the earth-realm folk of the Marches, patient and immovable pact-tenders whose skin is living stone and whose holds float on earth-magic. Steadfast as the goliaths they befriend, they tend stone-shrines and hold the frontier's most stubborn ground.","tradition":"The Setting, a rite of anchoring a floating stone to found a hold meant to endure.","appearance":"Living-stone skin, gem-flecked, earth-marked, stone-wraps.","naming":"Given name plus a hold (Tern of the Floating Gate).","occupations":["Earth-pact tenders","Stone-holders and builders","Marchwardens"],"allies":["Stoneblood goliaths","Mountain dwarves"],"rivals":["Rift-cults","Rift-drakes"],"landmark":"Stonegate, the floating-stone hold","hooks":["The stone your hold floats on is failing","A rift has opened beneath your ground","An elemental-pact wants your hold's anchor-stone"]},"ln-windborn":{"region":"elemental-marches","homeland":"The high wind-holds where the air-realm leaks through","environment":"Standing winds and the air-realm's leaking edge","culture":"Windborn are the air-realm genasi of the Marches, free-spirited pact-tenders who ride the standing winds and tend the sky-shrines. Restless and quick, they are the scouts and messengers of the frontier, and their pact is with the wind that will not be held.","tradition":"The First Gust, when a young Windborn's wind-nature wakes and lifts them for the first time.","appearance":"Sky-pale skin, wind-tossed forms, air-marked, light flowing wraps.","naming":"Given name plus a wind (Zeph of the High Gust).","occupations":["Air-pact tenders","Frontier scouts and messengers","Sky-shrine keepers"],"allies":["Windborn seraphim","Harengon","Birdkin"],"rivals":["Rift-cults","Those who would cage the wind"],"landmark":"The standing winds of the Marches","hooks":["The wind you tend has begun to still, an ill omen","A rift is loosing wild winds across the frontier","You carry a message on the wind that must not be caught"]},"ln-stormborn-g":{"region":"stormreach","homeland":"The storm-shrines of the Stormreach frontier","environment":"Standing storms where the storm-realm meets the world","culture":"Stormborn genasi are the storm-realm folk born where the tempest and the elemental storm-realm meet, kin to the living Storm itself. Traced to the Stormfall, they tend storm-shrines and crackle with barely-held lightning, and the Stormwardens watch them as closely as they watch the Storm.","tradition":"The First Bolt, when a young Stormborn's storm-nature wakes in a strike of held lightning.","appearance":"Storm-violet skin, static-lit hair, lightning-marked, storm-glass wraps.","naming":"Given name plus a storm (Raiden of the Standing Rift).","occupations":["Storm-pact tenders","Weather-wardens","Storm champions"],"allies":["Storm dragonborn","Stormblood goliaths","Gale Riders"],"rivals":["Stormwardens (who fear them)","Rift-cults"],"landmark":"The Standing Rift, a permanent tear into the storm-realm","hooks":["The Standing Rift is widening and your pact must hold it","Your held lightning is slipping loose","The Storm claims you as its own and the Wardens want you tested"]},"ln-frostborn-g":{"region":"elemental-marches","homeland":"The frost-shrines of the cold Marches","environment":"The elemental cold where the frost-realm leaks through","culture":"Frostborn genasi are the frost-realm folk of the cold frontier, still and patient pact-tenders whose breath rimes the air and whose calm hides a killing chill. Traced to the drowning cold of the Stormfall, they tend frost-shrines and guard the frozen border of the Marches.","tradition":"The Stillness, a rite of holding one's inner frost in perfect check through a long cold night.","appearance":"Frost-cyan skin, ice-crystal hair, rime-marked, frost-woven wraps.","naming":"Given name plus a frost (Vael of the Silent Frost).","occupations":["Frost-pact tenders","Cold-border wardens","Preservers and healers"],"allies":["Frostscale dragonborn","Frost goliaths"],"rivals":["Rift-cults","Those who would thaw the sealed cold"],"landmark":"The frozen shrines of the Marches","hooks":["Your inner frost will not still and the cold is spreading","A frost-rift is freezing the frontier","Something the cold preserved is thawing near your shrine"]}}};
; (function(){
  var U=SM.ui, E=SM.engine, D=SM.data;
  function esc(s){ return U.esc(s==null?'':String(s)); }
  function sec(label,val){ if(val==null||val===''){return '';} return '<div class="eyebrow" style="margin-top:10px">'+label+'</div><p class="small">'+esc(val)+'</p>'; }
  function listSec(label,arr){ if(arr==null||arr.length===0){return '';} return '<div class="eyebrow" style="margin-top:10px">'+label+'</div><ul style="margin:6px 0;padding-left:18px">'+arr.map(function(x){return '<li class="small">'+esc(x)+'</li>';}).join('')+'</ul>'; }
  SM.lore={
    data:function(){ return D.LORE||{}; },
    region:function(id){ var rs=(this.data().regions||[]); for(var i=0;i<rs.length;i++){ if(rs[i].id===id){return rs[i];} } return null; },
    setng:function(id){ var ss=(this.data().settlements||[]); for(var i=0;i<ss.length;i++){ if(ss[i].id===id){return ss[i];} } return null; },
    faction:function(id){ var fs=(this.data().factions||[]); for(var i=0;i<fs.length;i++){ if(fs[i].id===id){return fs[i];} } return null; },
    kinBlock:function(id){ var k=(this.data().kin||{})[id]; if(k==null){return '';}
      var h='<div class="eyebrow" style="margin-top:14px;color:var(--gold)">World Lore</div>';
      h+=sec('Origin',k.origin)+sec('Homeland',k.homeland)+sec('Culture',k.culture)+sec('Society',k.society)+sec('Government',k.government)+sec('Beliefs',k.beliefs);
      h+=listSec('Traditions',k.traditions);
      h+=sec('Language',k.language)+sec('Architecture',k.architecture)+sec('Clothing',k.clothing)+sec('Food',k.food)+sec('Military Traditions',k.military);
      h+=listSec('Common Occupations',k.occupations);
      if(k.regions&&k.regions.length){ var names=k.regions.map(function(rid){ var r=SM.lore.region(rid); return r?r.name:rid; }); h+=listSec('Homelands and Regions',names); }
      if(k.relations){ var rel=Object.keys(k.relations).map(function(kk){ var o=E.kin(kk); return (o?o.name:kk)+': '+k.relations[kk]; }); h+=listSec('Relations',rel); }
      h+=listSec('History',k.history)+listSec('Legends',k.legends)+listSec('What Outsiders Say',k.stereotypes);
      h+=sec('Greeting',k.greeting)+sec('Oath',k.oath)+sec('Symbol',k.symbol);
      if(k.colors){ h+=listSec('Colors',k.colors); }
      h+=listSec('Roleplaying Hooks',k.rpHooks)+listSec('Adventure Hooks',k.advHooks);
      return h;
    },
    lineageBlock:function(id){ var l=(this.data().lineage||{})[id]; if(l==null){return '';}
      var r=this.region(l.region);
      var h='<div class="eyebrow" style="margin-top:14px;color:var(--gold)">World Lore</div>';
      if(r){ h+='<div class="eyebrow" style="margin-top:10px">Region</div><p class="small"><b>'+esc(r.name)+'</b> - '+esc(r.climate)+'</p>'; }
      h+=sec('Homeland',l.homeland)+sec('Environment',l.environment)+sec('Culture',l.culture)+sec('Signature Tradition',l.tradition)+sec('Appearance',l.appearance)+sec('Naming',l.naming);
      h+=listSec('Common Occupations',l.occupations)+listSec('Allies',l.allies)+listSec('Rivals',l.rivals);
      h+=sec('Landmark',l.landmark)+sec('History',l.history);
      h+=listSec('Famous Figures',l.famousFigures);
      h+=listSec('Story Hooks',l.hooks);
      if(r){ h+=listSec('Regional Adventures - '+esc(r.name),(r.hooks||[]).slice(0,2)); }
      return h;
    },
    block:function(kind,id){ if(kind==='kin'){return this.kinBlock(id);} if(kind==='lineage'){return this.lineageBlock(id);} return ''; },
    regionDetail:function(id){ var r=this.region(id); if(r==null){return;}
      var kinNames=(r.commonKin||[]).map(function(kk){ var o=E.kin(kk); return o?o.name:kk; });
      var facNames=(r.factions||[]).map(function(fid){ var f=SM.lore.faction(fid); return f?f.name:fid; });
      var body='<div class="stack"><div class="tag">'+esc(r.climate)+'</div><p class="small">'+esc(r.description)+'</p>'
        +listSec('Major Settlements',r.settlements)+listSec('Major Factions',facNames)+listSec('Common Kin',kinNames)
        +listSec('Dangerous Creatures',r.creatures)+listSec('Resources',r.resources)+listSec('Major Conflicts',r.conflicts)
        +listSec('Important Landmarks',r.landmarks)+listSec('Adventure Hooks',r.hooks)+'</div>';
      U.modal(esc(r.name),body);
    },
    factionDetail:function(id){ var f=this.faction(id); if(f==null){return;} var reg=this.region(f.region);
      var body='<div class="stack"><div class="tag">'+esc(f.type)+' - '+esc(f.align)+'</div><p class="small">'+esc(f.desc)+'</p>'
        +(reg?sec('Region',reg.name):'')+listSec('Goals',f.goals)
        +listSec('Allies',(f.allies||[]).map(function(x){var a=SM.lore.faction(x);return a?a.name:x;}))
        +listSec('Rivals',(f.rivals||[]).map(function(x){var a=SM.lore.faction(x);return a?a.name:x;}))+'</div>';
      U.modal(esc(f.name),body);
    },
    settlementDetail:function(id){ var s2=this.setng(id); if(s2==null){return;} var reg=this.region(s2.region);
      var pk=E.kin(s2.primaryKin);
      var body='<div class="stack"><div class="tag">'+esc(s2.populationType)+'</div>'
        +(reg?sec('Region',reg.name):'')+(pk?sec('Primary Kin',pk.name):'')+sec('Government',s2.government)+sec('Major Landmark',s2.landmark)+sec('Local Conflict',s2.conflict)
        +listSec('Services',s2.services)+listSec('Local Rumors',s2.rumors)+listSec('Adventure Hooks',s2.hooks)+'</div>';
      U.modal(esc(s2.name),body);
    }
  };
  var NAVREF=(U&&U.NAV)?U.NAV:null;
  if(NAVREF){ NAVREF.world={t:'World Codex',i:'\ud83c\udf0d'}; }
  SM.world={ tab:'regions', setTab:function(t){ this.tab=t; SM.ui.go('world'); } };
  SM.screens.world=function(){ var L=SM.lore.data(); var tab=SM.world.tab;
    var tabs=[['regions','Regions'],['history','History'],['factions','Factions'],['settlements','Settlements']].map(function(t){ return '<button class="chip '+(tab===t[0]?'on':'')+'" onclick="SM.world.setTab(\''+t[0]+'\')">'+t[1]+'</button>'; }).join(' ');
    var body='';
    if(tab==='regions'){ body='<div class="list">'+(L.regions||[]).map(function(r){ return '<div class="li" onclick="SM.lore.regionDetail(\''+r.id+'\')"><div class="ava">\ud83d\uddfa\ufe0f</div><div class="meta"><div class="t">'+U.esc(r.name)+'</div><div class="s">'+U.esc(r.climate)+'</div></div></div>'; }).join('')+'</div>'; }
    else if(tab==='history'){ body='<div class="list">'+(L.history||[]).map(function(a){ return '<div class="panel" style="margin-top:8px"><div class="eyebrow">'+U.esc(a.age)+' <span class="tag">'+U.esc(a.span)+'</span></div><p class="small">'+U.esc(a.summary)+'</p><ul style="margin:6px 0;padding-left:18px">'+(a.events||[]).map(function(e){return '<li class="small">'+U.esc(e)+'</li>';}).join('')+'</ul></div>'; }).join('')+'</div>'; }
    else if(tab==='factions'){ body='<div class="list">'+(L.factions||[]).map(function(f){ return '<div class="li" onclick="SM.lore.factionDetail(\''+f.id+'\')"><div class="ava">\u2694\ufe0f</div><div class="meta"><div class="t">'+U.esc(f.name)+'</div><div class="s">'+U.esc(f.type)+' - '+U.esc(f.align)+'</div></div></div>'; }).join('')+'</div>'; }
    else { body='<div class="list">'+(L.settlements||[]).map(function(s2){ return '<div class="li" onclick="SM.lore.settlementDetail(\''+s2.id+'\')"><div class="ava">\ud83c\udff0</div><div class="meta"><div class="t">'+U.esc(s2.name)+'</div><div class="s">'+U.esc(s2.populationType)+'</div></div></div>'; }).join('')+'</div>'; }
    var meta=L.meta||{};
    return '<div class="panel"><div class="eyebrow">'+U.esc(meta.world||'The World')+'</div><p class="small muted">'+U.esc(meta.premise||'')+'</p></div>'
      +'<div class="pill-row" style="margin-top:10px">'+tabs+'</div>'
      +'<div style="margin-top:10px">'+body+'</div>';
  };
})();

</script>
