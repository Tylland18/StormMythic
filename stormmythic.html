/* ===================== SCREEN: COMBAT ===================== */
SM.screens.combat=()=>{ const E=SM.engine,U=SM.ui; const c=SM.state.combat;
  if(!c.active&&!c.combatants.length){
    return `<div class="panel"><div class="eyebrow">Combat Tracker</div><p class="small muted" style="margin-top:6px">Build an encounter, then start turn-based combat.</p>
      <div class="row" style="margin-top:10px"><button class="btn primary" onclick="SM.cbt.addParty()">+ Add Active Hero</button><button class="btn" onclick="SM.cbt.addEnemyPicker()">+ Add Enemy</button></div></div>
      ${U.need('No combatants yet. Add heroes and enemies to begin.')}`;
  }
  const cur=E.combat.current();
  const rows=c.combatants.map((cb,idx)=>{ const active=c.active&&idx===c.turn; const hpPct=Math.max(0,Math.round(cb.hp/cb.maxHp*100));
    return `<div class="card" style="cursor:default;border-color:${active?'var(--storm)':'var(--line2)'};${cb.defeated?'opacity:.55':''}">
      <div class="row between"><div><b>${cb.side==='party'?'🛡️ ':'👹 '}${U.esc(cb.name)}</b> ${active?'<span class="tag" style="color:var(--storm-glow)">TURN</span>':''} ${cb.defeated?'<span class="tag" style="color:var(--crimson)">DEFEATED</span>':''}</div>
        <span class="tag">Init ${cb.init!=null?cb.init:'—'}</span></div>
      <div class="row between small" style="margin-top:6px"><span>HP ${cb.hp}/${cb.maxHp}${cb.tempHp?' (+'+cb.tempHp+')':''}</span><span>DEF ${cb.defense}</span></div>
      <div class="bar hp"><i style="width:${hpPct}%"></i></div>
      ${cb.conditions&&cb.conditions.length?`<div class="pill-row" style="margin-top:6px">${cb.conditions.map(cn=>{const d=E.condition(cn.id);return `<span class="chip">${d?d.icon+' '+d.name:cn.id}${cn.dur!=null?' ('+cn.dur+')':''}</span>`;}).join('')}</div>`:''}
      <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="btn sm primary" onclick="SM.cbt.attack('${cb.id}')">Attack</button>
        <button class="btn sm" onclick="SM.cbt.dmg('${cb.id}')">Damage</button>
        <button class="btn sm" onclick="SM.cbt.heal('${cb.id}')">Heal</button>
        <button class="btn sm" onclick="SM.cbt.cond('${cb.id}')">Condition</button>
        <button class="btn sm danger" onclick="SM.cbt.remove('${cb.id}')">✕</button>
      </div></div>`;}).join('');
  return `<div class="panel"><div class="row between">
      <div><div class="eyebrow">${c.active?'Round '+c.round:'Encounter'}</div><b>${c.active&&cur?cur.name+"'s turn":c.combatants.length+' combatants'}</b></div>
      <div class="row" style="gap:6px">${c.active?`<button class="btn primary sm" onclick="SM.cbt.next()">Next Turn →</button>`:`<button class="btn primary sm" onclick="SM.cbt.start()">▶ Start</button>`}
        <button class="btn sm danger" onclick="SM.cbt.reset()">Reset</button></div></div>
    <div class="row" style="margin-top:10px;gap:6px"><button class="btn sm" onclick="SM.cbt.addParty()">+ Hero</button><button class="btn sm" onclick="SM.cbt.addEnemyPicker()">+ Enemy</button>${c.active?`<button class="btn sm" onclick="SM.cbt.end()">End Combat</button>`:''}</div>
  </div>
  <div class="grid cols2" style="margin-top:14px">${rows}</div>
  <div class="section-head" style="margin-top:16px"><h3>Combat Log</h3></div>
  <div class="log">${c.log.map(l=>`<div class="le ${l.cls}">${U.esc(l.msg)}</div>`).join('')||'<p class="muted small">No events yet.</p>'}</div>`;
};
SM.cbt={
  addParty:()=>{ const c=SM.act.get(); if(!c){SM.ui.toast('No active hero. Select one first.','bad');return;} SM.engine.combat.addFromChar(c); SM.ui.toast(c.name+' joins the fight.','ok'); SM.ui.render(); },
  addEnemyPicker:()=>{ SM.ui.modal('Add Enemy','<div class="list">'+SM.data.ENEMIES.map(e=>`<div class="li" onclick="SM.cbt.addEnemyFromLib('${e.id}')"><div class="ava">👹</div><div class="meta"><div class="t">${e.name} <span class="tag">${e.tier}</span></div><div class="s">HP ${e.hp} · CR ${e.cr}</div></div></div>`).join('')+'</div>'); },
  addEnemyFromLib:id=>{ const e=SM.engine.enemy(id); if(!e)return; const count=SM.state.combat.combatants.filter(x=>x.enemyId===id).length; SM.engine.combat.addEnemy(e,count?e.name+' '+(count+1):e.name); SM.ui.closeModal(); SM.ui.toast(e.name+' added.','info'); if(SM.state.screen!=='combat')SM.ui.go('combat'); else SM.ui.render(); },
  start:()=>{ SM.engine.combat.start(); SM.ui.render(); },
  next:()=>{ SM.engine.combat.next(); SM.ui.render(); },
  end:()=>{ SM.engine.combat.end(); SM.ui.render(); },
  reset:()=>{ if(confirm('Clear the encounter?')){ SM.engine.combat.reset(); SM.ui.render(); } },
  remove:id=>{ SM.engine.combat.remove(id); SM.ui.render(); },
  attack:id=>{ const c=SM.state.combat; const foes=c.combatants.filter(x=>x.id!==id&&!x.defeated);
    if(!foes.length){SM.ui.toast('No valid targets.','bad');return;}
    SM.ui.modal('Attack Target','<div class="list">'+foes.map(t=>`<div class="li" onclick="SM.cbt.doAttack('${id}','${t.id}')"><div class="ava">${t.side==='party'?'🛡️':'👹'}</div><div class="meta"><div class="t">${SM.ui.esc(t.name)}</div><div class="s">HP ${t.hp}/${t.maxHp} · DEF ${t.defense}</div></div></div>`).join('')+'</div>'); },
  doAttack:(aid,tid)=>{ const r=SM.engine.combat.attack(aid,tid); SM.ui.closeModal(); SM.ui.render(); },
  dmg:id=>{ const n=parseInt(prompt('Damage amount:','5'),10); if(n){SM.engine.combat.damage(id,n);SM.ui.render();} },
  heal:id=>{ const n=parseInt(prompt('Healing amount:','5'),10); if(n){SM.engine.combat.heal(id,n);SM.ui.render();} },
  cond:id=>{ SM.ui.modal('Apply Condition','<div class="pill-row">'+SM.data.CONDITIONS.map(cn=>`<button class="chip" onclick="SM.cbt.doCond('${id}','${cn.id}')">${cn.icon} ${cn.name}</button>`).join('')+'</div>'); },
  doCond:(id,cid)=>{ SM.engine.combat.addCondition(id,cid,3); SM.ui.closeModal(); SM.ui.render(); }
};

/* ===================== SCREEN: TOWN ===================== */
SM.screens.town=()=>{ const U=SM.ui;
  return `<div class="panel"><div class="eyebrow">Haventide</div><p class="small muted" style="margin-top:6px">A storm-battered port city — the adventuring hub of the Stormlands. Visit its locations to shop, rest, and find work.</p></div>
    <div class="grid cols2" style="margin-top:14px">${SM.data.TOWN_SERVICES.map(s=>`<div class="card" onclick="SM.town.open('${s.id}')"><div class="row"><div class="ava">${s.icon}</div><div class="meta"><div class="t">${s.name}</div><div class="s">${U.esc(s.desc)}</div></div></div></div>`).join('')}</div>`;
};
SM.town={
  open:id=>{ const s=SM.data.TOWN_SERVICES.find(x=>x.id===id); const U=SM.ui,E=SM.engine; const c=SM.act.get();
    if(s.sells){ const rows=s.sells.map(iid=>{const it=E.item(iid);return `<div class="li"><div class="ava">${it.dmg?'🗡️':it.pdef!=null?'🛡️':'📦'}</div><div class="meta"><div class="t">${it.name} ${U.rar(it.rarity)}</div><div class="s">${it.cost||'—'}</div></div><button class="btn sm primary" onclick="SM.town.buy('${iid}')">Buy</button></div>`;}).join('');
      U.modal(s.icon+' '+s.name,`<p class="small muted">${U.esc(s.desc)}</p>${c?`<div class="chip">Gold: ${c.currency.Gold||0}</div>`:'<p class="small bad">No active hero to buy for.</p>'}<div class="list" style="margin-top:10px">${rows}</div>`); return; }
    switch(s.action){
      case 'rest': if(c){SM.sheet.rest();U.toast('You rest at the inn. Fully recovered.','ok');} else U.toast('No active hero.','bad'); break;
      case 'heal': if(c){c.hpCur=E.maxHP(c);c.conditions=[];SM.act.save(c);U.toast('The temple restores you.','ok');SM.ui.render();} else U.toast('No active hero.','bad'); break;
      case 'quests': U.closeModal(); SM.ui.go('quests'); break;
      case 'forge': U.closeModal(); SM.ui.go('forge'); break;
      case 'craft': U.modal(s.icon+' '+s.name,`<p class="small muted">${U.esc(s.desc)}</p><p class="small">Crafting recipes: combine materials to forge gear.</p><div class="list"><div class="li"><div class="ava">⚒️</div><div class="meta"><div class="t">Stormsteel Blade</div><div class="s">2 Stormsteel Ingot → a storm weapon</div></div><button class="btn sm" onclick="SM.town.craft()">Craft</button></div></div>`); break;
      case 'rumors': U.modal('🍺 Tavern',`<p class="small muted">You overhear rumors...</p><div class="list">${SM.data.NPCS.map(n=>`<div class="li" onclick="SM.lib.detail('npc','${n.id}')"><div class="ava">🧑</div><div class="meta"><div class="t">${n.name}</div><div class="s">${U.esc(n.dialogue)}</div></div></div>`).join('')}</div>`); break;
      case 'travel': U.modal('🐎 Stable',`<p class="small muted">Travel between regions of the Stormlands.</p><div class="list">${SM.data.LOCATIONS.filter(l=>l.type!=='World').map(l=>`<div class="li"><div class="ava">📍</div><div class="meta"><div class="t">${l.name}</div><div class="s">${l.type} · ${U.esc(l.desc)}</div></div></div>`).join('')}</div>`); break;
      case 'bank': U.modal('🏦 Bank',`<p class="small muted">Your vault is secure. (Storage foundation ready for future expansion.)</p>${c?`<div class="chip">Gold: ${c.currency.Gold||0}</div>`:''}`); break;
      default: U.modal(s.icon+' '+s.name,`<p class="small muted">${U.esc(s.desc)}</p>`);
    } },
  buy:iid=>{ const c=SM.act.get(); const it=SM.engine.item(iid); if(!c){SM.ui.toast('No active hero.','bad');return;}
    const price=parseInt((it.cost||'0').replace(/[^0-9]/g,''),10)||10; if((c.currency.Gold||0)<price){SM.ui.toast('Not enough gold.','bad');return;}
    c.currency.Gold-=price; SM.inv.add(iid); SM.ui.toast('Bought '+it.name+' for '+price+' gold.','ok'); },
  craft:()=>{ const c=SM.act.get(); if(!c){SM.ui.toast('No active hero.','bad');return;} const ings=c.inventory.filter(i=>i.itemId==='i-material-stormsteel');
    if(ings.length<2){SM.ui.toast('Need 2 Stormsteel Ingots.','bad');return;}
    let removed=0; c.inventory=c.inventory.filter(i=>{ if(i.itemId==='i-material-stormsteel'&&removed<2){removed++;return false;} return true; });
    SM.inv.add('w-stormcannon'); SM.ui.toast('Crafted a storm weapon!','ok'); }
};

/* ===================== SCREEN: QUESTS ===================== */
SM.screens.quests=()=>{ const U=SM.ui; const c=SM.act.get(); const accepted=(c&&c.quests)||[];
  const byType=t=>SM.data.QUESTS.filter(q=>q.type===t);
  const sec=(title,arr)=>arr.length?`<div class="section-head" style="margin-top:16px"><h3>${title}</h3></div><div class="list">${arr.map(q=>`<div class="li" onclick="SM.quests.open('${q.id}')"><div class="ava">${q.type==='Main'?'⭐':'📌'}</div><div class="meta"><div class="t">${q.name} ${accepted.includes(q.id)?'<span class="tag" style="color:var(--emerald)">accepted</span>':''}</div><div class="s">${q.giver} · ${U.esc(q.desc)}</div></div></div>`).join('')}</div>`:'';
  return `<div class="panel"><div class="eyebrow">Quest Log</div><p class="small muted" style="margin-top:6px">${accepted.length} active · ${SM.data.QUESTS.length} available in the Stormlands.</p></div>
    ${sec('Main Quests',byType('Main'))}${sec('Side Quests',byType('Side'))}`;
};
SM.quests={
  open:id=>{ const q=SM.data.QUESTS.find(x=>x.id===id); const U=SM.ui; const c=SM.act.get(); const has=c&&(c.quests||[]).includes(id);
    U.modal(U.esc(q.name),`<div class="pill-row"><span class="tag">${q.type}</span><span class="tag">${q.giver}</span><span class="tag">${q.faction}</span></div>
      <p class="small" style="margin-top:8px">${U.esc(q.desc)}</p>
      <div class="eyebrow" style="margin-top:12px">Objectives</div><ul style="padding-left:18px">${q.objectives.map(o=>`<li class="small">${U.esc(o)}</li>`).join('')}</ul>
      <div class="eyebrow" style="margin-top:12px">Rewards</div><ul style="padding-left:18px">${q.rewards.map(r=>`<li class="small">${U.esc(r)}</li>`).join('')}</ul>
      ${c?(has?`<button class="btn block" style="margin-top:12px" onclick="SM.quests.complete('${id}')">Complete Quest</button>`:`<button class="btn primary block" style="margin-top:12px" onclick="SM.quests.accept('${id}')">Accept Quest</button>`):'<p class="small bad" style="margin-top:10px">Select a hero to accept quests.</p>'}`); },
  accept:id=>{ const c=SM.act.get(); c.quests=c.quests||[]; if(!c.quests.includes(id))c.quests.push(id); SM.act.save(c); SM.ui.closeModal(); SM.ui.toast('Quest accepted.','ok'); SM.ui.render(); },
  complete:id=>{ const c=SM.act.get(); const q=SM.data.QUESTS.find(x=>x.id===id); c.quests=(c.quests||[]).filter(x=>x!==id);
    const xp=parseInt((q.rewards.find(r=>/XP/.test(r))||'0').replace(/[^0-9]/g,''),10)||0; c.xp=(c.xp||0)+xp; SM.act.save(c); SM.ui.closeModal(); SM.ui.toast('Quest complete! +'+xp+' XP','ok'); SM.ui.render(); }
};

/* ===================== SCREEN: CAMPAIGNS ===================== */
SM.screens.campaigns=()=>{ const U=SM.ui,E=SM.engine; const camps=E.store.camps();
  return `<div class="section-head"><h3>Campaigns</h3><button class="btn primary sm" onclick="SM.camp.create()">✚ New</button></div>
    ${camps.length?`<div class="list">`+camps.map(c=>`<div class="li" onclick="SM.camp.open('${c.id}')"><div class="ava">🏰</div><div class="meta"><div class="t">${U.esc(c.name)}</div><div class="s">GM: ${U.esc(c.gm||'—')} · ${(c.chars||[]).length} heroes · ${(c.notes||[]).length||0} notes</div></div></div>`).join('')+`</div>`:U.need('No campaigns yet. Create one to organize your adventures.')}
    <div class="panel" style="margin-top:16px"><div class="eyebrow">Multiplayer</div><p class="small muted" style="margin-top:6px">Campaigns run locally today. The data model (campaigns, parties, shared characters, combat state) is structured so a future online backend can synchronize real multiplayer sessions, party chat, and a shared GM. Local play is not presented as online play.</p></div>`;
};
SM.camp={
  create:()=>{ SM.ui.modal('New Campaign',`<label class="fld"><span>Campaign Name</span><input type="text" id="cName"></label>
    <label class="fld"><span>Game Master</span><input type="text" id="cGM" value="${SM.ui.esc((SM.act.get()||{}).player||'')}"></label>
    <label class="fld"><span>Description</span><textarea id="cDesc"></textarea></label>
    <button class="btn primary block" onclick="SM.camp.save()">Create Campaign</button>`); },
  save:()=>{ const name=document.getElementById('cName').value.trim(); if(!name){SM.ui.toast('Name required.','bad');return;}
    SM.engine.store.upsertCamp({id:'camp-'+Date.now().toString(36),name,gm:document.getElementById('cGM').value,desc:document.getElementById('cDesc').value,chars:[],notes:[],created:Date.now()});
    SM.ui.closeModal(); SM.ui.toast('Campaign created.','ok'); SM.ui.render(); },
  open:id=>{ const c=SM.engine.store.camps().find(x=>x.id===id); const U=SM.ui; const active=SM.act.get();
    const heroes=(c.chars||[]).map(cid=>{const ch=SM.engine.store.getChar(cid);return ch?`<div class="li"><div class="ava">${(SM.engine.kin(ch.kinId)||{}).icon||'🧝'}</div><div class="meta"><div class="t">${U.esc(ch.name)}</div><div class="s">Lvl ${SM.engine.totalLevel(ch)}</div></div></div>`:'';}).join('')||'<p class="small muted">No heroes added.</p>';
    U.modal(U.esc(c.name),`<p class="small muted">${U.esc(c.desc||'')}</p><div class="kv"><span class="k">GM</span><span class="v">${U.esc(c.gm||'—')}</span></div>
      <div class="eyebrow" style="margin-top:12px">Party</div><div class="list">${heroes}</div>
      ${active?`<button class="btn block" style="margin-top:8px" onclick="SM.camp.addChar('${id}')">Add Active Hero to Party</button>`:''}
      <label class="fld" style="margin-top:12px"><span>Add Note</span><textarea id="campNote"></textarea></label>
      <button class="btn primary block" onclick="SM.camp.addNote('${id}')">Save Note</button>
      <div class="eyebrow" style="margin-top:12px">Notes</div><div class="log">${(c.notes||[]).map(n=>`<div class="le">${U.esc(n)}</div>`).join('')||'<p class="small muted">No notes.</p>'}</div>
      <button class="btn danger block" style="margin-top:12px" onclick="SM.camp.del('${id}')">Delete Campaign</button>`); },
  addChar:id=>{ const c=SM.engine.store.camps().find(x=>x.id===id); const a=SM.act.get(); c.chars=c.chars||[]; if(!c.chars.includes(a.id))c.chars.push(a.id); SM.engine.store.upsertCamp(c); SM.camp.open(id); SM.ui.toast('Hero added to party.','ok'); },
  addNote:id=>{ const c=SM.engine.store.camps().find(x=>x.id===id); const v=document.getElementById('campNote').value.trim(); if(!v)return; c.notes=c.notes||[]; c.notes.unshift(new Date().toLocaleDateString()+': '+v); SM.engine.store.upsertCamp(c); SM.camp.open(id); },
  del:id=>{ if(confirm('Delete campaign?')){ SM.engine.store.deleteCamp(id); SM.ui.closeModal(); SM.ui.render(); } }
};

/* ===================== SCREEN: GM TOOLS ===================== */
SM.screens.gm=()=>{ const U=SM.ui;
  const tools=[['combat','⚔️','Combat Tracker','Run initiative & turns'],['gmEnc','🐉','Encounter Builder','Assemble & launch fights'],
    ['gmEnemy','👹','Create Enemy','Custom monsters'],['gmItem','🗡️','Create Item','Custom gear'],['gmNPC','🧑','Create NPC','Custom characters'],
    ['gmQuest','📌','Create Quest','Custom objectives'],['campaigns','🏰','Campaigns','Manage adventures'],['gmLoot','💰','Loot Tables','Roll drops']];
  return `<div class="panel"><div class="eyebrow">Game Master Dashboard</div><p class="small muted" style="margin-top:6px">Tools to build and run StormMythic. Custom content is saved locally and merged into every library.</p></div>
    <div class="grid cols2" style="margin-top:14px">${tools.map(([a,ic,t,d])=>`<div class="card" onclick="SM.gm.tool('${a}')"><div class="row"><div class="ava">${ic}</div><div class="meta"><div class="t">${t}</div><div class="s">${d}</div></div></div></div>`).join('')}</div>`;
};
SM.gm={
  tool:a=>{ if(a==='combat'){SM.ui.go('combat');return;} if(a==='campaigns'){SM.ui.go('campaigns');return;}
    if(a==='gmEnc'){ this===this; SM.ui.modal('Encounter Builder','<p class="small muted">Add enemies to the combat tracker, then start combat.</p><div class="list">'+SM.data.ENEMIES.map(e=>`<div class="li" onclick="SM.cbt.addEnemyFromLib('${e.id}')"><div class="ava">👹</div><div class="meta"><div class="t">${e.name} <span class="tag">${e.tier}</span></div><div class="s">HP ${e.hp} · CR ${e.cr}</div></div></div>`).join('')+'</div><button class="btn primary block" style="margin-top:10px" onclick="SM.ui.closeModal();SM.ui.go(\'combat\')">Go to Combat</button>'); return; }
    if(a==='gmLoot'){ SM.ui.modal('Loot Tables','<div class="list">'+SM.data.LOOT.map(l=>`<div class="li" onclick="SM.gm.rollLoot('${l.id}')"><div class="ava">💰</div><div class="meta"><div class="t">${l.name} <span class="tag">${l.tier}</span></div><div class="s">Rolls: ${l.rolls}</div></div><button class="btn sm primary" onclick="event.stopPropagation();SM.gm.rollLoot('${l.id}')">Roll</button></div>`).join('')+'</div><div id="lootOut" style="margin-top:12px"></div>'); return; }
    if(a==='gmEnemy'){ SM.gm.formEnemy(); return; }
    if(a==='gmItem'){ SM.gm.formItem(); return; }
    if(a==='gmNPC'){ SM.gm.formNPC(); return; }
    if(a==='gmQuest'){ SM.gm.formQuest(); return; }
  },
  rollLoot:id=>{ const E=SM.engine; const lt=SM.data.LOOT.find(x=>x.id===id); const n=E.roll(lt.rolls).total; const out=[];
    for(let i=0;i<n;i++){ const total=lt.entries.reduce((a,e)=>a+e.w,0); let r=Math.random()*total; let pick=lt.entries[0];
      for(const e of lt.entries){ r-=e.w; if(r<=0){pick=e;break;} }
      if(pick.item){ const it=E.item(pick.item); out.push(it?it.name:pick.item); } else if(pick.coin){ out.push(E.roll(pick.coin).total+' '+pick.coin.replace(/[0-9d+]/g,'').trim()); } }
    document.getElementById('lootOut').innerHTML='<div class="panel"><div class="eyebrow">Dropped ('+n+')</div><ul style="padding-left:18px">'+out.map(x=>`<li class="small">${SM.ui.esc(x)}</li>`).join('')+'</ul></div>'; },
  formEnemy:()=>{ SM.ui.modal('Create Enemy',`<div class="grid cols2">
    <label class="fld"><span>Name</span><input id="geName" type="text"></label>
    <label class="fld"><span>Category</span><input id="geCat" type="text" value="Monstrosity"></label>
    <label class="fld"><span>Role</span><input id="geRole" type="text" value="Striker"></label>
    <label class="fld"><span>Tier</span><select id="geTier"><option>common</option><option>elite</option><option>boss</option><option>mythic</option></select></label>
    <label class="fld"><span>HP</span><input id="geHP" type="number" value="30"></label>
    <label class="fld"><span>Phys Def bonus</span><input id="gePdef" type="number" value="4"></label>
    <label class="fld"><span>CR</span><input id="geCR" type="text" value="2"></label>

    <label class="fld"><span>Lore</span><textarea id="geLore"></textarea></label>
    <button class="btn primary block" onclick="SM.gm.saveEnemy()">Save Enemy</button>`); },

    const e={id:'ce-'+Date.now().toString(36),name:g('geName')||'Custom Enemy',cat:g('geCat'),role:g('geRole'),tier:g('geTier'),hp:+g('geHP')||20,pdef:+g('gePdef')||3,mdef:2,speed:30,cr:g('geCR'),attrs:{MIG:12,VIG:12,PRE:10,SPI:10,AGI:12,INS:10,INT:8},attacks:[g('geAtk')],abilities:[],loot:[],lore:g('geLore')||'A custom creation.'};
    cst.enemies.push(e); SM.engine.store.saveCustom(cst); SM.data.ENEMIES.push(e); SM.ui.closeModal(); SM.ui.toast('Enemy saved to library.','ok'); },
  formItem:()=>{ SM.ui.modal('Create Item',`<div class="grid cols2">

    <label class="fld"><span>Cost</span><input id="giCost" type="text" value="100 gp"></label></div>
    <label class="fld"><span>Description</span><textarea id="giDesc"></textarea></label>
    <label class="fld"><span>Ability (one per line)</span><textarea id="giAb"></textarea></label>
    <button class="btn primary block" onclick="SM.gm.saveItem()">Save Item</button>`); },
  saveItem:()=>{ const g=id=>document.getElementById(id).value; const cst=SM.engine.store.custom();

    cst.items.push(it); SM.engine.store.saveCustom(cst); SM.data.ITEMS.push(it); SM.ui.closeModal(); SM.ui.toast('Item saved to library.','ok'); },
  formNPC:()=>{ SM.ui.modal('Create NPC',`<div class="grid cols2">

  saveNPC:()=>{ const g=id=>document.getElementById(id).value; const cst=SM.engine.store.custom();

/* ===================== SCREEN: MAP ===================== */
SM.screens.map=()=>{ const U=SM.ui; const world=SM.data.LOCATIONS.find(l=>l.type==='World');
  const children=SM.data.LOCATIONS.filter(l=>l.parent);
  return `<div class="panel"><div class="eyebrow">World Map</div><h3 style="margin-top:4px">${world?world.name:'The Stormlands'}</h3><p class="small muted">${world?U.esc(world.desc):''}</p></div>
    <div class="section-head" style="margin-top:16px"><h3>Locations</h3></div>
    <div class="grid cols2">${children.map(l=>`<div class="card" onclick="SM.ui.modal('${U.esc(l.name)}','<div class=\\'tag\\'>${l.type}</div><p class=\\'small muted\\' style=\\'margin-top:8px\\'>${U.esc(l.desc)}</p>')"><div class="row"><div class="ava">${l.type==='City'?'🏙️':l.type==='Dungeon'?'🕳️':l.type==='Ruin'?'🏛️':'📍'}</div><div class="meta"><div class="t">${l.name}</div><div class="s">${l.type}</div></div></div></div>`).join('')}</div>
    <div class="panel" style="margin-top:16px"><div class="eyebrow">Battle & Fog-of-War</div><p class="small muted" style="margin-top:6px">Interactive world/region/dungeon/battle maps with player & enemy tokens and fog-of-war are prepared in the data model (locations carry stable IDs and parent links) and will render here as tile/token assets are added. Combat currently runs in the theatre-of-the-mind tracker.</p></div>`;
};

/* ===================== SCREEN: LORE ===================== */
SM.screens.lore=()=>{ const U=SM.ui;
  const cats=[['kin','🧬','Kin',SM.data.KIN.length],['lineage','🌿','Lineages',SM.data.LINEAGES.length],['classlib','🎖️','Classes',SM.data.CLASSES.length],
    ['discipline','📕','Disciplines',SM.data.DISCIPLINES.length],['ability','✨','Abilities',SM.data.ABILITIES.length],['spell','🔮','Spells',SM.data.SPELLS.length],
    ['item','🗡️','Items',SM.engine.allItems().length],['enemy','👹','Enemies',SM.data.ENEMIES.length],['npc','🧑','NPCs',SM.data.NPCS.length],
    ['conditions','☠️','Conditions',SM.data.CONDITIONS.length],['factions','🏳️','Factions',SM.data.FACTIONS.length]];
  return `<div class="panel"><div class="eyebrow">The Stormlands Codex</div><p class="small muted" style="margin-top:6px">A perpetual storm crowns this dark-fantasy realm, where lightning is both blessing and doom. The Storm Court rules from Haventide as rifts between worlds widen. Heroes rise from 21 kin and 13 disciplined paths to face what pours through.</p></div>
    <div class="searchbar" style="margin-top:14px"><span class="mag">🔍</span><input type="search" placeholder="Search all lore..." oninput="SM.screens.lore.search(this.value)"></div>
    <div id="loreResults"></div>
    <div class="section-head" style="margin-top:16px"><h3>Codex Sections</h3></div>
    <div class="grid cols2">${cats.map(([s,ic,t,n])=>`<div class="card" onclick="SM.ui.go('${s}')"><div class="row"><div class="ava">${ic}</div><div class="meta"><div class="t">${t}</div><div class="s">${n} entries</div></div></div></div>`).join('')}</div>`;
};
SM.screens.lore.search=q=>{ q=q.toLowerCase().trim(); const el=document.getElementById('loreResults'); if(!q){el.innerHTML='';return;}
  const kinds=[['kin',SM.data.KIN],['lineage',SM.data.LINEAGES],['classlib',SM.data.CLASSES],['discipline',SM.data.DISCIPLINES],['ability',SM.data.ABILITIES],['spell',SM.data.SPELLS],['item',SM.engine.allItems()],['enemy',SM.data.ENEMIES],['npc',SM.data.NPCS],['conditions',SM.data.CONDITIONS],['factions',SM.data.FACTIONS]];
  let rows=[]; kinds.forEach(([k,arr])=>{ arr.forEach(r=>{ if(JSON.stringify(r).toLowerCase().includes(q)&&rows.length<40){ rows.push([k,r]); } }); });
  el.innerHTML=rows.length?`<div class="list" style="margin-top:10px">`+rows.map(([k,r])=>`<div class="li" onclick="${k==='item'?`SM.lib.detailItem('${r.id}')`:`SM.lib.detail('${k}','${r.id}')`}"><div class="ava">🔎</div><div class="meta"><div class="t">${SM.ui.esc(r.name)}</div><div class="s">${k}</div></div></div>`).join('')+`</div>`:'<p class="small muted" style="margin-top:10px">No matches.</p>'; };

/* ===================== SCREEN: SETTINGS ===================== */
SM.screens.settings=()=>{ const U=SM.ui,E=SM.engine; const s=E.store.settings(); const chars=E.store.chars().length;
  const tog=(k,label)=>`<div class="kv"><span class="k">${label}</span><button class="btn sm ${s[k]?'primary':''}" onclick="SM.settings.toggle('${k}')">${s[k]?'On':'Off'}</button></div>`;
  return `<div class="panel"><div class="eyebrow">Display</div>
    <div class="kv"><span class="k">Text Size</span><span>${['sm','md','lg','xl'].map(z=>`<button class="btn sm ${s.textSize===z?'primary':''}" onclick="SM.settings.text('${z}')">${z.toUpperCase()}</button>`).join(' ')}</span></div>
    <div class="kv"><span class="k">Theme</span><span class="v">Storm (Dark) </span></div>
    ${tog('animations','Animations')}${tog('diceAnim','Dice Animation')}</div>
    <div class="panel" style="margin-top:14px"><div class="eyebrow">Audio</div>${tog('music','Music')}${tog('sfx','Sound Effects')}
    <div class="kv"><span class="k">Combat Speed</span><span>${['slow','normal','fast'].map(z=>`<button class="btn sm ${s.combatSpeed===z?'primary':''}" onclick="SM.settings.combat('${z}')">${z}</button>`).join(' ')}</span></div></div>
    <div class="panel" style="margin-top:14px"><div class="eyebrow">Data Management</div>
    <p class="small muted" style="margin:6px 0">${chars} characters saved locally in this browser.</p>
    <div class="stack">
      <button class="btn block" onclick="SM.settings.export()">Export All Data (backup)</button>
      <button class="btn block" onclick="SM.settings.import()">Import Data</button>
      <button class="btn danger block" onclick="SM.settings.wipe()">Erase All Data</button>
    </div></div>
    <div class="panel" style="margin-top:14px"><div class="eyebrow">About</div>
    <p class="small muted" style="margin-top:6px">StormMythic v${SM.version} — a dark epic fantasy tabletop RPG platform. All content is original. Data persists in your browser's local storage; the schema is versioned (v${SM.schema}) and designed so a future online database can replace local storage for real multiplayer.</p></div>`;
};
SM.settings={
  toggle:k=>{ const s=SM.engine.store.settings(); s[k]=!s[k]; SM.engine.store.saveSettings(s); SM.ui.render(); },
  text:z=>{ const s=SM.engine.store.settings(); s.textSize=z; SM.engine.store.saveSettings(s); SM.ui.applySettings(); SM.ui.render(); },
  combat:z=>{ const s=SM.engine.store.settings(); s.combatSpeed=z; SM.engine.store.saveSettings(s); SM.ui.render(); },
  export:()=>{ const json=SM.engine.store.exportAll(); SM.ui.modal('Export / Backup','<p class="small muted">Copy and save this JSON to back up all your data.</p><textarea style="min-height:240px" onclick="this.select()">'+SM.ui.esc(json)+'</textarea>'); },
  import:()=>{ SM.ui.modal('Import Data','<p class="small muted">Paste previously exported JSON. This overwrites matching data.</p><textarea id="impAll" style="min-height:200px"></textarea><button class="btn primary block" style="margin-top:10px" onclick="SM.settings.doImport()">Import</button>'); },
  doImport:()=>{ try{ SM.engine.store.importAll(document.getElementById('impAll').value); SM.ui.closeModal(); SM.ui.toast('Data imported.','ok'); SM.ui.render(); }catch(e){ SM.ui.toast('Invalid JSON.','bad'); } },
  wipe:()=>{ if(confirm('Erase ALL characters, campaigns and settings? This cannot be undone.')){ SM.engine.store.wipe(); SM.ui.toast('All data erased.','info'); SM.ui.go('home'); } }
};

/* ===================== BOOT ===================== */
SM.boot=function(){
  SM.engine.combat.init();
  SM.engine.loadCustom();
  SM.ui.buildNav();
  SM.ui.applySettings();
  SM.state.screen='home';
  SM.ui.render();
  SM.ui.syncNav();
};
/* ===== ENRICHMENT: lore, leveled abilities, physical alterations ===== */
SM.data.CLASS_DETAIL={"berserker": {"loreLong": "Berserkers are born of the storm-touched war-clans of the northern reaches, where a warrior's rage is a sacred inheritance passed down in blood and thunder. They do not train the storm out of themselves; they learn to ride it, letting fury sharpen rather than blind. In the Stormlands a berserker's battle-cry is said to draw real lightning to the field.", "signature": [{"level": 6, "name": "Thunderous Charge", "desc": "Rush a foe at twice your speed; the impact deals bonus crush damage and can knock them prone."}, {"level": 11, "name": "Unbreaking Wrath", "desc": "The first time you would drop to 0 HP each battle while raging, you instead drop to half your Vigor score."}, {"level": 17, "name": "Storm-Forged Body", "desc": "Your rage grants resistance to lightning and thunder and immunity to being disarmed."}]}, "skald": {"loreLong": "Skalds are the memory of the Stormlands made flesh, wandering poet-warriors who carry the histories no library survived. Their verses are woven with true names and old oaths, giving their songs power over courage, fear, and even the weather. A skald in a warband is worth a dozen soldiers, for they turn a rout into a legend.", "signature": [{"level": 5, "name": "Verse of the Unbroken Line", "desc": "Grant all allies who hear you temporary HP and immunity to Frightened for one minute."}, {"level": 10, "name": "Name the Foe", "desc": "Speak an enemy's true name; your party gains advantage against it this battle."}, {"level": 15, "name": "Living Legend", "desc": "Once per long rest, rewrite a moment: reroll any single roll made by anyone in earshot."}]}, "divine": {"loreLong": "The Divine are vessels chosen by the storm-gods that watch the realm from behind the thunderheads. Their power flows not from study but from covenant, answering as radiant light or roaring tempest depending on the god they serve. Where they walk, the wounded rise and the wicked learn fear.", "signature": [{"level": 5, "name": "Sanctified Ground", "desc": "Bless a 20 ft area: allies heal each turn and undead take radiant damage within it."}, {"level": 10, "name": "Divine Aegis", "desc": "Ward an ally so the next attack that would drop them instead leaves them at 1 HP."}, {"level": 15, "name": "Voice of the God", "desc": "Channel your patron to cast any prayer at reduced cost once per long rest."}]}, "wildspeaker": {"loreLong": "Wildspeakers are the tongue of the untamed storm-wilds, druids who never fully separated from the beast and the bloom. They borrow shapes the way others borrow words, wearing fur, feather, bark, and cloud as the moment demands. The oldest are barely recognizable as their birth-kin, so many forms have they carried.", "signature": [{"level": 5, "name": "Wildshape Mastery", "desc": "Assume beast forms as a bonus action and speak while transformed."}, {"level": 10, "name": "Call of the Wild", "desc": "Summon a pack of spirit-beasts to fight beside you for one minute."}, {"level": 15, "name": "Heart of the Storm-Wild", "desc": "Merge beast, plant, and weather into a towering elemental-primal aspect."}]}, "warrior": {"loreLong": "Warriors are the disciplined spine of every Stormlands army, masters of every weapon and stance. Where others rely on magic or fury, the warrior relies on ten thousand hours at the training post and the certainty of perfect technique. Legends of grandmasters who cut lightning from the sky are told in every barracks.", "signature": [{"level": 5, "name": "Combat Superiority", "desc": "Add maneuver dice to trip, disarm, feint, or rally as part of your attacks."}, {"level": 11, "name": "Relentless", "desc": "When you start your turn with no maneuver dice, regain one."}, {"level": 17, "name": "Flurry of Steel", "desc": "Make one additional weapon attack on each of your turns."}]}, "mystic": {"loreLong": "Mystics walk the monastic paths hidden in the storm-shrouded peaks, harmonizing body, breath, and the raw energy the monks call Chi. Their art turns flesh into weapon and stillness into speed, and the highest adepts channel elements, dragons, and shadow through their strikes. To face a mystic unarmed is to lose before the first blow.", "signature": [{"level": 5, "name": "Chi Surge", "desc": "Spend Chi for extra movement, extra strikes, and impossible leaps."}, {"level": 10, "name": "Empty Body", "desc": "Briefly turn ethereal, passing through attacks and obstacles."}, {"level": 15, "name": "Perfect Form", "desc": "Your unarmed strikes ignore resistance and crit more easily."}]}, "oathbound": {"loreLong": "The Oathbound bound their souls to a sacred vow, and the storm-realm itself enforces the bargain. Their oath is a wellspring of power and a leash: break it, and the borrowed might turns to ash. Kept, it makes them living banners around which the desperate rally.", "signature": [{"level": 5, "name": "Aura of Resolve", "desc": "Allies within 10 ft add your Spirit modifier to their saving throws."}, {"level": 10, "name": "Oathbound Smite", "desc": "Channel your vow into a strike for massive radiant or thunderous damage."}, {"level": 15, "name": "Unyielding Oath", "desc": "Once per long rest, ignore all conditions and cannot drop below 1 HP for one minute."}]}, "warden": {"loreLong": "Wardens are the immovable answer to an unstoppable world, guardians who plant themselves between danger and everything they love. They train to hold ground the way rivers train stone, wearing enemies down while shielding allies. A single warden has held a bridge against an army in the old songs, and the songs, for once, are true.", "signature": [{"level": 5, "name": "Bulwark Stance", "desc": "Adjacent allies gain cover and reduced damage while you hold your ground."}, {"level": 10, "name": "Guardian's Challenge", "desc": "Force enemies to attack you and punish those who ignore the taunt."}, {"level": 15, "name": "Unbreakable Line", "desc": "Cannot be moved, knocked prone, or stunned; halve all damage for one round."}]}, "shadow": {"loreLong": "Shadows are the quiet professionals of the Stormlands underworld, equally at home picking a lock, a pocket, or a fight. They win by position, patience, and a single perfect strike from the dark. The best are never seen, never caught, and never where the thunder looks.", "signature": [{"level": 5, "name": "Deadly Precision", "desc": "Deal extra damage whenever you have advantage or an ally flanks your target."}, {"level": 10, "name": "Ghost Step", "desc": "Vanish and reappear anywhere within 30 ft as a bonus action."}, {"level": 15, "name": "Killing Blow", "desc": "Against a surprised or helpless foe, your first strike is an automatic critical hit."}]}, "arcanist": {"loreLong": "Arcanists are the scholars who mapped the storm and dared to bottle it. Theirs is the widest library of spells in the realm, from candle-cantrips to reality-shaking Mythic workings. They are feared not for raw power alone but for how precisely they wield it.", "signature": [{"level": 5, "name": "Arcane Mastery", "desc": "Recover spent Mana on a short rest and cast one signature spell at reduced cost."}, {"level": 10, "name": "Spell Shaping", "desc": "Bend the area of your spells to spare allies and catch more foes."}, {"level": 15, "name": "Archmage's Reserve", "desc": "Once per long rest, cast a spell without spending Mana."}]}, "pactbinder": {"loreLong": "Pactbinders traded with powers older and stranger than the storm-gods, and each carries a patron's mark like a brand and a gift. Their magic recharges with unnatural speed, fed by the bargain rather than by study. What they owe, and when it will be collected, is a question they try not to ask.", "signature": [{"level": 5, "name": "Pact Boon", "desc": "Manifest a signature gift: a spectral weapon, a familiar, or a book of secrets."}, {"level": 10, "name": "Dread Invocation", "desc": "Unleash a patron-granted power that reshapes the battlefield."}, {"level": 15, "name": "Patron's Favor", "desc": "Once per long rest, call directly on your patron for a dramatic intervention."}]}, "spellweaver": {"loreLong": "Spellweavers refused to choose between the blade and the spell, and so learned to braid them into a single thread. Their strikes carry enchantments and their spells carry steel, flowing between melee and magic without pause. In their hands a sword is just another word in a longer sentence of power.", "signature": [{"level": 5, "name": "Spellstrike", "desc": "Channel a spell through a weapon attack, delivering both in one action."}, {"level": 10, "name": "Arcane Momentum", "desc": "Each spell empowers your next weapon strike, and each strike empowers your next spell."}, {"level": 15, "name": "Woven Reality", "desc": "Your blade can cut through defenses and even short distances of space."}]}, "machinist": {"loreLong": "Machinists are the tinker-engineers who arm themselves with gears, powder, and caged lightning. Where a mystic trains the body, a machinist builds a better one: turrets, drones, gauntlets, and guns. In a realm powered by storms, they are the ones who learned to plug in.", "signature": [{"level": 5, "name": "Field Deployment", "desc": "Deploy turrets, drones, and traps that act on their own each round."}, {"level": 10, "name": "Overclock", "desc": "Supercharge your devices for a burst of extra damage and effects."}, {"level": 15, "name": "War Construct", "desc": "Assemble and pilot a towering stormtech construct in battle."}]}};
SM.data.DISC_DETAIL={"stormheart": {"loreLong": "Stormheart berserkers let their fury draw down the sky; every swing trails sparks and the air smells of ozone when they charge.", "abilities": [{"level": 3, "name": "Charged Blows", "type": "Passive", "desc": "Melee hits deal +1d6 lightning while raging."}, {"level": 7, "name": "Chain Fury", "type": "Passive", "desc": "Critical hits arc lightning to a nearby foe for half damage."}, {"level": 13, "name": "Thunderstep", "type": "Movement", "desc": "Once per turn, blink 15 ft in a flash of lightning as part of a charge."}], "alterations": [{"level": 5, "name": "Storm-Veined", "desc": "Lightning crackles beneath your skin, shedding dim light and shocking those who grapple you."}, {"level": 11, "name": "Thunderheart", "desc": "Your heartbeat booms audibly; enemies within 5 ft that hit you take 1d4 thunder."}, {"level": 17, "name": "Living Tempest", "desc": "A permanent halo of static wreathes you and your eyes glow storm-blue."}]}, "bloodrage": {"loreLong": "Bloodrage berserkers feed on their own wounds, growing stronger the closer they come to death; their scars glow like embers in a fight.", "abilities": [{"level": 3, "name": "Blood Fuel", "type": "Passive", "desc": "Gain extra Fury whenever you become bloodied or take a critical hit."}, {"level": 7, "name": "Sanguine Feast", "type": "Passive", "desc": "Reducing a foe to 0 HP heals you for your Vigor modifier."}, {"level": 13, "name": "Crimson Frenzy", "type": "Bonus", "desc": "While below half HP, make one extra attack each turn."}], "alterations": [{"level": 5, "name": "Ever-Bleeding Marks", "desc": "Old scars reopen as glowing red seams that never fully heal."}, {"level": 11, "name": "Crimson Eyes", "desc": "Your eyes turn blood-red and clearly see the wounded in any light."}, {"level": 17, "name": "Blood Halo", "desc": "A ring of floating blood-motes orbits you, feeding your rage."}]}, "earthshaker": {"loreLong": "Earthshakers root their fury in the ground itself, splitting stone and toppling foes with every blow.", "abilities": [{"level": 3, "name": "Quake Slam", "type": "Attack", "desc": "On a hit, knock prone all enemies within 5 ft of the target."}, {"level": 7, "name": "Tremor Field", "type": "Utility", "desc": "Create difficult terrain in a 15 ft area for one minute."}, {"level": 13, "name": "Fault Line", "type": "Attack", "desc": "Split the earth in a 30 ft line, dealing crush damage and forming a chasm."}], "alterations": [{"level": 5, "name": "Stoneskin Growth", "desc": "Rocky plates emerge along your forearms and shoulders (+1 physical defense)."}, {"level": 11, "name": "Seismic Stride", "desc": "The ground cracks where you step and small stones orbit your feet."}, {"level": 17, "name": "Mountain Form", "desc": "You grow one size larger while raging, becoming a walking landslide."}]}, "beastfury": {"loreLong": "Beast Fury berserkers let the animal within off its leash, hunting with claw, fang, and relentless pursuit.", "abilities": [{"level": 3, "name": "Feral Leap", "type": "Movement", "desc": "Pounce up to 20 ft to attack, dealing bonus damage on landing."}, {"level": 7, "name": "Rending Claws", "type": "Passive", "desc": "Melee hits apply Bleeding."}, {"level": 13, "name": "Blood Scent", "type": "Passive", "desc": "Gain advantage to track and to hit any bloodied creature."}], "alterations": [{"level": 5, "name": "Feral Claws & Fur", "desc": "Retractable claws grow and a thick pelt spreads across your body."}, {"level": 11, "name": "Beast Fangs", "desc": "Your teeth lengthen into fangs and your eyes become a predator's."}, {"level": 17, "name": "Apex Aspect", "desc": "You take on a permanent partial were-beast form, faster and stronger."}]}, "battlechant": {"loreLong": "Battle Chants are war-songs that turn fear into fury; a chanting skald steadies an entire line.", "abilities": [{"level": 3, "name": "War Chant", "type": "Active", "desc": "Allies who hear you add a Verse die to their attack rolls."}, {"level": 7, "name": "Steady Rhythm", "type": "Passive", "desc": "Allies within 30 ft gain temporary HP at the start of each round."}, {"level": 13, "name": "Crescendo", "type": "Active", "desc": "End a chant with a burst that empowers all allies for one round."}], "alterations": [{"level": 10, "name": "Resonant Voice", "desc": "Your voice gains layered harmonics that carry over any battlefield din."}]}, "lorekeeper": {"loreLong": "Lorekeepers carry the histories in living memory, weaponizing knowledge and cutting words.", "abilities": [{"level": 3, "name": "Cutting Words", "type": "Reaction", "desc": "Reduce an enemy roll by a Verse die as a reaction."}, {"level": 7, "name": "Vast Knowledge", "type": "Passive", "desc": "Gain expertise in lore and recall a useful fact once per scene."}, {"level": 13, "name": "Word of Unmaking", "type": "Active", "desc": "Speak a forgotten weakness, halving a foe's defenses for one round."}], "alterations": [{"level": 10, "name": "Ink-Marked Skin", "desc": "Lines of shifting script crawl across your skin, recording what you learn."}]}, "spiritsinger": {"loreLong": "Spirit Singers call ancestral spirits with their songs, weaving aid and ghostly presence.", "abilities": [{"level": 3, "name": "Spirit Chorus", "type": "Active", "desc": "Summon a helpful spirit that harries a foe or shields an ally."}, {"level": 7, "name": "Soothing Song", "type": "Active", "desc": "Heal allies over time while you keep singing."}, {"level": 13, "name": "Choir of Ancestors", "type": "Active", "desc": "Call a swarm of spirits to aid the party for one minute."}], "alterations": [{"level": 5, "name": "Spirit Tattoos", "desc": "Glowing ancestral markings appear across your arms."}, {"level": 11, "name": "Ghostlight Eyes", "desc": "Your eyes shine with pale spirit-light and can see the dead."}]}, "stormminstrel": {"loreLong": "Storm Minstrels make music of thunder and gale, striking foes with sound.", "abilities": [{"level": 3, "name": "Thunder Verse", "type": "Attack", "desc": "Loose a line of thunder, damaging and pushing foes."}, {"level": 7, "name": "Gale Refrain", "type": "Utility", "desc": "Reposition allies or foes on a gust as a bonus action."}, {"level": 13, "name": "Tempest Sonata", "type": "Attack", "desc": "Conjure a rolling thunderstorm of sound over an area."}], "alterations": [{"level": 5, "name": "Thunderthroat", "desc": "Your voice booms unnaturally, audible for a mile."}, {"level": 11, "name": "Static Hair", "desc": "Your hair lifts and crackles, charged with your song."}]}, "dawnkeeper": {"loreLong": "Dawnkeepers carry the first light of morning, the surest healers in the realm.", "abilities": [{"level": 3, "name": "Dawnlight", "type": "Active", "desc": "A powerful single-target heal that also removes one condition."}, {"level": 7, "name": "Purifying Light", "type": "Active", "desc": "Cleanse conditions from all allies in a small area."}, {"level": 13, "name": "Break of Dawn", "type": "Active", "desc": "A sunrise burst that mass-heals allies and blinds nearby foes."}], "alterations": [{"level": 5, "name": "Halo of Dawn", "desc": "A faint golden ring hovers above you, shedding soft light."}, {"level": 11, "name": "Radiant Veins", "desc": "Your veins glow warm gold when you channel healing."}]}, "warsaint": {"loreLong": "War Saints carry faith into the front line, blade in one hand and blessing in the other.", "abilities": [{"level": 3, "name": "Sacred Strike", "type": "Attack", "desc": "Add radiant damage to a weapon hit."}, {"level": 7, "name": "Armor of Faith", "type": "Passive", "desc": "Gain bonus defense while you have Faith remaining."}, {"level": 13, "name": "Saint's Wrath", "type": "Attack", "desc": "Release a radiant nova around you."}], "alterations": [{"level": 10, "name": "Sacred Brand", "desc": "A glowing holy sigil burns permanently over your heart."}]}, "graveshepherd": {"loreLong": "Soulkeepers guide souls across the final threshold, granting mercy or holding back death.", "abilities": [{"level": 3, "name": "Ward Against Death", "type": "Reaction", "desc": "Once per rest, prevent an ally's death, leaving them at 1 HP."}, {"level": 7, "name": "Reap", "type": "Passive", "desc": "Deal bonus necrotic damage to bloodied foes."}, {"level": 13, "name": "Threshold", "type": "Active", "desc": "Command life and death in an area, healing allies and harming foes."}], "alterations": [{"level": 5, "name": "Grave-Pale Skin", "desc": "Your skin turns cold and ashen, unbothered by decay."}, {"level": 11, "name": "Soul-Sight Eyes", "desc": "Your eyes perceive the souls of the living and the dead."}, {"level": 17, "name": "Death's Shroud", "desc": "A faint mist of the grave drifts perpetually around you."}]}, "stormherald": {"loreLong": "Skywrath heralds are the raw wrath of the storm-gods given voice, calling lightning at will.", "abilities": [{"level": 3, "name": "Call Lightning", "type": "Attack", "desc": "Summon a repeatable bolt from the sky onto a foe."}, {"level": 7, "name": "Storm Shield", "type": "Reaction", "desc": "Answer an attacker with a reactive burst of thunder."}, {"level": 13, "name": "Wrath of the Sky", "type": "Active", "desc": "Conjure a sustained lightning storm over the battlefield."}], "alterations": [{"level": 5, "name": "Storm Eyes", "desc": "Your irises crackle with tiny arcs of lightning."}, {"level": 11, "name": "Cloud Mantle", "desc": "A small storm cloud drifts above your shoulders, rumbling softly."}, {"level": 17, "name": "Thunder Voice", "desc": "Your words roll like distant thunder and can be felt as much as heard."}]}, "primalshaper": {"loreLong": "Primal Shapers master the beast forms, reshaping flesh at will.", "abilities": [{"level": 3, "name": "Greater Beast Form", "type": "Active", "desc": "Assume larger, deadlier beast forms with natural weapons."}, {"level": 7, "name": "Adaptive Hide", "type": "Passive", "desc": "Gain resistance based on your current form."}, {"level": 13, "name": "Primeval Avatar", "type": "Active", "desc": "Become an apex predator form for one minute."}], "alterations": [{"level": 5, "name": "Ever-Shifting Flesh", "desc": "Even in your birth form, subtle bestial traits linger."}, {"level": 11, "name": "Hybrid Aspect", "desc": "You keep partial beast traits permanently: claws, fur, or fangs."}, {"level": 17, "name": "Primeval Body", "desc": "Your true form is now a blend of many beasts."}]}, "groveguardian": {"loreLong": "Grove Guardians command plant and terrain, wardens of the living wild.", "abilities": [{"level": 3, "name": "Entangle", "type": "Attack", "desc": "Roots erupt to hold foes in an area."}, {"level": 7, "name": "Guardian Vines", "type": "Active", "desc": "Summon vine-defenders that block and grapple."}, {"level": 13, "name": "Wildwood Bastion", "type": "Active", "desc": "Raise a fortress of living wood."}], "alterations": [{"level": 5, "name": "Barkskin Patches", "desc": "Plates of living bark grow over your skin (+1 physical defense)."}, {"level": 11, "name": "Leaf-Hair & Roots", "desc": "Your hair becomes leaves and vines; you can root in place to recover."}]}, "spiritcaller": {"loreLong": "Spiritcallers speak with and summon the spirits of nature.", "abilities": [{"level": 3, "name": "Totem Spirits", "type": "Active", "desc": "Plant a totem that projects a helpful aura."}, {"level": 7, "name": "Spirit Beast", "type": "Active", "desc": "Summon a spirit companion to fight beside you."}, {"level": 13, "name": "Great Spirit", "type": "Active", "desc": "Manifest an elder nature spirit for one minute."}], "alterations": [{"level": 5, "name": "Spirit Markings", "desc": "Glowing sigils of the wild spirits mark your skin."}, {"level": 11, "name": "Totem Aura", "desc": "Spectral animal shadows circle you."}]}, "stormdruid": {"loreLong": "Storm Druids bend wind, rain, and lightning to their will.", "abilities": [{"level": 3, "name": "Storm Call", "type": "Attack", "desc": "Strike with lightning and gale in an area."}, {"level": 7, "name": "Rainveil", "type": "Utility", "desc": "Conjure obscuring rain that slows foes."}, {"level": 13, "name": "Eye of the Tempest", "type": "Active", "desc": "Center a personal storm system on yourself."}], "alterations": [{"level": 5, "name": "Cloud Hair", "desc": "Your hair drifts like mist and beads with rain."}, {"level": 11, "name": "Storm Eyes", "desc": "Your eyes churn like thunderheads."}, {"level": 17, "name": "Weather Aura", "desc": "Local weather bends to your mood wherever you go."}]}, "dragonsoul": {"loreLong": "Dragon Soul mystics awaken the wyrm sleeping in their breath and blood, and in time their bodies remember what they truly are.", "abilities": [{"level": 3, "name": "Breath Strike", "type": "Attack", "desc": "Exhale a cone of your chosen element as part of a strike."}, {"level": 7, "name": "Scaled Chi", "type": "Passive", "desc": "Gain resistance to your draconic element."}, {"level": 15, "name": "Dragon Ascendant", "type": "Active", "desc": "Unleash the inner dragon for empowered strikes and breath."}], "alterations": [{"level": 5, "name": "Draconic Wings", "desc": "Leathery wings unfurl from your back, granting a 30 ft fly speed."}, {"level": 10, "name": "Dragon Scales", "desc": "Hardened scales spread across your body (+1 physical defense, resist your element)."}, {"level": 15, "name": "Wyrm Eyes & Horns", "desc": "Your eyes become slitted and short horns emerge; you can see in darkness."}, {"level": 20, "name": "Dragon Aspect", "desc": "You permanently take on a half-dragon form, wings and all."}]}, "ironpalm": {"loreLong": "Iron Palm mystics temper the body until flesh rings like struck metal.", "abilities": [{"level": 3, "name": "Iron Body", "type": "Passive", "desc": "Gain bonus HP and defense while you have Chi."}, {"level": 7, "name": "Stunning Palm", "type": "Attack", "desc": "A precise strike that can stun the target."}, {"level": 13, "name": "Diamond Body", "type": "Passive", "desc": "Become immune to many conditions."}], "alterations": [{"level": 5, "name": "Iron-Hard Skin", "desc": "Your skin takes on a faint metallic sheen and resists cuts."}, {"level": 11, "name": "Stone Fists", "desc": "Your hands harden like living stone, increasing unarmed damage."}, {"level": 17, "name": "Living Metal", "desc": "Your body rings like a bell when struck and rarely bruises."}]}, "veilwalker": {"loreLong": "Veil Walkers slip between shadow and sight, monks of the unseen.", "abilities": [{"level": 3, "name": "Shadow Step", "type": "Movement", "desc": "Teleport between shadows in dim light."}, {"level": 7, "name": "Silent Kill", "type": "Passive", "desc": "Deal bonus damage when you strike unseen."}, {"level": 13, "name": "One With Shadow", "type": "Passive", "desc": "Become nearly invisible in darkness."}], "alterations": [{"level": 5, "name": "Shadow-Touched", "desc": "Your edges blur and you cast a faint second shadow."}, {"level": 11, "name": "Voidless Eyes", "desc": "Your eyes turn solid black and pierce the dark."}, {"level": 17, "name": "Umbral Form", "desc": "Part of you is always half-in-shadow, hard to strike."}]}, "elementaladept": {"loreLong": "Elemental Kata mystics flow through the elements, each stance a different power.", "abilities": [{"level": 3, "name": "Elemental Fist", "type": "Attack", "desc": "Swap the damage type of your strikes to any element."}, {"level": 7, "name": "Elemental Wave", "type": "Utility", "desc": "Push or pull foes with a surge of your element."}, {"level": 13, "name": "Avatar of Elements", "type": "Active", "desc": "Command all elements at once for one minute."}], "alterations": [{"level": 5, "name": "Elemental Aura", "desc": "Flickers of your current element trail your movements."}, {"level": 11, "name": "Elemental Skin", "desc": "Your skin shows your attuned element: embers, frost, sparks, or stone."}]}, "arcanevanguard": {"loreLong": "Arcane Vanguards temper their steel with a soldier's share of magic.", "abilities": [{"level": 3, "name": "Rune Weapon", "type": "Passive", "desc": "Your weapon carries minor spell effects."}, {"level": 7, "name": "Mage Slayer", "type": "Passive", "desc": "Gain bonus damage and advantage against spellcasters."}, {"level": 13, "name": "Runeblade Master", "type": "Active", "desc": "Etch powerful temporary enchantments onto your arms."}], "alterations": [{"level": 10, "name": "Runic Brands", "desc": "Glowing runes surface on your skin whenever you channel magic."}]}, "wartactician": {"loreLong": "War Tacticians win by maneuver and command, not brute force.", "abilities": [{"level": 3, "name": "Commanding Strike", "type": "Bonus", "desc": "Direct an ally to make an attack off your action."}, {"level": 7, "name": "Battle Maneuvers", "type": "Active", "desc": "Trip, disarm, or rally as part of your attacks."}, {"level": 13, "name": "Grand Strategist", "type": "Active", "desc": "Reposition the whole party a short distance as a bonus action."}], "alterations": [{"level": 10, "name": "Commander's Bearing", "desc": "You radiate calm authority; allies near you resist fear."}]}, "paragon": {"loreLong": "Paragons are the ideal of martial perfection, pure weapon mastery.", "abilities": [{"level": 3, "name": "Extra Attack", "type": "Passive", "desc": "Make additional weapon attacks as you level."}, {"level": 7, "name": "Perfect Form", "type": "Reaction", "desc": "Reroll a missed attack once per turn."}, {"level": 13, "name": "Living Legend", "type": "Passive", "desc": "Widen your critical range and never lose your footing."}], "alterations": [{"level": 10, "name": "Peak Physique", "desc": "Your body settles into an idealized, tireless form."}, {"level": 15, "name": "Unbreakable Frame", "desc": "You shrug off blows that would cripple others."}]}, "mirrorblade": {"loreLong": "Mirrorblades turn a foe's force back upon them, duelists of reflection.", "abilities": [{"level": 3, "name": "Mirror Parry", "type": "Reaction", "desc": "Reflect a portion of blocked melee damage at the attacker."}, {"level": 7, "name": "Riposte Chain", "type": "Reaction", "desc": "Each parry sets up the next counterattack."}, {"level": 13, "name": "Perfect Mirror", "type": "Reaction", "desc": "Reflect a critical hit back at its source."}], "alterations": [{"level": 10, "name": "Mirrored Eyes", "desc": "Your irises become reflective, catching every movement."}, {"level": 15, "name": "Glass Skin", "desc": "Your skin faintly mirrors the light, unnerving opponents."}]}, "crusader": {"loreLong": "Crusaders are the holy vanguard, sworn to drive back the dark.", "abilities": [{"level": 3, "name": "Zealous Smite", "type": "Attack", "desc": "Add radiant damage and push undead back."}, {"level": 7, "name": "Rally Banner", "type": "Active", "desc": "Buff all allies who can see you."}, {"level": 13, "name": "Holy Crusade", "type": "Active", "desc": "Lead a party-wide radiant charge."}], "alterations": [{"level": 5, "name": "Sacred Radiance", "desc": "A faint holy glow surrounds you in dim light."}, {"level": 11, "name": "Oath-Brand", "desc": "Your vow burns as a glowing sigil on your brow."}]}, "vengeance": {"loreLong": "The Wrathsworn hunt the guilty without rest, their oath a blade aimed at one throat.", "abilities": [{"level": 3, "name": "Vow of Enmity", "type": "Bonus", "desc": "Mark a foe to gain advantage against it."}, {"level": 7, "name": "Relentless Chase", "type": "Passive", "desc": "Gain bonus movement toward your marked target."}, {"level": 13, "name": "Avenging Storm", "type": "Attack", "desc": "Execute a marked, bloodied foe with a storm of blows."}], "alterations": [{"level": 5, "name": "Burning Eyes", "desc": "Your eyes smolder when you fix on your quarry."}, {"level": 11, "name": "Wrath Scars", "desc": "Glowing red marks spread across your skin as your vow deepens."}, {"level": 17, "name": "Aspect of Vengeance", "desc": "You take on a terrifying wrathful visage against your foe."}]}, "sacredguardian": {"loreLong": "Sacred Guardians are the shield of the innocent, protectors above all.", "abilities": [{"level": 3, "name": "Guardian Aura", "type": "Passive", "desc": "Redirect some damage from nearby allies to yourself."}, {"level": 7, "name": "Cleansing Touch", "type": "Active", "desc": "Cure conditions from an ally."}, {"level": 13, "name": "Aegis Eternal", "type": "Active", "desc": "Ward the whole party with a sacred shield."}], "alterations": [{"level": 10, "name": "Guardian Halo", "desc": "A soft protective halo appears when allies are near."}, {"level": 15, "name": "Aegis Wings", "desc": "Spectral wings unfurl when you shield an ally from harm."}]}, "stormoath": {"loreLong": "Storm Oath paladins bound themselves to the tempest itself.", "abilities": [{"level": 3, "name": "Thunder Smite", "type": "Attack", "desc": "Smite with chaining lightning."}, {"level": 7, "name": "Storm Aura", "type": "Passive", "desc": "Shock nearby foes each round."}, {"level": 13, "name": "Oath of the Tempest", "type": "Active", "desc": "Become a walking storm for one minute."}], "alterations": [{"level": 5, "name": "Charged Aura", "desc": "Static clings to you, raising the hair of those nearby."}, {"level": 11, "name": "Storm Brand", "desc": "A lightning-shaped mark glows across your arm."}, {"level": 17, "name": "Living Storm Aspect", "desc": "Clouds gather over you and lightning answers your oaths."}]}, "ironbastion": {"loreLong": "Iron Bastions are walls of iron and will, the purest tanks.", "abilities": [{"level": 3, "name": "Shield Wall", "type": "Active", "desc": "Grant cover to allies behind you."}, {"level": 7, "name": "Unyielding", "type": "Passive", "desc": "Resist forced movement and knockdown."}, {"level": 13, "name": "Fortress Eternal", "type": "Active", "desc": "Project a massive damage-reduction aura."}], "alterations": [{"level": 5, "name": "Iron Plating", "desc": "Your skin hardens into iron-like plates (+1 physical defense)."}, {"level": 11, "name": "Living Fortress", "desc": "Your frame broadens and toughens, hard to move or fell."}, {"level": 17, "name": "Adamant Body", "desc": "You become nearly as un     if(c==null) return {name:'', kin:null, lineage:null, totalLevel:0, tier:E.tierOf(0), classes:[], multiclass:false, hasClass:false, label:'Choose your first class'};
    var k=E.kin(c.kinId), l=E.lineage(c.lineageId);
    var tl=E.totalLevel(c), tier=E.tierOf(tl);
    var cls=(c.classes||[]).map(function(x){ var cl=E.cls(x.classId); var d=(x.discId==null)?null:E.disc(x.discId); return {classId:x.classId, name:cl?cl.name:x.classId, level:x.level, discId:x.discId||null, discName:d?d.name:null}; });
    var hasClass=cls.length>0; var multiclass=cls.length>1; var label;
    if(hasClass===false){ label='Choose your first class'; }
    else if(multiclass){ label=tier+' '+tl+' \u2014 '+cls.map(function(x){return x.name+' '+x.level;}).join(' / '); }
    else { var only=cls[0]; label=tier+' '+only.level+' '+only.name+(only.discName?(' ('+only.discName+')'):''); }
    return {name:c.name||'', kin:k?k.name:null, lineage:l?l.name:null, totalLevel:tl, tier:tier, classes:cls, multiclass:multiclass, hasClass:hasClass, label:label};
  };
  E.powerSummary=function(c){
    if(c==null) return null;
    var a=E.attrs(c), m=E.mods(c), def=E.defenses(c);
    var atk=E.attackBonus(c), spd=E.speed(c), tl=E.totalLevel(c), pb=E.profBonus(tl);
    var res=E.resource(c), hp=E.maxHP(c);
    var pc=E.primaryClass(c); var pKey=(pc&&pc.primary&&pc.primary[0])?pc.primary[0]:'MIG';
    var saveDC=8+pb+(m[pKey]||0);
    var w=E.equippedItem(c,'weapon'); var scaleKey=w?w.scale:'MIG';
    return { attrs:a, mods:m, defenses:def, attackBonus:atk, speed:spd, profBonus:pb, saveDC:saveDC,
             resource:res, maxHP:hp, primaryAttr:pKey, scaleAttr:scaleKey,
             weapon:w?{name:w.name,dmg:w.dmg,scale:w.scale}:null };
  };
  E.buildStrengths=function(c){
    var out=[]; if(c==null) return out;
    var ps=E.powerSummary(c); var rew=E.progressionRewards(c); var def=ps.defenses;
    if(ps.attackBonus>=5) out.push({type:'offense',label:'High attack bonus ('+E.signed(ps.attackBonus)+')'});
    else if(ps.attackBonus>=3) out.push({type:'offense',label:'Solid attack bonus ('+E.signed(ps.attackBonus)+')'});
    if(def.physicalDefense>=15) out.push({type:'defense',label:'Strong physical defense ('+def.physicalDefense+')'});
    else if(def.physicalDefense>=12) out.push({type:'defense',label:'Good physical defense ('+def.physicalDefense+')'});
    if(def.magicDefense>=4) out.push({type:'defense',label:'Strong magic defense ('+def.magicDefense+')'});
    if(def.evasion>=4) out.push({type:'defense',label:'High evasion ('+E.signed(def.evasion)+')'});
    if(def.block>0) out.push({type:'defense',label:'Shield block ('+def.block+')'});
    var classCount=rew.classes.length;
    if(classCount>1) out.push({type:'utility',label:'Versatile multiclass ('+classCount+' classes)'});
    var discCount=rew.classes.filter(function(x){return (x.discId==null)===false;}).length;
    if(discCount>1) out.push({type:'utility',label:'Multiple disciplines ('+discCount+')'});
    var learned=(Array.isArray(c.abilities)?c.abilities:[]).length;
    if(learned>=5) out.push({type:'utility',label:'Large ability pool ('+learned+' learned)'});
    var eqCount=(c.inventory||[]).filter(function(i){return i.equipped;}).length;
    if(eqCount>=3) out.push({type:'utility',label:'Strong equipment loadout ('+eqCount+' equipped)'});
    if(out.length===0) out.push({type:'info',label:'Developing build \u2014 level up and choose disciplines to grow your strengths.'});
    return out;
  };
  E.buildOpportunities=function(c){
    var out=[]; if(c==null) return out;
    var rew=E.progressionRewards(c);
    rew.classes.forEach(function(x){ if(Array.isArray(x.pending)&&x.pending.length>0){ out.push({type:'discipline',classId:x.classId,label:'Choose a discipline for '+x.className}); } });
    rew.classes.forEach(function(x){ (x.abilities.available||[]).forEach(function(a){ out.push({type:'ability',classId:x.classId,id:a.id,label:'Learn '+a.name+' ('+x.className+' Lv '+a.level+')'}); }); });
    rew.classes.forEach(function(x){ if(x.level<20){ out.push({type:'class-level',classId:x.classId,label:'Level up '+x.className+' to '+(x.level+1)}); } });
    rew.classes.forEach(function(x){ var up=(x.passives.upcoming||[])[0]; if((up==null)===false){ out.push({type:'passive',classId:x.classId,label:'Unlock '+up.name+' ('+x.className+' Lv '+up.level+')'}); } });
    var tp=E.tierProgress(c);
    if(tp.atTop===false&&(tp.nextTier==null)===false){ out.push({type:'tier',label:'Reach '+tp.nextTier+' tier at Total Level '+tp.nextAt}); }
    return out;
  };
})(SM.engine);

(function(E){
  E.validateBuild=function(c, stage){
    stage=(stage==='saved')?'saved':'create';
    var errors=[], warnings=[];
    var ep=function(code,msg){ errors.push({code:code,msg:msg}); };
    var wp=function(code,msg){ warnings.push({code:code,msg:msg}); };
    if(c==null||(typeof c==='object')===false){ return {valid:false, errors:[{code:'character',msg:'No character to validate.'}], warnings:[], totalLevel:0, tier:E.tierOf(0)}; }
    var nm=(typeof c.name==='string')?c.name.trim():'';
    if(nm.length===0) ep('name','Enter a character name.');
    var kin=(c.kinId==null)?null:E.kin(c.kinId);
    if(c.kinId==null) ep('kin','Choose a Kin.');
    else if(kin==null) ep('kin','Selected Kin is invalid.');
    var lin=(c.lineageId==null)?null:E.lineage(c.lineageId);
    if(c.lineageId==null) ep('lineage','Choose a Lineage.');
    else if(lin==null) ep('lineage','Selected Lineage is invalid.');
    else if((kin==null)===false&&((lin.kin===c.kinId)===false)) ep('lineage','Selected Lineage does not belong to the selected Kin.');
    var classes=Array.isArray(c.classes)?c.classes:[];
    if(Array.isArray(c.classes)===false) ep('classes','Character class data is malformed.');
    var clv=SM.creator.validateClassLevels(classes);
    clv.errors.forEach(function(e){ ep(e.code||'class', e.msg); });
    var seenC={};
    classes.forEach(function(x){ if(x&&(x.classId==null)===false){ if(seenC[x.classId]){ var d0=E.cls(x.classId); ep('class','Duplicate class entry: '+(d0?d0.name:x.classId)+'.'); } seenC[x.classId]=true; } });
    classes.forEach(function(x){
      if(x==null||(typeof x==='object')===false){ ep('class','Malformed class entry.'); return; }
      var cl=(x.classId==null)?null:E.cls(x.classId);
      if(x.discId==null){
        if(stage==='create') ep('discipline','Choose a Discipline'+(cl?(' for '+cl.name):'')+'.');
        else wp('discipline','Discipline choice pending'+(cl?(' for '+cl.name):'')+'.');
      } else {
        var ds=E.disc(x.discId);
        if(ds==null) ep('discipline','Invalid discipline selected'+(cl?(' for '+cl.name):'')+'.');
        else if((cl==null)===false&&((ds.cls===cl.id)===false)) ep('discipline','Discipline "'+ds.name+'" does not belong to '+cl.name+'.');
      }
    });
    var owned=Array.isArray(c.abilities)?c.abilities:[];
    var seenA={};
    owned.forEach(function(idv){
      if(seenA[idv]) ep('ability','Duplicate ability: '+idv+'.');
      seenA[idv]=true;
      var ab=E.ability(idv);
      if(ab==null){ ep('ability','Invalid ability reference: '+idv+'.'); return; }
      var cl=classes.find(function(y){ return y&&y.classId===ab.cls; });
      if(cl==null){ ep('ability','Ability "'+ab.name+'" requires a class the character does not have.'); return; }
      var lv=(typeof cl.level==='number')?cl.level:0;
      if(ab.level>lv) ep('ability','Ability "'+ab.name+'" requires '+((E.cls(ab.cls)||{}).name||ab.cls)+' level '+ab.level+'.');
      if((ab.disc==null)===false&&((cl.discId===ab.disc)===false)) ep('ability','Ability "'+ab.name+'" requires a different discipline.');
    });
    var normCount=SM.creator.normalizeClassLevels(classes).length;
    if(normCount>1) wp('multiclass','Character has multiple classes.');
    var total=SM.creator.calculateTotalLevel(classes);
    var tier=SM.creator.calculateCharacterTier(total);
    return { valid:(errors.length===0), errors:errors, warnings:warnings, totalLevel:total, tier:tier };
  };
  E.sanitizeBuild=function(raw){
    var c=E.migrateChar(raw);
    if(Array.isArray(c.classes)) c.classes=SM.creator.normalizeClassLevels(c.classes);
    c.totalLevel=E.totalLevel(c); c.tier=E.tierOf(c.totalLevel);
    return c;
  };
})(SM.engine);

(function(E){
  E.characterSummary=function(c){
    if(c==null||(typeof c==='object')===false) return {malformed:true, id:null, name:'Unknown', reason:'Not a character record.'};
    var idn=E.buildIdentity(c);
    var kin=(c.kinId==null)?null:E.kin(c.kinId);
    var lin=(c.lineageId==null)?null:E.lineage(c.lineageId);
    var primary=E.primaryClass(c);
    var classesLabel=idn.classes.map(function(x){return x.name+' '+x.level;}).join(' / ');
    var discLabel=idn.classes.map(function(x){return x.discName;}).filter(function(x){return (x==null)===false;}).join(' / ');
    var nm=(typeof c.name==='string'&&c.name.trim().length>0)?c.name.trim():'Unnamed Hero';
    return { id:c.id||null, name:nm, kin:kin?kin.name:null, lineage:lin?lin.name:null,
      primaryClass:primary?primary.name:null, classes:idn.classes, classesLabel:classesLabel, discLabel:discLabel,
      totalLevel:idn.totalLevel, tier:idn.tier, hasClass:idn.hasClass, multiclass:idn.multiclass,
      updated:(typeof c.updated==='number')?c.updated:null, malformed:false };
  };
  E.store.rosterEntries=function(){
    var raw=E.store.rawChars(); var out=[]; var seenId={};
    raw.forEach(function(rec, idx){
      try{
        if(rec==null||(typeof rec==='object')===false||Array.isArray(rec)){ out.push({kind:'malformed', index:idx, id:null, reason:'Record is not a character object.'}); return; }
        if(rec.id==null||(typeof rec.id==='string')===false||rec.id.length===0){ out.push({kind:'malformed', index:idx, id:null, reason:'Character is missing an ID.'}); return; }
        var dup=(seenId[rec.id]===true); seenId[rec.id]=true;
        var m=E.migrateChar(rec); m.id=rec.id; m.totalLevel=E.totalLevel(m); m.tier=E.tierOf(m.totalLevel);
        var sum=E.characterSummary(m); var vb=E.validateBuild(m,'saved');
        out.push({kind:'valid', id:rec.id, char:m, summary:sum, valid:vb.valid, warnings:vb.warnings, errors:vb.errors, duplicateId:dup});
      }catch(e){ out.push({kind:'malformed', index:idx, id:(rec&&rec.id)||null, reason:'Could not read character record.'}); }
    });
    return out;
  };
})(SM.engine);

SM.engine.alterationBonuses=function(c){var fly=0,pdef=0,notes=[];var al=SM.engine.alterationsFor(c).unlocked;al.forEach(function(a){var dsc=String(a.desc||'');var mf=dsc.match(/(\d+)\s*ft fly speed/i);if(mf){fly=Math.max(fly,parseInt(mf[1],10));}else if(/fly speed|flight/i.test(dsc)){fly=Math.max(fly,30);}var mp=dsc.match(/\+(\d+)\s*physical defense/i);if(mp){pdef+=parseInt(mp[1],10);}if(/darkvision|see in darkness|see clearly in darkness/i.test(dsc)){notes.push("Darkvision");}});return {fly:fly,pdef:pdef,notes:notes};};

    var rl=(rar||'').toLowerCase(), ell=(el||'').toLowerCase(), subl=(sub||'').toLowerCase();
    var ri=RARORD.indexOf(rar); if(ri<0)ri=0;
    var o={ id:x.i, name:x.n, category:cat, subtype:sub, element:el, tierName:tier,
      rarity:rl, value:x.v, cost:x.v+' gp', weight:1, fromRegistry:true, scale:x.pa, primaryAttr:x.pa,
      desc:'Original StormMythic '+subl+' infused with '+ell+' power.',
      ability:{ name:el+' Resonance', activation:'Passive', resourceCost:x.rc,
        desc:'Grants a '+rl+' '+ell+' effect appropriate to the item.' },
      crafting:{ station:(cat==='Weapon'?'Blacksmith':((cat==='Armor'||cat==='Shield')?'Armorer':'Enchanter')),
        difficulty:ri+1, materials:[el+' Essence',(tier==='Heroic'?'Ironwood':'Stormsteel Fragment')] },
      loot:{ sources:(x.bl===1?['boss loot','quest rewards','artifact caches']:['world loot','shops','enemy loot']),
        dropWeight:20-ri*2 },
      shop:{ available:(x.sh===1), basePrice:x.v,
        merchantTypes:(cat==='Weapon'?['Blacksmith','Armorer']:['General Goods','Enchanter']) },
      requirements:{ minimumTier:tier, classRestrictions:[], disciplineRestrictions:[] },
      tags:[(cat||'').toLowerCase(), subl, rl, ell] };
    if(cat==='Weapon'){ o.dmg=x.d; o.atk=x.ab||0; o.range=x.rg; o.dtype=el; o.props=[sub]; o.cat=((x.rg==='Ranged')?'Martial Ranged':'Martial Melee'); o.slot='weapon'; }
    else if(cat==='Armor'){ o.pdef=x.pd||0; o.mdef=x.md||0; o.movePenalty=x.mp||0; o.req='-'; o.cat=sub; o.slot='armor'; }
    else if(cat==='Shield'){ o.pdef=x.sp||0; o.mdef=x.sm||0; o.cat='Shield'; o.slot='offhand'; }
    else { o.power=x.p||0; o.cat=cat; o.type=typeMap[cat]||null; o.slot=slotMap[cat]||null; }
    return o;
  };
  E._regMap=null;
  E.regMap=function(){ if(E._regMap)return E._regMap; var m={}; var a=(D.REGISTRY||[]); for(var i=0;i<a.length;i++){ var h=E.hydrateReg(a[i]); if(h)m[h.id]=h; } E._regMap=m; return m; };
  E.registryItems=function(){ var mp=E.regMap(); return Object.keys(mp).map(function(k){return mp[k];}); };

  var NAVREF=(U&&U.NAV)?U.NAV:((E&&E.NAV)?E.NAV:null);
  if(NAVREF)NAVREF.codex={t:'Item Codex',i:'\ud83d\udcdc'};

  SM.codex={
    f:{cat:'',rar:'',el:'',tier:'',q:''}, page:0, per:48,
    filtered:function(){ var f=this.f; var q=(f.q||'').toLowerCase();
      return (D.REGISTRY||[]).filter(function(x){
        if(f.cat.length>0&&NE(x.c,f.cat))return false;
        if(f.rar.length>0&&NE(x.r,f.rar))return false;
        if(f.el.length>0&&NE(x.e,f.el))return false;
        if(f.tier.length>0&&NE(x.t,f.tier))return false;
        if(q.length>0&&x.n.toLowerCase().indexOf(q)<0&&x.s.toLowerCase().indexOf(q)<0)return false;
        return true;
      });
    },
    set:function(k,v){ this.f[k]=v; this.page=0; this.repaint(); },
    goPage:function(d){ var t=this.filtered(); var mx=Math.max(0,Math.ceil(t.length/this.per)-1); this.page=Math.min(mx,Math.max(0,this.page+d)); this.repaint(); },
    repaint:function(){ var el=document.getElementById('codexList'); if(el==null){ SM.ui.go('codex'); return; } el.innerHTML=this.listHtml(); var cc=document.getElementById('codexCount'); if(cc)cc.innerHTML=this.countHtml(); var pg=document.getElementById('codexPager'); if(pg)pg.innerHTML=this.pagerHtml(); },
    countHtml:function(){ return this.filtered().length+' items'; },
    pagerHtml:function(){ var t=this.filtered(); var pages=Math.max(1,Math.ceil(t.length/this.per)); return '<button class="btn sm" onclick="SM.codex.goPage(-1)">Prev</button> <span class="small">Page '+(this.page+1)+' / '+pages+'</span> <button class="btn sm" onclick="SM.codex.goPage(1)">Next</button>'; },
    statLine:function(x){ if(x.c==='Weapon')return x.d; if(x.c==='Armor')return 'Def '+x.pd+'/'+x.md; if(x.c==='Shield')return 'Blk '+x.sp+'/'+x.sm; return 'Pwr '+(x.p||0); },
    icon:function(x){ if(x.c==='Weapon')return '\u2694\ufe0f'; if(x.c==='Armor')return '\ud83e\uddba'; if(x.c==='Shield')return '\ud83d\udee1\ufe0f'; if(x.c==='Artifact')return '\ud83c\udf1f'; return '\ud83d\udc8d'; },
    listHtml:function(){ var t=this.filtered(); var stt=this.page*this.per; var pg=t.slice(stt,stt+this.per); var U=SM.ui;
      if(pg.length===0)return '<div class="need">No items match.</div>';
      return pg.map(function(x){ return '<div class="li" onclick="SM.codex.detail(\''+x.i+'\')"><div class="ava">'+SM.codex.icon(x)+'</div><div class="meta"><div class="t">'+U.esc(x.n)+'</div><div class="s">'+x.r+' '+x.e+' '+x.s+' - '+SM.codex.statLine(x)+'</div></div></div>'; }).join('');
    },
    detail:function(id){ var it=SM.engine.item(id); if(it==null)return; var U=SM.ui; var c=SM.act.get(); var stat='';
      if(it.category==='Weapon')stat='Damage '+it.dmg+' ('+it.dtype+'), Attack +'+(it.atk||0)+', '+(it.range||'Melee')+', scales '+it.scale;
      else if(it.category==='Armor')stat='Physical Def +'+it.pdef+', Magical Def +'+it.mdef+', Move Penalty '+it.movePenalty;
      else if(it.category==='Shield')stat='Block Physical +'+it.pdef+', Block Magical +'+it.mdef;
      else stat='Power '+it.power;
      var slot=SM.act.slotFor(it);
      var addBtn=(c==null)?'<div class="need">Select a character to add items.</div>':'<button class="btn primary block" onclick="SM.codex.add(\''+it.id+'\')">Add to Inventory'+(slot?' ('+slot+')':'')+'</button>';
      var body='<div class="stack">'
        +'<div class="small">'+U.esc(it.desc)+'</div>'
        +'<div class="kv"><b>Rarity</b> '+it.rarity+' &middot; <b>Tier</b> '+it.tierName+' &middot; <b>Element</b> '+it.element+' &middot; <b>Value</b> '+it.value+' gp</div>'
        +'<div class="kv"><b>Stats</b> '+stat+'</div>'
        +'<div class="kv"><b>Ability</b> '+U.esc(it.ability.name)+' ('+it.ability.activation+') - '+U.esc(it.ability.desc)+'</div>'
        +'<div class="kv"><b>Crafting</b> '+it.crafting.station+' (difficulty '+it.crafting.difficulty+'): '+it.crafting.materials.join(', ')+'</div>'
        +'<div class="kv"><b>Loot</b> '+it.loot.sources.join(', ')+' &middot; <b>Shop</b> '+(it.shop.available?'available':'not sold')+'</div>'
        +'<div class="pill-row">'+it.tags.map(function(tg){return '<span class="chip">'+tg+'</span>';}).join(' ')+'</div>'
        +addBtn+'</div>';
      U.modal(U.esc(it.name), body);
    },
    add:function(id){ var c=SM.act.get(); if(c==null){ SM.ui.toast('No active character'); return; } var it=SM.engine.item(id); if(it==null)return; c.inventory=c.inventory||[]; c.inventory.push({instId:'inst-'+Math.random().toString(36).slice(2,8),itemId:id,qty:1,equipped:false,slot:SM.act.slotFor(it)}); SM.engine.store.upsertChar(c); if(SM.ui.closeModal)SM.ui.closeModal(); SM.ui.toast('Added '+it.name); }
  };

  SM.screens.codex=function(){ var U=SM.ui; var C=SM.codex; var f=C.f;
    function opt(list,cur){ return '<option value="">All</option>'+list.map(function(o){ return '<option value="'+o+'"'+((cur===o)?' selected':'')+'>'+o+'</option>'; }).join(''); }
    var cats=['Weapon','Armor','Shield','Ring','Necklace','Trinket','Cloak','Belt','Boots','Gloves','Helmet','Staff/Wand','Magical Item','Artifact'];
    var rars=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Ascendant'];
    var els=['Storm','Stone','Radiant','Spirit','Void','Ember','Tide','Shadow','Astral','Verdant','Frost','Gale','Arcane','Temporal'];
    var tiers=['Heroic','Legendary','Epic','Mythic','Ascendant'];
    return '<div class="panel"><div class="eyebrow">Item Codex - '+(D.REGISTRY||[]).length+' original items</div>'
      +'<div class="searchbar" style="margin-top:8px"><span class="mag">\ud83d\udd0d</span><input type="search" id="codexSearch" placeholder="Search name or type..." value="'+U.esc(f.q||'')+'" oninput="SM.codex.set(\'q\',this.value)"></div>'
      +'<div class="grid cols" style="margin-top:8px;gap:6px">'
      +'<select onchange="SM.codex.set(\'cat\',this.value)">'+opt(cats,f.cat)+'</select>'
      +'<select onchange="SM.codex.set(\'rar\',this.value)">'+opt(rars,f.rar)+'</select>'
