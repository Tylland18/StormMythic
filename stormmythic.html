/* ===================== 4B-12 IMPORT / EXPORT / BACKUP (engine) ===================== */
(function(E){
  var FMT_CHAR='stormmythic-character', FMT_BACKUP='stormmythic-backup', FMT_VER=1;
  E.IO={ CHAR:FMT_CHAR, BACKUP:FMT_BACKUP, VERSION:FMT_VER };
  var clone=function(x){ return JSON.parse(JSON.stringify(x)); };
  E.newCharId=function(){ return 'ch-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); };
  E.uniqueCharId=function(used){ used=used||{}; var id=E.newCharId(); var g=0; while(used[id]===true&&g<100000){ id=E.newCharId()+g.toString(36); g++; } return id; };

  /* ---------- EXPORT ---------- */
  E.exportCharacter=function(c){
    if(c==null||(typeof c==='object')===false) return null;
    var ch=E.migrateChar(clone(c)); if((c.id==null)===false) ch.id=c.id;
    return { format:FMT_CHAR, formatVersion:FMT_VER, schemaVersion:SM.schema, exportedAt:new Date().toISOString(), character:ch };
  };
  E.exportCharacterJSON=function(c){ var e=E.exportCharacter(c); return (e==null)?null:JSON.stringify(e,null,2); };
  E.exportBackup=function(){
    var rows=E.store.rosterEntries().filter(function(en){ return en.kind==='valid'; });
    var chars=rows.map(function(en){ return clone(en.char); });
    return { format:FMT_BACKUP, formatVersion:FMT_VER, schemaVersion:SM.schema, exportedAt:new Date().toISOString(), activeCharacterId:E.store.activeId(), characters:chars };
  };
  E.exportBackupJSON=function(){ return JSON.stringify(E.exportBackup(),null,2); };

  /* ---------- import-specific supplemental reference checks (warnings only) ---------- */
  E.importSupplementWarnings=function(c){
    var w=[];
    (Array.isArray(c.spells)?c.spells:[]).forEach(function(sid){ if((sid==null)===false&&E.spell(sid)==null) w.push({code:'spell',msg:'Unknown spell reference: '+sid}); });
    (Array.isArray(c.inventory)?c.inventory:[]).forEach(function(it){ var id=it&&it.itemId; if((id==null)===false&&E.item(id)==null) w.push({code:'equipment',msg:'Unknown equipment reference: '+id}); });
    return w;
  };

  /* ---------- validate one record (reuses validateBuild) ---------- */
  E.validateImportRecord=function(raw, idx){
    var rec={ index:(idx==null?0:idx), valid:false, char:null, summary:null, errors:[], warnings:[], sourceId:null };
    if(raw==null||(typeof raw==='object')===false||Array.isArray(raw)){ rec.errors.push({code:'character',msg:'Record is not a character object.'}); return rec; }
    rec.sourceId=(typeof raw.id==='string'&&raw.id.length>0)?raw.id:null;
    var m; try{ m=E.migrateChar(clone(raw)); }catch(e){ rec.errors.push({code:'character',msg:'Character could not be normalized.'}); return rec; }
    if((rec.sourceId==null)===false) m.id=rec.sourceId;
    m.totalLevel=E.totalLevel(m); m.tier=E.tierOf(m.totalLevel);
    var vb=E.validateBuild(m,'saved');
    rec.errors=vb.errors.slice();
    rec.warnings=vb.warnings.slice().concat(E.importSupplementWarnings(m));
    rec.char=m; rec.summary=E.characterSummary(m); rec.valid=(vb.valid===true);
    return rec;
  };

  /* ---------- validate payload envelope ---------- */
  E.validateImport=function(payload){
    var res={ ok:false, fatal:false, kind:null, errors:[], warnings:[], activeCharacterId:null, records:[], counts:{total:0,valid:0,invalid:0} };
    var data=payload;
    if(typeof payload==='string'){
      var t=payload.trim();
      if(t.length===0){ res.fatal=true; res.errors.push({code:'empty',msg:'The file is empty.'}); return res; }
      try{ data=JSON.parse(t); }catch(e){ res.fatal=true; res.errors.push({code:'json',msg:'This file is not valid JSON.'}); return res; }
    }
    if(data==null||(typeof data==='object')===false||Array.isArray(data)){ res.fatal=true; res.errors.push({code:'payload',msg:'Import data is not a StormMythic file.'}); return res; }
    var fmt=data.format;
    if((fmt===FMT_CHAR)===false&&(fmt===FMT_BACKUP)===false){ res.fatal=true; res.errors.push({code:'format',msg:'Unrecognized file format.'}); return res; }
    var fv=data.formatVersion;
    if(Number.isFinite(fv)===false||fv>FMT_VER){ res.fatal=true; res.errors.push({code:'formatVersion',msg:'Unsupported file version.'}); return res; }
    var sv=data.schemaVersion;
    if(Number.isFinite(sv)===false||sv>SM.schema){ res.fatal=true; res.errors.push({code:'schemaVersion',msg:'Unsupported character schema version.'}); return res; }
    if(fmt===FMT_CHAR){
      res.kind='character';
      if(data.character==null||(typeof data.character==='object')===false){ res.fatal=true; res.errors.push({code:'character',msg:'No character found in this file.'}); return res; }
      res.records.push(E.validateImportRecord(data.character,0));
    } else {
      res.kind='backup';
      if(Array.isArray(data.characters)===false){ res.fatal=true; res.errors.push({code:'characters',msg:'No characters array found in this backup.'}); return res; }
      res.activeCharacterId=(typeof data.activeCharacterId==='string')?data.activeCharacterId:null;
      data.characters.forEach(function(rc,i){ res.records.push(E.validateImportRecord(rc,i)); });
    }
    res.counts.total=res.records.length;
    res.counts.valid=res.records.filter(function(r){ return r.valid===true; }).length;
    res.counts.invalid=res.counts.total-res.counts.valid;
    res.ok=(res.counts.valid>0);
    return res;
  };

  /* ---------- resolve ids (collision-safe) ---------- */
  E.resolveImportIds=function(records, existingIds, mode){
    mode=(mode==='replace')?'replace':'add';
    var used={}; (existingIds||[]).forEach(function(id){ if((id==null)===false) used[id]=true; });
    var batch={};
    (records||[]).forEach(function(r){
      if((r.valid===true)===false) return;
      var origId=(r.char&&typeof r.char.id==='string'&&r.char.id.length>0)?r.char.id:null;
      var newId=origId, remapped=false, willReplace=false;
      if(origId==null){ newId=E.uniqueCharId(used); remapped=true; }
      else if(mode==='replace'){
        if(batch[origId]===true){ newId=E.uniqueCharId(used); remapped=true; }
        else { newId=origId; willReplace=(used[origId]===true); }
      } else {
        if(used[origId]===true||batch[origId]===true){ newId=E.uniqueCharId(used); remapped=true; }
        else newId=origId;
      }
      batch[newId]=true; used[newId]=true;
      r.originalId=origId; r.resolvedId=newId; r.remapped=remapped; r.willReplace=willReplace;
    });
    return records;
  };

  /* ---------- commit (atomic-style: prepare, then single write) ---------- */
  E.commitImport=function(records, opts){
    opts=opts||{}; var mode=(opts.mode==='replace')?'replace':'add';
    var summary={ added:0, replaced:0, remapped:0, rejected:0, ids:[] };
    var valids=(records||[]).filter(function(r){ return r.valid===true; });
    summary.rejected=(records||[]).length-valids.length;
    var next=E.store.rawChars().slice();
    valids.forEach(function(r){
      var ch=clone(r.char);
      var id=r.resolvedId||ch.id||E.newCharId();
      ch.id=id; ch.updated=Date.now(); if(ch.created==null) ch.created=Date.now();
      if(r.remapped===true) summary.remapped++;
      var idx=next.findIndex(function(x){ return x&&x.id===id; });
      if(idx>=0){ next[idx]=ch; summary.replaced++; } else { next.push(ch); summary.added++; }
      summary.ids.push(id);
    });
    E.store.saveChars(next);
    if((opts.restoreActiveId==null)===false){
      var target=opts.restoreActiveId;
      var mt=(records||[]).find(function(r){ return r.originalId===target&&r.resolvedId; });
      if(mt) target=mt.resolvedId;
      if((E.store.getChar(target)==null)===false) E.store.setActive(target);
    }
    var act=E.store.activeId();
    if(act==null||E.store.getChar(act)==null){ var first=E.store.chars()[0]; E.store.setActive(first?first.id:null); }
    return summary;
  };
})(SM.engine);

SM.io={

  today:function(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return 'backup'; } },

      return false;
    }
  },
  exportChar:function(id){

  },
  openImport:function(){

      +'<p class="small muted">Import a StormMythic character or a full backup. Existing characters are never overwritten by default.</p>'

  onFile:function(evt){

  fromPaste:function(){

      if(r.warnings&&r.warnings.length>0) tags.push('<span class="small faint">'+SM.ui.esc(r.warnings.map(function(w){return w.msg;}).join(' \u00b7 '))+'</span>');

      : (res.counts.valid>0?'1 character ready to import':'This character cannot be imported');
    var canImport=(res.counts.valid>0);
    var actions='<div class="row" style="margin-top:12px;gap:8px">';
    if(canImport){ actions+='<button class="btn primary" onclick="SM.io.confirmImport(\'add\')">Import as New</button><button class="btn" onclick="SM.io.confirmImport(\'replace\')" aria-label="Replace characters that share an ID">Replace Existing</button>'; }
    actions+='<button class="btn" onclick="SM.io.cancel()">Cancel</button></div>';
    SM.ui.modal('Import Preview', '<p class="small" role="status">'+SM.ui.esc(summ)+'</p>'+rows+actions);
    return res;
  },
  confirmImport:function(mode){
    var p=SM.io._pending;
    if(p==null||p.result==null){ SM.ui.toast('Nothing to import.','info'); return null; }
    var res=p.result;
    if(res.counts.valid<=0){ SM.ui.toast('Nothing to import.','info'); return null; }
    mode=(mode==='replace')?'replace':'add';
    var existing=SM.engine.store.chars().map(function(c){ return c.id; });
    SM.engine.resolveImportIds(res.records, existing, mode);
    var opts={ mode:mode };
    if(res.kind==='backup') opts.restoreActiveId=res.activeCharacterId;
    var sum=SM.engine.commitImport(res.records, opts);
    SM.io._pending=null;
    SM.ui.closeModal();
    var parts=[]; if(sum.added>0)parts.push(sum.added+' added'); if(sum.replaced>0)parts.push(sum.replaced+' replaced'); if(sum.remapped>0)parts.push(sum.remapped+' re-IDed'); if(sum.rejected>0)parts.push(sum.rejected+' rejected');
    SM.ui.toast('Import complete: '+(parts.join(', ')||'no changes')+'.', ((sum.added+sum.replaced)>0)?'ok':'info');
    SM.ui.render();
    return sum;
  },
  cancel:function(){ SM.io._pending=null; SM.ui.closeModal(); }
};



/* ===== PHASE 5A COMBAT CORE (engine only) ===== */

/* =====================================================================
   PHASE 5A: COMBAT CORE ENGINE  (SM.combat)
   ---------------------------------------------------------------------
   Engine/rules layer only. Deterministic when an RNG is injected.
   - Reuses existing authoritative helpers (E.mod, E.defenses, E.attackBonus,
     E.maxHP, E.resource, E.saveMod, E.speed, E.profBonus, E.tierOf ...).
   - Introduces NO new stat formulas and NO competing character schema.
   - Never writes to localStorage or mutates persistent character records.
   - No UI. Phase 5B builds the Battle UI on top of this API.
   ===================================================================== */
(function(){
  if (typeof SM === 'undefined') return;
  var E = SM.engine, D = SM.data;
  var C = {};
  SM.combat = C;
  C.version = '5A';

  var ATTR_IDS = ['MIG','VIG','PRE','SPI','AGI','INS','INT'];
  var PARTICIPANT_TYPES = ['PLAYER','ALLY','ENEMY','NPC','SUMMON'];
  var SIDE_OF = { PLAYER:'party', ALLY:'party', SUMMON:'party', ENEMY:'foe', NPC:'neutral' };

  /* -------------------- Central rules (edit here, never in UI) -------------------- */
  C.RULES = {
    d20Min: 1, d20Max: 20,
    critOn: 20, critMissOn: 1, critMissEnabled: true,
    critMultiplier: 2,               // critical doubles RAW damage before mitigation
    saveNatCrit: true,               // nat20 auto-success, nat1 auto-fail on saves
    minDamageOnHit: 1,               // a connecting attack deals at least this much
    downedStateTypes: ['PLAYER','ALLY'], // these go DOWNED at 0 HP; others are DEFEATED
    downedToDefeatedOnZeroAgain: true,
    clearConditionsOnDefeat: true,
    woundedThreshold: 0.5            // 0 < hp <= maxHp*threshold => 'wounded'
  };

  /* -------------------- Event type constants -------------------- */
  C.EVENTS = {
    COMBAT_STARTED:'COMBAT_STARTED', ROUND_STARTED:'ROUND_STARTED',
    TURN_STARTED:'TURN_STARTED', TURN_ENDED:'TURN_ENDED',
    ATTACK_DECLARED:'ATTACK_DECLARED', ATTACK_RESOLVED:'ATTACK_RESOLVED',
    DAMAGE_DEALT:'DAMAGE_DEALT', HEALING_APPLIED:'HEALING_APPLIED',
    CONDITION_APPLIED:'CONDITION_APPLIED', CONDITION_REMOVED:'CONDITION_REMOVED',
    RESOURCE_SPENT:'RESOURCE_SPENT', RESOURCE_RESTORED:'RESOURCE_RESTORED',
    PARTICIPANT_DOWNED:'PARTICIPANT_DOWNED', PARTICIPANT_DEFEATED:'PARTICIPANT_DEFEATED',
    SAVE_RESOLVED:'SAVE_RESOLVED', ABILITY_EXECUTED:'ABILITY_EXECUTED', SPELL_CAST:'SPELL_CAST',
    REACTION_TRIGGERED:'REACTION_TRIGGERED',
    COMBAT_VICTORY:'COMBAT_VICTORY', COMBAT_DEFEAT:'COMBAT_DEFEAT'
  };
  C.PARTICIPANT_TYPES = PARTICIPANT_TYPES.slice();

  /* -------------------- Small utilities -------------------- */
  function err(code, message){ return { ok:false, error:code, message: message || code }; }
  function num(v, d){
    if (typeof v === 'number' && isFinite(v)) return v;
    if (v !== null && v !== undefined && v !== '' && isFinite(Number(v))) return Number(v);
    return d;
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function isObj(x){ return x !== null && typeof x === 'object'; }

  /* -------------------- Injectable RNG -------------------- */
  // mulberry32 seeded PRNG -> deterministic function returning a float in [0,1)
  C.makeRng = function(seed){
    var a = (seed >>> 0) || 0x9e3779b9;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  function rngOf(state){ return (state && typeof state.rng === 'function') ? state.rng : Math.random; }
  function rollDie(state, sides){ sides = sides || 20; return Math.floor(rngOf(state)() * sides) + 1; }
  C.rollDie = rollDie;

  /* -------------------- Thin calc wrappers (reuse existing helpers; NO new formulas) -------------------- */
  C.calc = {
    getAttributeModifier: function(v){ return E.mod(v); },
    calculatePhysicalDefense: function(c){ return E.defenses(c).physicalDefense; },
    calculateMagicDefense: function(c){ return E.defenses(c).magicDefense; },
    calculateEvasion: function(c){ return E.defenses(c).evasion; },
    calculateBlock: function(c){ return E.defenses(c).block; },
    calculateScalingBonus: function(c){ var m=E.mods(c), w=E.equippedItem(c,'weapon'); return m[(w&&w.scale)||'MIG']||0; },
    calculateAttackPower: function(c){ return E.attackBonus(c); }
  };

  /* -------------------- Character -> combat snapshot (pure; never mutates the record) -------------------- */
  C.snapshotCharacter = function(char){
    if (!isObj(char)) return null;
    var mods = E.mods(char);
    var def = E.defenses(char);
    var res = E.resource(char);
    var total = E.totalLevel(char);
    var prof = E.profBonus(total);
    var p = E.primaryClass(char);
    var castKey = (p && p.primary && p.primary[1]) || 'SPI';
    var saveMods = {};
    ATTR_IDS.forEach(function(k){ saveMods[k] = E.saveMod(char, k); });
    return {
      maxHp: E.maxHP(char),
      speed: E.speed(char),
      attackBonus: E.attackBonus(char),
      magicAttackBonus: prof + (mods[castKey] || 0),
      defenses: {
        physicalDefense: def.physicalDefense, magicDefense: def.magicDefense,
        evasion: def.evasion, block: def.block,
        defenseValue: def.defenseValue, magicTarget: def.magicTarget
      },
      saveMods: saveMods,
      resource: { name: res.name, max: res.max, current: res.max },
      initiativeMod: mods.AGI || 0,
      tier: E.tierOf(total), totalLevel: total
    };
  };

  /* -------------------- Combat state -------------------- */
  var _combatCounter = 0;
  C.createCombat = function(opts){
    opts = opts || {};
    var rng;
    if (typeof opts.rng === 'function') rng = opts.rng;
    else if (opts.seed !== null && opts.seed !== undefined) rng = C.makeRng(opts.seed);
    else rng = Math.random;
    return {
      combatId: opts.combatId || ('cmb-' + Date.now().toString(36) + '-' + (++_combatCounter)),
      round: 0, turnIndex: -1, phase: 'setup',    // 'setup' | 'active' | 'ended'
      participants: [], order: [], activeId: null,
      defeated: [], log: [], pendingReactions: [], pendingEffects: [],
      encounter: opts.encounter || {}, outcome: null,
      rng: rng, _seq: 0, _pcount: 0, listeners: {}
    };
  };

  /* -------------------- Events / log / listeners -------------------- */
  C.emitCombatEvent = function(state, type, data){
    data = data || {};
    var ev = {
      seq: ++state._seq, type: type, round: state.round, turnIndex: state.turnIndex,
      actorId: data.actorId || null, targetId: data.targetId || null, data: data
    };
    state.log.push(ev);
    var ls = state.listeners[type] || [];
    for (var i = 0; i < ls.length; i++){ try { ls[i](ev, state); } catch(e){} }
    var any = state.listeners['*'] || [];
    for (var j = 0; j < any.length; j++){ try { any[j](ev, state); } catch(e){} }
    if (type !== C.EVENTS.REACTION_TRIGGERED) scanTriggers(state, ev);
    return ev;
  };
  C.on = function(state, type, fn){
    if (typeof fn !== 'function') return function(){};
    (state.listeners[type] = state.listeners[type] || []).push(fn);
    return function off(){ var arr = state.listeners[type]; var i = arr.indexOf(fn); if (i >= 0) arr.splice(i, 1); };
  };
  C.getCombatLog = function(state){ return state ? state.log.slice() : []; };

  /* -------------------- Reaction / passive trigger scan (event-driven, extensible) -------------------- */
  // Participants may carry reactions/passives as { when:<eventType>, id, kind }.
  // Matching triggers are queued into state.pendingReactions for the UI/AI layer to resolve.
  function scanTriggers(state, ev){
    for (var i = 0; i < state.participants.length; i++){
      var p = state.participants[i];
      if (p.state === 'defeated') continue;
      var specs = (p.reactions || []).concat(p.passives || []);
      for (var s = 0; s < specs.length; s++){
        var spec = specs[s];
        if (spec.when && spec.when !== ev.type) continue;
        var ok = true;
        if (typeof spec.match === 'function'){ try { ok = !!spec.match(ev, p, state); } catch(e){ ok = false; } }
        if (ok){
          state.pendingReactions.push({ participantId: p.id, trigger: spec.id || spec.when, event: ev.seq, kind: spec.kind || 'reaction' });
          C.emitCombatEvent(state, C.EVENTS.REACTION_TRIGGERED, { actorId: p.id, trigger: spec.id || spec.when, sourceEvent: ev.seq });
        }
      }
    }
  }
  // NOTE: REACTION_TRIGGERED is emitted OUTSIDE emitCombatEvent's scan loop to avoid recursion.
  // scanTriggers is only invoked from emitCombatEvent; it must not itself re-scan. Guard below.

  /* -------------------- Turn-state helper -------------------- */
  function baseTurn(speed){
    return { action:true, bonus:true, reaction:true, movement: (speed || 0), maxMovement: (speed || 0), used:{} };
  }

  /* -------------------- Participants -------------------- */
  C.getParticipant = function(state, id){
    if (!state || !id) return null;
    for (var i = 0; i < state.participants.length; i++){ if (state.participants[i].id === id) return state.participants[i]; }
    return null;
  };

  C.addParticipant = function(state, spec){
    if (!state) return err('invalid_state', 'No combat state.');
    if (state.phase === 'ended') return err('invalid_state', 'Combat already ended.');
    spec = spec || {};
    var type = PARTICIPANT_TYPES.indexOf(spec.type) >= 0 ? spec.type : 'ENEMY';
    var snap = null, refId = null, name = spec.name;

    if (isObj(spec.character)){
      snap = C.snapshotCharacter(spec.character);
      refId = spec.character.id || null;
      if (!name) name = spec.character.name || 'Hero';
    } else if (spec.characterId && E.store && typeof E.store.getChar === 'function'){
      var ch = E.store.getChar(spec.characterId);
      if (ch){ snap = C.snapshotCharacter(ch); refId = ch.id; if (!name) name = ch.name; }
    }

    if (!snap){
      // Generic entity spec (enemy / npc / summon): explicit numbers, no character record.
      var def = spec.defenses || {};
      snap = {
        maxHp: num(spec.maxHp, num(spec.hp, 1)),
        speed: num(spec.speed, 30),
        attackBonus: num(spec.attackBonus, 0),
        magicAttackBonus: num(spec.magicAttackBonus, num(spec.attackBonus, 0)),
        defenses: {
          physicalDefense: num(def.physicalDefense, 0), magicDefense: num(def.magicDefense, 0),
          evasion: num(def.evasion, 0), block: num(def.block, 0),
          defenseValue: num(def.defenseValue, 10 + num(def.physicalDefense, 0)),
          magicTarget: num(def.magicTarget, 10 + num(def.magicDefense, 0))
        },
        saveMods: spec.saveMods || {},
        resource: spec.resource
          ? { name: spec.resource.name || 'Resource', max: num(spec.resource.max, 0), current: num(spec.resource.current, num(spec.resource.max, 0)) }
          : { name: '-', max: 0, current: 0 },
        initiativeMod: num(spec.initiativeMod, 0),
        tier: spec.tier || 'Heroic', totalLevel: num(spec.totalLevel, 1)
      };
    }

    var maxHp = Math.max(1, num(snap.maxHp, 1));
    var startHp = (spec.hp !== null && spec.hp !== undefined) ? clamp(num(spec.hp, maxHp), 0, maxHp) : maxHp;

    var p = {
      id: spec.id || ('p' + (++state._pcount)),
      name: name || (type.charAt(0) + type.slice(1).toLowerCase()),
      type: type,
      side: spec.side || SIDE_OF[type] || 'neutral',
      ref: refId,
      maxHp: maxHp, hp: startHp, tempHp: num(spec.tempHp, 0),
      resources: { name: snap.resource.name, max: snap.resource.max, current: num(snap.resource.current, snap.resource.max) },
      defenses: snap.defenses,
      attackBonus: snap.attackBonus, magicAttackBonus: snap.magicAttackBonus,
      saveMods: snap.saveMods || {}, speed: snap.speed,
      mitigation: spec.mitigation || {}, flatMitigation: num(spec.flatMitigation, 0),
      initiative: (spec.initiative !== null && spec.initiative !== undefined && isFinite(Number(spec.initiative))) ? Number(spec.initiative) : null,
      initiativeMod: num(spec.initiativeMod, snap.initiativeMod),
      conditions: [], turn: baseTurn(snap.speed),
      reactions: spec.reactions || [], passives: spec.passives || [],
      cooldowns: {}, flags: spec.flags || {},
      _seq: state._pcount, state: 'healthy',
      tier: snap.tier, totalLevel: snap.totalLevel
    };
    reclassifyIfAlive(p);
    state.participants.push(p);
    return { ok:true, participant:p, id:p.id };
  };

  C.removeParticipant = function(state, id){
    var i = -1;
    for (var k = 0; k < state.participants.length; k++){ if (state.participants[k].id === id){ i = k; break; } }
    if (i < 0) return err('not_found', 'Participant not found.');
    var p = state.participants.splice(i, 1)[0];
    var oi = state.order.indexOf(id); if (oi >= 0) state.order.splice(oi, 1);
    var di = state.defeated.indexOf(id); if (di >= 0) state.defeated.splice(di, 1);
    if (state.activeId === id) state.activeId = null;
    return { ok:true, participant:p };
  };

  function reclassifyIfAlive(p){
    if (p.hp > 0){ p.state = (p.hp <= p.maxHp * C.RULES.woundedThreshold) ? 'wounded' : 'healthy'; }
  }

  /* -------------------- Initiative -------------------- */
  C.rollInitiative = function(state){
    state.participants.forEach(function(p){
      if (p.initiative === null || p.initiative === undefined){
        p.initiative = rollDie(state, 20) + (p.initiativeMod || 0);
      }
    });
    state.order = state.participants.slice().sort(cmpInit).map(function(p){ return p.id; });
    return state.order.slice();
  };
  function cmpInit(a, b){
    if (b.initiative !== a.initiative) return b.initiative - a.initiative;             // higher total first
    if ((b.initiativeMod || 0) !== (a.initiativeMod || 0)) return (b.initiativeMod || 0) - (a.initiativeMod || 0); // higher mod wins ties
    return a._seq - b._seq;                                                            // stable by insertion order
  }

  /* -------------------- Turn order -------------------- */
  C.startCombat = function(state){
    if (!state) return err('invalid_state');
    if (state.phase === 'active') return err('already_active', 'Combat already started.');
    if (state.participants.length === 0) return err('no_participants', 'Add participants before starting.');
    if (state.order.length === 0) C.rollInitiative(state);
    state.phase = 'active'; state.round = 0; state.outcome = null;
    C.emitCombatEvent(state, C.EVENTS.COMBAT_STARTED, { order: state.order.slice() });
    return C.startRound(state);
  };

  C.startRound = function(state){
    if (state.phase !== 'active') return err('not_active', 'Combat is not active.');
    state.round += 1; state.turnIndex = -1;
    state.participants.forEach(function(p){ if (p.state !== 'defeated'){ p.turn = baseTurn(p.speed); } });
    C.emitCombatEvent(state, C.EVENTS.ROUND_STARTED, { round: state.round });
    return C.startTurn(state);
  };

  C.startTurn = function(state){
    var n = state.order.length;
    for (var step = 0; step < n; step++){
      state.turnIndex += 1;
      if (state.turnIndex >= n) break;
      var p = C.getParticipant(state, state.order[state.turnIndex]);
      if (p && p.state !== 'defeated' && p.state !== 'downed'){
        state.activeId = p.id;
        p.turn = baseTurn(p.speed);                 // action economy resets at the start of the participant's turn
        C.emitCombatEvent(state, C.EVENTS.TURN_STARTED, { actorId: p.id });
        processConditionsFor(state, p, 'turnStart');
        return { ok:true, activeId:p.id, participant:p };
      }
    }
    // Round exhausted (or nobody actable this pass)
    var chk = C.checkCombatEnd(state);
    if (chk.ended) return chk;
    var anyActable = state.participants.some(function(p){ return p.state !== 'defeated' && p.state !== 'downed'; });
    if (!anyActable){ state.activeId = null; return { ok:true, stalled:true, activeId:null }; }
    return C.startRound(state);
  };

  C.endTurn = function(state){
    var p = C.getActiveParticipant(state);
    if (!p) return err('no_active', 'No active participant.');
    processConditionsFor(state, p, 'turnEnd');
    C.emitCombatEvent(state, C.EVENTS.TURN_ENDED, { actorId: p.id });
    var end = C.checkCombatEnd(state);
    if (end.ended) return end;
    return C.startTurn(state);
  };

  C.getActiveParticipant = function(state){ return state.activeId ? C.getParticipant(state, state.activeId) : null; };

  C.checkCombatEnd = function(state){
    var foes = state.participants.filter(function(p){ return p.side === 'foe'; });
    var party = state.participants.filter(function(p){ return p.side === 'party'; });
    var foesLeft = foes.filter(function(p){ return p.state !== 'defeated'; }).length;
    var partyActable = party.filter(function(p){ return p.state !== 'defeated' && p.state !== 'downed'; }).length;

    if (foes.length > 0 && foesLeft === 0){
      if (state.outcome !== 'victory'){ state.outcome = 'victory'; state.phase = 'ended'; C.emitCombatEvent(state, C.EVENTS.COMBAT_VICTORY, {}); }
      return { ok:true, ended:true, outcome:'victory' };
    }
    if (party.length > 0 && foes.length > 0 && partyActable === 0){
      if (state.outcome !== 'defeat'){ state.outcome = 'defeat'; state.phase = 'ended'; C.emitCombatEvent(state, C.EVENTS.COMBAT_DEFEAT, {}); }
      return { ok:true, ended:true, outcome:'defeat' };
    }
    return { ok:true, ended:false, outcome:null };
  };

  /* -------------------- Action economy -------------------- */
  function spendEcon(state, id, key){
    var p = C.getParticipant(state, id || state.activeId);
    if (!p) return err('invalid_participant', 'Participant not found.');
    if (p.state === 'defeated' || p.state === 'downed') return err('cannot_act', 'Participant cannot act.');
    if (key !== 'reaction' && p.id !== state.activeId) return err('not_active_turn', 'Not this participant\'s turn.');
    if (p.turn[key] !== true) return err('unavailable', 'No ' + key + ' available.');
    p.turn[key] = false;
    return { ok:true, participant:p, spent:key };
  }
  C.spendAction = function(state, id){ return spendEcon(state, id, 'action'); };
  C.spendBonusAction = function(state, id){ return spendEcon(state, id, 'bonus'); };
  C.useReaction = function(state, id){ return spendEcon(state, id, 'reaction'); };
  C.move = function(state, id, dist){
    var p = C.getParticipant(state, id || state.activeId);
    if (!p) return err('invalid_participant');
    if (p.state === 'defeated' || p.state === 'downed') return err('cannot_act');
    if (p.id !== state.activeId) return err('not_active_turn');
    dist = num(dist, 0);
    if (dist < 0) return err('invalid_distance');
    if (dist > p.turn.movement) return err('insufficient_movement', 'Not enough movement.');
    p.turn.movement -= dist;
    return { ok:true, remaining:p.turn.movement };
  };

  /* -------------------- Defense pipeline -------------------- */
  C.getDefenseTarget = function(p, type){
    var magic = (type === 'magical' || type === 'spell' || type === 'magic');
    return magic ? p.defenses.magicTarget : p.defenses.defenseValue;
  };

  /* -------------------- Attack resolution -------------------- */
  var ATTACK_TYPES = ['melee','ranged','physical','magical','spell','ability'];
  C.resolveAttack = function(state, opts){
    opts = opts || {};
    var atk = C.getParticipant(state, opts.attackerId);
    var tgt = C.getParticipant(state, opts.targetId);
    if (!atk) return err('invalid_attacker', 'Attacker not found.');
    if (!tgt) return err('invalid_target', 'Target not found.');
    if (atk.state === 'defeated' || atk.state === 'downed') return err('attacker_cannot_act', 'Attacker cannot act.');
    if (tgt.state === 'defeated') return err('target_defeated', 'Target already defeated.');
    if (ATTACK_TYPES.indexOf(opts.type) < 0 && opts.type !== undefined && opts.type !== null) return err('invalid_attack_type', 'Unknown attack type: ' + opts.type);
    var type = ATTACK_TYPES.indexOf(opts.type) >= 0 ? opts.type : 'physical';
    var magic = (type === 'magical' || type === 'spell');
    var bonus = (typeof opts.bonus === 'number') ? opts.bonus : (magic ? atk.magicAttackBonus : atk.attackBonus);
    var defKey = opts.defenseKey || (magic ? 'magicTarget' : 'defenseValue');
    var target = (typeof opts.defense === 'number') ? opts.defense : tgt.defenses[defKey];

    var roll = rollDie(state, 20);
    var total = roll + bonus;
    var critMiss = C.RULES.critMissEnabled && roll === C.RULES.critMissOn;
    var crit = roll === C.RULES.critOn;
    var hit = crit ? true : (critMiss ? false : total >= target);

    C.emitCombatEvent(state, C.EVENTS.ATTACK_DECLARED, { actorId: atk.id, targetId: tgt.id, type: type });

    var result = {
      ok:true, hit:hit, critical: hit && crit, criticalMiss: critMiss,
      attackRoll: roll, attackTotal: total, bonus: bonus,
      defense: target, defenseKey: defKey, type: type,
      damageType: opts.damageType || (magic ? 'magical' : 'physical'),
      attackerId: atk.id, targetId: tgt.id, damage: 0, damageResult: null
    };

    if (hit && opts.damage !== null && opts.damage !== undefined){
      var dmg = C.resolveDamage(state, {
        targetId: tgt.id, amount: num(opts.damage, 0), type: result.damageType,
        critical: result.critical, sourceId: atk.id,
        minDamage: (opts.minDamage !== null && opts.minDamage !== undefined) ? opts.minDamage : C.RULES.minDamageOnHit,
        mitigate: opts.mitigate !== false
      });
      result.damage = dmg.finalDamage; result.damageResult = dmg;
    }
    C.emitCombatEvent(state, C.EVENTS.ATTACK_RESOLVED, { actorId: atk.id, targetId: tgt.id, hit: hit, critical: result.critical, damage: result.damage });
    return result;
  };

  /* -------------------- Damage engine (centralized) -------------------- */
  C.resolveDamage = function(state, opts){
    opts = opts || {};
    var tgt = C.getParticipant(state, opts.targetId);
    if (!tgt) return err('invalid_target', 'Target not found.');
    var raw = num(opts.amount, 0); if (raw < 0) raw = 0;
    var type = opts.type || 'physical';
    var critical = opts.critical === true;
    if (critical) raw = Math.round(raw * C.RULES.critMultiplier);

    // Centralized flat mitigation, kept separate from the to-hit defense so it is never double-counted.
    var mitigation = 0;
    if (opts.mitigate !== false){
      var mit = tgt.mitigation || {};
      mitigation = num(mit[type], 0) + num(tgt.flatMitigation, 0);
    }
    if (typeof opts.mitigation === 'number') mitigation = opts.mitigation;

    var minD = num(opts.minDamage, 0);
    var mitigated = raw - mitigation;
    if (mitigated < minD) mitigated = minD;
    if (mitigated < 0) mitigated = 0;
    var finalDamage = mitigated;

    var before = tgt.hp;
    var remaining = finalDamage, tempAbsorbed = 0;
    if (tgt.tempHp > 0){ tempAbsorbed = Math.min(tgt.tempHp, remaining); tgt.tempHp -= tempAbsorbed; remaining -= tempAbsorbed; }
    applyHpLoss(state, tgt, remaining, opts.sourceId);
    var after = tgt.hp;

    var res = {
      ok:true, rawDamage: raw, mitigation: mitigation, mitigatedDamage: finalDamage, finalDamage: finalDamage,
      damageType: type, critical: critical, tempAbsorbed: tempAbsorbed,
      targetHpBefore: before, targetHpAfter: after,
      downed: tgt.state === 'downed', defeated: tgt.state === 'defeated', targetId: tgt.id
    };
    C.emitCombatEvent(state, C.EVENTS.DAMAGE_DEALT, { actorId: opts.sourceId || null, targetId: tgt.id, amount: finalDamage, damageType: type, critical: critical });
    return res;
  };

  /* -------------------- Downed / defeated model -------------------- */
  function applyHpLoss(state, p, amount, sourceId){
    if (amount <= 0){ reclassifyIfAlive(p); return; }
    var wasDown = (p.state === 'downed');
    p.hp = Math.max(0, p.hp - amount);
    if (p.hp > 0){ reclassifyIfAlive(p); return; }
    if (wasDown){
      if (C.RULES.downedToDefeatedOnZeroAgain) setDefeated(state, p, sourceId);
      return;
    }
    if (C.RULES.downedStateTypes.indexOf(p.type) >= 0){
      p.state = 'downed';
      C.emitCombatEvent(state, C.EVENTS.PARTICIPANT_DOWNED, { actorId: sourceId || null, targetId: p.id });
    } else {
      setDefeated(state, p, sourceId);
    }
  }
  function setDefeated(state, p, sourceId){
    p.state = 'defeated';
    if (state.defeated.indexOf(p.id) < 0) state.defeated.push(p.id);
    if (C.RULES.clearConditionsOnDefeat) p.conditions = [];
    C.emitCombatEvent(state, C.EVENTS.PARTICIPANT_DEFEATED, { actorId: sourceId || null, targetId: p.id });
    C.checkCombatEnd(state);
  }
  // Death-save hook (documented default; centralized so Phases 5B-5E can override).
  C.rollDeathSave = function(state, id, opts){
    opts = opts || {};
    var p = C.getParticipant(state, id);
    if (!p) return err('invalid_participant');
    if (p.state !== 'downed') return err('not_down', 'Participant is not downed.');
    var dc = num(opts.dc, 10);
    var roll = rollDie(state, 20);
    var success = roll >= dc;
    return { ok:true, roll: roll, dc: dc, success: success, note: 'Default death-save hook; final rules set in a later phase.' };
  };
  C.revive = function(state, id, hp){
    var p = C.getParticipant(state, id);
    if (!p) return err('invalid_participant');
    if (p.state !== 'downed' && p.state !== 'defeated') return err('not_down', 'Participant is not downed or defeated.');
    var di = state.defeated.indexOf(p.id); if (di >= 0) state.defeated.splice(di, 1);
    p.hp = clamp(num(hp, 1), 1, p.maxHp);
    reclassifyIfAlive(p);
    return { ok:true, participant:p, hp:p.hp };
  };

  /* -------------------- Healing -------------------- */
  C.resolveHealing = function(state, opts){
    opts = opts || {};
    var tgt = C.getParticipant(state, opts.targetId);
    if (!tgt) return err('invalid_target', 'Target not found.');
    var amount = num(opts.amount, 0); if (amount < 0) amount = 0;

    if (opts.temp === true){
      var tb = tgt.tempHp;
      tgt.tempHp = Math.max(tgt.tempHp, amount); // temporary HP does not stack; keep the higher pool
      C.emitCombatEvent(state, C.EVENTS.HEALING_APPLIED, { targetId: tgt.id, temp:true, amount: tgt.tempHp - tb });
      return { ok:true, temp:true, requested:amount, healed:0, overheal:0, tempBefore:tb, tempAfter:tgt.tempHp, targetHpBefore:tgt.hp, targetHpAfter:tgt.hp, revived:false };
    }

    var canRevive = opts.allowRevive === true;
    if (tgt.state === 'defeated' && !canRevive){
      return { ok:true, healed:0, blocked:true, reason:'defeated', requested:amount, overheal:0, targetHpBefore:tgt.hp, targetHpAfter:tgt.hp, revived:false, temp:false };
    }
    var before = tgt.hp, revived = false;
    if ((tgt.state === 'downed' || tgt.state === 'defeated') && canRevive){
      var di = state.defeated.indexOf(tgt.id); if (di >= 0) state.defeated.splice(di, 1);
      revived = true;
    }
    var healed = Math.max(0, Math.min(amount, tgt.maxHp - tgt.hp));
    tgt.hp += healed;
    var overheal = amount - healed;
    reclassifyIfAlive(tgt);
    C.emitCombatEvent(state, C.EVENTS.HEALING_APPLIED, { targetId: tgt.id, amount: healed, revived: revived });
    return { ok:true, requested:amount, healed:healed, overheal:overheal, targetHpBefore:before, targetHpAfter:tgt.hp, revived:revived, temp:false };
  };

  /* -------------------- Saving throws -------------------- */
  C.resolveSave = function(state, opts){
    opts = opts || {};
    var p = C.getParticipant(state, opts.participantId);
    if (!p) return err('invalid_participant', 'Participant not found.');
    var attr = opts.attr;
    var mod = (typeof opts.bonus === 'number') ? opts.bonus : num((p.saveMods || {})[attr], 0);
    var dc = num(opts.dc, 10);
    var roll = rollDie(state, 20);
    var total = roll + mod;
    var success = total >= dc, critical = false;
    if (C.RULES.saveNatCrit){
      if (roll === C.RULES.critOn){ success = true; critical = true; }
      else if (roll === C.RULES.critMissOn){ success = false; critical = true; }
    }
    C.emitCombatEvent(state, C.EVENTS.SAVE_RESOLVED, { targetId: p.id, attr: attr, dc: dc, roll: roll, total: total, success: success });
    return { ok:true, success:success, roll:roll, total:total, dc:dc, attr:attr, mod:mod, critical:critical, participantId:p.id };
  };

  /* -------------------- Conditions / status effects -------------------- */
  // Extensible tick-effect registry (id -> { onTurnStart, onTurnEnd }). Not hardcoded into UI.
  C.CONDITION_EFFECTS = {
    burning:      { onTurnStart: function(s,p,c){ C.resolveDamage(s,{ targetId:p.id, amount: num(c.value,2), type:'fire',   minDamage:0, mitigate:false, sourceId:c.source||null }); } },
    poisoned:     { onTurnStart: function(s,p,c){ C.resolveDamage(s,{ targetId:p.id, amount: num(c.value,2), type:'poison', minDamage:0, mitigate:false, sourceId:c.source||null }); } },
    bleeding:     { onTurnStart: function(s,p,c){ C.resolveDamage(s,{ targetId:p.id, amount: num(c.value,1), type:'physical',minDamage:0, mitigate:false, sourceId:c.source||null }); } },
    regeneration: { onTurnStart: function(s,p,c){ C.resolveHealing(s,{ targetId:p.id, amount: num(c.value,2) }); } }
  };

  C.applyCondition = function(state, opts){
    opts = opts || {};
    var tgt = C.getParticipant(state, opts.targetId);
    if (!tgt) return err('invalid_target', 'Target not found.');
    var id = opts.id;
    if (!id || typeof id !== 'string') return err('invalid_condition', 'Condition id required.');
    if (tgt.state === 'defeated') return err('target_defeated', 'Cannot apply conditions to a defeated participant.');
    var meta = (E.condition ? E.condition(id) : null);
    var name = opts.name || (meta && meta.name) || id;
    var stackable = opts.stackable === true;
    var existing = null;
    for (var i = 0; i < tgt.conditions.length; i++){ if (tgt.conditions[i].id === id){ existing = tgt.conditions[i]; break; } }

    if (existing){
      if (stackable){
        existing.stacks = (existing.stacks || 1) + num(opts.stacks, 1);
        if (opts.maxStacks) existing.stacks = Math.min(existing.stacks, num(opts.maxStacks, existing.stacks));
      }
      if (opts.duration !== null && opts.duration !== undefined){
        var incoming = num(opts.duration, 0);
        var cur = existing.permanent ? Infinity : num(existing.duration, 0);
        existing.duration = (opts.refresh === true) ? incoming : Math.max(cur, incoming);
        if (existing.duration !== Infinity) existing.permanent = false;
      }
      if (opts.value !== null && opts.value !== undefined) existing.value = opts.value;
      C.emitCombatEvent(state, C.EVENTS.CONDITION_APPLIED, { targetId: tgt.id, conditionId: id, refreshed:true, stacks: existing.stacks });
      return { ok:true, condition: existing, refreshed:true };
    }

    var permanent = (opts.duration === null || opts.duration === undefined);
    var cond = {
      id: id, name: name,
      duration: permanent ? Infinity : num(opts.duration, 1), permanent: permanent,
      stacks: stackable ? num(opts.stacks, 1) : 1,
      value: (opts.value !== null && opts.value !== undefined) ? opts.value : null,
      source: opts.source || null,
      tags: opts.tags || (meta && meta.tags) || [],
      startRound: state.round, data: opts.data || {}
    };
    tgt.conditions.push(cond);
    C.emitCombatEvent(state, C.EVENTS.CONDITION_APPLIED, { targetId: tgt.id, conditionId: id, stacks: cond.stacks });
    return { ok:true, condition: cond, refreshed:false };
  };

  C.removeCondition = function(state, opts){
    opts = opts || {};
    var tgt = C.getParticipant(state, opts.targetId);
    if (!tgt) return err('invalid_target', 'Target not found.');
    var i = -1;
    for (var k = 0; k < tgt.conditions.length; k++){ if (tgt.conditions[k].id === opts.id){ i = k; break; } }
    if (i < 0) return { ok:true, removed:false };
    var c = tgt.conditions.splice(i, 1)[0];
    C.emitCombatEvent(state, C.EVENTS.CONDITION_REMOVED, { targetId: tgt.id, conditionId: c.id, expired: opts.expired === true });
    return { ok:true, removed:true, condition:c };
  };

  C.hasCondition = function(state, id, condId){
    var p = C.getParticipant(state, id);
    return p ? p.conditions.some(function(c){ return c.id === condId; }) : false;
  };

  C.processConditions = function(state, phase, id){
    var targets = id ? [C.getParticipant(state, id)] : state.participants.slice();
    targets.forEach(function(p){ if (p) processConditionsFor(state, p, phase); });
    return { ok:true };
  };

  function processConditionsFor(state, p, phase){
    if (!p || p.state === 'defeated') return;
    var list = p.conditions.slice();
    list.forEach(function(c){
      var eff = C.CONDITION_EFFECTS[c.id];
      if (!eff) return;
      if (phase === 'turnStart' && typeof eff.onTurnStart === 'function') eff.onTurnStart(state, p, c);
      if (phase === 'turnEnd' && typeof eff.onTurnEnd === 'function') eff.onTurnEnd(state, p, c);
    });
    if (phase === 'turnEnd'){
      p.conditions.slice().forEach(function(c){
        if (c.permanent || c.duration === Infinity) return;
        c.duration -= 1;
        if (c.duration <= 0) C.removeCondition(state, { targetId: p.id, id: c.id, expired:true });
      });
    }
  }

  /* -------------------- Resources -------------------- */
  C.checkResource = function(state, id, amount){
    var p = C.getParticipant(state, id);
    if (!p) return false;
    return (p.resources.current || 0) >= num(amount, 0);
  };
  C.spendResource = function(state, id, amount){
    var p = C.getParticipant(state, id);
    if (!p) return err('invalid_participant', 'Participant not found.');
    var cost = num(amount, 0);
    if ((p.resources.current || 0) < cost) return err('insufficient_resource', 'Not enough ' + (p.resources.name || 'resource') + '.');
    p.resources.current -= cost;
    C.emitCombatEvent(state, C.EVENTS.RESOURCE_SPENT, { targetId: p.id, amount: cost, resource: p.resources.name });
    return { ok:true, current: p.resources.current };
  };
  C.restoreResource = function(state, id, amount){
    var p = C.getParticipant(state, id);
    if (!p) return err('invalid_participant', 'Participant not found.');
    var amt = num(amount, 0);
    p.resources.current = Math.min(p.resources.max, (p.resources.current || 0) + amt);
    C.emitCombatEvent(state, C.EVENTS.RESOURCE_RESTORED, { targetId: p.id, amount: amt, resource: p.resources.name });
    return { ok:true, current: p.resources.current };
  };

  /* -------------------- Ability / spell execution hooks (Phase 5C fills content) -------------------- */
  C.ABILITY_HANDLERS = {};   // abilityId -> function(state, ctx) -> result
  C.SPELL_HANDLERS = {};      // spellId   -> function(state, ctx) -> result

  function executeVia(state, opts, kind){
    opts = opts || {};
    var actor = C.getParticipant(state, opts.actorId);
    if (!actor) return err('invalid_participant', 'Actor not found.');
    if (actor.state === 'defeated' || actor.state === 'downed') return err('cannot_act', 'Actor cannot act.');
    var contentId = (kind === 'spell') ? opts.spellId : opts.abilityId;
    var meta = (kind === 'spell') ? (E.spell ? E.spell(contentId) : null) : (E.ability ? E.ability(contentId) : null);

    // Validate resource availability BEFORE consuming the action (no partial commits).
    if (opts.cost !== null && opts.cost !== undefined && !C.checkResource(state, actor.id, opts.cost)){
      return err('insufficient_resource', 'Not enough ' + (actor.resources.name || 'resource') + '.');
    }
    var actKey = opts.action || 'action';
    if (actKey !== 'free'){
      var sp = spendEcon(state, actor.id, actKey === 'bonus' ? 'bonus' : 'action');
      if (!sp.ok) return sp;
    }
    if (opts.cost !== null && opts.cost !== undefined){
      var rc = C.spendResource(state, actor.id, opts.cost);
      if (!rc.ok) return rc;
    }

    var ctx = { state: state, actor: actor, actorId: actor.id, targetIds: opts.targetIds || [], meta: meta, contentId: contentId, opts: opts };
    var handlers = (kind === 'spell') ? C.SPELL_HANDLERS : C.ABILITY_HANDLERS;
    var out = { ok:true, executed:true, effects:[], contentId: contentId };
    var handler = handlers[contentId];
    if (typeof handler === 'function'){
      try { out = handler(state, ctx) || out; }
      catch(e){ out = { ok:false, error:'handler_error', message: String((e && e.message) || e) }; }
    }
    C.emitCombatEvent(state, (kind === 'spell') ? C.EVENTS.SPELL_CAST : C.EVENTS.ABILITY_EXECUTED,
      { actorId: actor.id, contentId: contentId, targetIds: opts.targetIds || [] });
    return out;
  }
  C.executeAbility = function(state, opts){ return executeVia(state, opts, 'ability'); };
  C.castSpell = function(state, opts){ return executeVia(state, opts, 'spell'); };

  /* -------------------- Reaction / passive registration helpers -------------------- */
  C.registerReaction = function(state, id, spec){
    var p = C.getParticipant(state, id);
    if (!p) return err('invalid_participant');
    spec = spec || {}; spec.kind = 'reaction';
    p.reactions.push(spec);
    return { ok:true };
  };
  C.registerPassive = function(state, id, spec){
    var p = C.getParticipant(state, id);
    if (!p) return err('invalid_participant');
    spec = spec || {}; spec.kind = 'passive';
    p.passives.push(spec);
    return { ok:true };
  };
  C.getPendingReactions = function(state){ return state ? state.pendingReactions.slice() : []; };
  C.clearPendingReactions = function(state){ if (state) state.pendingReactions = []; return { ok:true }; };

})();

SM.screens.roster=()=>{ const E=SM.engine,U=SM.ui;
  var entries=E.store.rosterEntries(); var activeId=E.store.activeId();
  var head=`<div class="section-head"><h3>Characters</h3><button class="btn primary sm" onclick="SM.roster.newChar()" aria-label="Create a new character">+ New Character</button> <button class="btn sm" onclick="SM.io.openImport()" aria-label="Import a character or backup file">Import</button> <button class="btn sm" onclick="SM.io.backup()" aria-label="Export all characters as a backup file">Backup All</button></div>`;
  if(entries.length===0){ return head+`<div class="panel" style="text-align:center" role="status"><div style="font-size:2rem">\uD83D\uDDC2\uFE0F</div><h3 style="margin:6px 0">No heroes forged yet.</h3><p class="muted small">Create your first StormMythic character.</p><button class="btn primary" onclick="SM.roster.newChar()">Create Character</button></div>`; }
  var cards=entries.map(function(en){
    if(en.kind==='malformed'){ return `<div class="panel" role="group" aria-label="Character needs attention" style="border-color:#8a6a25;margin-top:8px"><div class="row between"><b>\u26a0\ufe0f Character data needs attention</b></div><div class="small muted" style="margin-top:4px">${U.esc(en.reason||'This record could not be read.')}</div>`+((en.id==null)?'':`<div class="row" style="margin-top:8px;gap:6px"><button class="btn ghost sm" onclick="SM.roster.recover('${en.id}')">Attempt Recovery</button><button class="btn danger sm" onclick="SM.roster.confirmDelete('${en.id}')">Delete</button></div>`)+`</div>`; }
    var s=en.summary; var isActive=(en.id===activeId);
    var kinIcon=(E.kin(en.char.kinId)||{}).icon||'\uD83E\uDDDD';
    var warn=(en.warnings&&en.warnings.length>0)?`<div class="small faint" style="margin-top:4px">${U.esc(en.warnings.map(function(w){return w.msg;}).join(' \u00b7 '))}</div>`:'';
    var dupWarn=en.duplicateId?`<div class="small" style="color:#ff6b6b;margin-top:2px">Duplicate ID detected.</div>`:'';
    var acts = isActive
      ? `<button class="btn sm" onclick="SM.ui.go('sheet')">Open Sheet</button><button class="btn sm" onclick="SM.ui.go('dashboard')">Progression</button><button class="btn sm" onclick="SM.ui.go('build')">Build</button>`
      : `<button class="btn sm primary" onclick="SM.roster.play('${en.id}')" aria-label="Play ${U.esc(s.name)}">Play</button>`;
    acts += `<button class="btn sm" onclick="SM.roster.rename('${en.id}')">Rename</button><button class="btn sm" onclick="SM.roster.duplicate('${en.id}')">Duplicate</button><button class="btn sm" onclick="SM.io.exportChar('${en.id}')" aria-label="Export character">Export</button><button class="btn danger sm" onclick="SM.roster.confirmDelete('${en.id}')">Delete</button>`;
    return `<div class="card" role="group" aria-label="${U.esc(s.name)}${isActive?' (active)':''}" style="margin-top:8px${isActive?';border-color:var(--storm-glow)':''}">
      <div class="row between">
        <div class="row" style="gap:10px"><div class="ava">${kinIcon}</div>
          <div class="meta"><div class="t">${U.esc(s.name)} ${isActive?'<span class="tag" style="background:var(--storm-lo);color:#eafcff">ACTIVE</span>':''}</div>
            <div class="s">${U.esc(s.kin||'\u2014')}${s.lineage?(' \u00b7 '+U.esc(s.lineage)):''}</div></div></div>
        <div style="text-align:right"><span class="tier-badge tier-${s.tier}">${s.tier}</span><div class="small muted" style="margin-top:2px">Total ${s.totalLevel}</div></div>
      </div>
      <div class="small" style="margin-top:6px">${s.hasClass?U.esc(s.classesLabel):'No class'}${s.discLabel?(' <span class="storm">\u00b7 '+U.esc(s.discLabel)+'</span>'):''}</div>
      ${dupWarn}${warn}
      <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">${acts}</div></div>`;
  }).join('');
  return head+cards;
};
SM.roster={
  newChar:function(){ SM.creator.start(); SM.ui.go('creator'); },
  play:function(id){ var c=SM.engine.store.getChar(id); if(c==null){ SM.ui.toast('Character not found.','bad'); SM.ui.render(); return; } SM.engine.store.setActive(id); SM.ui.toast('Now playing '+(c.name||'hero')+'.','ok'); SM.ui.go('sheet'); },
  rename:function(id){ var c=SM.engine.store.getChar(id); if(c==null){ SM.ui.toast('Character not found.','bad'); return; } SM.ui.modal('Rename Character', `<label class="fld"><span>Character name</span><input id="rnBox" type="text" value="${SM.ui.esc(c.name||'')}" aria-label="Character name"></label><div class="row" style="gap:8px;margin-top:10px"><button class="btn primary" onclick="SM.roster.doRename('${id}')">Save</button><button class="btn ghost" onclick="SM.ui.closeModal()">Cancel</button></div>`); },
  doRename:function(id){ var c=SM.engine.store.getChar(id); if(c==null)return; var el=document.getElementById('rnBox'); var nm=el?String(el.value||'').trim():''; if(nm.length===0){ SM.ui.toast('Name cannot be empty.','bad'); return; } c.name=nm; SM.engine.store.upsertChar(c); SM.ui.closeModal(); SM.ui.toast('Renamed to '+nm+'.','ok'); SM.ui.render(); },
  duplicate:function(id){ var c=SM.engine.store.getChar(id); if(c==null){ SM.ui.toast('Character not found.','bad'); return; } var copy=JSON.parse(JSON.stringify(c)); copy.id='ch-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); copy.name=String(c.name||'Hero')+' Copy'; copy.created=Date.now(); copy.updated=Date.now(); SM.engine.validateBuild(copy,'saved'); SM.engine.store.upsertChar(copy); SM.ui.toast('Duplicated as '+copy.name+'.','ok'); SM.ui.render(); },
  confirmDelete:function(id){ var c=SM.engine.store.getChar(id); var nm=c?(c.name||'this character'):'this character'; SM.ui.modal('Delete Character', `<p role="alert">Delete <b>${SM.ui.esc(nm)}</b>? This cannot be undone.</p><div class="row" style="gap:8px;margin-top:10px"><button class="btn danger" onclick="SM.roster.doDelete('${id}')">Delete</button><button class="btn ghost" onclick="SM.ui.closeModal()">Cancel</button></div>`); },
  doDelete:function(id){ SM.engine.store.deleteCharSafe(id); SM.ui.closeModal(); SM.ui.toast('Character deleted.','info'); SM.ui.render(); },
  recover:function(id){ var raw=SM.engine.store.rawChars().find(function(r){return r&&r.id===id;}); if(raw==null){ SM.ui.toast('Record not found.','bad'); return; } var fixed=SM.engine.sanitizeBuild(raw); fixed.id=id; SM.engine.store.upsertChar(fixed); SM.ui.toast('Recovery attempted. Review the character.','info'); SM.ui.render(); }
};

SM.state.diceHist=[];
SM.screens.dice=()=>{ const U=SM.ui;
  const dice=[4,6,8,10,12,20,100];
  return `
  <div class="panel">
    <div class="eyebrow">Quick Dice</div>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">${dice.map(d=>`<button class="btn" onclick="SM.dice.quick(${d})">d${d}</button>`).join('')}</div>
    <div id="diceResult" style="margin-top:16px;text-align:center"></div>
  </div>
  <div class="panel" style="margin-top:16px">
    <div class="eyebrow">Custom Roll</div>
    <label class="fld" style="margin-top:8px"><span>Formula (e.g. 2d6+4, 4d8+10, 1d20+7)</span><input type="text" id="diceFormula" value="1d20" onkeydown="if(event.key==='Enter')SM.dice.custom()"></label>
    <div class="pill-row" style="margin-bottom:10px">
      <button class="chip ${'normal'===(SM.state.diceMode||'normal')?'on':''}" onclick="SM.dice.mode('normal')">Normal</button>
      <button class="chip ${'advantage'===SM.state.diceMode?'on':''}" onclick="SM.dice.mode('advantage')">Advantage</button>
      <button class="chip ${'disadvantage'===SM.state.diceMode?'on':''}" onclick="SM.dice.mode('disadvantage')">Disadvantage</button>
    </div>
    <button class="btn primary block" onclick="SM.dice.custom()">🎲 Roll</button>
  </div>
  <div class="section-head" style="margin-top:16px"><h3>History</h3>${SM.state.diceHist.length?'<button class="btn sm" onclick="SM.dice.clear()">Clear</button>':''}</div>
  <div class="log" id="diceHist">${SM.state.diceHist.map(h=>`<div class="le ${h.cls||''}"><b>${h.total}</b> <span class="muted small">${h.detail}</span></div>`).join('')||'<p class="muted small">No rolls yet.</p>'}</div>`;
};
SM.dice={
  mode:m=>{ SM.state.diceMode=m; SM.ui.render(); },
  show:(html)=>{ const el=document.getElementById('diceResult'); if(el)el.innerHTML=html; },
  push:(total,detail,cls)=>{ SM.state.diceHist.unshift({total,detail,cls}); if(SM.state.diceHist.length>50)SM.state.diceHist.pop(); },
  quick:sides=>{ const E=SM.engine; const v=E.rollDie(sides); const cls=sides===20&&v===20?'crit':sides===20&&v===1?'fail':'';
    SM.dice.show(`<div class="die ${cls} rolling" style="margin:0 auto">${v}</div><div class="small muted" style="margin-top:8px">d${sides}${sides===20&&v===20?' · CRITICAL':sides===20&&v===1?' · FUMBLE':''}</div>`);
    SM.dice.push(v,'d'+sides,cls); const h=document.getElementById('diceHist'); if(h)h.innerHTML=SM.state.diceHist.map(x=>`<div class="le ${x.cls||''}"><b>${x.total}</b> <span class="muted small">${x.detail}</span></div>`).join(''); },
  custom:()=>{ const E=SM.engine; const f=document.getElementById('diceFormula').value.trim()||'1d20'; const mode=SM.state.diceMode||'normal';
    const isD20=/^1?d20/i.test(f);
    let total,detail,cls='';
    if(isD20&&mode!=='normal'){ const bonus=E.parseFormula(f).flat; const r=E.d20(bonus,mode); total=r.total; cls=r.crit?'crit':r.fumble?'fail':''; detail=`${f} (${mode}) → [${r.pair.filter(x=>x!=null).join(', ')}] pick ${r.nat} ${E.signed(bonus)}`; SM.dice.show(`<div class="die ${cls}" style="margin:0 auto">${r.nat}</div><div style="font-size:1.6rem;font-weight:800;margin-top:8px">${total}</div><div class="small muted">${detail}</div>`);
    } else { const r=E.roll(f); total=r.total; const rd=r.rolls.map(x=>x.dice+' ['+x.values.join(',')+']').join(' + '); detail=`${f} → ${rd}${r.flat?' '+E.signed(r.flat):''}`; SM.dice.show(`<div style="font-size:2.4rem;font-weight:800">${total}</div><div class="small muted">${detail}</div>`); }
    SM.dice.push(total,detail,cls); const h=document.getElementById('diceHist'); if(h)h.innerHTML=SM.state.diceHist.map(x=>`<div class="le ${x.cls||''}"><b>${x.total}</b> <span class="muted small">${x.detail}</span></div>`).join(''); },
  clear:()=>{ SM.state.diceHist=[]; SM.ui.render(); }
};

SM.screens.inventory=()=>{ const E=SM.engine,U=SM.ui; const c=SM.act.get();
  if(!c) return U.need('No active character.');
  const inv=c.inventory||[];
  const cur=Object.entries(c.currency||{}).map(([k,v])=>`<span class="chip">${v} ${k}</span>`).join(' ');
  return `<div class="panel"><div class="eyebrow">Currency</div><div class="pill-row" style="margin-top:8px">${cur}</div></div>
    <div class="section-head" style="margin-top:16px"><h3>Inventory (${inv.length})</h3><button class="btn sm primary" onclick="SM.inv.addPicker()">+ Add Item</button></div>
    ${inv.length?`<div class="list">`+inv.map(i=>{const it=E.item(i.itemId);if(!it)return '';
      return `<div class="li"><div class="ava">${i.equipped?'✅':(it.dmg?'🗡️':it.pdef!=null?'🛡️':'📦')}</div>
        <div class="meta" onclick="SM.lib.detailItem('${it.id}')"><div class="t">${U.esc(i.customName||it.name)} ${i.qty>1?'<span class="tag">x'+i.qty+'</span>':''} ${U.rar(it.rarity)}</div>
          <div class="s">${it.cat||it.type||''} ${i.equipped?'· <span class="storm">equipped</span>':''}</div></div>
        <button class="btn sm" onclick="SM.inv.menu('${i.instId}')">•••</button></div>`;}).join('')+`</div>`:U.need('Inventory is empty.')}`;
};
SM.inv={
  menu:instId=>{ const c=SM.act.get(); const i=c.inventory.find(x=>x.instId===instId); const it=SM.engine.item(i.itemId); const slot=SM.act.slotFor(it);
    SM.ui.modal(SM.ui.esc(it.name),`<div class="stack">
      ${slot?`<button class="btn primary block" onclick="SM.inv.equip('${instId}')">${i.equipped?'Unequip':'Equip'}</button>`:''}
      ${it.type==='Consumable'?`<button class="btn block" onclick="SM.inv.use('${instId}')">Use</button>`:''}
      <button class="btn block" onclick="SM.inv.sell('${instId}')">Sell</button>
      <button class="btn danger block" onclick="SM.inv.drop('${instId}')">Drop</button>
    </div>`); },
  equip:instId=>{ const c=SM.act.get(); const i=c.inventory.find(x=>x.instId===instId); const it=SM.engine.item(i.itemId); const slot=SM.act.slotFor(it);
    if(i.equipped){ i.equipped=false; } else { c.inventory.filter(x=>x.slot===slot&&x.equipped).forEach(x=>x.equipped=false); i.equipped=true; i.slot=slot; }
    SM.act.save(c); SM.ui.closeModal(); SM.ui.toast(i.equipped?'Equipped '+it.name:'Unequipped '+it.name,'ok'); SM.ui.render(); },
  use:instId=>{ const c=SM.act.get(); const i=c.inventory.find(x=>x.instId===instId); const it=SM.engine.item(i.itemId);
    if(/Heal (\d+d\d+(?:\+\d+)?)/.test((it.abilities||[]).join(' '))){ const m=(it.abilities||[]).join(' ').match(/Heal (\d+d\d+(?:\+\d+)?)/); const r=SM.engine.roll(m[1]); c.hpCur=Math.min(SM.engine.maxHP(c),c.hpCur+r.total); SM.ui.toast('Healed '+r.total+' HP.','ok'); }
    i.qty--; if(i.qty<=0)c.inventory=c.inventory.filter(x=>x.instId!==instId); SM.act.save(c); SM.ui.closeModal(); SM.ui.render(); },
  sell:instId=>{ const c=SM.act.get(); const i=c.inventory.find(x=>x.instId===instId); const it=SM.engine.item(i.itemId);
    c.currency.Gold=(c.currency.Gold||0)+5; i.qty--; if(i.qty<=0)c.inventory=c.inventory.filter(x=>x.instId!==instId); SM.act.save(c); SM.ui.closeModal(); SM.ui.toast('Sold for 5 Gold.','ok'); SM.ui.render(); },
  drop:instId=>{ const c=SM.act.get(); c.inventory=c.inventory.filter(x=>x.instId!==instId); SM.act.save(c); SM.ui.closeModal(); SM.ui.toast('Item dropped.','info'); SM.ui.render(); },
  addPicker:()=>{ const items=SM.engine.allItems();
    SM.ui.modal('Add Item','<div class="searchbar" style="margin-bottom:10px"><span class="mag">🔍</span><input type="search" id="addSearch" placeholder="Search items..." oninput="SM.inv.filterAdd(this.value)"></div><div id="addList" class="list">'+SM.inv.addRows(items)+'</div>'); },
  addRows:items=>items.slice(0,60).map(it=>`<div class="li" onclick="SM.inv.add('${it.id}')"><div class="ava">${it.dmg?'🗡️':it.pdef!=null?'🛡️':'📦'}</div><div class="meta"><div class="t">${SM.ui.esc(it.name)} ${SM.ui.rar(it.rarity)}</div><div class="s">${it.cat||it.type||''}</div></div></div>`).join(''),
  filterAdd:q=>{ q=q.toLowerCase(); const items=SM.engine.allItems().filter(it=>it.name.toLowerCase().includes(q)); document.getElementById('addList').innerHTML=SM.inv.addRows(items); },
  add:itemId=>{ const c=SM.act.get(); const it=SM.engine.item(itemId); const existing=c.inventory.find(x=>x.itemId===itemId&&!x.equipped);
    if(existing&&it.type==='Consumable'||existing&&it.type==='Material'){ existing.qty++; } else { c.inventory.push({instId:'inst-'+Math.random().toString(36).slice(2,8),itemId,qty:1,equipped:false,slot:SM.act.slotFor(it)}); }
    SM.act.save(c); SM.ui.closeModal(); SM.ui.toast('Added '+it.name,'ok'); SM.ui.render(); }
};

/* ===================== SCREEN: EQUIPMENT ===================== */
SM.screens.equipment=()=>{ const E=SM.engine,U=SM.ui; const c=SM.act.get();
  if(!c) return U.need('No active character.');
  E.ensureDerived(c); const def=E.defenses(c);
  return `<div class="panel"><div class="eyebrow">Loadout Summary</div>
    <div class="grid cols" style="margin-top:8px">
      <div class="stat"><div class="lab">Defense</div><div class="val">${def.defenseValue}</div></div>
      <div class="stat"><div class="lab">Phys</div><div class="val">${def.physicalDefense}</div></div>
      <div class="stat"><div class="lab">Magic</div><div class="val">${def.magicDefense}</div></div>
      <div class="stat"><div class="lab">Block</div><div class="val">${def.block}</div></div>
    </div></div>
    <div class="section-head" style="margin-top:16px"><h3>Equipment Slots</h3></div>
    <div class="list">${SM.act.SLOTS.map(([slot,label,ic])=>{const it=E.equippedItem(c,slot);
      return `<div class="li"><div class="ava">${ic}</div><div class="meta"><div class="t">${label}</div><div class="s">${it?U.esc(it.name):'<span class="faint">empty</span>'}</div></div>
        <button class="btn sm" onclick="SM.equip.pick('${slot}')">${it?'Change':'Equip'}</button></div>`;}).join('')}</div>`;
};
SM.equip={
  pick:slot=>{ const c=SM.act.get(); const owned=(c.inventory||[]).filter(i=>SM.act.slotFor(SM.engine.item(i.itemId))===slot);
    const rows=owned.length?owned.map(i=>{const it=SM.engine.item(i.itemId);return `<div class="li" onclick="SM.equip.set('${slot}','${i.instId}')"><div class="ava">${i.equipped?'✅':'▫️'}</div><div class="meta"><div class="t">${SM.ui.esc(it.name)}</div><div class="s">${it.dmg?('DMG '+it.dmg):(it.pdef!=null?'DEF +'+it.pdef:'')}</div></div></div>`;}).join(''):'<p class="muted small">No items for this slot in inventory. Add some from the Item Library.</p>';
    SM.ui.modal('Equip: '+slot,`<div class="list">${rows}</div><button class="btn block" style="margin-top:10px" onclick="SM.equip.unequip('${slot}')">Unequip slot</button>`); },
  set:(slot,instId)=>{ const c=SM.act.get(); c.inventory.filter(x=>x.slot===slot&&x.equipped).forEach(x=>x.equipped=false);
    const i=c.inventory.find(x=>x.instId===instId); i.equipped=true; i.slot=slot; SM.act.save(c); SM.ui.closeModal(); SM.ui.toast('Equipped.','ok'); SM.ui.render(); },
  unequip:slot=>{ const c=SM.act.get(); c.inventory.filter(x=>x.slot===slot&&x.equipped).forEach(x=>x.equipped=false); SM.act.save(c); SM.ui.closeModal(); SM.ui.render(); }
};

  screen(kind,title){ const q=this.q[kind]||''; const chips=this.chips(kind);

  chips(kind){ if(kind==='item'){ return ['all',...SM.data.RARITIES].map(r=>`<button class="chip ${(this.filt[kind]||'all')===r?'on':''}" onclick="SM.lib.setFilt('${kind}','${r}')">${r}</button>`).join(''); }
    if(kind==='spell'){ return ['all',...SM.data.SPELL_SCHOOLS].map(s=>`<button class="chip ${(this.filt[kind]||'all')===s?'on':''}" onclick="SM.lib.setFilt('${kind}','${s}')">${s}</button>`).join(''); }

     case 'lineage': { const k=E.kin(r.kin); return `<div class="li" onclick="SM.lib.detail('lineage','${r.id}')"><div class="ava">${k?k.icon:'🌿'}</div><div class="meta"><div class="t">${r.name} <span class="tag">${k?k.name:''}</span></div><div class="s">${U.esc(r.trait)}</div></div></div>`; }
