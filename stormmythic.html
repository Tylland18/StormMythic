<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<title>StormMythic</title>
<style>
:root{
  --bg:#07080d; --bg2:#0b0e16; --panel:#11151f; --panel2:#161b28;
  --ink:#e9edf6; --ink-dim:#9aa6bd; --ink-faint:#68728a;
  --line:#232a3a; --line2:#2e394f;
  --silver:#cfd6e6; --silver-lo:#8a93a8;
  --gold:#e8c579; --gold-lo:#b9963f;
  --storm:#5aa7ff; --storm-lo:#2b6ad1; --storm-glow:#7cc0ff;
  --violet:#9a7bff; --emerald:#5fd1a0; --crimson:#ff6b6b; --amber:#ffb454;
  --ok:#57d38c; --warn:#ffb454; --bad:#ff6b6b;
  --r:14px; --r-sm:9px; --shadow:0 8px 30px rgba(0,0,0,.55);
  --fs:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:var(--fs); line-height:1.5; overscroll-behavior-y:none;}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(90,167,255,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(154,123,255,.08), transparent 55%),
    linear-gradient(180deg,#07080d 0%, #05060a 100%);
  min-height:100vh; min-height:100dvh;
}
h1,h2,h3,h4{margin:0 0 .4em; font-weight:700; letter-spacing:.3px}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
a{color:var(--storm-glow); text-decoration:none}
button,input,select,textarea{font:inherit; color:inherit}
img{max-width:100%}
.hidden{display:none !important}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}

/* ===== Brand / lightning ===== */
.brandmark{font-weight:800; letter-spacing:1px; background:linear-gradient(90deg,var(--silver),#fff 40%,var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 22px rgba(124,192,255,.25)}
.bolt{color:var(--storm-glow); filter:drop-shadow(0 0 6px rgba(124,192,255,.7))}

/* ===== Layout ===== */
#app{display:flex; min-height:100vh; min-height:100dvh}
.sidebar{display:none}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:12px 16px calc(12px); padding-top:calc(12px + env(safe-area-inset-top));
  background:linear-gradient(180deg, rgba(9,11,17,.96), rgba(9,11,17,.75));
  border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
.topbar .logo{font-size:1.15rem; display:flex; align-items:center; gap:8px}
.topbar .spacer{flex:1}
.topbar .screen-title{font-size:.82rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:2px}
.iconbtn{background:var(--panel); border:1px solid var(--line2); color:var(--silver);
  width:40px;height:40px;border-radius:10px; display:grid; place-items:center; cursor:pointer; font-size:1.1rem}
.iconbtn:active{transform:scale(.96)}

.content{flex:1; padding:16px; padding-bottom:96px; max-width:1120px; width:100%; margin:0 auto}
@media(min-width:960px){ .content{padding:26px} }

/* ===== Bottom nav (mobile) ===== */
.bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex;
  background:linear-gradient(180deg, rgba(12,15,23,.92), rgba(7,9,14,.99));
  border-top:1px solid var(--line2); backdrop-filter:blur(14px);
  padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1; background:none; border:none; color:var(--ink-faint); padding:10px 4px 12px;
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-size:.66rem; letter-spacing:.5px}
.bottomnav button .ic{font-size:1.25rem; line-height:1}
.bottomnav button.active{color:var(--storm-glow)}
.bottomnav button.active .ic{filter:drop-shadow(0 0 8px rgba(124,192,255,.8))}

/* ===== Sidebar (desktop) ===== */
@media(min-width:960px){
  .bottomnav{display:none}
  .sidebar{display:flex; flex-direction:column; width:250px; flex:0 0 250px;
    background:linear-gradient(180deg,#0a0d15,#07090f); border-right:1px solid var(--line);
    position:sticky; top:0; height:100vh; overflow-y:auto}
  .sidebar .brand{padding:20px 18px; font-size:1.35rem; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line)}
  .sidebar nav{padding:10px; overflow-y:auto}
  .sidebar .navgroup{font-size:.66rem; text-transform:uppercase; letter-spacing:2px; color:var(--ink-faint); margin:14px 12px 6px}
  .sidebar .navlink{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px;
    color:var(--ink-dim); cursor:pointer; font-size:.92rem}
  .sidebar .navlink .ic{width:20px; text-align:center}
  .sidebar .navlink:hover{background:var(--panel); color:var(--ink)}
  .sidebar .navlink.active{background:linear-gradient(90deg,rgba(90,167,255,.16),rgba(90,167,255,.02));
    color:#fff; box-shadow:inset 2px 0 0 var(--storm)}
  .content{padding-bottom:26px}
  .main .topbar .menu-toggle{display:none}
}

/* ===== Panels / cards ===== */
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line2);
  border-radius:var(--r); padding:16px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.panel::before{content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(207,214,230,.35),transparent)}
.card{background:linear-gradient(180deg,#141926,#0f131d); border:1px solid var(--line2);
  border-radius:var(--r-sm); padding:14px; cursor:pointer; transition:transform .08s, border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--storm-lo); box-shadow:0 6px 22px rgba(43,106,209,.18)}
.card:active{transform:scale(.99)}
.grid{display:grid; gap:12px}
.grid.cols{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.cols2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.cols3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:12px}

.section-head{display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; gap:10px}
.eyebrow{font-size:.68rem; letter-spacing:3px; text-transform:uppercase; color:var(--gold-lo)}

/* ===== Chips / tags / badges ===== */
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line2); font-size:.74rem; color:var(--ink-dim)}
.chip.on{background:linear-gradient(90deg,rgba(90,167,255,.22),rgba(90,167,255,.05)); color:#fff; border-color:var(--storm-lo)}
.tag{font-size:.68rem; padding:2px 8px; border-radius:6px; background:#0e1220; border:1px solid var(--line2); color:var(--ink-dim)}
.badge{font-size:.66rem; padding:2px 8px; border-radius:6px; font-weight:700; letter-spacing:.4px}
/* rarity colors */
.r{font-weight:700; font-size:.66rem; padding:2px 8px; border-radius:6px; letter-spacing:.4px; text-transform:uppercase}
.r.common{color:#c3ccdd; background:#121826; border:1px solid #2b364a}
.r.uncommon{color:#7fe3a3; background:#0e1e16; border:1px solid #245c3c}
.r.rare{color:#7cc0ff; background:#0d1826; border:1px solid #2b5a8c}
.r.epic{color:#c39bff; background:#160f26; border:1px solid #4a327f}
.r.legendary{color:#ffcf7a; background:#241a0c; border:1px solid #8a6a25}
.r.mythic{color:#ff8fae; background:#260f18; border:1px solid #8a2f4a}
.r.ascendant{color:#eafcff; background:linear-gradient(90deg,#123,#214);
  border:1px solid #6cc; box-shadow:0 0 12px rgba(124,220,255,.35)}

.tier-badge{padding:3px 10px;border-radius:999px;font-weight:700;font-size:.72rem;letter-spacing:.5px}
.tier-Heroic{background:#14202e;color:#9fd0ff;border:1px solid #2b5a8c}
.tier-Legendary{background:#241a0c;color:#ffcf7a;border:1px solid #8a6a25}
.tier-Epic{background:#160f26;color:#c39bff;border:1px solid #4a327f}
.tier-Mythic{background:#260f18;color:#ff8fae;border:1px solid #8a2f4a}
.tier-Ascendant{background:linear-gradient(90deg,#0d2230,#182742);color:#eafcff;border:1px solid #6cc;box-shadow:0 0 14px rgba(124,220,255,.3)}

/* ===== Buttons ===== */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  padding:11px 16px; border-radius:10px; border:1px solid var(--line2); background:var(--panel);
  color:var(--ink); font-weight:600; font-size:.92rem; transition:transform .07s, box-shadow .15s, border-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(90deg,var(--storm-lo),var(--storm)); border-color:var(--storm);
  color:#eaf3ff; box-shadow:0 6px 20px rgba(43,106,209,.35)}
.btn.gold{background:linear-gradient(90deg,var(--gold-lo),var(--gold)); border-color:var(--gold); color:#241a05}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a2c33; color:#ff9a9a}
.btn.sm{padding:7px 11px; font-size:.8rem; border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ===== Inputs ===== */
label.fld{display:block; margin-bottom:12px}
label.fld > span{display:block; font-size:.74rem; color:var(--ink-dim); margin-bottom:5px; letter-spacing:.4px}
input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%; background:#0c1019; border:1px solid var(--line2); color:var(--ink);
  border-radius:9px; padding:11px 12px; outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--storm-lo); box-shadow:0 0 0 3px rgba(43,106,209,.18)}
textarea{min-height:90px; resize:vertical}
.searchbar{position:relative}
.searchbar input{padding-left:38px}
.searchbar .mag{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint)}

/* ===== Stats / bars ===== */
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:10px}
.stat{background:#0d1220; border:1px solid var(--line2); border-radius:10px; padding:10px; text-align:center}
.stat .lab{font-size:.64rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-faint)}
.stat .val{font-size:1.5rem; font-weight:800; color:#fff}
.stat .mod{font-size:.8rem; color:var(--gold)}
.bar{height:12px; border-radius:8px; background:#0b0f18; border:1px solid var(--line2); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:8px}
.bar.hp > i{background:linear-gradient(90deg,#c0392b,#ff6b6b)}
.bar.res > i{background:linear-gradient(90deg,var(--storm-lo),var(--storm-glow))}
.bar.xp > i{background:linear-gradient(90deg,var(--gold-lo),var(--gold))}

.kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-dim)} .kv .v{font-weight:600}

/* ===== Wizard stepper ===== */
.stepper{display:flex; gap:6px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:0 0 auto; font-size:.72rem; padding:6px 11px; border-radius:999px; border:1px solid var(--line2);
  color:var(--ink-faint); background:var(--panel); white-space:nowrap}
.step.done{color:var(--emerald); border-color:#245c3c}
.step.active{color:#fff; border-color:var(--storm); background:linear-gradient(90deg,rgba(90,167,255,.2),transparent)}

/* ===== Modal ===== */
.modal-wrap{position:fixed; inset:0; z-index:60; display:none; align-items:flex-end; justify-content:center;
  background:rgba(3,5,10,.72); backdrop-filter:blur(4px)}
.modal-wrap.open{display:flex}
.modal{background:linear-gradient(180deg,#141826,#0e121c); border:1px solid var(--line2);
  border-radius:18px 18px 0 0; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow)}
@media(min-width:720px){ .modal-wrap{align-items:center} .modal{border-radius:16px} }
.modal .mhead{position:sticky; top:0; display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-bottom:1px solid var(--line); background:#12162200; backdrop-filter:blur(6px)}
.modal .mbody{padding:16px}

/* ===== Toast ===== */
.toast-wrap{position:fixed; left:0; right:0; bottom:88px; z-index:80; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
@media(min-width:960px){ .toast-wrap{bottom:24px} }
.toast{background:#12172400; background:linear-gradient(180deg,#182033,#10151f); border:1px solid var(--line2);
  color:var(--ink); padding:11px 16px; border-radius:10px; box-shadow:var(--shadow); font-size:.88rem; animation:toastin .2s ease}
.toast.ok{border-color:#245c3c} .toast.bad{border-color:#7a2c33} .toast.info{border-color:var(--storm-lo)}
@keyframes toastin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ===== Dice ===== */
.die{width:56px;height:56px;border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:1.3rem;
  background:linear-gradient(180deg,#1a2233,#0f1420); border:1px solid var(--line2); box-shadow:var(--shadow)}
.die.rolling{animation:shake .5s ease}
.die.crit{border-color:var(--gold); color:var(--gold); box-shadow:0 0 18px rgba(232,197,121,.5)}
.die.fail{border-color:var(--crimson); color:var(--crimson); box-shadow:0 0 18px rgba(255,107,107,.4)}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-9deg) translateY(-4px)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}

/* combat log */
.log{max-height:280px; overflow-y:auto; font-size:.84rem; display:flex; flex-direction:column; gap:6px}
.log .le{padding:6px 10px; border-radius:8px; background:#0c111c; border:1px solid var(--line)}
.log .le.hit{border-left:3px solid var(--storm)}
.log .le.crit{border-left:3px solid var(--gold)}
.log .le.miss{border-left:3px solid var(--ink-faint)}
.log .le.down{border-left:3px solid var(--crimson)}
.log .le.heal{border-left:3px solid var(--emerald)}

.empty{text-align:center; padding:40px 16px; color:var(--ink-faint)}
.empty .big{font-size:2.4rem; margin-bottom:8px; opacity:.6}
.list{display:flex; flex-direction:column; gap:8px}
.li{display:flex; align-items:center; gap:12px; padding:12px; border-radius:10px; background:#0e131f; border:1px solid var(--line2); cursor:pointer}
.li:hover{border-color:var(--storm-lo)}
.li .ava{width:44px;height:44px;border-radius:10px; display:grid; place-items:center; font-size:1.3rem;
  background:linear-gradient(180deg,#1a2233,#10151f); border:1px solid var(--line2); flex:0 0 auto}
.li .meta{flex:1; min-width:0}
.li .meta .t{font-weight:700}
.li .meta .s{font-size:.78rem; color:var(--ink-dim)}
.muted{color:var(--ink-dim)} .faint{color:var(--ink-faint)} .small{font-size:.8rem}
.gold{color:var(--gold)} .silver{color:var(--silver)} .storm{color:var(--storm-glow)}
hr.sep{border:none; border-top:1px solid var(--line); margin:14px 0}
.scrollx{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
.pill-row{display:flex; gap:8px; flex-wrap:wrap}
.selectable{border:1px solid var(--line2); border-radius:10px; padding:12px; cursor:pointer; background:#0e131f}
.selectable.sel{border-color:var(--storm); box-shadow:0 0 0 2px rgba(90,167,255,.25) inset; background:linear-gradient(180deg,rgba(90,167,255,.08),transparent)}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="bolt">⚡</span> <span class="brandmark">STORMMYTHIC</span></div>
    <nav id="sidenav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn menu-toggle" onclick="SM.ui.openMore()">☰</button>
      <div class="logo"><span class="bolt">⚡</span> <span class="brandmark">STORMMYTHIC</span></div>
      <div class="spacer"></div>
      <div class="screen-title" id="screenTitle">Home</div>
    </header>
    <main class="content" id="view"><!-- screens render here --></main>
  </div>
</div>

<nav class="bottomnav" id="bottomnav"></nav>
<div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)SM.ui.closeModal()">
  <div class="modal"><div class="mhead"><h3 id="modalTitle">Details</h3>
    <button class="iconbtn" onclick="SM.ui.closeModal()">✕</button></div>
    <div class="mbody" id="modalBody"></div></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
"use strict";
const SM = { data:{}, engine:{}, ui:{}, screens:{}, state:{ screen:'home', params:{} } };
SM.version = "1.0.0";
SM.schema = 3;
/* ===================== ATTRIBUTES ===================== */
SM.data.ATTRS = [
  {id:'MIG', name:'Might',     desc:'Raw physical power, melee force, carrying capacity.'},
  {id:'VIG', name:'Vigor',     desc:'Endurance, toughness, health and physical defense.'},
  {id:'PRE', name:'Presence',  desc:'Force of personality, leadership, social sway.'},
  {id:'SPI', name:'Spirit',    desc:'Willpower, magical warding, connection to the storm.'},
  {id:'AGI', name:'Agility',   desc:'Speed, reflexes, balance and evasion.'},
  {id:'INS', name:'Instinct',  desc:'Perception, intuition, reaction and awareness.'},
  {id:'INT', name:'Intellect', desc:'Reasoning, lore, arcane theory and tactics.'}
];

/* ===================== KIN (21) ===================== */
SM.data.KIN = [
 {id:'human',name:'Human',icon:'🧑',speed:30,
  lore:'The most numerous folk of the Stormlands, humans spread from the Northland fjords to the desert waystones, adapting to every sky.',
  desc:'Versatile and ambitious. Humans lack a single defining gift but excel through drive and adaptability.',
  traits:['Adaptive: gain a bonus skill focus','Ambition: +1 to one attribute of choice at creation'],
  attr:{},resist:[],weak:[],
  abilities:['Resolve: once per rest, reroll a failed saving throw.']},
 {id:'elf',name:'Elf',icon:'🧝',speed:30,
  lore:'Ageless children of the greenlight and the deep wood, the elves remember the first storms and keep the old songs.',
  desc:'Graceful, long-lived and keen-sensed, elves lean toward magic and precision.',
  traits:['Ageless: immune to magical aging','Keen Senses: advantage on perception vs concealment'],
  attr:{AGI:1,INT:1},resist:['Charm'],weak:[],
  abilities:['Trance: fully rest in 4 hours instead of 8.']},
 {id:'dwarf',name:'Dwarf',icon:'🧔',speed:25,
  lore:'Forgeborn of the mountain-roots, dwarves shape metal and stone and drink deep of ancestral memory.',
  desc:'Stout, stubborn and enduring. Masters of the forge and the deep places.',
  traits:['Stonesense: detect unstable stone and hidden passages','Forge-Trained: proficient with smith tools'],
  attr:{VIG:2,MIG:1},resist:['Poison'],weak:[],
  abilities:['Deep Endurance: advantage on saves vs poison and exhaustion.']},
 {id:'halfling',name:'Halfling',icon:'🧑‍🌾',speed:25,
  lore:'Small folk of hearth and road, halflings prize comfort, good company, and improbable luck.',
  desc:'Nimble, brave and uncannily fortunate.',
  traits:['Lucky: reroll natural 1 on a d20 once per rest','Nimble: move through the space of larger creatures'],
  attr:{AGI:2,PRE:1},resist:['Frightened'],weak:[],
  abilities:['Small Wonder: advantage on Agility saves.']},
 {id:'orc',name:'Orc',icon:'🧌',speed:30,
  lore:'Iron-blooded warriors of the ash steppes, orcs live by strength honored and oaths kept in blood.',
  desc:'Powerful and relentless, orcs push through wounds that would fell others.',
  traits:['Relentless: when reduced to 0 HP, drop to 1 HP once per rest','Menacing: trained in intimidation'],
  attr:{MIG:2,VIG:1},resist:['Bleeding'],weak:[],
  abilities:['Battle Surge: bonus-action rush after downing a foe.']},
 {id:'dragonborn',name:'Dragonborn',icon:'🐲',speed:30,
  lore:'Scaled heirs of the sky-wyrms, dragonborn carry an elemental breath tied to their blood.',
  desc:'Proud, elemental and formidable in melee.',
  traits:['Draconic Breath: cone/line elemental attack per rest','Scaled Hide: +1 physical defense while unarmored'],
  attr:{MIG:1,PRE:1,SPI:1},resist:['(by lineage element)'],weak:[],
  abilities:['Elemental Breath: 2d6 element save-for-half, scales with tier.']},
 {id:'harengon',name:'Harengon',icon:'🐇',speed:35,
  lore:'Swift hare-folk touched by the storm-wind, harengon leap between raindrops and lightning-flashes.',
  desc:'Blindingly fast and hard to pin down.',
  traits:['Leap: long/high jump doubled','Storm Step: extra reaction movement'],
  attr:{AGI:2,INS:1},resist:['Slowed'],weak:[],
  abilities:['Rabbit Hop: bonus-action disengage + jump.']},
 {id:'wolfkin',name:'Wolfkin',icon:'🐺',speed:35,
  lore:'Pack-bound hunters with the loyalty of the wild, wolfkin hunt in coordinated fury.',
  desc:'Fierce trackers who thrive beside allies.',
  traits:['Pack Tactics: advantage when an ally is adjacent to the target','Keen Scent: track by smell'],
  attr:{MIG:1,INS:2},resist:[],weak:[],
  abilities:['Rend: bite deals bonus bleed on a hit.']},
 {id:'owlkin',name:'Owlkin',icon:'🦉',speed:30,fly:30,
  lore:'Silent-winged sages of the night sky, owlkin see truths hidden in the dark.',
  desc:'Watchful, wise, and quiet on the wing.',
  traits:['Glide: fall slowly and glide short distances','Silent Flight: no noise while moving'],
  attr:{INT:2,INS:1},resist:['Blinded'],weak:[],
  abilities:['Nightsight: see clearly in darkness.']},
 {id:'tigerkin',name:'Tigerkin',icon:'🐯',speed:35,

/* ===================== ENGINE: LOOKUPS ===================== */
(function(E){
  const D=SM.data;
  E.byId=(arr,id)=>arr.find(x=>x.id===id)||null;
  E.kin=id=>E.byId(D.KIN,id);
  E.lineage=id=>E.byId(D.LINEAGES,id);
  E.lineagesFor=kinId=>D.LINEAGES.filter(l=>l.kin===kinId);
  E.cls=id=>E.byId(D.CLASSES,id);
  E.disc=id=>E.byId(D.DISCIPLINES,id);
  E.discsFor=clsId=>D.DISCIPLINES.filter(d=>d.cls===clsId);
  E.ability=id=>E.byId(D.ABILITIES,id);
  E.spell=id=>E.byId(D.SPELLS,id);
  E.condition=id=>E.byId(D.CONDITIONS,id);
  E.enemy=id=>E.byId(D.ENEMIES,id);
  E.item=id=>(E.byId([...D.WEAPONS,...D.ARMOR,...D.SHIELDS,...D.ITEMS],id)||(SM.engine.regMap?SM.engine.regMap()[id]:null)||null);
  E.allItems=()=>[...D.WEAPONS,...D.ARMOR,...D.SHIELDS,...D.ITEMS];
  E.attrName=id=>{const a=E.byId(D.ATTRS,id);return a?a.name:id;};
})(SM.engine);

/* ===================== ENGINE: RULES MATH ===================== */
(function(E){
  E.mod=v=>Math.floor((Number(v||0)-10)/2);
  E.fmtMod=v=>{const m=E.mod(v);return (m>=0?'+':'')+m;};
  E.signed=n=>(n>=0?'+':'')+n;
  E.TIERS=[
    {name:'Heroic',min:1,max:20},{name:'Legendary',min:21,max:40},
    {name:'Epic',min:41,max:60},{name:'Mythic',min:61,max:80},
    {name:'Ascendant',min:81,max:999}
  ];
  E.tierOf=lvl=>{ for(const t of E.TIERS){ if(lvl>=t.min&&lvl<=t.max) return t.name; } return 'Heroic'; };
  E.profBonus=totalLevel=>2+Math.floor((Math.max(1,totalLevel)-1)/4);
  E.xpForLevel=lvl=>lvl*1000; // simple curve
})(SM.engine);

/* ===================== ENGINE: DICE ===================== */
(function(E){
  const rnd=sides=>Math.floor(Math.random()*sides)+1;
  E.rollDie=sides=>rnd(sides);
  E.rollDice=(n,sides)=>{const out=[];for(let i=0;i<n;i++)out.push(rnd(sides));return out;};
  // parse "2d6+1d4+3" -> {terms:[{n,sides}], flat}
  E.parseFormula=f=>{
    f=String(f||'').replace(/\s+/g,'').toLowerCase();
    const terms=[]; let flat=0;
    const re=/([+-]?)(\d*)d(\d+)|([+-]?\d+)/g; let m;
    while((m=re.exec(f))){
      if(m[3]){ const sign=m[1]==='-'?-1:1; const n=m[2]===''?1:parseInt(m[2],10); terms.push({n,sides:parseInt(m[3],10),sign}); }
      else if(m[4]){ flat+=parseInt(m[4],10); }
    }
    return {terms,flat};
  };
  E.roll=(formula,opt={})=>{
    const {terms,flat}=E.parseFormula(formula);
    let total=0; const rolls=[];
    for(const t of terms){ const dr=E.rollDice(t.n,t.sides); const sum=dr.reduce((a,b)=>a+b,0)*(t.sign||1);
      total+=sum; rolls.push({dice:`${t.n}d${t.sides}`,values:dr,sign:t.sign||1}); }
    total+=flat;
    return {total,rolls,flat,formula};
  };
  // d20 with adv/dis, crit detection
  E.d20=(bonus=0,mode='normal')=>{
    let a=E.rollDie(20),b=E.rollDie(20),nat;
    if(mode==='advantage') nat=Math.max(a,b);
    else if(mode==='disadvantage') nat=Math.min(a,b);
    else { nat=a; b=null; }
    return {nat,pair:[a,b],total:nat+bonus,bonus,mode,crit:nat===20,fumble:nat===1};
  };
})(SM.engine);

/* ===================== ENGINE: CHARACTER MODEL ===================== */
(function(E){
  const D=SM.data;
  E.newCharacter=()=>({
    id:'ch-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    schema:SM.schema, name:'', player:SM.state.playerName||'',
    kinId:null, lineageId:null,
    classes:[], // {classId, level, discId}
    attrsBase:{MIG:10,VIG:10,PRE:10,SPI:10,AGI:10,INS:10,INT:10},
    background:'', appearance:{}, appearanceDesc:'',
    abilities:[], spells:[],
    inventory:[], // {instId,itemId,qty,enh,customName,equipped,slot}
    currency:{Copper:0,Silver:0,Gold:25,Platinum:0,'Mythic Shard':0,'Ascendant Ember':0},
    hpCur:null, resCur:null, xp:0, notes:'', conditions:[], seenAlterations:[],
    created:Date.now(), updated:Date.now()
  });
  E.totalLevel=c=>(c.classes||[]).reduce((a,x)=>a+(x.level||0),0)||0;
  E.primaryClass=c=>(c.classes&&c.classes[0])?E.cls(c.classes[0].classId):null;
  // effective attributes = base + kin + lineage
  E.attrs=c=>{
    const out={...c.attrsBase};
    const add=obj=>{ if(!obj)return; for(const k in obj){ out[k]=(out[k]||0)+obj[k]; } };
    const k=E.kin(c.kinId); if(k) add(k.attr);
    const l=E.lineage(c.lineageId); if(l) add(l.attr);
    // item flat sets/bonuses (Belt of Titan Might etc handled simply)
    (c.inventory||[]).filter(i=>i.equipped).forEach(i=>{ const it=E.item(i.itemId); if(it&&it.setAttr){for(const k2 in it.setAttr) out[k2]=Math.max(out[k2],it.setAttr[k2]);} });
    return out;
  };
  E.mods=c=>{ const a=E.attrs(c); const o={}; for(const k in a) o[k]=E.mod(a[k]); return o; };
  E.speed=c=>{ const k=E.kin(c.kinId); let s=k?k.speed:30; 
    (c.inventory||[]).filter(i=>i.equipped).forEach(i=>{const it=E.item(i.itemId); if(it&&/\+10 ft speed/.test((it.abilities||[]).join(' ')))s+=10; if(it&&/\+5 speed/.test((it.abilities||[]).join(' ')))s+=5;});
    return s; };
  E.maxHP=c=>{
    const m=E.mods(c); let hp=0;
    (c.classes||[]).forEach((cl,idx)=>{ const def=E.cls(cl.classId); if(!def)return;
      const die=parseInt(def.hitDie.replace('d',''),10); const avg=Math.floor(die/2)+1;
      for(let lv=1;lv<=cl.level;lv++){ if(idx===0&&lv===1) hp+=die+m.VIG; else hp+=avg+m.VIG; } });
    if(c.kinId==='bearkin'||c.kinId==='goliath'||c.kinId==='turtlekin') hp+=E.totalLevel(c); // thick hide etc
    return Math.max(1,hp);
  };
  E.equipped=(c,slot)=> (c.inventory||[]).find(i=>i.equipped&&i.slot===slot)||null;
  E.equippedItem=(c,slot)=>{const e=E.equipped(c,slot);return e?E.item(e.itemId):null;};
  E.defenses=c=>{
    const m=E.mods(c);
    const armor=E.equippedItem(c,'armor');
    const shield=E.equippedItem(c,'offhand');
    const armorP=armor?(armor.pdef||0):0, armorM=armor?(armor.mdef||0):0;
    const shieldP=(shield&&shield.cat==='Shield'||shield&&shield.pdef)?(shield.pdef||0):0;
    // Mystic unarmored defense
    const altB = SM.engine.alterationBonuses?SM.engine.alterationBonuses(c):{fly:0,pdef:0,notes:[]}; let physicalDefense = 1 + armorP + m.VIG + (altB.pdef||0);
    const magicDefense = armorM + m.SPI;
    const evasion = m.AGI + m.INS;
    const block = shieldP>0 ? (shieldP + m.VIG) : 0;
    // combined targets for combat
    const defenseValue = 10 + physicalDefense + evasion + (shieldP);
    const magicTarget = 10 + magicDefense + evasion;
    return {physicalDefense,magicDefense,evasion,block,armorP,armorM,shieldP,defenseValue,magicTarget};
  };
  E.attackBonus=c=>{ const m=E.mods(c); const w=E.equippedItem(c,'weapon');
    const scaleKey=w?w.scale:'MIG'; return E.profBonus(E.totalLevel(c))+(m[scaleKey]||0); };
  E.resource=c=>{ const p=E.primaryClass(c); if(!p) return {name:'—',max:0}; const m=E.mods(c);
    const key=(p.primary&&p.primary[1])||'SPI'; const max=E.totalLevel(c)+(m[key]||0); 
    return {name:p.resource,max:Math.max(0,max)}; };
  E.ensureDerived=c=>{ const mx=E.maxHP(c); if(c.hpCur==null||c.hpCur>mx) c.hpCur=mx; const r=E.resource(c); if(c.resCur==null||c.resCur>r.max) c.resCur=r.max; return c; };
  // saving throw
  E.saveMod=(c,attrKey)=>{ const m=E.mods(c); return (m[attrKey]||0)+E.profBonus(E.totalLevel(c)); };
  // level up / multiclass
  E.addClassLevel=(c,classId,discId)=>{
    if(E.cls(classId)==null) return {ok:false,msg:'Unknown class.'};
    var okDisc=(discId&&E.disc(discId)&&E.disc(discId).cls===classId)?discId:null;
    let cl=(c.classes||[]).find(x=>x.classId===classId);
    if(cl==null){ cl={classId,level:0,discId:okDisc}; c.classes.push(cl); }
    if(cl.level>=20) return {ok:false,msg:'Class already at maximum level (20).'};
    cl.level++; if(okDisc) cl.discId=okDisc;
    c.hpCur=E.maxHP(c); c.totalLevel=E.totalLevel(c); c.tier=E.tierOf(E.totalLevel(c)); E.ensureDerived(c); c.updated=Date.now();
    return {ok:true};
  };
  E.availableAbilities=c=>{
    const total=E.totalLevel(c);
    const classIds=(c.classes||[]).map(x=>x.classId);
    const discIds=(c.classes||[]).map(x=>x.discId).filter(Boolean);
    return SM.data.ABILITIES.filter(a=>{
      if(!classIds.includes(a.cls)) return false;
      const cl=(c.classes||[]).find(x=>x.classId===a.cls);
      if(a.disc && !discIds.includes(a.disc)) return false;
      if(cl && a.level>cl.level) return false;
      return true;
    });
  };
})(SM.engine);

/* ===================== ENGINE: STORAGE ===================== */
(function(E){
  const K={chars:'sm_characters',camps:'sm_campaigns',settings:'sm_settings',active:'sm_active_char',custom:'sm_custom',party:'sm_party'};
  const readJSON=(k,def)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } };
  const writeJSON=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ SM.ui&&SM.ui.toast&&SM.ui.toast('Storage error: '+e.message,'bad'); return false; } };
  E.migrateChar=function(raw){
    var nn=function(v){return v==null?false:true;};
    if(raw==null||(typeof raw==='object')===false){ return E.newCharacter(); }
    var def=E.newCharacter();
    var c={};
    for(var k in raw){ if(Object.prototype.hasOwnProperty.call(raw,k)){ c[k]=raw[k]; } }
    if(c.kinId==null && nn(raw.kin)){ c.kinId=raw.kin; }
    if(c.lineageId==null && nn(raw.lineage)){ c.lineageId=raw.lineage; }
    if(c.attrsBase==null && nn(raw.attrs)){ c.attrsBase=raw.attrs; }
    var hasClasses=(Array.isArray(c.classes) && c.classes.length>0);
    if(hasClasses===false){
      var legacyId=nn(raw.classId)?raw.classId:(nn(raw['class'])?raw['class']:(nn(raw.className)?raw.className:null));
      if(nn(legacyId)){
        c.classes=[{classId:legacyId, level:(typeof raw.level==='number')?raw.level:1, discId:nn(raw.discId)?raw.discId:(nn(raw.disc)?raw.disc:null)}];
      } else if(Array.isArray(c.classes)===false){
        c.classes=[];
      }
    }
    if(Array.isArray(c.classes)){
      c.classes=c.classes.map(function(x){
        if(x==null||(typeof x==='object')===false){ return {classId:null, level:1, discId:null}; }
        var e={};
        for(var kk in x){ if(Object.prototype.hasOwnProperty.call(x,kk)){ e[kk]=x[kk]; } }
        if(e.classId==null){ e.classId=nn(e.id)?e.id:(nn(e['class'])?e['class']:null); }
        if((typeof e.level==='number')===false){ e.level=1; }
        if(e.discId==null){ e.discId=nn(e.disc)?e.disc:null; }
        return e;
      });
    }
    var ab=(nn(c.attrsBase) && (typeof c.attrsBase==='object'))?c.attrsBase:{};
    var nab={};
    for(var ak in def.attrsBase){ nab[ak]=(typeof ab[ak]==='number')?ab[ak]:def.attrsBase[ak]; }
    for(var ak2 in ab){ if(Object.prototype.hasOwnProperty.call(nab,ak2)===false){ nab[ak2]=ab[ak2]; } }
    c.attrsBase=nab;
    var cur=(nn(c.currency) && (typeof c.currency==='object'))?c.currency:{};
    var ncur={};
    for(var ck in def.currency){ ncur[ck]=(typeof cur[ck]==='number')?cur[ck]:def.currency[ck]; }
    for(var ck2 in cur){ if(Object.prototype.hasOwnProperty.call(ncur,ck2)===false){ ncur[ck2]=cur[ck2]; } }
    c.currency=ncur;
    if(c.name==null){ c.name=def.name; }
    if(c.player==null){ c.player=def.player; }
    if(c.kinId===undefined){ c.kinId=null; }
    if(c.lineageId===undefined){ c.lineageId=null; }
    if(c.background==null){ c.background=def.background; }
    if(c.appearance==null||(typeof c.appearance==='object')===false){ c.appearance=def.appearance; }
    if(c.appearanceDesc==null){ c.appearanceDesc=def.appearanceDesc; }
    if(Array.isArray(c.abilities)===false){ c.abilities=[]; }
    if(Array.isArray(c.spells)===false){ c.spells=[]; }
    if(Array.isArray(c.inventory)===false){ c.inventory=[]; }
    if(Array.isArray(c.conditions)===false){ c.conditions=[]; }
    if(Array.isArray(c.seenAlterations)===false){ c.seenAlterations=[]; }
    if(c.hpCur===undefined){ c.hpCur=null; }
    if(c.resCur===undefined){ c.resCur=null; }
    if((typeof c.xp==='number')===false){ c.xp=0; }
    if(c.notes==null){ c.notes=def.notes; }
    if(c.id==null||c.id===''){ c.id='ch-mig-'+String(c.name==null?'unnamed':c.name).toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
    if((typeof c.created==='number')===false){ c.created=0; }
    if((typeof c.updated==='number')===false){ c.updated=(typeof c.created==='number')?c.created:0; }
    c.schema=3;
    return c;
  };
  E.store={
    chars:()=>readJSON(K.chars,[]).map(function(c){var m=E.migrateChar(c); m.totalLevel=E.totalLevel(m); m.tier=E.tierOf(m.totalLevel); return m;}),
    saveChars:a=>writeJSON(K.chars,a),
    getChar:id=>E.store.chars().find(c=>c.id===id)||null,
    upsertChar:c=>{ c.updated=Date.now(); const a=E.store.chars(); const i=a.findIndex(x=>x.id===c.id); if(i>=0)a[i]=c; else a.push(c); E.store.saveChars(a); return c; },
    deleteChar:id=>{ E.store.saveChars(E.store.chars().filter(c=>c.id!==id)); if(E.store.activeId()===id)E.store.setActive(null); },
    activeId:()=>readJSON(K.active,null),
    setActive:id=>writeJSON(K.active,id),
    activeChar:()=>{ const id=E.store.activeId(); return id?E.store.getChar(id):null; },
    rawChars:()=>{ var a=readJSON(K.chars,[]); return Array.isArray(a)?a:[]; },
    deleteCharSafe:function(id){ var wasActive=(E.store.activeId()===id); E.store.saveChars(E.store.chars().filter(function(c){return (c.id===id)===false;})); if(wasActive){ var rest=E.store.chars(); E.store.setActive(rest.length>0?rest[0].id:null); } return E.store.activeId(); },
    camps:()=>readJSON(K.camps,[]),
    saveCamps:a=>writeJSON(K.camps,a),
    upsertCamp:c=>{ const a=E.store.camps(); const i=a.findIndex(x=>x.id===c.id); if(i>=0)a[i]=c; else a.push(c); E.store.saveCamps(a); return c; },
    deleteCamp:id=>E.store.saveCamps(E.store.camps().filter(c=>c.id!==id)),
    settings:()=>readJSON(K.settings,{theme:'storm',textSize:'md',diceAnim:true,sfx:false,music:false,combatSpeed:'normal',animations:true}),
    saveSettings:s=>writeJSON(K.settings,s),
    custom:()=>readJSON(K.custom,{enemies:[],items:[],npcs:[],abilities:[],spells:[],quests:[]}),
    saveCustom:c=>writeJSON(K.custom,c),
    exportAll:()=>JSON.stringify({v:SM.schema,exported:Date.now(),chars:E.store.chars(),camps:E.store.camps(),settings:E.store.settings(),custom:E.store.custom(),party:readJSON(K.party,null)},null,2),
    importAll:json=>{ const d=(typeof json==='string')?JSON.parse(json):json;
      if(d.chars)writeJSON(K.chars,d.chars); if(d.camps)writeJSON(K.camps,d.camps);
      if(d.settings)writeJSON(K.settings,d.settings); if(d.custom)writeJSON(K.custom,d.custom);
      if(d.party)writeJSON(K.party,d.party); return true; },
    wipe:()=>{ Object.values(K).forEach(k=>localStorage.removeItem(k)); }
  };
  // merge custom content into runtime registries
  E.loadCustom=()=>{ const c=E.store.custom();
    const merge=(target,extra)=>{ (extra||[]).forEach(x=>{ if(!target.find(t=>t.id===x.id)) target.push(x); }); };
    merge(SM.data.ENEMIES,c.enemies); merge(SM.data.ITEMS,c.items); merge(SM.data.NPCS,c.npcs);
    merge(SM.data.ABILITIES,c.abilities); merge(SM.data.SPELLS,c.spells); merge(SM.data.QUESTS,c.quests);
  };
})(SM.engine);

/* ===================== ENGINE: COMBAT ===================== */
(function(E){
  const S=()=>SM.state.combat;
  E.combat={
    init(){ SM.state.combat={active:false,round:0,turn:0,combatants:[],log:[]}; },
    start(){ const c=S(); if(!c.combatants.length){ SM.ui.toast('Add combatants first.','bad'); return; }
      c.combatants.forEach(cb=>{ if(cb.init==null) cb.init=E.rollDie(20)+(cb.initBonus||0); });
      c.combatants.sort((a,b)=>b.init-a.init); c.active=true; c.round=1; c.turn=0;
      this.log('⚔️ Combat begins! Round 1.','crit'); this.log('Turn: '+c.combatants[0].name);
    },
    addCombatant(cb){ const c=S(); cb.id=cb.id||'cb-'+Math.random().toString(36).slice(2,8);
      cb.conditions=cb.conditions||[]; cb.tempHp=cb.tempHp||0; c.combatants.push(cb); return cb; },
    addFromChar(ch){ E.ensureDerived(ch); const d=E.defenses(ch);
      return this.addCombatant({name:ch.name||'Hero',side:'party',hp:ch.hpCur,maxHp:E.maxHP(ch),
        defense:d.defenseValue,mdef:d.magicTarget,initBonus:E.mods(ch).AGI+E.mods(ch).INS,
        atkBonus:E.attackBonus(ch),dmg:(E.equippedItem(ch,'weapon')||{dmg:'1d4'}).dmg,charId:ch.id}); },
    addEnemy(en,label){ const parseAtk=(en.attacks&&en.attacks[0])||'Attack: +4, 1d6';
      const mAtk=parseAtk.match(/\+(\d+)/); const mDmg=parseAtk.match(/(\d+d\d+(?:\+\d+)?)/);
      return this.addCombatant({name:label||en.name,side:'enemy',hp:en.hp,maxHp:en.hp,
        defense:10+(en.pdef||0),mdef:10+(en.mdef||0),initBonus:E.mod(en.attrs?en.attrs.AGI:10),
        atkBonus:mAtk?parseInt(mAtk[1],10):4,dmg:mDmg?mDmg[1]:'1d6',enemyId:en.id}); },
    current(){ const c=S(); return c.combatants[c.turn]||null; },
    next(){ const c=S(); if(!c.active)return; 
      // tick DoT conditions on the one whose turn is starting next
      c.turn++; if(c.turn>=c.combatants.length){ c.turn=0; c.round++; this.log('— Round '+c.round+' —','crit'); }
      const cur=this.current(); if(cur){ this.tickConditions(cur); this.log('Turn: '+cur.name); }
    },
    tickConditions(cb){ (cb.conditions||[]).slice().forEach(cn=>{ const def=E.condition(cn.id);
        if(def&&def.dot){ const r=E.roll(def.dot.match(/\d+d\d+/)[0]); this.damage(cb.id,r.total,def.name+' ('+def.dot+')','heal'===false?'':'');
          this.log(`${cb.name} suffers ${r.total} from ${def.name}.`,'down'); }
        if(cn.dur!=null){ cn.dur--; if(cn.dur<=0){ cb.conditions=cb.conditions.filter(x=>x!==cn); this.log(`${cb.name} recovers from ${def?def.name:cn.id}.`); } }
      }); },
    attack(attId,tgtId,opt={}){ const c=S(); const a=c.combatants.find(x=>x.id===attId),t=c.combatants.find(x=>x.id===tgtId);
      if(!a||!t)return; const mode=opt.mode||'normal';
      const roll=E.d20((opt.bonus!=null?opt.bonus:a.atkBonus),mode);
      const target=opt.vsMagic?t.mdef:t.defense;
      if(roll.fumble){ this.log(`${a.name} attacks ${t.name}: NATURAL 1 — critical failure!`,'miss'); return {roll,hit:false,fumble:true}; }
      const hit=roll.crit||roll.total>=target;
      if(!hit){ this.log(`${a.name} attacks ${t.name}: ${roll.total} vs ${target} — miss.`,'miss'); return {roll,hit:false}; }
      let dmgF=opt.dmg||a.dmg; let dr=E.roll(dmgF); let dmg=dr.total;
      if(roll.crit){ const dr2=E.roll(dmgF); dmg=dr.total+dr2.rolls.reduce((s,x)=>s+x.values.reduce((p,v)=>p+v,0),0); }
      this.damage(tgtId,dmg,null,'');
      this.log(`${a.name} ${roll.crit?'CRITS':'hits'} ${t.name} for ${dmg} (${dmgF}${roll.crit?' x2 dice':''}). [${roll.nat}${E.signed(roll.bonus)}=${roll.total} vs ${target}]`, roll.crit?'crit':'hit');
      return {roll,hit:true,dmg,crit:roll.crit};
    },
    damage(id,amt,src,type){ const c=S(); const t=c.combatants.find(x=>x.id===id); if(!t)return;
      amt=Math.max(0,Math.round(amt));
      if(t.tempHp>0){ const absorb=Math.min(t.tempHp,amt); t.tempHp-=absorb; amt-=absorb; }
      t.hp-=amt; if(t.hp<=0){ t.hp=0; t.defeated=true; this.log(`${t.name} is DEFEATED!`,'down'); }
      if(t.charId){ const ch=E.store.getChar(t.charId); if(ch){ ch.hpCur=t.hp; E.store.upsertChar(ch); } }
    },
    heal(id,amt){ const c=S(); const t=c.combatants.find(x=>x.id===id); if(!t)return;
      if(t.defeated&&t.hp===0){ /* revival brings to amt */ t.defeated=false; }
      t.hp=Math.min(t.maxHp,t.hp+Math.max(0,Math.round(amt))); this.log(`${t.name} heals ${amt} HP.`,'heal');
      if(t.charId){ const ch=E.store.getChar(t.charId); if(ch){ ch.hpCur=t.hp; E.store.upsertChar(ch); } } },
    addCondition(id,condId,dur){ const c=S(); const t=c.combatants.find(x=>x.id===id); if(!t)return;
      const def=E.condition(condId); if(!def)return;
      if(!def.stacks && t.conditions.find(x=>x.id===condId)) return;
      t.conditions.push({id:condId,dur:dur||3}); this.log(`${t.name} is now ${def.name}.`, def.kind==='positive'?'heal':'down'); },
    removeCondition(id,condId){ const c=S(); const t=c.combatants.find(x=>x.id===id); if(!t)return;
      t.conditions=t.conditions.filter(x=>x.id!==condId); },
    remove(id){ const c=S(); c.combatants=c.combatants.filter(x=>x.id!==id); if(c.turn>=c.combatants.length)c.turn=0; },
    end(){ this.log('Combat ended.','crit'); SM.state.combat={active:false,round:0,turn:0,combatants:S().combatants,log:S().log}; },
    reset(){ E.combat.init(); },
    log(msg,cls){ const c=S(); c.log.unshift({t:Date.now(),msg,cls:cls||''}); if(c.log.length>200)c.log.pop(); }
  };
  SM.state.combat={active:false,round:0,turn:0,combatants:[],log:[]};
})(SM.engine);

  else list=`<div class="list">`+chars.map(c=>{ const k=E.kin(c.kinId); const tl=E.totalLevel(c);
    const clsNames=(c.classes||[]).map(x=>{const cl=E.cls(x.classId);return (cl?cl.name:'?')+' '+x.level;}).join(' / ')||'No class';

SM.screens.selection.open=id=>{ const E=SM.engine; const c=E.store.getChar(id); if(!c)return; const k=E.kin(c.kinId);const tl=E.totalLevel(c);

    `<div class="row"><div class="ava" style="width:56px;height:56px;font-size:1.6rem">${k?k.icon:'🧝'}</div>

/* ===================== SCREEN: CHARACTER CREATOR ===================== */
SM.creator={ i:0, draft:null, pool:[], cfg:{formula:'4d6',count:7,dropLow:1,dropHigh:0,min:3,max:18},
  steps:['Name','Kin','Lineage','Class','Discipline','Attributes','Background','Appearance','Equipment','Abilities','Spells','Review'],
  start(){ this.i=0; this.draft=SM.engine.newCharacter(); this.pool=[]; },
  render(){ if(!this.draft) this.start(); const S=this;
    const steps=this.steps.map((s,idx)=>`<div class="step ${idx<S.i?'done':''} ${idx===S.i?'active':''}" onclick="SM.creator.goStep(${idx})">${idx+1}. ${s}</div>`).join('');
    return `<div class="stepper">${steps}</div><div class="panel" id="cbody">${this.body()}</div>
      <div class="row between" style="margin-top:14px">
        <button class="btn" ${this.i===0?'disabled':''} onclick="SM.creator.back()">← Back</button>
        ${this.i<this.steps.length-1?`<button class="btn primary" onclick="SM.creator.next()">Next →</button>`:`<button class="btn gold" onclick="SM.creator.finish()">⚡ Create Character</button>`}
      </div>`; },
  refresh(){ document.getElementById('view').innerHTML=this.render(); },
  goStep(i){ if(i<=this.i){ this.i=i; this.refresh(); } },
  back(){ if(this.i>0){this.i--;this.refresh();} },
  next(){ const err=this.validate(); if(err){ SM.ui.toast(err,'bad'); return; } if(this.i<this.steps.length-1){this.i++;this.refresh();} },
  validate(){ const d=this.draft;
    switch(this.i){
      case 0: if(!d.name.trim())return 'Enter a character name.'; break;
      case 1: if(!d.kinId)return 'Choose a Kin.'; break;
      case 2: if(!d.lineageId)return 'Choose a Lineage.'; break;
      case 3: { var _cl=this.validateClassLevels(d.classes); if(_cl.valid===false)return _cl.errors[0].msg; break; }
      case 4: { for(var _i=0;_i<d.classes.length;_i++){ var _x=d.classes[_i]; if(_x.discId==null)return 'Choose a Discipline for every class.'; var _ds=SM.engine.disc(_x.discId); if(_ds==null||((_ds.cls===_x.classId)===false))return 'Each discipline must belong to its class.'; } break; }
    } return null; },
  set(field,val){ this.draft[field]=val; },
  body(){ const E=SM.engine,U=SM.ui,d=this.draft;
    switch(this.i){
     case 0: return `<h3>Identity</h3>
        <label class="fld"><span>Character Name</span><input type="text" value="${U.esc(d.name)}" oninput="SM.creator.draft.name=this.value"></label>
        <label class="fld"><span>Player Name</span><input type="text" value="${U.esc(d.player)}" oninput="SM.creator.draft.player=this.value"></label>`;
     case 1: return `<h3>Choose Kin <span class="small muted">(21)</span></h3><div class="grid cols">`+SM.data.KIN.map(k=>
        `<div class="selectable ${d.kinId===k.id?'sel':''}" onclick="SM.creator.pickKin('${k.id}')" style="text-align:center">
          <div style="font-size:1.8rem">${k.icon}</div><div style="font-weight:700;margin-top:4px">${k.name}</div>
          <div class="small muted">${Object.entries(k.attr||{}).map(([a,v])=>a+' '+E.signed(v)).join(' ')||'Versatile'}</div></div>`).join('')+`</div>
        ${d.kinId?SM.creator.detailPanel('kin',d.kinId):''}`;
     case 2: { if(!d.kinId)return U.need('Pick a Kin first.'); const lins=E.lineagesFor(d.kinId);
        return `<h3>Choose Lineage <span class="small muted">of ${E.kin(d.kinId).name}</span></h3><div class="grid cols2">`+lins.map(l=>
        `<div class="selectable ${d.lineageId===l.id?'sel':''}" onclick="SM.creator.pick('lineageId','${l.id}')">
          <div class="row between"><b>${l.name}</b><span class="small gold">${Object.entries(l.attr||{}).map(([a,v])=>a+' '+E.signed(v)).join('')}</span></div>
          <div class="small muted">${U.esc(l.lore)}</div><div class="small storm" style="margin-top:4px">${U.esc(l.trait)}</div></div>`).join('')+`</div>${d.lineageId?SM.creator.detailPanel('lineage',d.lineageId):''}`; }
     case 3: {
       if(d.classes.length===0){
         return `<h3>Choose Class</h3><p class="small muted">Pick your first class. You can add more classes after.</p><div class="grid cols2">`+SM.data.CLASSES.map(cl=>
          `<div class="selectable" onclick="SM.creator.pickClass('${cl.id}')">
            <div class="row"><div style="font-size:1.5rem">${cl.icon}</div><div><b>${cl.name}</b><div class="small muted">${cl.role} · ${cl.hitDie} · ${cl.resource}</div></div></div>
            <div class="small muted" style="margin-top:6px">${U.esc(cl.identity)}</div></div>`).join('')+`</div>`;
       }
       var tot=this.calculateTotalLevel(d.classes); var tier=this.calculateCharacterTier(tot);
       var chosen=d.classes.map(function(cc){return cc.classId;});
       var avail=SM.data.CLASSES.filter(function(cl){ return chosen.indexOf(cl.id)<0; });
       var entries=d.classes.map((cc,idx)=>{ var cl=E.cls(cc.classId); var ds=(cc.discId==null)?null:E.disc(cc.discId); var can=(d.classes.length>1);
         return `<div class="selectable sel" style="cursor:default">
           <div class="row between">
             <div class="row"><div style="font-size:1.4rem">${cl.icon}</div><div><b>${cl.name}</b>${idx===0?' <span class="tag">Primary</span>':''}<div class="small muted">${(ds==null)?'No discipline yet':('Discipline: '+U.esc(ds.name))}</div></div></div>
             ${can?`<button class="btn ghost sm danger" onclick="SM.creator.removeClass('${cc.classId}')">Remove</button>`:''}
           </div>
           <div class="row" style="margin-top:8px;align-items:center;gap:8px">
             <span class="small muted">Level</span>
             <button class="btn ghost sm" onclick="SM.creator.incClassLevel('${cc.classId}',-1)">-</button>
             <input type="number" min="1" max="20" step="1" value="${cc.level}" onchange="SM.creator.setClassLevel('${cc.classId}',this.value)" style="width:64px;text-align:center;padding:6px;border-radius:8px">
             <button class="btn ghost sm" onclick="SM.creator.incClassLevel('${cc.classId}',1)">+</button>
             <span class="small faint">(1-20)</span>
           </div></div>`; }).join('');
       return `<h3>Choose Class <span class="small muted">(multiclass supported)</span></h3>
         <div class="grid">${entries}</div>
         <div class="panel row between" style="margin-top:10px;align-items:center">
           <div><span class="small muted">Total Level</span><div style="font-size:1.3rem"><b>${tot}</b></div></div>
           <div style="text-align:right"><span class="small muted">Tier</span><div><span class="tier-badge tier-${tier}">${tier}</span></div></div></div>

  slotFor:it=>{ if(!it)return null; if(it.slot)return it.slot; if(it.dmg)return 'weapon';
    if(SM.data.SHIELDS.some(s=>s.id===it.id))return 'offhand';
    if(SM.data.ARMOR.some(a=>a.id===it.id))return 'armor';
    const map={Ring:'ring1',Amulet:'neck',Cloak:'cloak',Belt:'belt',Boots:'boots',Gloves:'gloves',Helmet:'head',Staff:'weapon',Wand:'weapon'};
    return map[it.type]||null; },
  SLOTS:[['weapon','Weapon','🗡️'],['offhand','Off-hand / Shield','🛡️'],['armor','Armor','🥋'],['head','Head','🪖'],['neck','Neck','📿'],['ring1','Ring I','💍'],['ring2','Ring II','💍'],['cloak','Cloak','🧥'],['belt','Belt','🔗'],['boots','Boots','👢'],['gloves','Gloves','🧤']]
};

/* ===================== SCREEN: CHARACTER SHEET ===================== */
SM.screens.sheet=()=>{ const E=SM.engine,U=SM.ui; const c=SM.act.get();
  if(!c) return U.need('No active character. Create or select one.')+`<div class="row" style="justify-content:center;gap:8px"><button class="btn primary" onclick="SM.ui.go('creator')">Create</button><button class="btn" onclick="SM.ui.go('selection')">Select</button></div>`;
  E.ensureDerived(c); const k=E.kin(c.kinId),l=E.lineage(c.lineageId),tl=E.totalLevel(c),def=E.defenses(c),res=E.resource(c),maxhp=E.maxHP(c);
  const m=E.mods(c),a=E.attrs(c);const pc=E.primaryClass(c);const pKey=(pc&&pc.primary)?pc.primary[0]:'MIG';const saveDC=8+E.profBonus(tl)+(m[pKey]||0);const initB=m.AGI+m.INS;const passAware=10+m.INS;const carry=(a.MIG||10)*15;const altB=E.alterationBonuses?E.alterationBonuses(c):{fly:0,pdef:0,notes:[]};
  const clsStr=(c.classes||[]).map(x=>{const cl=E.cls(x.classId);const d=E.disc(x.discId);return `${cl?cl.name:'?'} ${x.level}${d?' <span class="small muted">('+d.name+')</span>':''}`;}).join(' · ');
  const hpPct=Math.max(0,Math.round(c.hpCur/maxhp*100)), resPct=res.max?Math.round((c.resCur||0)/res.max*100):0;
  const xpNext=E.xpForLevel(tl+1), xpPct=Math.min(100,Math.round((c.xp||0)/xpNext*100));
  const w=E.equippedItem(c,'weapon');
  const abilities=(c.abilities||[]).map(id=>E.ability(id)).filter(Boolean);
  const spells=(c.spells||[]).map(id=>E.spell(id)).filter(Boolean);
  return `
  <div class="panel">
    <div class="row between">
      <div class="row"><div class="ava" style="width:58px;height:58px;font-size:1.7rem">${k?k.icon:'🧝'}</div>
        <div><div style="font-size:1.3rem;font-weight:800">${U.esc(c.name)}</div>
          <div class="small muted">${k?k.name:''} · ${l?l.name:''}${c.player?' · '+U.esc(c.player):''}</div>
          <div class="small">${clsStr||'No class'}</div></div></div>
      <div style="text-align:right"><span class="tier-badge tier-${E.tierOf(tl)}">${E.tierOf(tl)}</span><div class="small muted" style="margin-top:4px">Total Level ${tl}</div></div>
    </div>
    <div style="margin-top:14px">
      <div class="row between small"><span>HP</span><span>${c.hpCur} / ${maxhp}</span></div>
      <div class="bar hp"><i style="width:${hpPct}%"></i></div>
      <div class="row between small" style="margin-top:8px"><span>${res.name}</span><span>${c.resCur||0} / ${res.max}</span></div>
      <div class="bar res"><i style="width:${resPct}%"></i></div>
      <div class="row between small" style="margin-top:8px"><span>XP</span><span>${c.xp||0} / ${xpNext}</span></div>
      <div class="bar xp"><i style="width:${xpPct}%"></i></div>
    </div>
    <div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap">
      <button class="btn sm danger" onclick="SM.sheet.quick('dmg')">− Damage</button>
      <button class="btn sm" onclick="SM.sheet.quick('heal')">+ Heal</button>
      <button class="btn sm" onclick="SM.sheet.rest()">🛏️ Long Rest</button>
      <button class="btn sm" onclick="SM.sheet.addXP()">+ XP</button><button class="btn sm" onclick="SM.ui.go('roster')">🗂️ Characters</button>
      <button class="btn sm" onclick="SM.ui.go('dashboard')">📈 Progression</button><button class="btn sm" onclick="SM.ui.go('build')">💠 Power & Build</button><button class="btn sm primary" onclick="SM.ui.go('forge')">⚒️ Forge</button>
    </div>
  </div>

  ${SM.sheet.banner(c)}
  <div class="section-head" style="margin-top:16px"><h3>Attributes</h3><button class="btn sm" onclick="SM.sheet.rollSave()">Roll Save</button></div>
  ${U.attrRow(c)}

  <div class="grid cols2" style="margin-top:16px">
    <div class="panel"><div class="eyebrow">Defenses</div>
      <div class="kv"><span class="k">Defense (to be hit)</span><span class="v">${def.defenseValue}</span></div>
      <div class="kv"><span class="k">Physical Defense</span><span class="v">${def.physicalDefense}</span></div>
      <div class="kv"><span class="k">Magic Defense</span><span class="v">${def.magicDefense}</span></div>
      <div class="kv"><span class="k">Evasion</span><span class="v">${E.signed(def.evasion)}</span></div>
      <div class="kv"><span class="k">Block</span><span class="v">${def.block}</span></div>
    </div>
    <div class="panel"><div class="eyebrow">Combat</div>
      <div class="kv"><span class="k">Movement</span><span class="v">${E.speed(c)} ft${(function(){var f=Math.max((k&&k.fly)||0,(altB&&altB.fly)||0);var s=f>0?' · Fly '+f:'';if(altB&&altB.notes&&altB.notes.length>0)s+=' · '+altB.notes.join(', ');return s;})()}</span></div>
      <div class="kv"><span class="k">Attack Bonus</span><span class="v">${E.signed(E.attackBonus(c))}</span></div>
      <div class="kv"><span class="k">Weapon</span><span class="v">${w?w.name+' ('+w.dmg+')':'Unarmed'}</span></div>
      <div class="kv"><span class="k">Prof. Bonus</span><span class="v">${E.signed(E.profBonus(tl))}</span></div>
      <div class="kv"><span class="k">Initiative</span><span class="v">${E.signed(initB)}</span></div>
      <div class="kv"><span class="k">Save DC</span><span class="v">${saveDC}</span></div>
      <div class="kv"><span class="k">Passive Awareness</span><span class="v">${passAware}</span></div>
      <div class="kv"><span class="k">Carry Capacity</span><span class="v">${carry} lb</span></div>
      <button class="btn sm block primary" style="margin-top:8px" onclick="SM.sheet.attackRoll()">🎲 Attack Roll</button>
    </div>
  </div>

  ${c.conditions&&c.conditions.length?`<div class="panel" style="margin-top:16px"><div class="eyebrow">Conditions</div><div class="pill-row">${c.conditions.map(cn=>{const d=E.condition(cn.id||cn);return `<span class="chip on">${d?d.icon+' '+d.name:cn}</span>`;}).join('')}</div></div>`:''}

  <div class="section-head" style="margin-top:16px"><h3>Saving Throws</h3><span class="small muted">tap to roll</span></div>
  <div class="statgrid">${SM.data.ATTRS.map(at=>`<div class="stat" style="cursor:pointer" onclick="SM.sheet.quickSave('${at.id}')"><div class="lab">${at.name.slice(0,3)}</div><div class="val">${E.signed(E.saveMod(c,at.id))}</div><div class="mod">save</div></div>`).join('')}</div>

  <div class="panel" style="margin-top:16px"><div class="eyebrow">Heritage</div>
    <div class="kv"><span class="k">Kin</span><span class="v">${k?k.name:'—'}</span></div>
    <div class="kv"><span class="k">Lineage</span><span class="v">${l?l.name:'—'}</span></div>
    ${k?`<p class="small muted" style="margin-top:6px">${U.esc(k.lore)}</p>`:''}
    ${(k&&k.traits&&k.traits.length)?`<div class="eyebrow" style="margin-top:8px">Kin Traits</div><ul style="padding-left:18px;margin:4px 0">${k.traits.map(t=>`<li class="small">${U.esc(t)}</li>`).join('')}</ul>`:''}
    ${(k&&k.abilities&&k.abilities.length)?`<div class="eyebrow" style="margin-top:8px">Kin Abilities</div><ul style="padding-left:18px;margin:4px 0">${k.abilities.map(t=>`<li class="small">${U.esc(t)}</li>`).join('')}</ul>`:''}
    ${l?`<div class="eyebrow" style="margin-top:8px">Lineage Trait</div><p class="small">${U.esc(l.trait)}${l.element?' · Element: '+U.esc(l.element):''}</p>`:''}
    <div class="row" style="gap:20px;margin-top:8px;align-items:flex-start">
      <div><div class="eyebrow">Resistances</div><div class="pill-row">${((k&&k.resist)||[]).filter(Boolean).map(x=>`<span class="chip">${U.esc(x)}</span>`).join('')||'<span class="faint small">none</span>'}</div></div>
      <div><div class="eyebrow">Weaknesses</div><div class="pill-row">${((k&&k.weak)||[]).filter(Boolean).map(x=>`<span class="chip">${U.esc(x)}</span>`).join('')||'<span class="faint small">none</span>'}</div></div>
    </div>
  </div>

  <div class="section-head" style="margin-top:16px"><h3>Classes &amp; Disciplines</h3></div>
  <div class="stack">${(c.classes||[]).map(x=>{const cl=E.cls(x.classId);const d=E.disc(x.discId);if(cl==null)return '';return `<div class="panel"><div class="row between"><b>${cl.icon} ${cl.name} ${x.level}</b><span class="tag">${cl.role}</span></div><div class="small muted">${cl.hitDie} · ${cl.resource} · Primary ${(cl.primary||[]).map(p=>E.attrName(p)).join(' / ')}</div>${d?`<div class="small storm" style="margin-top:4px">${d.name} — ${U.esc(d.ident)}</div>`:`<div class="small faint" style="margin-top:4px">No discipline chosen</div>`}${(cl.passive&&cl.passive[0])?`<div class="small" style="margin-top:4px">${U.esc(cl.passive[0])}</div>`:''}</div>`;}).join('')||U.need('No classes yet.')}</div>

  ${(c.quests&&c.quests.length)?`<div class="section-head" style="margin-top:16px"><h3>Active Quests</h3></div><div class="list">${c.quests.map(qid=>{const q=SM.data.QUESTS.find(z=>z.id===qid);return q?`<div class="li" onclick="SM.quests.open('${q.id}')"><div class="ava">${q.type==='Main'?'⭐':'📌'}</div><div class="meta"><div class="t">${q.name}</div><div class="s">${q.giver}</div></div></div>`:'';}).join('')}</div>`:''}

  ${(function(){var al=SM.engine.alterationsFor(c);if(al.unlocked.length===0&&al.upcoming.length===0)return '';return '<div class="section-head" style="margin-top:16px"><h3>Physical Alterations</h3></div><div class="list">'+al.unlocked.map(function(z){return '<div class="li" style="cursor:default"><div class="ava">🧬</div><div class="meta"><div class="t">'+U.esc(z.name)+' <span class="tag">Lv '+z.level+'</span></div><div class="s">'+U.esc(z.desc)+' <span class="faint">('+U.esc(z.disc)+')</span></div></div></div>';}).join('')+al.upcoming.slice(0,4).map(function(z){return '<div class="li" style="cursor:default;opacity:.5"><div class="ava">🔒</div><div class="meta"><div class="t">'+U.esc(z.name)+' <span class="tag">Lv '+z.level+'</span></div><div class="s">Unlocks at '+U.esc(z.disc)+' level '+z.level+'</div></div></div>';}).join('')+'</div>';})()}
  <div class="section-head" style="margin-top:16px"><h3>Abilities</h3><button class="btn sm" onclick="SM.ui.go('forge')">Learn</button></div>
  ${abilities.length?`<div class="list">`+abilities.map(a=>`<div class="li" onclick="SM.lib.detail('ability','${a.id}')"><div class="ava">✨</div><div class="meta"><div class="t">${a.name} <span class="tag">${a.type}</span></div><div class="s">${U.esc(a.desc)}</div></div></div>`).join('')+`</div>`:U.need('No abilities learned yet.')}

  <div class="section-head" style="margin-top:16px"><h3>Spells</h3></div>
  ${spells.length?`<div class="list">`+spells.map(s=>`<div class="li" onclick="SM.lib.detail('spell','${s.id}')"><div class="ava">🔮</div><div class="meta"><div class="t">${s.name} <span class="tag">${s.school} ${s.level}</span></div><div class="s">${U.esc(s.desc)}</div></div></div>`).join('')+`</div>`:`<p class="muted small">No spells known.</p>`}

  <div class="section-head" style="margin-top:16px"><h3>Equipment</h3><button class="btn sm" onclick="SM.ui.go('equipment')">Manage</button></div>
  <div class="list">${SM.act.SLOTS.map(([slot,label,ic])=>{const it=E.equippedItem(c,slot);return it?`<div class="li" onclick="SM.lib.detailItem('${it.id}')"><div class="ava">${ic}</div><div class="meta"><div class="t">${it.name}</div><div class="s">${label}</div></div></div>`:'';}).join('')||U.need('Nothing equipped.')}</div>

  <div class="section-head" style="margin-top:16px"><h3>Inventory</h3><button class="btn sm" onclick="SM.ui.go('inventory')">Open</button></div>
  <p class="small muted">${(c.inventory||[]).length} items · ${Object.entries(c.currency||{}).filter(([k,v])=>v>0).map(([k,v])=>v+' '+k).join(', ')||'no coin'}</p>

  ${c.background?`<div class="panel" style="margin-top:16px"><div class="eyebrow">Background</div><p class="small">${U.esc(c.background)}</p></div>`:''}
  ${c.appearanceDesc?`<div class="panel" style="margin-top:12px"><div class="eyebrow">Appearance</div><p class="small">${U.esc(c.appearanceDesc)}</p></div>`:''}
  <div class="panel" style="margin-top:12px"><div class="eyebrow">Notes</div><textarea oninput="SM.sheet.saveNotes(this.value)" placeholder="Session notes...">${U.esc(c.notes||'')}</textarea></div>
  `;
};
SM.sheet={
  quick:kind=>{ const c=SM.act.get(); if(!c)return; const n=parseInt(prompt((kind==='dmg'?'Damage':'Healing')+' amount:','5'),10); if(!n)return;
    const mx=SM.engine.maxHP(c); c.hpCur=kind==='dmg'?Math.max(0,c.hpCur-n):Math.min(mx,c.hpCur+n); SM.act.save(c);
    SM.ui.toast((kind==='dmg'?'-':'+')+n+' HP',kind==='dmg'?'bad':'ok'); if(c.hpCur===0)SM.ui.toast('Defeated!','bad'); SM.ui.render(); },
  rest:()=>{ const c=SM.act.get(); if(!c)return; c.hpCur=SM.engine.maxHP(c); c.resCur=SM.engine.resource(c).max; c.conditions=[]; SM.act.save(c); SM.ui.toast('Long rest complete. Fully recovered.','ok'); SM.ui.render(); },
  addXP:()=>{ const c=SM.act.get(); if(!c)return; const n=parseInt(prompt('Add XP:','500'),10); if(!n)return; c.xp=(c.xp||0)+n; SM.act.save(c);
    SM.ui.toast('+'+n+' XP',' ok'); if(c.xp>=SM.engine.xpForLevel(SM.engine.totalLevel(c)+1))SM.ui.toast('Ready to level up in the Forge!','info'); SM.ui.render(); },
  saveNotes:v=>{ const c=SM.act.get(); if(!c)return; c.notes=v; SM.engine.store.upsertChar(c); },
  attackRoll:()=>{ const c=SM.act.get(); const E=SM.engine; const r=E.d20(E.attackBonus(c)); const w=E.equippedItem(c,'weapon')||{dmg:'1d4',dtype:'Crush',name:'Unarmed'};
    let dr=E.roll(w.dmg); let dmg=dr.total; if(r.crit){const d2=E.roll(w.dmg);dmg+=d2.total-(d2.flat||0);}  
    SM.ui.modal('Attack Roll',`<div class="row" style="gap:10px"><div class="die ${r.crit?'crit':r.fumble?'fail':''}">${r.nat}</div><div><div style="font-size:1.4rem;font-weight:800">${r.total} to hit</div><div class="small muted">d20 ${E.signed(r.bonus)} ${r.crit?'· CRITICAL!':r.fumble?'· FUMBLE!':''}</div></div></div>
      <hr class="sep"><div class="kv"><span class="k">${w.name} damage</span><span class="v">${r.fumble?'—':dmg+' '+(w.dtype||'')}</span></div><div class="small muted">${w.dmg}${r.crit?' (crit: doubled dice)':''}</div>`); },
  rollSave:()=>{ const c=SM.act.get(); const opts=SM.data.ATTRS.map(a=>`<button class="btn sm" onclick="SM.sheet.doSave('${a.id}')">${a.name}</button>`).join(' ');
    SM.ui.modal('Saving Throw','<p class="small muted">Choose an attribute to roll a save:</p><div class="pill-row">'+opts+'</div><div id="saveOut" style="margin-top:12px"></div>'); },
  doSave:attr=>{ const c=SM.act.get(); const E=SM.engine; const r=E.d20(E.saveMod(c,attr)); 
    document.getElementById('saveOut').innerHTML=`<div class="row"><div class="die ${r.crit?'crit':r.fumble?'fail':''}">${r.nat}</div><div><div style="font-size:1.3rem;font-weight:800">${r.total}</div><div class="small muted">${E.attrName(attr)} save · d20 ${E.signed(r.bonus)}</div></div></div>`; }
};

SM.sheet.quickSave=function(attr){ const c=SM.act.get(); if(c==null)return; const E=SM.engine; const r=E.d20(E.saveMod(c,attr)); SM.ui.toast(E.attrName(attr)+' save: '+r.total+' (d20 '+r.nat+' '+E.signed(r.bonus)+')', r.crit?'ok':(r.fumble?'bad':'info')); };

/* ===================== SCREEN: FORGE ===================== */
SM.screens.forge=()=>{ const E=SM.engine,U=SM.ui; const c=SM.act.get();
  if(!c) return U.need('No active character. Select or create one to use the Forge.');
  E.ensureDerived(c); const tl=E.totalLevel(c); const canLevel=(c.xp||0)>=E.xpForLevel(tl+1);
  const classSection=(c.classes||[]).map(x=>{const cl=E.cls(x.classId);const d=E.disc(x.discId);
    return `<div class="card" style="cursor:default"><div class="row between"><b>${cl.name} ${x.level}</b>
      <button class="btn sm ${x.level<20?'primary':''}" ${x.level>=20?'disabled':''} onclick="SM.forge.previewLevelUp('${x.classId}')">${x.level>=20?'Max':'Level Up →'}</button></div>
      <div class="small muted">${cl.role} · ${cl.resource} · ${cl.hitDie}</div>
      ${d?`<div class="small storm">${d.name}</div>`:`<div class="pill-row" style="margin-top:6px">${E.discsFor(cl.id).map(dd=>`<button class="chip" onclick="SM.forge.chooseDisc('${cl.id}','${dd.id}')">${dd.name}</button>`).join('')}</div>`}
    </div>`;}).join('');
  const otherClasses=SM.data.CLASSES.filter(cl=>!(c.classes||[]).some(x=>x.classId===cl.id));
  return `
  <div class="panel"><div class="row between"><div><div class="eyebrow">Character Forge</div><b style="font-size:1.15rem">${U.esc(c.name)}</b></div>
    <div style="text-align:right"><span class="tier-badge tier-${E.tierOf(tl)}">${E.tierOf(tl)}</span><div class="small muted">Lvl ${tl} · XP ${c.xp||0}/${E.xpForLevel(tl+1)}</div></div></div>
    ${canLevel?'<p class="small" style="color:var(--gold);margin-top:8px">⚡ Enough XP to level up — choose a class to advance.</p>':'<p class="small muted" style="margin-top:8px">Level up any class (XP is a soft gate you can override).</p>'}
  </div>

  <div class="section-head" style="margin-top:16px"><h3>Classes & Levels</h3></div>
  <div class="stack">${classSection}</div>

  <div class="section-head" style="margin-top:16px"><h3>Multiclass</h3></div>
  <div class="scrollx">${otherClasses.map(cl=>`<div class="card" style="min-width:150px" onclick="SM.forge.addClass('${cl.id}')"><div style="font-size:1.4rem">${cl.icon}</div><b>${cl.name}</b><div class="small muted">${cl.role}</div><div class="small storm">+ Add class</div></div>`).join('')}</div>

  <div class="section-head" style="margin-top:16px"><h3>Learn Abilities</h3></div>
  ${(()=>{ const avail=E.availableAbilities(c).filter(a=>!(c.abilities||[]).includes(a.id));
    return avail.length?`<div class="list">`+avail.map(a=>`<div class="li"><div class="ava">✨</div><div class="meta"><div class="t">${a.name} <span class="tag">${a.type}</span> <span class="tag">Lv ${a.level}</span></div><div class="s">${U.esc(a.desc)}</div></div><button class="btn sm primary" onclick="SM.forge.learnAbility('${a.id}')">Learn</button></div>`).join('')+`</div>`:'<p class="muted small">No new abilities available. Level up or choose a discipline to unlock more.</p>'; })()}

  <div class="section-head" style="margin-top:16px"><h3>Learn Spells</h3></div>
  ${(()=>{ const avail=SM.data.SPELLS.filter(s=>!(c.spells||[]).includes(s.id));
    return `<div class="list">`+avail.slice(0,30).map(s=>`<div class="li"><div class="ava">🔮</div><div class="meta"><div class="t">${s.name} <span class="tag">${s.school} ${s.level}</span></div><div class="s">${U.esc(s.desc)}</div></div><button class="btn sm" onclick="SM.forge.learnSpell('${s.id}')">Learn</button></div>`).join('')+`</div>`; })()}

  <div class="section-head" style="margin-top:16px"><h3>Quick Actions</h3></div>
  <div class="row" style="margin-top:6px"><button class="btn primary" onclick="SM.ui.go('dashboard')">📈 Progression Dashboard</button></div>
  <div class="row"><button class="btn" onclick="SM.ui.go('equipment')">🛡️ Equipment</button><button class="btn" onclick="SM.ui.go('inventory')">🎒 Inventory</button><button class="btn" onclick="SM.forge.editAttrs()">Edit Attributes</button></div>
  `;
};
SM.forge={

div>`:''; const upSec=up.length>0?`<div class="eyebrow" style="margin-top:10px">Upcoming</div>`+up.map(function(a){return `<div class="small faint">Lv ${a.level}: ${U.esc(a.name)}</div>`;}).join(''):''; const pendSec=cr.pending.length>0?`<div class="eyebrow" style="margin-top:10px">Discipline Choice Required</div><div class="small storm" style="margin-bottom:6px">${U.esc(cr.pending[0].msg)}</div><div class="pill-row">`+E.discsFor(classId).map(function(dd){return `<button class="chip" onclick="SM.forge.chooseDisc('${classId}','${dd.id}')">${U.esc(dd.name)}</button>`;}).join('')+`</div>`:''; const html=`<div class="panel"><b>${U.esc(cl.name)} ${pv.prevLevel} &rarr; ${U.esc(cl.name)} ${pv.newLevel}</b><div class="small" style="margin-top:4px">Total Level: ${curTotal} &rarr; ${newTotal}</div>${tierLine}</div>`+newSec+availSec+upSec+pendSec+`<div class="panel" style="margin-top:10px;border-color:var(--emerald)"><div class="small" style="color:var(--emerald)"><b>Saved.</b> Character progression saved successfully.</div></div>`; U.modal('Level Up Complete', html); },

/* ===================== SCREEN: PROGRESSION DASHBOARD ===================== */
SM.screens.dashboard=()=>{ const E=SM.engine,U=SM.ui; const c=SM.act.get();
  if(c==null) return U.need('No active character. Create or select one.')+`<div class="row" style="justify-content:center;gap:8px"><button class="btn primary" onclick="SM.ui.go('creator')">Create</button><button class="btn" onclick="SM.ui.go('selection')">Select</button></div>`;
  const rew=E.progressionRewards(c); const tl=rew.totalLevel; const tier=rew.tier;
  const classCount=rew.classes.length;
  const discCount=rew.classes.filter(function(x){return (x.discId==null)===false;}).length;
  const learnedCount=(Array.isArray(c.abilities)?c.abilities:[]).length;
  const tp=E.tierProgress(c); const nm=E.nextMilestone(c);
  let h=`<div class="row between" style="align-items:flex-start"><div><h2 style="margin:0">${U.esc(c.name||'Character')}</h2><div class="small muted">Progression Dashboard</div><div class="small storm" style="margin-top:2px">${U.esc(E.buildIdentity(c).label)}</div></div><div style="text-align:right"><span class="tier-badge tier-${tier}">${tier}</span><div class="small muted" style="margin-top:4px">Total Level ${tl}</div></div></div>`;
  h+=`<div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" onclick="SM.ui.go('sheet')">Character Sheet</button><button class="btn sm" onclick="SM.ui.go('forge')">Forge</button><button class="btn sm" onclick="SM.ui.go('build')">💠 Power & Build</button></div>`;
  const stat=(label,val)=>`<div class="card" style="text-align:center"><div class="eyebrow">${label}</div><div style="font-size:1.5rem;font-weight:800;margin-top:2px">${val}</div></div>`;
  h+=`<div class="section-head" style="margin-top:14px"><h3>Progression</h3></div><div class="grid cols">${stat('Total Level',tl)}${stat('Tier',`<span class="tier-badge tier-${tier}">${tier}</span>`)}${stat('Classes',classCount)}${stat('Class Levels',tl)}${stat('Disciplines',discCount)}${stat('Abilities Learned',learnedCount)}</div>`;
  const tierText=tp.atTop?`Total Level ${tl} \u00b7 Maximum tier reached`:`Total Level ${tl} / ${tp.tierMax} \u00b7 ${tp.pct}% through ${tp.tier}`;
  h+=`<div class="section-head" style="margin-top:16px"><h3>Tier Progress</h3></div><div class="panel"><div class="row between"><span class="tier-badge tier-${tp.tier}">${tp.tier}</span>${tp.atTop?'<span class="small muted">Top Tier</span>':`<span class="small muted">Next: <span class="tier-badge tier-${tp.nextTier}">${tp.nextTier}</span> at Total Level ${tp.nextAt}</span>`}</div><div class="bar" style="margin-top:8px" role="progressbar" aria-valuenow="${tp.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Tier progress ${tp.pct} percent"><i style="width:${tp.pct}%"></i></div><div class="small muted" style="margin-top:4px">${tierText}</div></div>`;
  const mi=(o)=>`<div class="kv"><span class="k">${U.esc(o.label)}</span><span class="v">${U.esc(o.detail)}</span></div>`;
  h+=`<div class="section-head" style="margin-top:16px"><h3>Next Milestone</h3></div><div class="panel"><div class="eyebrow storm">${U.esc(nm.primary.label)}</div><div style="font-weight:700;margin-top:2px">${U.esc(nm.primary.detail)}</div>${nm.list.length>1?`<hr class="sep">`+nm.list.filter(function(x){return (x===nm.primary)===false;}).map(mi).join(''):''}</div>`;
  h+=`<div class="section-head" style="margin-top:16px"><h3>Class Progression</h3></div>`;
  h+=rew.classes.map(function(x){
    const pct=Math.round((Math.min(20,x.level)/20)*100);
    const disc=(x.discId==null)?`<div class="small storm">Discipline choice required</div><div class="pill-row" style="margin-top:6px">`+E.discsFor(x.classId).map(function(dd){return `<button class="chip" onclick="SM.forge.chooseDisc('${x.classId}','${dd.id}')">${U.esc(dd.name)}</button>`;}).join('')+`</div>`:`<div class="small">Discipline: <b>${U.esc(x.discName||'')}</b></div>`;
    const btn=(x.level>=20)?`<span class="tag">MAX CLASS LEVEL</span>`:`<button class="btn sm primary" onclick="SM.forge.previewLevelUp('${x.classId}')">Level Up \u2192</button>`;
    return `<div class="panel" style="margin-top:8px"><div class="row between"><b>${U.esc(x.className)}</b><span class="small muted">Level ${x.level} / 20</span></div><div class="bar" style="margin-top:6px" role="progressbar" aria-valuenow="${x.level}" aria-valuemin="0" aria-valuemax="20" aria-label="${U.esc(x.className)} level ${x.level} of 20"><i style="width:${pct}%"></i></div><div class="small muted" style="margin-top:4px">${x.level} of 20 \u00b7 ${pct}%</div><div style="margin-top:8px">${disc}</div><div class="row" style="margin-top:8px">${btn}</div></div>`;
  }).join('');
  let learned=[],available=[],upcoming=[];
  rew.classes.forEach(function(x){
    (x.abilities.chosen||[]).forEach(function(a){ learned.push({a:a,x:x}); });
    (x.abilities.available||[]).forEach(function(a){ available.push({a:a,x:x}); });
    (x.abilities.upcoming||[]).forEach(function(a){ upcoming.push({a:a,x:x}); });
  });
  const abRow=(o,mode)=>{ const a=o.a,x=o.x; const dn=(a.disc==null)?null:(E.disc(a.disc)?E.disc(a.disc).name:a.disc);
    const tags=`<span class="tag">${U.esc(x.className)}</span> <span class="tag">Lv ${a.level}</span>`+((dn==null)?'':` <span class="tag">${U.esc(dn)}</span>`);
    const learnBtn=(mode==='available')?`<button class="btn sm primary" onclick="SM.forge.learnAbility('${a.id}')">Learn</button>`:'';
    return `<div class="li" style="cursor:default"><div class="ava">\u2728</div><div class="meta"><div class="t">${U.esc(a.name)} ${tags}</div><div class="s">${U.esc(a.desc||'')}</div></div>${learnBtn}</div>`;
  };
  h+=`<div class="section-head" style="margin-top:16px"><h3>Ability Progression</h3></div>`;
  h+=`<div class="eyebrow" style="margin-top:6px">Learned (${learned.length})</div>`+(learned.length>0?`<div class="list">`+learned.map(function(o){return abRow(o,'learned');}).join('')+`</div>`:`<div class="small muted">No abilities learned yet.</div>`);
  h+=`<div class="eyebrow" style="margin-top:10px">Available (${available.length})</div>`+(available.length>0?`<div class="list">`+available.map(function(o){return abRow(o,'available');}).join('')+`</div>`:`<div class="small muted">Nothing available to learn right now.</div>`);
  h+=`<div class="eyebrow" style="margin-top:10px">Upcoming (${upcoming.length})</div>`+(upcoming.length>0?`<div class="list">`+upcoming.map(function(o){return abRow(o,'upcoming');}).join('')+`</div>`:`<div class="small muted">No upcoming abilities.</div>`);
  let pUnlocked=[],pUpcoming=[];
  rew.classes.forEach(function(x){
    (x.passives.unlocked||[]).forEach(function(p){ pUnlocked.push({p:p,x:x}); });
    (x.passives.upcoming||[]).forEach(function(p){ pUpcoming.push({p:p,x:x}); });
  });
  if(pUnlocked.length>0||pUpcoming.length>0){
    h+=`<div class="section-head" style="margin-top:16px"><h3>Passive Progression</h3></div>`;
    const paRow=(o)=>{ const p=o.p,x=o.x; return `<div class="li" style="cursor:default"><div class="ava">\uD83E\uDDEC</div><div class="meta"><div class="t">${U.esc(p.name)} <span class="tag">${U.esc(x.className)}</span> <span class="tag">Lv ${p.level}</span></div><div class="s">${U.esc(p.desc||'')}</div></div></div>`; };
    if(pUnlocked.length>0) h+=`<div class="eyebrow" style="margin-top:6px">Active / Unlocked (${pUnlocked.length})</div><div class="list">`+pUnlocked.map(paRow).join('')+`</div>`;
    if(pUpcoming.length>0) h+=`<div class="eyebrow" style="margin-top:10px">Upcoming (${pUpcoming.length})</div><div class="list">`+pUpcoming.map(paRow).join('')+`</div>`;
  }
  h+=`<div class="section-head" style="margin-top:16px"><h3>Recent Progression</h3></div>`;
  let rp=[];
  rp.push(`Reached Total Level ${tl}`);
  rp.push(`Reached ${tier} Tier`);
  rew.classes.forEach(function(x){ rp.push(`${x.className} at Level ${x.level}`); });
  rew.classes.forEach(function(x){ if((x.discId==null)===false) rp.push(`Selected ${x.discName} discipline for ${x.className}`); });
  if(learnedCount>0) rp.push(`Learned ${learnedCount} ${learnedCount===1?'ability':'abilities'}`);
  h+=`<div class="panel">`+rp.map(function(s){return `<div class="small">&bull; ${U.esc(s)}</div>`;}).join('')+`<div class="small faint" style="margin-top:6px">Summary reflects current character state.</div></div>`;
  return h;
};

    h+=`<div class="section-head" style="margin-top:16px"><h3>Equipment</h3><button class="btn sm" onclick="SM.ui.go('equipment')">Manage</button></div>${eq.length>0?`<div class="list">`+eq.join('')+`</div>`:U.need('Nothing equipped.')}`;

    h+=`<div class="section-head" style="margin-top:16px"><h3>Next Build Opportunities</h3></div>`;
    if(opps.length===0){ h+=`<div class="panel"><div class="small muted">No further progression available \u2014 maximum build reached.</div></div>`; }
    else { h+=`<div class="panel">`+opps.slice(0,8).map(function(o){return `<div class="small">&bull; ${U.esc(o.label)}</div>`;}).join('')+`<div class="row" style="gap:8px;margin-top:10px"><button class="btn sm primary" onclick="SM.ui.go('dashboard')">Open Progression</button><button class="btn sm" onclick="SM.ui.go('forge')">Open Forge</button></div><div class="small faint" style="margin-top:6px">Informational \u2014 progression actions are taken in Progression or Forge.</div></div>`; }
